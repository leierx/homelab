apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: capi-argo-bridge
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: capi-argo-bridge
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - {port: "8081", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
