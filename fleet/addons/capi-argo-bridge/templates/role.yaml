apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capi-argo-bridge
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # no list/watch: this namespace holds the cluster Secrets (cluster-admin
    # bearer tokens) and repo credentials, and the bridge only ever gets by name
    verbs: ["create", "update", "delete", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capi-argo-bridge
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: capi-argo-bridge
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: capi-argo-bridge
  apiGroup: rbac.authorization.k8s.io
