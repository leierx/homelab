# the bridge reads Clusters and their Secrets only here
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.clusterNamespace }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capi-argo-bridge
  namespace: {{ .Values.clusterNamespace }}
rules:
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capi-argo-bridge
  namespace: {{ .Values.clusterNamespace }}
subjects:
  - kind: ServiceAccount
    name: capi-argo-bridge
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: capi-argo-bridge
  apiGroup: rbac.authorization.k8s.io
---
# workload clusters' API servers, for CAPI's controllers and Argo CD
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: api-servers
  namespace: {{ .Values.clusterNamespace }}
spec:
  endpointSelector:
    matchLabels:
      kubevirt.io: virt-launcher
  ingress:
    - fromEndpoints:
        {{- range list "capi-system" "kubeadm-bootstrap-system" "kubeadm-control-plane-system" "kubevirt-infrastructure-system" }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ . }}
            control-plane: controller-manager
        {{- end }}
        {{- range list "argocd-server" "argocd-application-controller" }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $.Release.Namespace }}
            app.kubernetes.io/name: {{ . }}
        {{- end }}
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
