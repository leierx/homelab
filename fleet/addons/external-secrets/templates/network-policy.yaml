# Default-deny for the namespace, then what External Secrets needs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - {}
    # admission webhook calls
    - fromEntities: [kube-apiserver]
  egress:
    - toEndpoints:
        - {}
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: openbao
            app.kubernetes.io/name: openbao
      toPorts:
        - ports:
            - {port: "8200", protocol: TCP}
