# The single, stable secret-store name the whole fleet references.
# Swap the provider block (here, or per env/cluster via a Component in
# env/<env>/ or cluster/<name>/) to plug in Vault, 1Password, Bitwarden,
# a cloud KMS, etc. Consumers do not change.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fleet-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    # TODO(fleet): replace the fake provider with the real secret backend.
    fake:
      data: []
