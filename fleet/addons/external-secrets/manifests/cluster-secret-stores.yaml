# no serviceAccountRef namespace, so ESO logs in as the ExternalSecret's own namespace (docs/README.md, Secrets)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      caProvider:
        type: Secret
        name: openbao-tls
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: openbao-client
          serviceAccountRef:
            name: openbao-client
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-push
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      # ESO's property push is read-modify-write; CAS turns a lost race into a retry
      checkAndSet:
        required: true
      caProvider:
        type: Secret
        name: openbao-tls
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: openbao-client-push
          serviceAccountRef:
            name: openbao-client
            audiences: [openbao]
