# Backend: OpenBao (addon openbao), KV v2 mount `kv`. Every ExternalSecret's
# remoteRef.key is <cluster>/<app>.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fleet-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  conditions:
    # namespaces whose addons read secrets; anything else is refused
    - namespaces: [alerta, argo, argocd, harbor, immich, keycloak, miniflux, monitoring, renovate]
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      caProvider:
        type: Secret
        name: openbao-tls
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# Write store for generated values; its own ServiceAccount and OpenBao role keep writes apart in the audit log.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-push
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fleet-secrets-push
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  conditions:
    # namespaces whose addons generate secrets
    - namespaces: [alerta, argo, harbor, keycloak, monitoring]
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      # ESO's property push is read-modify-write; CAS turns a lost race into a retry
      checkAndSet:
        required: true
      caProvider:
        type: Secret
        name: openbao-tls
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-push
          serviceAccountRef:
            name: external-secrets-push
            namespace: external-secrets
