# every remoteRef.key is <cluster>/<app>
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fleet-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  conditions:
    - namespaces: [alerta, apprise, argo, argocd, gotify, immich, keycloak, miniflux, monitoring, opencloud, paperless, renovate]
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      caProvider:
        type: Secret
        name: openbao-tls
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# its own ServiceAccount and OpenBao role keep writes apart in the audit log
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-push
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fleet-secrets-push
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  conditions:
    - namespaces: [alerta, gotify, keycloak, monitoring, opencloud, paperless]
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      # ESO's property push is read-modify-write; CAS turns a lost race into a retry
      checkAndSet:
        required: true
      caProvider:
        type: Secret
        name: openbao-tls
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-push
          serviceAccountRef:
            name: external-secrets-push
            namespace: external-secrets
