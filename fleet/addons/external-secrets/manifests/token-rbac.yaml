apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-token
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [external-secrets, external-secrets-push]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-token
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
---
# the referent stores log in as each namespace's openbao-client ServiceAccount, and only that one
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-openbao-client-token
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [openbao-client]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-openbao-client-token
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-openbao-client-token
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
