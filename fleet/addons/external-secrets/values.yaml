serviceMonitor: {enabled: true}
# Token creation is granted to the two store ServiceAccounts in manifests/token-rbac.yaml.
rbac: {serviceAccountTokenCreate: false}
resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
webhook:
  resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
certController:
  resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
