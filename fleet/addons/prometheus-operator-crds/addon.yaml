# ServiceMonitor/PodMonitor/... CRDs for everything that ships them; no operator (Alloy scrapes).
addon:
  enablement: baseline
  placement:
    key: fleet/environment
    value: prod
  namespace: monitoring
  podSecurity: restricted
  # Keep repoURL -> name -> version in this order; Renovate parses it.
  chart:
    repoURL: https://prometheus-community.github.io/helm-charts
    name: prometheus-operator-crds
    version: 32.0.1
