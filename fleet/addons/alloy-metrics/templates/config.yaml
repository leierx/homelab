apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-metrics
data:
  config.alloy: |
    {{- .Files.Get "config.alloy" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-metrics-env
data:
  MIMIR_URL: http://mimir.monitoring.svc:8080/api/v1/push
  LOKI_URL: http://loki.monitoring.svc:3100/loki/api/v1/push
  # the cluster label on every series and log line
  CLUSTER_NAME: {{ .Values.fleet.cluster }}
