apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac.yaml
generatorOptions:
  # referenced by name from the Helm values; Alloy's config-reloader picks up changes
  disableNameSuffixHash: true
configMapGenerator:
  - name: alloy-metrics
    files:
      - config.alloy
  - name: alloy-metrics-env
    literals:
      - MIMIR_URL=http://mimir.monitoring.svc:8080/api/v1/push
      - LOKI_URL=http://loki.monitoring.svc:3100/loki/api/v1/push
