apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-metrics
rules:
  # discovery.kubernetes reads the nodes for kubelet and cAdvisor, the API
  # server's and kube-dns's endpoint slices, kube-state-metrics and
  # node-exporter; the events source watches every namespace
  - apiGroups: ["", "discovery.k8s.io"]
    resources: ["endpoints", "endpointslices", "pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  # the operator components read every ServiceMonitor and PodMonitor
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors"]
    verbs: ["get", "list", "watch"]
  # kubelet and cAdvisor are scraped through the node's /metrics and
  # /metrics/cadvisor, which are cluster-scoped subresources
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
  # the API server's own /metrics is a non-resource URL
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
  # a ServiceMonitor or PodMonitor can reference a Secret for its scrape
  # credentials, as CDI's does
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-metrics
subjects:
  - kind: ServiceAccount
    name: alloy-metrics
    namespace: telemetry
