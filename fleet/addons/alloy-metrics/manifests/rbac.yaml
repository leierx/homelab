apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-metrics
rules:
  # service discovery, plus events for the events source
  - apiGroups: ["", "discovery.k8s.io"]
    resources: ["endpointslices", "pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  # the operator components read every ServiceMonitor and PodMonitor
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors"]
    verbs: ["get", "list", "watch"]
  # kubelet and cAdvisor scrapes are authorized against nodes/metrics
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
  # the API server's own /metrics is a non-resource URL
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
  # ServiceMonitor/PodMonitor scrape credentials, e.g. CDI's
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-metrics
subjects:
  - kind: ServiceAccount
    name: alloy-metrics
    namespace: telemetry
