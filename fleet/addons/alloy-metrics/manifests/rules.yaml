apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alloy-metrics
  labels:
    fleet.io/ruler: mimir
spec:
  groups:
    - name: scraping
      rules:
        - alert: TargetDown
          expr: up == 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: A scrape target has been down for 10 minutes, so its metrics and alerts are blind.
    - name: coredns
      rules:
        # reload keeps the old config when the new one fails, so a broken coredns-custom only bites on the next restart
        - alert: CoreDNSConfigRejected
          expr: max by (pod) (coredns_reload_failed_total) > 0
          labels:
            severity: critical
            instance: 'kube-system/{{ $labels.pod }}'
          annotations:
            summary: CoreDNS rejected a config change and still runs the old one; it will crash-loop on its next restart (docs/postmortem/2026-11-06-loft01-coredns-down.md).
    - name: k8s.rules.container_cpu_usage
      rules:
        # the name the kubernetes-mixin dashboards (CloudNativePG's among them) query
        - record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate
          expr: sum by (cluster, namespace, pod, container) (irate(container_cpu_usage_seconds_total{job="kubelet", metrics_path="/metrics/cadvisor", image!=""}[5m])) * on (cluster, namespace, pod) group_left (node) topk by (cluster, namespace, pod) (1, max by (cluster, namespace, pod, node) (kube_pod_info{node!=""}))
    - name: kubelet
      rules:
        - alert: VolumeFillingUp
          expr: max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
          for: 15m
          labels:
            severity: warning
            instance: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}'
          annotations:
            summary: A PVC is over 85% full.
