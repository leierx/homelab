apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alloy-metrics
  labels:
    fleet.io/ruler: mimir
spec:
  groups:
    - name: scraping
      rules:
        - alert: TargetDown
          expr: up == 0
          for: 10m
          labels:
            severity: warning
            instance: '{{ $labels.job }}: {{ or $labels.pod $labels.instance }}'
          annotations:
            summary: A scrape target has been down for 10 minutes, so its metrics and alerts are blind.
    - name: coredns
      rules:
        # reload keeps the old config when the new one fails, so a broken coredns-custom only bites on the next restart
        - alert: CoreDNSConfigRejected
          expr: max by (pod) (coredns_reload_failed_total) > 0
          labels:
            severity: critical
            instance: 'kube-system/{{ $labels.pod }}'
          annotations:
            summary: CoreDNS rejected a config change and still runs the old one; it will crash-loop on its next restart (docs/postmortem/2026-11-06-loft01-coredns-down.md).
    - name: k8s.rules.container_cpu_usage
      rules:
        # the name the kubernetes-mixin dashboards (CloudNativePG's among them) query
        - record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate
          expr: sum by (cluster, namespace, pod, container) (irate(container_cpu_usage_seconds_total{job="kubelet", metrics_path="/metrics/cadvisor", image!=""}[5m])) * on (cluster, namespace, pod) group_left (node) topk by (cluster, namespace, pod) (1, max by (cluster, namespace, pod, node) (kube_pod_info{node!=""}))
    - name: kubelet
      rules:
        - alert: VolumeFillingUp
          expr: max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
          for: 15m
          labels:
            severity: warning
            instance: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }}'
          annotations:
            summary: A PVC is over 85% full.
        - alert: ContainerMemoryNearLimit
          expr: max by (namespace, pod, container) (container_memory_working_set_bytes{job="kubelet", metrics_path="/metrics/cadvisor", container!=""}) / max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"}) > 0.9
          for: 1h
          labels:
            severity: warning
            instance: '{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}'
          annotations:
            summary: A container has used over 90% of its memory limit for an hour.
    - name: alerting-pipeline
      rules:
        - alert: RuleEvaluationFailing
          expr: sum by (job, rule_group) (increase({__name__=~"(cortex|loki)_prometheus_rule_evaluation_failures_total"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
            instance: '{{ $labels.job }}: {{ $labels.rule_group }}'
          annotations:
            summary: A Mimir or Loki rule group fails to evaluate, so its alerts can't fire.
        - alert: RulerNotificationsFailing
          # increase() drops __name__, so errors and dropped are summed apart before they meet
          expr: >-
            ((sum by (job) (increase(cortex_prometheus_notifications_errors_total[15m])) + sum by (job) (increase(cortex_prometheus_notifications_dropped_total[15m])))
            or (sum by (job) (increase(loki_prometheus_notifications_errors_total[15m])) + sum by (job) (increase(loki_prometheus_notifications_dropped_total[15m])))) > 0
          for: 15m
          labels:
            severity: warning
            instance: '{{ $labels.job }}'
          annotations:
            summary: A ruler can't hand alerts to Alertmanager.
        - alert: AlloyComponentUnhealthy
          expr: max by (job) (alloy_component_controller_running_components{health_type!="healthy"}) > 0
          for: 15m
          labels:
            severity: warning
            instance: '{{ $labels.job }}'
          annotations:
            summary: An Alloy component is unhealthy (scraping, log shipping or rule sync).
