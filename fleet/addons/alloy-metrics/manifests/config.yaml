apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-metrics
data:
  config.alloy: |
    // api-server.alloy
    discovery.kubernetes "apiserver" {
      role = "endpointslice"
    
      selectors {
        role  = "endpointslice"
        label = "kubernetes.io/service-name=kubernetes"
      }
    
      namespaces {
        names = ["default"]
      }
    }
    
    discovery.relabel "apiserver" {
      targets = discovery.kubernetes.apiserver.targets
    
      rule {
        source_labels = ["__meta_kubernetes_endpointslice_port_name"]
        regex         = "https"
        action        = "keep"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_service_name"]
        target_label  = "service"
      }
    
      rule {
        replacement  = "kubernetes"
        target_label = "source"
      }
    }
    
    prometheus.scrape "apiserver" {
      targets           = discovery.relabel.apiserver.output
      job_name          = "integrations/kubernetes/kube-apiserver"
      scheme            = "https"
      scrape_interval   = "60s"
      scrape_timeout    = "10s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = false
        server_name          = "kubernetes"
      }
    
      clustering {
        enabled = true
      }
    
      forward_to = [prometheus.relabel.apiserver.receiver]
    }
    
    // the API server repeats the kubelet's volume series under its own job; the
    // kubelet scrape owns them, so drop this copy
    prometheus.relabel "apiserver" {
      rule {
        source_labels = ["__name__"]
        regex         = "kubelet_volume_stats_.*"
        action        = "drop"
      }
    
      forward_to = [prometheus.remote_write.mimir.receiver]
    }
    
    // cadvisor.alloy
    discovery.relabel "cadvisor" {
      targets = discovery.relabel.nodes.output
    
      rule {
        replacement  = "/metrics/cadvisor"
        target_label = "__metrics_path__"
      }
    }
    
    prometheus.scrape "cadvisor" {
      targets           = discovery.relabel.cadvisor.output
      job_name          = "integrations/kubernetes/cadvisor"
      scheme            = "https"
      scrape_interval   = "60s"
      scrape_timeout    = "10s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
        server_name          = "kubernetes"
      }
    
      clustering {
        enabled = true
      }
    
      forward_to = [prometheus.relabel.cadvisor.receiver]
    }
    
    // cAdvisor reports cgroups without a container or an image; drop those series
    prometheus.relabel "cadvisor" {
      rule {
        source_labels = ["__name__", "container"]
        separator     = "@"
        regex         = "(container_cpu_.*|container_fs_.*|container_memory_.*|container_pressure_.*)@"
        action        = "drop"
      }
    
      rule {
        source_labels = ["__name__", "image"]
        separator     = "@"
        regex         = "(container_cpu_.*|container_fs_.*|container_memory_.*|container_network_.*|container_pressure_.*)@"
        action        = "drop"
      }
    
      // keep the labels, but do not let two boots look like two machines
      rule {
        source_labels = ["__name__", "boot_id"]
        separator     = "@"
        regex         = "machine_memory_bytes@.*"
        target_label  = "boot_id"
        replacement   = "NA"
      }
    
      rule {
        source_labels = ["__name__", "system_uuid"]
        separator     = "@"
        regex         = "machine_memory_bytes@.*"
        target_label  = "system_uuid"
        replacement   = "NA"
      }
    
      // filesystem and network series only for real devices and interfaces
      rule {
        source_labels = ["__name__", "device"]
        separator     = "@"
        regex         = "container_fs_.*@(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dasd.+)"
        target_label  = "__keepme"
        replacement   = "1"
      }
    
      rule {
        source_labels = ["__name__", "__keepme"]
        separator     = "@"
        regex         = "container_fs_.*@"
        action        = "drop"
      }
    
      rule {
        source_labels = ["__name__"]
        regex         = "container_fs_.*"
        target_label  = "__keepme"
        replacement   = ""
      }
    
      rule {
        source_labels = ["__name__", "interface"]
        separator     = "@"
        regex         = "container_network_.*@(en[ospx][0-9].*|wlan[0-9].*|eth[0-9].*)"
        target_label  = "__keepme"
        replacement   = "1"
      }
    
      rule {
        source_labels = ["__name__", "__keepme"]
        separator     = "@"
        regex         = "container_network_.*@"
        action        = "drop"
      }
    
      rule {
        source_labels = ["__name__"]
        regex         = "container_network_.*"
        target_label  = "__keepme"
        replacement   = ""
      }
    
      forward_to = [prometheus.remote_write.mimir.receiver]
    }
    
    // events.alloy
    // not a clustered component: a second metrics replica would send every event
    // twice
    loki.source.kubernetes_events "cluster_events" {
      job_name   = "integrations/kubernetes/eventhandler"
      log_format = "logfmt"
      forward_to = [loki.process.cluster_events.receiver]
    }
    
    loki.process "cluster_events" {
      stage.static_labels {
        values = {
          source = "kubernetes-events",
        }
      }
    
      stage.logfmt {
        mapping = {
          component = "sourcecomponent",
          kind      = "",
          level     = "type",
          name      = "",
          node      = "sourcehost",
          reason    = "",
        }
      }
    
      stage.labels {
        values = {
          kind         = "",
          level        = "",
          service_name = "job",
          reason       = "reason",
        }
      }
    
      stage.match {
        selector = "{kind=\"Node\"}"
    
        stage.labels {
          values = {
            node = "name",
          }
        }
      }
    
      stage.match {
        selector = "{level=\"Normal\"}"
    
        stage.static_labels {
          values = {
            level = "Info",
          }
        }
      }
    
      stage.structured_metadata {
        values = {
          name = "name",
          node = "node",
        }
      }
    
      stage.label_drop {
        values = ["kind"]
      }
    
      forward_to = [loki.write.loki.receiver]
    }
    
    // kube-dns.alloy
    discovery.kubernetes "kube_dns" {
      role = "endpointslice"
    
      namespaces {
        names = ["kube-system"]
      }
    
      selectors {
        role  = "endpointslice"
        label = "kubernetes.io/service-name=kube-dns"
      }
    }
    
    discovery.relabel "kube_dns" {
      targets = discovery.kubernetes.kube_dns.targets
    
      rule {
        source_labels = [
          "__meta_kubernetes_pod_container_port_name",
          "__meta_kubernetes_pod_phase",
          "__meta_kubernetes_pod_ready",
        ]
        separator = "@"
        regex     = "metrics@Running@true"
        action    = "keep"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_container_init"]
        regex         = "true"
        action        = "drop"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    
      rule {
        source_labels = [
          "__meta_kubernetes_pod_controller_kind",
          "__meta_kubernetes_pod_controller_name",
        ]
        separator    = "/"
        target_label = "workload"
      }
    
      rule {
        source_labels = ["workload"]
        regex         = "(ReplicaSet/.+)-.+"
        target_label  = "workload"
      }
    
      rule {
        action = "replace"
        source_labels = [
          "__meta_kubernetes_pod_label_app_kubernetes_io_name",
          "__meta_kubernetes_pod_label_k8s_app",
          "__meta_kubernetes_pod_label_app",
        ]
        separator    = ";"
        regex        = "^(?:;*)?([^;]+).*$"
        replacement  = "$1"
        target_label = "app"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_service_name"]
        target_label  = "service"
      }
    
      rule {
        replacement  = "kubernetes"
        target_label = "source"
      }
    }
    
    prometheus.scrape "kube_dns" {
      targets         = discovery.relabel.kube_dns.output
      job_name        = "integrations/kubernetes/kube-dns"
      scheme          = "http"
      scrape_interval = "60s"
      scrape_timeout  = "10s"
    
      clustering {
        enabled = true
      }
    
      forward_to = [prometheus.remote_write.mimir.receiver]
    }
    
    // kube-state-metrics.alloy
    // the kube-state-metrics Service's endpoints; the job name and the one label
    // are what the dashboards and alerts query
    discovery.kubernetes "kube_state_metrics" {
      role = "endpoints"
    
      selectors {
        role  = "endpoints"
        label = "app.kubernetes.io/name=kube-state-metrics,app.kubernetes.io/instance=kube-state-metrics"
      }
    }
    
    discovery.relabel "kube_state_metrics" {
      targets = discovery.kubernetes.kube_state_metrics.targets
    
      rule {
        replacement  = "kubernetes"
        target_label = "source"
      }
    }
    
    prometheus.scrape "kube_state_metrics" {
      targets         = discovery.relabel.kube_state_metrics.output
      job_name        = "integrations/kubernetes/kube-state-metrics"
      scrape_interval = "60s"
      scrape_timeout  = "10s"
      scheme          = "http"
    
      tls_config {
        insecure_skip_verify = true
      }
    
      clustering {
        enabled = true
      }
    
      forward_to = [prometheus.remote_write.mimir.receiver]
    }
    
    // kubelet.alloy
    discovery.relabel "kubelet" {
      targets = discovery.relabel.nodes.output
    }
    
    prometheus.scrape "kubelet" {
      targets           = discovery.relabel.kubelet.output
      job_name          = "integrations/kubernetes/kubelet"
      scheme            = "https"
      scrape_interval   = "60s"
      scrape_timeout    = "10s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
        server_name          = "kubernetes"
      }
    
      clustering {
        enabled = true
      }
    
      forward_to = [prometheus.remote_write.mimir.receiver]
    }
    
    // /metrics/resource is a separate endpoint with its own small metric set
    discovery.relabel "kubelet_resources" {
      targets = discovery.relabel.nodes.output
    
      rule {
        replacement  = "/metrics/resource"
        target_label = "__metrics_path__"
      }
    }
    
    prometheus.scrape "kubelet_resources" {
      targets           = discovery.relabel.kubelet_resources.output
      job_name          = "integrations/kubernetes/resources"
      scheme            = "https"
      scrape_interval   = "60s"
      scrape_timeout    = "10s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
        server_name          = "kubernetes"
      }
    
      clustering {
        enabled = true
      }
    
      forward_to = [prometheus.relabel.kubelet_resources.receiver]
    }
    
    prometheus.relabel "kubelet_resources" {
      rule {
        source_labels = ["__name__"]
        regex         = "up|scrape_samples_scraped|node_cpu_usage_seconds_total|node_memory_working_set_bytes"
        action        = "keep"
      }
    
      forward_to = [prometheus.remote_write.mimir.receiver]
    }
    
    // node-exporter.alloy
    discovery.kubernetes "node_exporter" {
      role = "pod"
    
      selectors {
        role  = "pod"
        label = "app.kubernetes.io/name=node-exporter,app.kubernetes.io/instance=node-exporter"
      }
    }
    
    discovery.relabel "node_exporter" {
      targets = discovery.kubernetes.node_exporter.targets
    
      rule {
        source_labels = [
          "__meta_kubernetes_pod_container_init",
          "__meta_kubernetes_pod_phase",
          "__meta_kubernetes_pod_ready",
        ]
        separator = "@"
        regex     = "false@Running@true"
        action    = "keep"
      }
    
      // the pod is hostNetwork, so the node is the useful identity, not the pod IP
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "instance"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    
      rule {
        source_labels = [
          "__meta_kubernetes_pod_controller_kind",
          "__meta_kubernetes_pod_controller_name",
        ]
        separator    = "/"
        target_label = "workload"
      }
    
      rule {
        source_labels = ["workload"]
        regex         = "(ReplicaSet/.+)-.+"
        target_label  = "workload"
      }
    
      rule {
        source_labels = [
          "__meta_kubernetes_pod_label_app_kubernetes_io_name",
          "__meta_kubernetes_pod_label_k8s_app",
          "__meta_kubernetes_pod_label_app",
        ]
        separator    = ";"
        regex        = "^(?:;*)?([^;]+).*$"
        replacement  = "$1"
        target_label = "app"
      }
    
      rule {
        source_labels = [
          "__meta_kubernetes_pod_label_app_kubernetes_io_component",
          "__meta_kubernetes_pod_label_k8s_component",
          "__meta_kubernetes_pod_label_component",
        ]
        regex        = "^(?:;*)?([^;]+).*$"
        replacement  = "$1"
        target_label = "component"
      }
    
      rule {
        replacement  = "kubernetes"
        target_label = "source"
      }
    }
    
    prometheus.scrape "node_exporter" {
      targets         = discovery.relabel.node_exporter.output
      job_name        = "integrations/node_exporter"
      scrape_interval = "60s"
      scrape_timeout  = "10s"
      scheme          = "http"
    
      tls_config {
        insecure_skip_verify = true
      }
    
      clustering {
        enabled = true
      }
    
      forward_to = [prometheus.relabel.node_exporter.receiver]
    }
    
    prometheus.relabel "node_exporter" {
      rule {
        source_labels = ["__name__", "fstype"]
        separator     = "@"
        regex         = "node_filesystem.*@(ramfs|tmpfs)"
        action        = "drop"
      }
    
      forward_to = [prometheus.remote_write.mimir.receiver]
    }
    
    // nodes.alloy
    // every node, for the kubelet and cAdvisor scrapes
    discovery.kubernetes "nodes" {
      role = "node"
    }
    
    discovery.relabel "nodes" {
      targets = discovery.kubernetes.nodes.targets
    
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
    
      rule {
        replacement  = "kubernetes"
        target_label = "source"
      }
    }
    
    // operator.alloy
    // every ServiceMonitor and PodMonitor in the cluster; the CRDs come from the
    // prometheus-operator-crds addon
    prometheus.operator.servicemonitors "service_monitors" {
      kubernetes_role = "endpointslice"
    
      clustering {
        enabled = true
      }
    
      scrape {
        default_scrape_interval = "60s"
        default_scrape_timeout  = "10s"
      }
    
      forward_to = [prometheus.remote_write.mimir.receiver]
    }
    
    prometheus.operator.podmonitors "pod_monitors" {
      clustering {
        enabled = true
      }
    
      scrape {
        default_scrape_interval = "60s"
        default_scrape_timeout  = "10s"
      }
    
      forward_to = [prometheus.remote_write.mimir.receiver]
    }
    
    // remote-write.alloy
    prometheus.remote_write "mimir" {
      endpoint {
        url = sys.env("MIMIR_URL")
      }
    
      external_labels = {
        cluster          = sys.env("CLUSTER_NAME"),
        k8s_cluster_name = sys.env("CLUSTER_NAME"),
      }
    }
    
    // the cluster events pipeline writes here
    loki.write "loki" {
      endpoint {
        url              = sys.env("LOKI_URL")
        retry_on_http_429 = true
        min_backoff_period = "500ms"
        max_backoff_period = "5m"
        max_backoff_retries = "10"
      }
    
      external_labels = {
        cluster          = sys.env("CLUSTER_NAME"),
        k8s_cluster_name = sys.env("CLUSTER_NAME"),
      }
    }
