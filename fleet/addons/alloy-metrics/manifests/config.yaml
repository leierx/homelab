apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-metrics
data:
  config.alloy: |
    // the CRDs come from the prometheus-operator-crds addon
    prometheus.operator.servicemonitors "service_monitors" {
      kubernetes_role = "endpointslice"

      scrape {
        default_scrape_interval = "30s"
        default_scrape_timeout  = "10s"
      }

      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    prometheus.operator.podmonitors "pod_monitors" {
      scrape {
        default_scrape_interval = "30s"
        default_scrape_timeout  = "10s"
      }

      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    // ServiceMonitors cannot read the service account token, so the API server is scraped here
    discovery.kubernetes "apiserver" {
      role = "endpointslice"

      namespaces {
        names = ["default"]
      }

      selectors {
        role  = "endpointslice"
        label = "kubernetes.io/service-name=kubernetes"
      }
    }

    prometheus.scrape "apiserver" {
      targets           = discovery.kubernetes.apiserver.targets
      job_name          = "apiserver"
      scheme            = "https"
      scrape_interval   = "30s"
      scrape_timeout    = "10s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        ca_file     = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        server_name = "kubernetes"
      }

      forward_to = [prometheus.relabel.apiserver.receiver]
    }

    prometheus.relabel "apiserver" {
      // the kubelet scrape owns these; k3s serves them here too
      rule {
        source_labels = ["__name__"]
        regex         = "kubelet_.*|volume_manager_.*|storage_operation_.*"
        action        = "drop"
      }

      // the histogram buckets are most of the series and nothing here queries them
      rule {
        source_labels = ["__name__"]
        regex         = "(apiserver|etcd)_.*_bucket"
        action        = "drop"
      }

      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    // kubelet and cAdvisor have no Service to monitor, so they are scraped through the node API
    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }

      rule {
        replacement  = "/metrics"
        target_label = "metrics_path"
      }
    }

    prometheus.scrape "kubelet" {
      targets           = discovery.relabel.kubelet.output
      job_name          = "kubelet"
      scheme            = "https"
      scrape_interval   = "30s"
      scrape_timeout    = "10s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }

      forward_to = [prometheus.relabel.kubelet.receiver]
    }

    // k3s serves every control-plane component from one registry; the apiserver scrape owns the rest
    prometheus.relabel "kubelet" {
      rule {
        source_labels = ["__name__"]
        regex         = "up|kubelet_.*|volume_manager_.*|storage_operation_.*"
        action        = "keep"
      }

      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    // both scrapes are job kubelet, told apart by metrics_path, as the dashboards and mixins expect
    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets

      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }

      rule {
        replacement  = "/metrics/cadvisor"
        target_label = "__metrics_path__"
      }

      rule {
        replacement  = "/metrics/cadvisor"
        target_label = "metrics_path"
      }
    }

    prometheus.scrape "cadvisor" {
      targets           = discovery.relabel.cadvisor.output
      job_name          = "kubelet"
      scheme            = "https"
      scrape_interval   = "30s"
      scrape_timeout    = "10s"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }

      forward_to = [prometheus.relabel.cadvisor.receiver]
    }

    // cAdvisor also reports parent cgroups with no container or image, which double-count their children
    prometheus.relabel "cadvisor" {
      rule {
        source_labels = ["__name__", "container"]
        separator     = "@"
        regex         = "(container_cpu_.*|container_fs_.*|container_memory_.*|container_pressure_.*)@"
        action        = "drop"
      }

      rule {
        source_labels = ["__name__", "image"]
        separator     = "@"
        regex         = "(container_cpu_.*|container_fs_.*|container_memory_.*|container_network_.*|container_pressure_.*)@"
        action        = "drop"
      }

      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    // PrometheusRules labelled for Mimir; alerts with LogQL go to alloy-events
    mimir.rules.kubernetes "mimir" {
      address = sys.env("MIMIR_URL")

      rule_selector {
        match_labels = {"fleet.io/ruler" = "mimir"}
      }
    }

    prometheus.remote_write "mimir" {
      endpoint {
        url = sys.env("MIMIR_URL") + "/api/v1/push"
      }

      external_labels = {
        cluster = sys.env("CLUSTER_NAME"),
      }
    }
