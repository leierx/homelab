# Default-deny comes from the cluster baseline; each telemetry workload opens only its required flows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy-metrics
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: alloy-metrics
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports: [{port: "12345", protocol: TCP}]
  egress:
    - toEntities: [kube-apiserver]
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
            - {port: "9100", protocol: TCP}
            - {port: "9962", protocol: TCP}
            - {port: "9963", protocol: TCP}
            - {port: "9964", protocol: TCP}
            - {port: "9965", protocol: TCP}
            - {port: "10250", protocol: TCP}
    - toEntities: [cluster]
      toPorts:
        - ports:
            - {port: "3000", protocol: TCP}
            - {port: "3100", protocol: TCP}
            - {port: "8080", protocol: TCP}
            - {port: "8081", protocol: TCP}
            - {port: "8082", protocol: TCP}
            - {port: "8083", protocol: TCP}
            - {port: "8084", protocol: TCP}
            - {port: "8200", protocol: TCP}
            - {port: "8443", protocol: TCP}
            - {port: "9000", protocol: TCP}
            - {port: "9090", protocol: TCP}
            - {port: "9153", protocol: TCP}
            - {port: "9187", protocol: TCP}
            - {port: "9402", protocol: TCP}
            - {port: "9633", protocol: TCP}
            - {port: "12345", protocol: TCP}
            - {port: "19001", protocol: TCP}
