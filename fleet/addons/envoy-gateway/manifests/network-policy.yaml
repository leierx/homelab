# Base Envoy Gateway policies: controller and edge proxy baseline.
# Cluster-specific routes, OIDC, and internal Gateways live in clusters/<cluster>/envoy-gateway/manifests/.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: controller
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gateway-helm
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
      toPorts:
        - ports: [{ port: "18000", protocol: TCP }]
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "9443", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports: [{ port: "19001", protocol: TCP }]
  egress:
    - toEntities: [kube-apiserver]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: certgen
spec:
  endpointSelector:
    matchLabels:
      app: certgen
  egress:
    - toEntities: [kube-apiserver]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: proxies-edge
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: edge
  ingress:
    - fromEntities: [world, host]
      toPorts:
        - ports:
            - { port: "10080", protocol: TCP }
            - { port: "10443", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports: [{ port: "19001", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: gateway-helm
      toPorts:
        - ports: [{ port: "18000", protocol: TCP }]
    # ACME HTTP-01 solvers (cert-manager), in whichever namespace the Certificate is
    - toEndpoints:
        - matchExpressions:
            - { key: k8s:io.kubernetes.pod.namespace, operator: Exists }
            - { key: acme.cert-manager.io/http01-solver, operator: In, values: ["true"] }
      toPorts:
        - ports: [{ port: "8089", protocol: TCP }]
