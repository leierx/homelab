# Hardened downstream defaults and browser response headers for every listener on edge and wg
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: wg
  # no clientIPDetection: any xForwardedFor setting, even numTrustedHops 0, makes Envoy take the client's own
  # (rightmost) X-Forwarded-For entry as its IP; without it Envoy uses the TCP peer and appends that
  http1:
    enableTrailers: false
  tls:
    minVersion: "1.2"
    alpnProtocols:
      - h2
      - http/1.1
  headers:
    # nothing proxies in front of edge or wg, so a client's X-Forwarded-For is a claim; drop it before Envoy
    # appends the peer, since backends (Keycloak among them) take the first entry
    earlyRequestHeaders:
      remove:
        - X-Forwarded-For
    enableEnvoyHeaders: false
    withUnderscoresAction: RejectRequest
    lateResponseHeaders:
      addIfAbsent:
        - name: Strict-Transport-Security
          value: max-age=63072000; includeSubDomains
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: Referrer-Policy
          value: strict-origin-when-cross-origin
      remove:
        - Server
        - X-Powered-By
