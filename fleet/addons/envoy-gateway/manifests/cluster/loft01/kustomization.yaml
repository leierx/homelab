apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  # loft01's WireGuard address: only peers reach the wg Gateway
  - target:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: wg
    patch: |
      - op: add
        path: /spec/provider/kubernetes/envoyService/patch/value/spec/externalIPs
        value: [10.0.0.1]
