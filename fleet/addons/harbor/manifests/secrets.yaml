# generated once into OpenBao by the cluster's PushSecrets; Harbor wants 16 characters for these
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random16
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 16
  symbols: 0
  allowRepeat: true
  secretKeys: [secret_key, core_secret, jobservice_secret, registry_http_secret]
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random32
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 32
  symbols: 0
  allowRepeat: true
  secretKeys: [csrf_key, admin_password, registry_password]
---
# key core signs registry tokens with
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: harbor-token
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-token
spec:
  secretName: harbor-token
  commonName: harbor-token
  duration: 87600h
  issuerRef:
    kind: Issuer
    name: harbor-token
