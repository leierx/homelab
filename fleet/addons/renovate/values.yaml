serviceAccount: {name: renovate}
cronjob:
  schedule: 17 * * * *
  concurrencyPolicy: Forbid
  activeDeadlineSeconds: 3000
  preCommand: |
    RENOVATE_TOKEN=$(node /usr/local/share/github-app-token/token.mjs)
    export RENOVATE_TOKEN
renovate:
  config: |
    {
      "platform": "github",
      "repositories": ["leierx/homelab"],
      "onboarding": false,
      "requireConfig": "required",
      "platformCommit": "enabled",
      "username": "leierx-renovate[bot]",
      "persistRepoData": true
    }
  persistence: {cache: {enabled: true}}
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    seccompProfile: {type: RuntimeDefault}
existingSecret: renovate-github-app
# the chart adds fsGroup 1000 for the cache volume; don't re-chown the whole tree every hour
securityContext: {fsGroupChangePolicy: OnRootMismatch}
extraVolumes: [{name: github-app-token, configMap: {name: renovate-github-app-token}}]
extraVolumeMounts: [{name: github-app-token, mountPath: /usr/local/share/github-app-token}]
resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 4Gi}}
