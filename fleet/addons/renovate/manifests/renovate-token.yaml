apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: renovate
spec:
  appIDRef: {name: renovate-github-app, key: GITHUB_APP_ID}
  installIDRef: {name: renovate-github-app, key: GITHUB_APP_INSTALLATION_ID}
  auth:
    privateKey:
      secretRef: {name: renovate-github-app, key: GITHUB_APP_PRIVATE_KEY}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-token
spec:
  # tokens last 60 min and Renovate reads one at pod start: every run gets >=55 min, past activeDeadlineSeconds
  refreshInterval: 5m
  target:
    name: renovate-token
    template:
      data:
        RENOVATE_TOKEN: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: renovate
