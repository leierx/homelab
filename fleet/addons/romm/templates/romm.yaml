apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: romm
spec:
  replicas: 1
  serviceName: romm
  selector:
    matchLabels:
      app.kubernetes.io/name: romm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: romm
    spec:
      automountServiceAccountToken: false
      # k8s injects ROMM_PORT=tcp://... for Service/romm, which breaks nginx's `listen ${ROMM_PORT};`
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: romm
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: ROMM_BASE_URL
              value: {{ required "url is per cluster" .Values.url | quote }}
            - name: ROMM_DB_DRIVER
              value: postgresql
            - name: DB_HOST
              value: romm-db-rw
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: romm
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: romm-db-app
                  key: username
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: romm-db-app
                  key: password
            - name: ROMM_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: auth-secret-key
            - name: ROMM_SESSION_SECURE_COOKIE
              value: "true"
            - name: DISABLE_SETUP_WIZARD
              value: "true"
            - name: DISABLE_USERPASS_LOGIN
              value: "true"
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_AUTOLOGIN
              value: "true"
            - name: OIDC_ALLOW_REGISTRATION
              value: "true"
            - name: OIDC_PROVIDER
              value: keycloak
            - name: OIDC_CLIENT_ID
              value: romm
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: romm
                  key: oidc-client-secret
            - name: OIDC_SERVER_APPLICATION_URL
              value: {{ required "oidc.issuer is per cluster" .Values.oidc.issuer | quote }}
            - name: OIDC_REDIRECT_URI
              value: {{ printf "%s/api/oauth/openid" (required "url is per cluster" .Values.url) | quote }}
            - name: OIDC_CLAIM_ROLES
              value: groups
            - name: OIDC_ROLE_ADMIN
              value: homelab-admins
            - name: OIDC_ROLE_EDITOR
              value: homelab-operators
            - name: OIDC_ROLE_VIEWER
              value: homelab-viewers
            - name: HASHEOUS_API_ENABLED
              value: "true"
            - name: PLAYMATCH_API_ENABLED
              value: "true"
            - name: LAUNCHBOX_API_ENABLED
              value: "true"
            - name: HLTB_API_ENABLED
              value: "true"
            - name: TZ
              value: Europe/Oslo
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 30
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: library
              mountPath: /romm/library
            - name: resources
              mountPath: /romm/resources
            - name: assets
              mountPath: /romm/assets
            - name: redis
              mountPath: /redis-data
            - name: config
              mountPath: /romm/config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: romm-library
        - name: resources
          persistentVolumeClaim:
            claimName: romm-resources
        - name: assets
          persistentVolumeClaim:
            claimName: romm-assets
        - name: redis
          persistentVolumeClaim:
            claimName: romm-redis
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: romm
  labels:
    app.kubernetes.io/name: romm
spec:
  selector:
    app.kubernetes.io/name: romm
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
