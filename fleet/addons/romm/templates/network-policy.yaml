# Default-deny for the namespace, then what RomM and Postgres need.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - {}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    # the CloudNativePG operator checks the instance's status endpoint
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - {port: "8000", protocol: TCP}
  egress:
    - toEndpoints:
        - {}
    # the Postgres instance manager
    - toEntities: [kube-apiserver]
    # Keycloak at the issuer hostname and metadata providers (Hasheous, LaunchBox, Switch TitleDB, etc.)
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
