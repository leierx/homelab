# ROMs and BIOS files; a ZFS filesystem, browsable per file in snapshots
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romm-library
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storage.library.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.library.size }}
---
