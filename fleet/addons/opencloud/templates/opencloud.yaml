# OpenCloud's own state: the built-in LDAP with the auto-provisioned users, NATS and the search index
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storage.data.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.data.size }}
---
# storage/: the spaces as plain files and folders (posix driver, metadata in user xattrs), plus settings and shares
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: files
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.storage.files.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.files.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
spec:
  replicas: 1
  # RWO volumes can't be mounted by two pods at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencloud
      annotations:
        # the config files are only read at startup
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencloud
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          args: [server]
          envFrom:
            # OC_JWT_SECRET, IDM_*_PASSWORD and the other values `opencloud init` would generate
            - secretRef:
                name: opencloud
          env:
            - name: OC_URL
              value: {{ required "url is per cluster" .Values.url | quote }}
            # TLS ends at the Gateway
            - name: PROXY_TLS
              value: "false"
            - name: OC_OIDC_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            # Keycloak logs in instead of the built-in IdP; ocm would serve an unauthenticated URL fetcher; app
            # tokens are a login that bypasses Keycloak and survives disabling the user there
            - name: OC_EXCLUDE_RUN_SERVICES
              value: idp,ocm,auth-app
            - name: PROXY_ENABLE_APP_AUTH
              value: "false"
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            # the role comes from the token's roles claim on every request; without one, access is denied
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: oidc
            - name: GRAPH_ASSIGN_DEFAULT_USER_ROLE
              value: "false"
            # no local admin account
            - name: OC_ADMIN_USER_ID
              value: ""
            - name: WEB_OIDC_CLIENT_ID
              value: opencloud-web
            - name: WEB_OPTION_ACCOUNT_EDIT_LINK_HREF
              value: {{ printf "%s/account" .Values.oidc.issuer | quote }}
            - name: FRONTEND_CHECK_FOR_UPDATES
              value: "false"
            - name: PROXY_CSP_CONFIG_FILE_OVERRIDE_LOCATION
              value: /etc/opencloud/csp.yaml
            # no public links (upstream's switch from GHSA-vf5j-r2hw-2hrw)
            - name: GATEWAY_STORAGE_PUBLIC_LINK_ENDPOINT
              value: ""
            - name: OC_SYSTEM_USER_ID
              value: {{ required "ids.systemUser is per cluster" .Values.ids.systemUser | quote }}
            - name: OC_SERVICE_ACCOUNT_ID
              value: {{ required "ids.serviceAccount is per cluster" .Values.ids.serviceAccount | quote }}
            - name: GRAPH_APPLICATION_ID
              value: {{ required "ids.graphApplication is per cluster" .Values.ids.graphApplication | quote }}
            - name: STORAGE_USERS_MOUNT_ID
              value: {{ required "ids.storageUsersMount is per cluster" .Values.ids.storageUsersMount | quote }}
            - name: GATEWAY_STORAGE_USERS_MOUNT_ID
              value: {{ .Values.ids.storageUsersMount | quote }}
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
          # the debug server with /healthz and /readyz listens on localhost only
          startupProbe:
            exec:
              command: [curl, -fsS, -o, /dev/null, http://127.0.0.1:9205/healthz]
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: [curl, -fsS, -o, /dev/null, http://127.0.0.1:9205/healthz]
          readinessProbe:
            exec:
              command: [curl, -fsS, -o, /dev/null, http://127.0.0.1:9205/readyz]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/opencloud
              readOnly: true
            - name: data
              mountPath: /var/lib/opencloud
            # storage/ itself, so the services can create users/ and metadata/ in it
            - name: files
              mountPath: /var/lib/opencloud/storage
            - name: thumbnails
              mountPath: /var/lib/opencloud/thumbnails
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: opencloud-config
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: files
          persistentVolumeClaim:
            claimName: files
        - name: thumbnails
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: opencloud
  labels:
    app.kubernetes.io/name: opencloud
spec:
  selector:
    app.kubernetes.io/name: opencloud
  ports:
    - name: http
      port: 9200
      targetPort: http
      protocol: TCP
