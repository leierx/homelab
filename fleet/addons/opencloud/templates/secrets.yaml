# generated once into OpenBao by the cluster's PushSecret
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random
  annotations:
    # before the PushSecret that uses it
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys:
    - jwt_secret
    - transfer_secret
    - url_signing_secret
    - machine_auth_api_key
    - system_user_api_key
    - service_account_secret
    - thumbnails_transfer_token
    - idm_svc_password
    - idm_revasvc_password
    - idm_idpsvc_password
