# generated once into OpenBao (PushSecret in the cluster layer)
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys:
    - jwt_secret
    - machine_auth_api_key
    - transfer_secret
    - url_signing_secret
    - system_user_api_key
    - service_account_secret
    - idm_password
    - idm_reva_password
    - idm_idp_password
