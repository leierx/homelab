{{- $idp := regexFind "^https?://[^/]+/" (required "oidc.issuer is per cluster" .Values.oidc.issuer) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-config
data:
  # upstream's default without its third-party hosts (App Store list, update check, diagrams.net), plus Keycloak
  csp.yaml: |
    directives:
      child-src: ["'self'"]
      connect-src: ["'self'", "blob:", "{{ $idp }}"]
      default-src: ["'none'"]
      font-src: ["'self'"]
      frame-ancestors: ["'self'"]
      frame-src: ["'self'", "blob:", "{{ $idp }}"]
      img-src: ["'self'", "data:", "blob:"]
      manifest-src: ["'self'"]
      media-src: ["'self'"]
      object-src: ["'self'", "blob:"]
      script-src: ["'self'", "'unsafe-inline'"]
      style-src: ["'self'", "'unsafe-inline'"]
  # upstream's default apps without the App Store, which loads its catalogue from GitHub
  web.yaml: |
    web:
      config:
        apps: [files, search, text-editor, pdf-viewer, external, admin-settings, epub-reader, preview]
