{{- $idp := urlParse (required "oidc.issuer is per cluster" .Values.oidc.issuer) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-config
data:
  # first match wins; not the groups claim, which OpenCloud copies into groups every user sees; opencloud-admin is the only path to admin
  proxy.yaml: |
    role_assignment:
      driver: oidc
      oidc_role_mapper:
        role_claim: opencloud_role
        role_mapping:
          - role_name: admin
            claim_value: admin
          - role_name: user
            claim_value: user
          - role_name: user-light
            claim_value: user-light
  # upstream's CSP minus third-party origins, plus Keycloak and the app compatibility list
  csp.yaml: |
    directives:
      child-src: ["'self'"]
      connect-src: ["'self'", "blob:", "{{ $idp.scheme }}://{{ $idp.host }}/", "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/main/webApps/apps.json"]
      default-src: ["'none'"]
      font-src: ["'self'"]
      frame-ancestors: ["'self'"]
      frame-src: ["'self'", "blob:", "{{ $idp.scheme }}://{{ $idp.host }}/"]
      img-src: ["'self'", "data:", "blob:"]
      manifest-src: ["'self'"]
      media-src: ["'self'", "blob:"]
      object-src: ["'self'", "blob:"]
      script-src: ["'self'", "'unsafe-inline'"]
      style-src: ["'self'", "'unsafe-inline'", "blob:"]
      worker-src: ["'self'", "blob:"]
  # unzip extracts in the browser; desktop browsers page large blobs to disk (default 64 MB)
  apps.yaml: |
    unzip:
      config:
        maxArchiveSize: 1000000000
