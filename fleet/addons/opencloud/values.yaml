image:
  repository: docker.io/opencloudeu/opencloud-rolling
  tag: 9.0.0
url: ""
oidc:
  issuer: ""
# what `opencloud init` would generate; stored data refers to them, so they never change once set
ids:
  systemUser: ""
  serviceAccount: ""
  graphApplication: ""
  storageUsersMount: ""
persistence:
  data:
    size: 10Gi
  files:
    size: 100Gi
# web extensions by name: the opencloudeu/web-extensions tag
apps: {}
