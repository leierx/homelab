# generated once into OpenBao; the OIDC client secret next to it comes from the keycloak addon
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys: [session_hash_key]
---
# 32-byte AES-256 key for gorilla/securecookie
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: encrypt-key
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 32
  symbols: 0
  allowRepeat: true
  secretKeys: [session_encrypt_key]
