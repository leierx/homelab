namespace: zot
podSecurity: restricted
dependencies:
  - cilium
  - zfs-localpv
  - external-secrets
  - prometheus-operator-crds
  - cert-manager
  - envoy-gateway
  - keycloak
helm:
  repoURL: ghcr.io/project-zot/helm-charts
  chart: zot
  # renovate: datasource=docker depName=ghcr.io/project-zot/helm-charts/zot
  targetRevision: 0.1.128
  # Zot never serves its own chart: a broken Zot could otherwise not be fixed through Argo CD
  mirror: false
