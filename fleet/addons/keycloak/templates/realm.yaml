{{- define "keycloak.realmWorkflowSpec" -}}
workflowTemplateRef:
  name: tofu
  clusterScope: true
serviceAccountName: keycloak-tofu
podMetadata:
  labels:
    app.kubernetes.io/name: keycloak-tofu
arguments:
  parameters:
    - name: configMap
      value: keycloak-realm-tofu
    - name: secret
      value: keycloak-tofu
    - name: waitUrl
      value: http://keycloak-service:8080/realms/master
{{- end -}}
# on sync, so a realm change applies at once
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: keycloak-realm-
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # the CRD comes from argo-workflows, which syncs in the same wave
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {{- include "keycloak.realmWorkflowSpec" . | nindent 2 }}
---
# hourly, so changes made by hand in Keycloak are reverted
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: keycloak-realm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  schedules: ["0 * * * *"]
  concurrencyPolicy: Forbid
  workflowSpec:
    {{- include "keycloak.realmWorkflowSpec" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-tofu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-tofu
rules:
  # the kubernetes backend lists Secrets to find workspaces, and list can't be narrowed with resourceNames
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [tfstate-default-keycloak]
    verbs: [get, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [lock-tfstate-default-keycloak]
    verbs: [get, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  # Argo's executor reports each template's result here
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-tofu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-tofu
subjects:
  - kind: ServiceAccount
    name: keycloak-tofu
