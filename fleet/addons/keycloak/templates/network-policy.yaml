# Default-deny for the namespace, then what Keycloak, its operator and Postgres need.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # the reconcile pod and Keycloak's own traffic: Postgres, JGroups
    - fromEndpoints:
        - {}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    # the CloudNativePG operator checks the instance's status endpoint
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - {port: "8000", protocol: TCP}
  egress:
    - toEndpoints:
        - {}
    # the Keycloak operator and the Postgres instance manager
    - toEntities: [kube-apiserver]
---
# The reconcile pod: Keycloak, DNS, the API server for its state, and the OpenTofu registry.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keycloak-tofu
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-tofu
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    # registry.opentofu.org and the provider release downloads
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: keycloak
            app.kubernetes.io/name: keycloak
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
