apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keycloak
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - {port: "9000", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
        - matchLabels:
            app.kubernetes.io/name: keycloak-tofu
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "9000", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: keycloak-db
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres
  annotations:
    # with the database Cluster, whose initdb job needs the API server
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: keycloak-db
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - {port: "8000", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: keycloak
        - matchLabels:
            cnpg.io/cluster: keycloak-db
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
    # the CloudNativePG operator checks the instance's status endpoint
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - {port: "8000", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "9187", protocol: TCP}
  egress:
    # the Postgres instance manager and initdb/join jobs
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: keycloak-db
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keycloak-tofu
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-tofu
  egress:
    - toEntities: [kube-apiserver]
    # lookups through Cilium's DNS proxy, which learns the addresses the toFQDNs rule allows
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*"
    # the OpenTofu registry and the provider release downloads
    - toFQDNs:
        - matchName: registry.opentofu.org
        - matchName: github.com
        - matchName: release-assets.githubusercontent.com
        - matchName: objects.githubusercontent.com
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: keycloak
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
