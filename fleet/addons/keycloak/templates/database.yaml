apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  annotations:
    # the realm's users and their second factors; removing the addon must not drop them
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  instances: 1
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  storage: {{ toJson .Values.database.storage }}
  postgresql:
    parameters:
      # Keycloak asks for at most 20 connections; the server keeps headroom for the operator and pg_dump
      max_connections: "60"
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: keycloak-db
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: keycloak-db
  podMetricsEndpoints:
    - port: metrics
