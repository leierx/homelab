apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  annotations:
    # after its database and secrets are Healthy
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 1
  # Keycloak never calls the Kubernetes API (JGroups finds peers through the headless Service's DNS)
  automountServiceAccountToken: false
  # the master realm's service client OpenTofu logs in with, created only when the master realm is
  # first created. No standing admin user: break-glass is `kc.sh bootstrap-admin` in the Keycloak pod
  bootstrapAdmin:
    service:
      secret: keycloak-bootstrap-admin
  db:
    vendor: postgres
    host: keycloak-db-rw
    database: keycloak
    usernameSecret: { name: keycloak-db-app, key: username }
    passwordSecret: { name: keycloak-db-app, key: password }
  # TLS ends at the Gateways
  http:
    httpEnabled: true
  # hostname per cluster (cluster/<name>/)
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  # the operator's own policy opens 8080 and 9000 to every pod; templates/network-policy.yaml replaces it
  networkPolicy:
    enabled: false
  additionalOptions:
    # proxy-trusted-addresses (the pod network, where the Envoy proxies are) per cluster (cluster/<name>/)
    # the database's max_connections is 60; Keycloak's default pool of 100 never fits
    - name: db-pool-max-size
      value: "20"
    # the operator then creates a ServiceMonitor for the management port's /metrics
    - name: metrics-enabled
      value: "true"
    - name: event-metrics-user-enabled
      value: "true"
  resources:
    requests: { cpu: 200m, memory: 1Gi }
    limits: { memory: 2Gi }
  unsupported:
    podTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containers:
          - securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
