automountServiceAccountToken: false
config:
  route:
    receiver: alerta
    group_by: [alertname]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
    routes:
      - receiver: ntfy
        matchers: ['severity="critical"']
        continue: true
      - receiver: alerta
  receivers:
    - name: ntfy
      webhook_configs:
        - url: http://ntfy.ntfy.svc:8080/alerts?template=alertmanager
          http_config:
            authorization: {type: Bearer, credentials_file: /etc/alertmanager-secrets/ntfy-token}
    - name: alerta
      webhook_configs:
        - url: http://alerta.alerta.svc:8080/api/webhooks/prometheus
          http_config:
            authorization: {type: Key, credentials_file: /etc/alertmanager-secrets/alerta-api-key}
# receiver_name on the notification metrics, so Alerta and ntfy (both webhooks) report each other
extraArgs:
  enable-feature: receiver-name-in-metrics
extraSecretMounts:
  - {name: secrets, mountPath: /etc/alertmanager-secrets, secretName: alertmanager, readOnly: true}
statefulSet: {enabled: true}
persistence:
  enabled: true
  size: 1Gi
  annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}
resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
configmapReload:
  resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {memory: 64Mi}}
serviceMonitor:
  enabled: true
  # the headless Service selects the same pod, which would be scraped twice
  relabelings:
    - {sourceLabels: [__meta_kubernetes_service_name], regex: alertmanager-headless, action: drop}
testFramework: {enabled: false}
