automountServiceAccountToken: false
config:
  route:
    receiver: alerta
    group_by: [alertname]
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h
    routes:
      - receiver: apprise
        matchers: ['severity="critical"']
        continue: true
      - receiver: alerta
  receivers:
    - name: apprise
      webhook_configs:
        - url: http://apprise.apprise.svc:8000/notify/loft01
          # Apprise's request format; values that parse as YAML lists or maps are sent as such, so the bullets are "* "
          payload:
            tag: '{{ if eq .Status "firing" }}urgent{{ else }}quiet{{ end }}'
            type: '{{ if eq .Status "firing" }}failure{{ else }}success{{ end }}'
            format: markdown
            title: '{{ if eq .Status "firing" }}🔴 {{ .GroupLabels.alertname }}{{ with len .Alerts.Firing }}{{ if gt . 1 }} ×{{ . }}{{ end }}{{ end }}{{ else }}✅ {{ .GroupLabels.alertname }} resolved{{ end }}'
            body: >-
              {{ if eq .Status "firing" }}{{ with .CommonAnnotations.summary }}{{ . }}{{ "\n\n" }}{{ end }}{{ end }}
              {{- range .Alerts.Firing }}* **{{ .Labels.instance }}** · since {{ (tz "Europe/Oslo" .StartsAt).Format "Mon 15:04" }}
              {{- if not $.CommonAnnotations.summary }}<br>{{ .Annotations.summary }}{{ end }}{{ "\n" }}{{ end }}
              {{- range .Alerts.Resolved }}* ✓ **{{ .Labels.instance }}** · lasted {{ humanizeDuration (.EndsAt.Sub .StartsAt).Seconds }}{{ "\n" }}{{ end }}
    - name: alerta
      webhook_configs:
        - url: http://alerta.alerta.svc:8080/api/webhooks/prometheus
          http_config:
            authorization: {type: Key, credentials_file: /etc/alertmanager-secrets/alerta-api-key}
# receiver_name on the notification metrics, so Alerta and Apprise (both webhooks) report each other
extraArgs:
  enable-feature: receiver-name-in-metrics
extraSecretMounts:
  - {name: secrets, mountPath: /etc/alertmanager-secrets, secretName: alertmanager, readOnly: true}
statefulSet: {enabled: true}
persistence:
  enabled: true
  size: 1Gi
  annotations: {argocd.argoproj.io/sync-options: "Delete=false,Prune=false"}
resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
configmapReload:
  resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {memory: 64Mi}}
serviceMonitor:
  enabled: true
  # the headless Service selects the same pod, which would be scraped twice
  relabelings:
    - {sourceLabels: [__meta_kubernetes_service_name], regex: alertmanager-headless, action: drop}
testFramework: {enabled: false}
