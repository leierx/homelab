apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alertmanager
  labels:
    fleet.io/ruler: mimir
spec:
  groups:
    - name: alertmanager
      rules:
        # each channel reports the other: a failed email shows in Alerta, an Alerta failure arrives by email
        - alert: AlertmanagerEmailFailing
          expr: sum(increase(alertmanager_notifications_failed_total{receiver_name="email"}[15m])) > 0
          labels:
            severity: warning
            instance: alertmanager/email
          annotations:
            summary: 'A critical alert could not be emailed: check the Alertmanager log for the SMTP error.'
        - alert: AlertmanagerAlertaFailing
          expr: sum(increase(alertmanager_notifications_failed_total{receiver_name="alerta"}[15m])) > 0
          for: 15m
          labels:
            severity: critical
            instance: alertmanager/alerta
          annotations:
            summary: 'Alertmanager cannot deliver to Alerta: only critical alerts reach you, by email.'
