apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alertmanager
  labels:
    fleet.io/ruler: mimir
spec:
  groups:
    - name: alertmanager
      rules:
        # each channel reports the other: a mail failure shows in Alerta, an Alerta failure arrives by mail
        - alert: AlertmanagerEmailFailing
          expr: sum(increase(alertmanager_notifications_failed_total{integration="email"}[15m])) > 0
          labels:
            severity: warning
            instance: alertmanager/email
          annotations:
            summary: 'A critical alert could not be mailed: the Alertmanager log has the SMTP error (port 25 blocked, or the recipient refused it).'
        - alert: AlertmanagerAlertaFailing
          expr: sum(increase(alertmanager_notifications_failed_total{integration="webhook"}[15m])) > 0
          for: 15m
          labels:
            severity: critical
            instance: alertmanager/alerta
          annotations:
            summary: 'Alertmanager cannot deliver to Alerta: only critical alerts reach you, by email.'
