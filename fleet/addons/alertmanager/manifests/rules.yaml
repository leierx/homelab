apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alertmanager
  labels:
    fleet.io/ruler: mimir
spec:
  groups:
    - name: alertmanager
      rules:
        - alert: AlertmanagerAlertaFailing
          expr: sum(increase(alertmanager_notifications_failed_total{receiver_name="alerta"}[15m])) > 0
          for: 15m
          labels:
            severity: critical
            instance: alertmanager/alerta
          annotations:
            summary: 'Alertmanager cannot deliver to Alerta: new alerts are missing from the history.'
