apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alertmanager
  labels:
    fleet.io/ruler: mimir
spec:
  groups:
    - name: alertmanager
      rules:
        # each channel reports the other: a failed push shows in Alerta, an Alerta failure arrives as a push
        - alert: AlertmanagerAppriseFailing
          expr: sum(increase(alertmanager_notifications_failed_total{receiver_name="apprise"}[15m])) > 0
          labels:
            severity: warning
            instance: alertmanager/apprise
          annotations:
            summary: 'A critical alert could not be pushed: the Alertmanager log has the Apprise error.'
        - alert: AlertmanagerAlertaFailing
          expr: sum(increase(alertmanager_notifications_failed_total{receiver_name="alerta"}[15m])) > 0
          for: 15m
          labels:
            severity: critical
            instance: alertmanager/alerta
          annotations:
            summary: 'Alertmanager cannot deliver to Alerta: only critical alerts reach you, as Gotify pushes.'
