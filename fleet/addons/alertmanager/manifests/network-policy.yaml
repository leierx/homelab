apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
            - {port: "9093", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
        - matchLabels:
            app.kubernetes.io/name: mimir
        - matchLabels:
            app.kubernetes.io/name: loki
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "9093", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alerta
            app.kubernetes.io/name: alerta
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    # lookups through Cilium's DNS proxy, which learns the addresses the toFQDNs rule allows
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*"
    # SMTP submission for critical alert emails (ISP blocks port 25)
    - toFQDNs:
        - matchName: smtp.resend.com
      toPorts:
        - ports:
            - {port: "587", protocol: TCP}
