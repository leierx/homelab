nameOverride: smartctl-exporter
rbac: {create: false}
serviceAccount: {create: false, name: smartctl-exporter}
serviceMonitor:
  enabled: true
  relabelings:
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: instance
resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {memory: 64Mi}}
