apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smartctl-exporter
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: smartctl-exporter
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports: [{port: "9633", protocol: TCP}]
