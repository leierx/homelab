apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl-exporter
  labels:
    fleet.io/ruler: mimir
spec:
  groups:
    - name: smart
      rules:
        - alert: SmartStatusFailed
          expr: min by (instance, device) (smartctl_device_smart_status) < 1 or absent(smartctl_device_smart_status)
          for: 5m
          labels:
            severity: critical
            instance: '{{ $labels.instance }}/{{ $labels.device }}'
          annotations:
            summary: A disk failed its SMART health assessment (or smartctl-exporter stopped reporting); replace the disk.
        - alert: SmartDiskErrors
          expr: max by (instance, device) (smartctl_device_attribute{attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Offline_Uncorrectable|Reported_Uncorrect", attribute_value_type="raw"} > 0 or smartctl_scsi_grown_defect_list > 0 or {__name__=~"smartctl_(read|write|verify)_total_uncorrected_errors"} > 0 or smartctl_device_media_errors > 0 or smartctl_device_self_test_log_error_count > 0)
          for: 15m
          labels:
            severity: warning
            instance: '{{ $labels.instance }}/{{ $labels.device }}'
          annotations:
            summary: A disk reports reallocated, pending or uncorrectable sectors, SCSI grown defects, NVMe media errors or a failed SMART self-test; scrub the pool and plan a replacement.
        - alert: SmartNvmeWarning
          expr: max by (instance, device) (smartctl_device_critical_warning > 0 or (smartctl_device_available_spare < smartctl_device_available_spare_threshold) + 1)
          for: 5m
          labels:
            severity: critical
            instance: '{{ $labels.instance }}/{{ $labels.device }}'
          annotations:
            summary: An NVMe controller raised its critical-warning flag or fell below its available-spare threshold.
        - alert: SmartDiskHot
          expr: max by (instance, device) (smartctl_device_temperature{temperature_type="current"}) > 55
          for: 15m
          labels:
            severity: warning
            instance: '{{ $labels.instance }}/{{ $labels.device }}'
          annotations:
            summary: A disk has been over 55°C for 15 minutes; check fans and airflow.
