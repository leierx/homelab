# ESO regenerates the password on each refresh; CNPG applies it because the Secret carries cnpg.io/reload
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: miniflux-db-password
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-db-rotation
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 720h
  target:
    name: miniflux-db-app
    creationPolicy: Merge
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        password: '{{ "{{ .password }}" }}'
        pgpass: 'miniflux-db-rw:5432:miniflux:miniflux:{{ "{{ .password }}" }}'
        uri: 'postgresql://miniflux:{{ "{{ .password }}" }}@miniflux-db-rw.{{ .Release.Namespace }}:5432/miniflux'
        fqdn-uri: 'postgresql://miniflux:{{ "{{ .password }}" }}@miniflux-db-rw.{{ .Release.Namespace }}.svc.cluster.local:5432/miniflux'
        jdbc-uri: 'jdbc:postgresql://miniflux-db-rw.{{ .Release.Namespace }}:5432/miniflux?password={{ "{{ .password }}" }}&user=miniflux'
        fqdn-jdbc-uri: 'jdbc:postgresql://miniflux-db-rw.{{ .Release.Namespace }}.svc.cluster.local:5432/miniflux?password={{ "{{ .password }}" }}&user=miniflux'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: miniflux-db-password
