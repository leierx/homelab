apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: miniflux-db
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  bootstrap:
    initdb:
      database: miniflux
      owner: miniflux
  storage: {{ toJson .Values.database.storage }}
  postgresql:
    parameters:
      # Miniflux asks for at most 20 connections; the server keeps headroom for the operator and pg_dump
      max_connections: "60"
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: miniflux-db
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: miniflux-db
  podMetricsEndpoints:
    - port: metrics
