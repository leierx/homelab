# The provider namespaces are not this addon's destination, so they are manifests here.
# The chart's createNamespace values are off; these carry the protection annotation instead.
apiVersion: v1
kind: Namespace
metadata:
  name: capi-system
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubeadm-bootstrap-system
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubeadm-control-plane-system
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubevirt-infrastructure-system
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
