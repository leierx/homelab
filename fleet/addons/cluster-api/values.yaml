enableHelmHook: false
resources:
  manager: {requests: {cpu: 10m, memory: 64Mi}, limits: {cpu: null, memory: 256Mi}}
containerSecurityContext:
  manager:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    seccompProfile: {type: RuntimeDefault}
core:
  cluster-api:
    createNamespace: false
    # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
    version: v1.14.3
    deployment:
      containers: [{name: manager, resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 512Mi}}}]
bootstrap:
  kubeadm:
    createNamespace: false
    # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
    version: v1.14.3
    deployment:
      containers: [{name: manager, resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}}]
controlPlane:
  kubeadm:
    createNamespace: false
    # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
    version: v1.14.3
    deployment:
      containers: [{name: manager, resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 512Mi}}}]
infrastructure:
  kubevirt:
    createNamespace: false
    # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api-provider-kubevirt
    version: v0.11.2
    deployment:
      containers: [{name: manager, resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}}]
    manifestPatches:
      - |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: capk-controller-manager
          namespace: kubevirt-infrastructure-system
        spec:
          template:
            spec:
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: manager
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: [ALL]
