enableHelmHook: false
resources:
  manager: {requests: {cpu: 10m, memory: 64Mi}, limits: {cpu: null, memory: 256Mi}}
containerSecurityContext:
  manager:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: {drop: [ALL]}
    seccompProfile: {type: RuntimeDefault}
# clusterctl's config client MkdirAlls $XDG_CONFIG_HOME/cluster-api on every reconcile, though it writes nothing there
env:
  manager: [{name: XDG_CONFIG_HOME, value: /home/nonroot/.config}]
# volumes replaces the chart's list, so its webhook cert is repeated
volumes:
  - {name: cert, secret: {defaultMode: 420, secretName: capi-operator-webhook-service-cert}}
  - {name: xdg-config, emptyDir: {sizeLimit: 1Mi}}
volumeMounts:
  manager:
    - {mountPath: /tmp/k8s-webhook-server/serving-certs, name: cert, readOnly: true}
    - {mountPath: /home/nonroot/.config, name: xdg-config}
core:
  cluster-api:
    createNamespace: false
    # lets Clusters be built from a ClusterClass
    manager: {featureGates: {ClusterTopology: true}}
    # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
    version: v1.14.4
    deployment:
      containers: [{name: manager, resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 512Mi}}}]
bootstrap:
  kubeadm:
    createNamespace: false
    manager: {featureGates: {ClusterTopology: true}}
    # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
    version: v1.14.4
    deployment:
      containers: [{name: manager, resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}}]
controlPlane:
  kubeadm:
    createNamespace: false
    manager: {featureGates: {ClusterTopology: true}}
    # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
    version: v1.14.4
    deployment:
      containers: [{name: manager, resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 512Mi}}}]
infrastructure:
  kubevirt:
    createNamespace: false
    # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api-provider-kubevirt
    version: v0.11.2
    deployment:
      containers: [{name: manager, resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}}]
    # upstream ships imagePullPolicy Always, which needs quay.io at every start, and no container securityContext
    patches:
      - target: {group: apps, kind: Deployment, name: capk-controller-manager}
        patch: |
          - {op: replace, path: /spec/template/spec/containers/0/imagePullPolicy, value: IfNotPresent}
          - op: add
            path: /spec/template/spec/containers/0/securityContext
            value:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
              seccompProfile: {type: RuntimeDefault}
