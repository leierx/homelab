enableHelmHook: false
resources:
  manager: {requests: {cpu: 10m, memory: 64Mi}, limits: {cpu: null, memory: 256Mi}}
containerSecurityContext:
  manager:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    seccompProfile: {type: RuntimeDefault}
core:
  cluster-api:
    createNamespace: false
    # ClusterClass (fleet/clusters/loft01/capi-argo-bridge/manifests/clusterclass-kubevirt.yaml)
    manager: {featureGates: {ClusterTopology: true}}
    # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
    version: v1.14.3
    deployment:
      containers: [{name: manager, resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 512Mi}}}]
bootstrap:
  kubeadm:
    createNamespace: false
    manager: {featureGates: {ClusterTopology: true}}
    # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
    version: v1.14.3
    deployment:
      containers: [{name: manager, resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}}]
controlPlane:
  kubeadm:
    createNamespace: false
    manager: {featureGates: {ClusterTopology: true}}
    # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
    version: v1.14.3
    deployment:
      containers: [{name: manager, resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 512Mi}}}]
infrastructure:
  kubevirt:
    createNamespace: false
    # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api-provider-kubevirt
    version: v0.11.2
    deployment:
      containers: [{name: manager, resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}}]
