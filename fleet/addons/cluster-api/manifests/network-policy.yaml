apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: operator
  namespace: capi-operator-system
spec:
  endpointSelector:
    matchLabels:
      control-plane: controller-manager
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - {port: "9440", protocol: TCP}
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "9443", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
    # lookups through Cilium's DNS proxy, which learns the addresses the toFQDNs rule allows
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*"
    # provider release manifests from GitHub
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: release-assets.githubusercontent.com
        - matchName: objects.githubusercontent.com
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: controller
  namespace: capi-system
spec:
  endpointSelector:
    matchLabels:
      control-plane: controller-manager
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - {port: "9440", protocol: TCP}
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "9443", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
    # workload clusters' API servers, on their control-plane VMs
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: clusters
            kubevirt.io: virt-launcher
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
---
