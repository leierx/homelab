addon:
  enablement: baseline
  placement:
    key: fleet/environment
    value: prod
  namespace: telemetry
  podSecurity: privileged
  # Keep repoURL -> name -> version in this order; Renovate parses it.
  chart:
    repoURL: https://prometheus-community.github.io/helm-charts
    name: kube-state-metrics
    version: 8.6.0
