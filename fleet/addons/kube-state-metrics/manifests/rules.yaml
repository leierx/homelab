apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kube-state-metrics
  labels:
    fleet.io/ruler: mimir
spec:
  groups:
    - name: kubernetes
      rules:
        - alert: PodRestarting
          expr: sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[15m])) > 3
          labels:
            severity: warning
            instance: '{{ $labels.namespace }}/{{ $labels.pod }}'
          annotations:
            summary: A container restarted more than three times in 15 minutes.
        - alert: NodeNotReady
          expr: max by (node) (kube_node_status_condition{condition="Ready", status="true"}) == 0
          for: 5m
          labels:
            severity: critical
            instance: '{{ $labels.node }}'
          annotations:
            summary: A node has been NotReady for 5 minutes.
