apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: server
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: wg
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "8083", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
    # workload clusters' API servers, on their control-plane VMs
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: clusters
            kubevirt.io: virt-launcher
      toPorts:
        - ports:
            - {port: "6443", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: argocd-repo-server
      toPorts:
        - ports:
            - {port: "8081", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: argocd-redis
      toPorts:
        - ports:
            - {port: "6379", protocol: TCP}
    # Keycloak OIDC via CoreDNS split-horizon to the edge Gateway
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: edge
      toPorts:
        - ports:
            - {port: "10443", protocol: TCP}
---
