# Default-deny for the namespace, then what Argo CD needs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # the namespace's own pods
    - fromEndpoints:
        - {}
    # the Envoy Gateway proxies
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
  egress:
    - toEndpoints:
        - {}
    - toEntities: [kube-apiserver]
    # the cluster-wide baseline allows DNS too, but Argo CD is what delivers that policy
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    # GitHub and the chart repositories, and the Keycloak issuer (public address) for SSO
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
