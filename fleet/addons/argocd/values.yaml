configs:
  cm:
    admin.enabled: 'false'

    resource.customizations.health.apiextensions.k8s.io_CustomResourceDefinition: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for i, condition in ipairs(obj.status.conditions) do
          if condition.type == "Established" and condition.status == "True" then
            hs.status = "Healthy"
            hs.message = condition.message or "CRD is established"
            return hs
          end
        end
      end
      return hs

    resource.customizations.health.v1_PersistentVolumeClaim: |
      hs = {}
      if obj.status ~= nil and obj.status.phase ~= nil then
        if obj.status.phase == "Pending" then
          hs.status = "Healthy"
          hs.message = "Waiting for first consumer to bind volume"
          return hs
        end
        if obj.status.phase == "Bound" then
          hs.status = "Healthy"
          return hs
        end
        if obj.status.phase == "Lost" then
          hs.status = "Degraded"
          return hs
        end
      end
      hs.status = "Progressing"
      return hs

    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
        if obj.status.sync ~= nil and obj.status.sync.status == "OutOfSync" and hs.status == "Healthy" then
          hs.status = "Progressing"
          hs.message = "Application is OutOfSync"
        end
        -- argo-workflows-server waits for Keycloak OIDC discovery, while keycloak needs CronWorkflow CRD from argo-workflows
        if obj.metadata ~= nil and obj.metadata.name == "argo-workflows" and obj.status.sync ~= nil and obj.status.sync.status == "Synced" and hs.status == "Progressing" then
          if obj.status.operationState == nil or obj.status.operationState.phase == "Succeeded" then
            hs.status = "Healthy"
          end
        end
      end
      return hs

    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jqPathExpressions:
        - '.spec.conversion.webhook.clientConfig.caBundle'
    resource.customizations.ignoreDifferences.apiregistration.k8s.io_APIService: |
      jqPathExpressions:
        - '.spec.caBundle'
  params:
    server.insecure: true
    controller.diff.server.side: true
    controller.sync.timeout.seconds: '4800'
  rbac:
    policy.csv: |
      g, homelab-admins, role:admin
      g, homelab-operators, role:admin
      g, homelab-viewers, role:readonly

dex: {enabled: false}
notifications: {enabled: false}

controller:
  metrics: {enabled: true, serviceMonitor: {enabled: true}}
  resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {memory: 4Gi}}
repoServer:
  metrics: {enabled: true, serviceMonitor: {enabled: true}}
  resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 1Gi}}
  copyutil:
    resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
server:
  metrics: {enabled: true, serviceMonitor: {enabled: true}}
  resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
applicationSet:
  metrics: {enabled: true, serviceMonitor: {enabled: true}}
  resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
redis:
  automountServiceAccountToken: false
  resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 256Mi}}
redisSecretInit:
  resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}

extraObjects:
  - apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: default
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    spec:
      sourceRepos: ["*"]
      destinations:
        - server: "*"
          namespace: "*"
      clusterResourceWhitelist:
        - group: "*"
          kind: "*"
  - apiVersion: argoproj.io/v1alpha1
    kind: ApplicationSet
    metadata:
      name: fleet-root
      namespace: argocd
    spec:
      goTemplate: true
      goTemplateOptions: ["missingkey=error"]
      ignoreApplicationDifferences:
        - jsonPointers:
            - /spec/syncPolicy
      generators:
        - clusters:
            selector:
              matchLabels:
                fleet.io/enabled: "true"
      template:
        metadata:
          name: 'fleet-{{ `{{ .name }}` }}'
          namespace: argocd
          labels:
            fleet.io/cluster: '{{ `{{ .name }}` }}'
        spec:
          project: default
          destination:
            server: '{{ `{{ .server }}` }}'
            namespace: argocd
          source:
            repoURL: '{{ `{{ index .metadata.annotations "fleet.io/repo-url" }}` }}'
            targetRevision: '{{ `{{ index .metadata.annotations "fleet.io/target-revision" }}` }}'
            path: fleet
            helm:
              valueFiles:
                - 'clusters/{{ `{{ .name }}` }}/cluster.yaml'
              valuesObject:
                cluster:
                  name: '{{ `{{ .name }}` }}'
                  server: '{{ `{{ .server }}` }}'
          ignoreDifferences:
            - group: argoproj.io
              kind: Application
              jsonPointers:
                - /spec/syncPolicy
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            syncOptions:
              - ServerSideApply=true
              - RespectIgnoreDifferences=true
            retry:
              limit: 10
              backoff:
                duration: 10s
                factor: 2
                maxDuration: 5m
