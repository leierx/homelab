configs:
  cm:
    admin.enabled: 'false'

    resource.customizations.health.argoproj.io_Application: |
      hs = { status = "Progressing", message = "" }
      if obj.metadata.annotations ~= nil and obj.metadata.annotations["fleet.io/non-blocking"] == "true" then
        hs.status = "Healthy"
        hs.message = "non-blocking"
        return hs
      end
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message or ""
      end
      return hs
  params:
    server.insecure: true
    controller.diff.server.side: true
    controller.sync.timeout.seconds: '4800'
    reposerver.log.level: warn
  rbac:
    policy.csv: |
      p, role:operator, applications, sync, */*, allow
      p, role:operator, applications, action/*, */*, allow
      g, role:operator, role:readonly
      g, homelab-admins, role:admin
      g, homelab-operators, role:operator
      g, homelab-viewers, role:readonly

global:
  networkPolicy: {create: false}

dex: {enabled: false}
notifications: {enabled: false}

controller:
  metrics: {enabled: true, serviceMonitor: {enabled: true}}
  resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {memory: 4Gi}}
repoServer:
  metrics: {enabled: true, serviceMonitor: {enabled: true}}
  resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 1Gi}}
  copyutil:
    resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
server:
  metrics: {enabled: true, serviceMonitor: {enabled: true}}
  resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
applicationSet:
  metrics: {enabled: true, serviceMonitor: {enabled: true}}
  resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
redis:
  automountServiceAccountToken: false
  resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 256Mi}}
redisSecretInit:
  resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}

extraObjects:
  - apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: default
      namespace: argocd
    spec:
      sourceRepos: ["*"]
      destinations:
        - server: "*"
          namespace: "*"
      clusterResourceWhitelist:
        - group: "*"
          kind: "*"
