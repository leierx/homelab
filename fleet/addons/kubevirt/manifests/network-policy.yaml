apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: virt-operator
  namespace: kubevirt
spec:
  endpointSelector:
    matchLabels:
      kubevirt.io: virt-operator
  ingress:
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "8444", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "8443", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: virt-api
  namespace: kubevirt
spec:
  endpointSelector:
    matchLabels:
      kubevirt.io: virt-api
  ingress:
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "8443", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "8443", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            kubevirt.io: virt-handler
      toPorts:
        - ports:
            - {port: "8443", protocol: TCP}
---
