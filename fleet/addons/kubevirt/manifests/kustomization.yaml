apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.1/kubevirt-operator.yaml
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.1/kubevirt-cr.yaml
  - network-policy.yaml
patches:
  # the upstream namespace stays privileged: virt-handler runs privileged and hostPID
  - target:
      kind: Namespace
      name: kubevirt
    patch: |
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Delete=false,Prune=false
  # the seccomp profile is the one thing keeping virt-launcher (uid 107) out of Pod Security restricted in v1.9.1
  - target:
      kind: KubeVirt
    patch: |
      - op: add
        path: /spec/configuration/seccompConfiguration
        value:
          virtualMachineInstanceProfile:
            customProfile:
              runtimeDefaultProfile: true
  # Template is Beta (on by default in v1.9.1) and only deploys virt-template, which nothing here uses
  - target:
      kind: KubeVirt
    patch: |
      - op: add
        path: /spec/configuration/developerConfiguration/disabledFeatureGates
        value:
          - Template
  # an accidental CR delete must not tear the running VMs down (the DELETE webhook enforces this)
  - target:
      kind: KubeVirt
    patch: |
      - op: add
        path: /spec/uninstallStrategy
        value: BlockUninstallIfWorkloadsExist
  # the CR waits for the operator to be Healthy
  - target:
      kind: KubeVirt
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "1"
