apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.1/kubevirt-operator.yaml
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.1/kubevirt-cr.yaml
  - network-policy.yaml
patches:
  # the upstream namespace stays privileged: virt-handler runs privileged and hostPID
  - target:
      kind: Namespace
      name: kubevirt
    patch: |
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Delete=false,Prune=false
  # the seccomp profile is the one thing keeping virt-launcher (uid 107) out of Pod Security restricted in v1.9.1
  - target:
      kind: KubeVirt
    patch: |
      - op: add
        path: /spec/configuration/seccompConfiguration
        value:
          virtualMachineInstanceProfile:
            customProfile:
              runtimeDefaultProfile: true
  # an accidental CR delete must not tear the running VMs down (the DELETE webhook enforces this)
  - target:
      kind: KubeVirt
    patch: |
      - op: add
        path: /spec/uninstallStrategy
        value: BlockUninstallIfWorkloadsExist
  # TODO(kubevirt v1.10.0): remove once kubevirt/kubevirt#18698 lands in a release;
  # in v1.9.1 virt-operator unmounts /etc/virt-handler/clientcertificates while
  # virt-handler still polls --client-cert-file/--client-key-file every minute
  - target:
      kind: KubeVirt
    patch: |
      - op: add
        path: /spec/customizeComponents
        value:
          flags:
            handler:
              client-cert-file: /etc/virt-handler/migrationservercertificates/tls.crt
              client-key-file: /etc/virt-handler/migrationservercertificates/tls.key
          # the admission policy wants a memory limit and no CPU limit on every container
          patches:
            - resourceType: Deployment
              resourceName: virt-api
              type: strategic
              patch: '{"spec":{"template":{"spec":{"containers":[{"name":"virt-api","resources":{"limits":{"memory":"1Gi"}}}]}}}}'
            - resourceType: Deployment
              resourceName: virt-controller
              type: strategic
              patch: '{"spec":{"template":{"spec":{"containers":[{"name":"virt-controller","resources":{"limits":{"memory":"512Mi"}}}]}}}}'
            - resourceType: Deployment
              resourceName: virt-exportproxy
              type: strategic
              patch: '{"spec":{"template":{"spec":{"containers":[{"name":"exportproxy","resources":{"limits":{"memory":"256Mi"}}}]}}}}'
            - resourceType: Deployment
              resourceName: virt-template-apiserver
              type: strategic
              patch: '{"spec":{"template":{"spec":{"containers":[{"name":"apiserver","resources":{"limits":{"cpu":null}}}]}}}}'
            - resourceType: Deployment
              resourceName: virt-template-controller
              type: strategic
              patch: '{"spec":{"template":{"spec":{"containers":[{"name":"manager","resources":{"limits":{"cpu":null}}}]}}}}'
            - resourceType: DaemonSet
              resourceName: virt-handler
              type: strategic
              patch: '{"spec":{"template":{"spec":{"initContainers":[{"name":"virt-launcher","resources":{"requests":{"cpu":"5m","memory":"20Mi"},"limits":{"memory":"64Mi"}}}],"containers":[{"name":"virt-handler","resources":{"limits":{"memory":"1Gi"}}}]}}}}'
  - target:
      kind: Deployment
      name: virt-operator
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/resources/limits
        value:
          memory: 1Gi
  # the CR waits for the operator to be Healthy
  - target:
      kind: KubeVirt
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "1"
