apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kube-audit
  labels:
    fleet.io/ruler: loki
spec:
  groups:
    - name: kube-audit
      rules:
        - alert: AdminKubeconfigUsed
          expr: sum(count_over_time({job="kube-audit"} | json | user_username="system:admin" [5m])) > 0
          labels:
            severity: warning
            instance: system:admin
          annotations:
            summary: "The host's system:masters certificate was used: break-glass, or someone who shouldn't have it."
        - alert: RBACChangedByPerson
          expr: sum by (user_username, objectRef_resource, objectRef_name) (count_over_time({job="kube-audit"} | json | objectRef_apiGroup="rbac.authorization.k8s.io" | verb=~"create|update|patch|delete" | user_username!~"system:serviceaccount:.*" | requestURI!~".*dryRun=All.*" [5m])) > 0
          labels:
            severity: warning
            instance: '{{ $labels.user_username }}: {{ $labels.objectRef_resource }}/{{ $labels.objectRef_name }}'
          annotations:
            summary: A role or binding was created, changed or deleted by something other than a ServiceAccount.
        - alert: SecretReadByPerson
          expr: sum by (user_username, objectRef_namespace, objectRef_name) (count_over_time({job="kube-audit"} | json | user_username=~"oidc:.*" | objectRef_resource="secrets" [5m])) > 0
          labels:
            severity: informational
            instance: '{{ $labels.user_username }}: {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }}'
          annotations:
            summary: Someone logged in through Keycloak read a Secret.
        # Argo CD syncs these on every change and ESO rewrites ExternalSecret status; anything else is a ServiceAccount reaching past its own app
        - alert: PolicyOrSecretStoreChangedByServiceAccount
          expr: sum by (user_username, objectRef_apiGroup, objectRef_namespace, objectRef_name) (count_over_time({job="kube-audit"} | json | objectRef_apiGroup=~"cilium.io|external-secrets.io" | verb=~"create|update|patch|delete" | user_username=~"system:serviceaccount:.*" | user_username!~"system:serviceaccount:(argocd|external-secrets):.*" [5m])) > 0
          labels:
            severity: warning
            instance: '{{ $labels.user_username }}: {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }}'
          annotations:
            summary: A ServiceAccount other than Argo CD or ESO wrote a Cilium policy, ExternalSecret or ClusterSecretStore; check which TokenReview gave it that identity.
        - alert: EphemeralContainerAdded
          expr: sum by (user_username, objectRef_namespace, objectRef_name) (count_over_time({job="kube-audit"} | json | objectRef_subresource="ephemeralcontainers" [5m])) > 0
          labels:
            severity: warning
            instance: '{{ $labels.user_username }}: {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }}'
          annotations:
            summary: A debug container was added to a running pod (kubectl debug); its image runs as that pod's identity.
        # the kubelet API reaches every container on the node, past admission and network policy
        - alert: NodeProxyUsed
          expr: sum by (user_username, objectRef_name) (count_over_time({job="kube-audit"} | json | objectRef_resource="nodes" | objectRef_subresource="proxy" [5m])) > 0
          labels:
            severity: warning
            instance: '{{ $labels.user_username }}: {{ $labels.objectRef_name }}'
          annotations:
            summary: The kubelet API was reached through the apiserver; check whether the caller can already exec into anything on that node.
        - alert: PodEnteredByPerson
          expr: sum by (user_username, objectRef_namespace, objectRef_name, objectRef_subresource) (count_over_time({job="kube-audit"} | json | user_username=~"oidc:.*" | objectRef_subresource=~"exec|attach|portforward" [5m])) > 0
          labels:
            severity: informational
            instance: '{{ $labels.user_username }}: {{ $labels.objectRef_namespace }}/{{ $labels.objectRef_name }}'
          annotations:
            summary: Someone logged in through Keycloak used exec, attach or port-forward on a pod.
