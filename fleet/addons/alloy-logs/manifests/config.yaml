apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-logs
data:
  config.alloy: |
    // the API server's audit log; on a cluster without that file the pipeline finds nothing
    local.file_match "kube_audit" {
      path_targets = [{"__path__" = sys.env("AUDIT_LOG_PATH"), "job" = "kube-audit"}]
    }

    loki.source.file "kube_audit" {
      targets    = local.file_match.kube_audit.targets
      forward_to = [loki.write.loki.receiver]
    }

    // the pods on this node; containerd writes their logs under /var/log/pods
    discovery.kubernetes "pods" {
      role = "pod"

      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("HOSTNAME")
      }
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        target_label  = "app"
      }

      rule {
        source_labels = ["namespace", "container"]
        separator     = "/"
        target_label  = "job"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
    }

    local.file_match "pods" {
      path_targets = discovery.relabel.pods.output
    }

    loki.source.file "pods" {
      targets       = local.file_match.pods.targets
      tail_from_end = true
      forward_to    = [loki.process.pods.receiver]
    }

    loki.process "pods" {
      stage.cri {}

      stage.label_drop {
        values = ["filename"]
      }

      forward_to = [loki.write.loki.receiver]
    }

    loki.write "loki" {
      endpoint {
        url                 = sys.env("LOKI_URL") + "/loki/api/v1/push"
        retry_on_http_429   = true
        min_backoff_period  = "500ms"
        max_backoff_period  = "5m"
        max_backoff_retries = 10
      }

      external_labels = {
        cluster = sys.env("CLUSTER_NAME"),
      }
    }
