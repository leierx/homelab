apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-logs
data:
  config.alloy: |
    // audit.alloy
    // AUDIT_LOG_PATH; on a cluster without that file the pipeline finds nothing
    local.file_match "kube_audit" {
      path_targets = [{"__path__" = sys.env("AUDIT_LOG_PATH"), "job" = "kube-audit"}]
    }
    
    loki.source.file "kube_audit" {
      targets    = local.file_match.kube_audit.targets
      forward_to = [loki.write.loki.receiver]
    }
    
    // pods.alloy
    discovery.kubernetes "pods" {
      role = "pod"
    
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("HOSTNAME")
      }
    }
    
    discovery.relabel "filtered_pods" {
      targets = discovery.kubernetes.pods.targets
    
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        action        = "replace"
        target_label  = "namespace"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_logs_grafana_com_pods_enabled"]
        regex         = "(false|no|skip)"
        action        = "drop"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    
      // the default job is namespace/container; the annotation overrides it
      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        replacement   = "$1"
        target_label  = "job"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_container_id"]
        regex         = "^(\\S+):\\/\\/.+$"
        replacement   = "$1"
        target_label  = "tmp_container_runtime"
      }
    
      rule {
        source_labels = [
          "__meta_kubernetes_pod_annotation_resource_opentelemetry_io_service_name",
          "__meta_kubernetes_pod_label_app_kubernetes_io_name",
          "__meta_kubernetes_pod_container_name",
        ]
        separator    = ";"
        regex        = "^(?:;*)?([^;]+).*$"
        replacement  = "$1"
        target_label = "service_name"
      }
    
      rule {
        source_labels = [
          "__meta_kubernetes_pod_annotation_resource_opentelemetry_io_service_namespace",
          "namespace",
        ]
        separator    = ";"
        regex        = "^(?:;*)?([^;]+).*$"
        replacement  = "$1"
        target_label = "service_namespace"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_resource_opentelemetry_io_service_instance_id"]
        target_label  = "service_instance_id"
      }
    
      rule {
        source_labels = ["service_instance_id", "namespace", "pod", "container"]
        separator     = "."
        regex         = "^\\.([^.]+\\.[^.]+\\.[^.]+)$"
        target_label  = "service_instance_id"
      }
    
      rule {
        action = "labelmap"
        regex  = "__meta_kubernetes_pod_annotation_resource_opentelemetry_io_(.+)"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_k8s_grafana_com_logs_job"]
        regex         = "(.+)"
        target_label  = "job"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = "(.+)"
        target_label  = "app_kubernetes_io_name"
      }
    
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
    
      // static pods, created by the kubelet, log somewhere else
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_kubernetes_io_config_mirror", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        regex         = "(.+/.+)"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
    }
    
    local.file_match "pod_logs" {
      path_targets = discovery.relabel.filtered_pods.output
    }
    
    loki.source.file "pod_logs" {
      targets       = local.file_match.pod_logs.targets
      tail_from_end = true
      forward_to    = [loki.process.pod_logs.receiver]
    }
    
    loki.process "pod_logs" {
      stage.match {
        selector = "{tmp_container_runtime=~\"containerd|cri-o|\"}"
    
        stage.cri {
          max_partial_lines = 100
        }
    
        stage.labels {
          values = {
            flags  = "",
            stream = "",
          }
        }
      }
    
      stage.match {
        selector = "{tmp_container_runtime=\"docker\"}"
    
        stage.docker {}
    
        stage.labels {
          values = {
            stream = "",
          }
        }
      }
    
      stage.label_drop {
        values = [
          "filename",
          "tmp_container_runtime",
        ]
      }
    
      stage.structured_metadata {
        values = {
          k8s_pod_name        = "k8s_pod_name",
          pod                 = "pod",
          service_instance_id = "service_instance_id",
        }
      }
    
      forward_to = [loki.write.loki.receiver]
    }
    
    // remote-write.alloy
    loki.write "loki" {
      endpoint {
        url                 = sys.env("LOKI_URL")
        retry_on_http_429   = true
        min_backoff_period  = "500ms"
        max_backoff_period  = "5m"
        max_backoff_retries = "10"
      }
    
      external_labels = {
        cluster          = sys.env("CLUSTER_NAME"),
        k8s_cluster_name = sys.env("CLUSTER_NAME"),
      }
    }
