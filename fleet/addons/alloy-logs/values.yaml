alloy:
  configMap: {create: false, name: alloy-logs}
  mounts: {varlog: true}
  envFrom: [{configMapRef: {name: alloy-logs-env}}]
  # loki.source.api "harbor" (manifests/config.yaml)
  extraPorts: [{name: harbor-webhook, port: 3500, targetPort: 3500, protocol: TCP}]
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    seccompProfile: {type: RuntimeDefault}
  resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
  enableReporting: false
rbac: {create: false}
configReloader:
  resources: {requests: {memory: 16Mi}, limits: {memory: 64Mi}}
crds: {create: false}
serviceMonitor: {enabled: true}
