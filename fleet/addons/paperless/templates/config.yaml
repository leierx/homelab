apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-init
data:
  # run by the image's custom init on every start, after the superuser is created: admin is break-glass only
  disable-admin.sh: |
    cd "${PAPERLESS_SRC_DIR}"
    python3 manage.py shell -c "from django.contrib.auth.models import User; print('admin deactivated:', User.objects.filter(username='admin', is_active=True).update(is_active=False))"
