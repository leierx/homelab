# generated once into OpenBao (PushSecret in the cluster layer); the OIDC client secret next to them comes from the keycloak addon
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys: [secret_key, admin_password]
