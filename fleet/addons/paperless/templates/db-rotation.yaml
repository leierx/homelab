# ESO regenerates the password on each refresh; CNPG applies it because the Secret carries cnpg.io/reload
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: paperless-db-password
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-db-rotation
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 720h
  target:
    name: paperless-db-app
    creationPolicy: Merge
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        password: '{{ "{{ .password }}" }}'
        pgpass: 'paperless-db-rw:5432:paperless:paperless:{{ "{{ .password }}" }}'
        uri: 'postgresql://paperless:{{ "{{ .password }}" }}@paperless-db-rw.{{ .Release.Namespace }}:5432/paperless'
        fqdn-uri: 'postgresql://paperless:{{ "{{ .password }}" }}@paperless-db-rw.{{ .Release.Namespace }}.svc.cluster.local:5432/paperless'
        jdbc-uri: 'jdbc:postgresql://paperless-db-rw.{{ .Release.Namespace }}:5432/paperless?password={{ "{{ .password }}" }}&user=paperless'
        fqdn-jdbc-uri: 'jdbc:postgresql://paperless-db-rw.{{ .Release.Namespace }}.svc.cluster.local:5432/paperless?password={{ "{{ .password }}" }}&user=paperless'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: paperless-db-password
