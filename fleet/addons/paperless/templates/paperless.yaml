{{- $url := required "url is per cluster" .Values.url -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paperless
  annotations:
    # after its database and secrets are Healthy
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  serviceName: paperless
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      # Service links would set PAPERLESS_PORT=tcp://… and break the webserver
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # in-memory: the queue only lives as long as the pod's scratch files do
        - name: valkey
          image: {{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}
          restartPolicy: Always
          args: [--bind, 127.0.0.1, --save, "", --appendonly, "no"]
          startupProbe:
            exec:
              command: [valkey-cli, -h, 127.0.0.1, ping]
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: paperless
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: PAPERLESS_URL
              value: {{ $url | quote }}
            - name: PAPERLESS_ALLOWED_HOSTS
              value: {{ (urlParse $url).host | quote }}
            # drops upstream's default http://localhost:8000 credentialed origin
            - name: PAPERLESS_CORS_ALLOWED_HOSTS
              value: {{ $url | quote }}
            # the cluster is IPv4-only
            - name: PAPERLESS_BIND_ADDR
              value: 0.0.0.0
            # only the Gateway reaches the pod, and it sets these headers itself
            - name: PAPERLESS_PROXY_SSL_HEADER
              value: '["HTTP_X_FORWARDED_PROTO","https"]'
            - name: PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT
              value: "1"
            - name: PAPERLESS_SECRET_KEY
              valueFrom: {secretKeyRef: {name: paperless, key: secret-key}}
            - name: PAPERLESS_DBENGINE
              value: postgresql
            - name: PAPERLESS_DBHOST
              valueFrom: {secretKeyRef: {name: paperless-db-app, key: host}}
            - name: PAPERLESS_DBNAME
              valueFrom: {secretKeyRef: {name: paperless-db-app, key: dbname}}
            - name: PAPERLESS_DBUSER
              valueFrom: {secretKeyRef: {name: paperless-db-app, key: username}}
            - name: PAPERLESS_DBPASS
              valueFrom: {secretKeyRef: {name: paperless-db-app, key: password}}
            - name: PAPERLESS_REDIS
              value: redis://127.0.0.1:6379
            - name: PAPERLESS_TIME_ZONE
              value: {{ .Values.timeZone | quote }}
            - name: PAPERLESS_OCR_LANGUAGE
              value: {{ .Values.ocrLanguage | quote }}
            # created only so the first sign-up can't become superuser; disable-admin.sh deactivates it on every start
            - name: PAPERLESS_ADMIN_USER
              value: admin
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: paperless, key: admin-password}}
            # only SSO: Keycloak accounts are created at first login, superuser from homelab-admins, groups from the claim
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              valueFrom: {secretKeyRef: {name: paperless, key: socialaccount-providers}}
            - name: PAPERLESS_DISABLE_REGULAR_LOGIN
              value: "true"
            - name: PAPERLESS_REDIRECT_LOGIN_TO_SSO
              value: "true"
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: "true"
            - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS
              value: "true"
            - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP
              value: homelab-admins
            # roles only sync at login, so a session lasts no longer than the realm's SSO session
            - name: PAPERLESS_SESSION_COOKIE_AGE
              value: "43200"
            # webhooks, mail, remote OCR and AI can't target loopback (Valkey) or the edge Gateway's other apps
            - name: PAPERLESS_WEBHOOKS_ALLOW_INTERNAL_REQUESTS
              value: "false"
            - name: PAPERLESS_EMAIL_ALLOW_INTERNAL_HOSTS
              value: "false"
            - name: PAPERLESS_REMOTE_OCR_ALLOW_INTERNAL_ENDPOINTS
              value: "false"
            - name: PAPERLESS_AI_LLM_ALLOW_INTERNAL_ENDPOINTS
              value: "false"
            # documents come in through the web UI and API; nothing can write to a consume folder
            - name: PAPERLESS_CONSUMER_DISABLE
              value: "true"
            # an emptyDir /run is world-writable and root-owned; s6 refuses it otherwise
            - name: S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES
              value: "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # ALLOWED_HOSTS refuses the pod IP; localhost is always allowed
          startupProbe:
            httpGet:
              path: /favicon.ico
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /favicon.ico
              port: http
              httpHeaders: [{name: Host, value: localhost}]
          livenessProbe:
            httpGet:
              path: /favicon.ico
              port: http
              httpHeaders: [{name: Host, value: localhost}]
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            # write-checked at start even with the consumer off
            - name: consume
              mountPath: /usr/src/paperless/consume
            - name: run
              mountPath: /run
            # also the scratch dir for uploads and OCR
            - name: tmp
              mountPath: /tmp
            # upstream's PAPERLESS_OCR_LANGUAGES would apt-get more languages as root at boot
            - name: tessdata
              mountPath: /usr/share/tesseract-ocr/5/tessdata
              subPath: tessdata
            # a single root-owned file: the image refuses scripts from a writable or non-root directory
            - name: init
              mountPath: /custom-cont-init.d/disable-admin.sh
              subPath: disable-admin.sh
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: consume
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir:
            # uploads and OCR scratch; evicts this pod before the node's root disk fills
            sizeLimit: 10Gi
        - name: tessdata
          image:
            reference: {{ .Values.tessdata.image.repository }}:{{ .Values.tessdata.image.tag }}
        - name: init
          configMap:
            name: paperless-init
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: paperless
  labels:
    app.kubernetes.io/name: paperless
spec:
  selector:
    app.kubernetes.io/name: paperless
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
