apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: paperless
  labels:
    fleet.io/ruler: loki
spec:
  groups:
    - name: paperless
      rules:
        - alert: PaperlessPasswordLogin
          expr: sum by (username) (count_over_time({namespace="paperless", container="paperless"} |= "[paperless.auth]" |= "Login failed for user" | regexp "Login failed for user `(?P<username>[^`]*)`" [5m])) > 0
          labels:
            severity: warning
            instance: '{{ $labels.username }}'
          annotations:
            summary: "Someone tried a password or token on Paperless, which only Keycloak logins pass: someone guessing, or break-glass."
