images: {pullPolicy: IfNotPresent}
crds:
  upgradeJob:
    podSecurityContext: {seccompProfile: {type: RuntimeDefault}}
    resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 128Mi}}
controller:
  workflowNamespaces: [argo, keycloak]
  podSecurityContext: {seccompProfile: {type: RuntimeDefault}}
  retentionPolicy: {completed: 5, failed: 3, errored: 3}
  # Loki keeps their logs; failed pods stay for debugging until retentionPolicy drops the workflow
  workflowDefaults: {spec: {podGC: {strategy: OnPodSuccess}}}
  metricsConfig: {enabled: true}
  serviceMonitor: {enabled: true}
  resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
executor:
  securityContext:
    runAsNonRoot: true
    runAsUser: 8737
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
  resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
server:
  authModes: [sso]
  podSecurityContext: {seccompProfile: {type: RuntimeDefault}}
  # the chart already mounts an emptyDir at /tmp
  securityContext: {readOnlyRootFilesystem: true}
  sso: {enabled: true}
  resources: {requests: {cpu: 20m, memory: 128Mi}, limits: {memory: 512Mi}}
