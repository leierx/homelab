# Default-deny for the namespace, then what Argo Workflows needs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # the wg Gateway's proxy
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - {port: "2746", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
    # Keycloak's token and userinfo endpoints (public address), and GitHub for the git input artifacts workflows fetch
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
