# shared OpenTofu runner; each caller supplies its own ServiceAccount, RBAC, NetworkPolicy and inputs
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: tofu
  annotations:
    # the chart installs its CRDs from a hook Job, so the kind is unknown when Argo CD validates the sync
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entrypoint: reconcile
  arguments:
    parameters:
      - name: configMap
      - name: secret
      - name: waitUrl
        value: ""
  volumes:
    - name: tofu
      configMap:
        name: "{{workflow.parameters.configMap}}"
    - name: work
      emptyDir: {}
    - name: tmp
      emptyDir: {}
  templates:
    - name: reconcile
      inputs:
        parameters:
          - name: secret
          - name: waitUrl
      securityContext:
        runAsNonRoot: true
        runAsUser: 8737
        seccompProfile:
          type: RuntimeDefault
      container:
        image: ghcr.io/opentofu/opentofu:1.13.9
        workingDir: /work
        volumeMounts:
          - {name: tofu, mountPath: /tofu, readOnly: true}
          - {name: work, mountPath: /work}
          - {name: tmp, mountPath: /tmp}
        command: [sh, -c]
        args:
          - |
            set -eu
            if [ -n "$WAIT_URL" ]; then
              tries=50
              until wget -q -O /dev/null "$WAIT_URL"; do
                tries=$((tries - 1))
                [ "$tries" -gt 0 ] || { echo "$WAIT_URL did not answer"; exit 1; }
                sleep 10
              done
            fi
            # tofu init writes .terraform/ next to the root, so it runs on a copy
            cp /tofu/*.tf /tofu/.terraform.lock.hcl .
            tofu init -input=false
            # a sync's run and a scheduled one can overlap
            tofu plan -lock-timeout=10m -out=plan
            tofu apply -lock-timeout=10m plan
        env:
          - {name: HOME, value: /tmp}
          - {name: WAIT_URL, value: "{{inputs.parameters.waitUrl}}"}
        envFrom:
          - secretRef:
              name: "{{inputs.parameters.secret}}"
          # more TF_VAR_s that another repo provides, e.g. the private apps' hostnames
          - configMapRef:
              name: "{{inputs.parameters.secret}}-vars"
              optional: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests: {cpu: 50m, memory: 256Mi}
          limits: {memory: 1Gi}
