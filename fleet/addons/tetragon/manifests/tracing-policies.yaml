# Tripwires: no restricted pod does these, so a hit is an attack; policy-mode monitor only posts until a policy has stayed quiet.
# NixOS host binaries live under /nix/store, and the one that runs in a pod's cgroup is runc setting the container up.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: tripwire-exec
spec:
  options:
    - {name: policy-mode, value: monitor}
  podSelector:
    matchExpressions:
      - {key: "k8s:io.kubernetes.pod.namespace", operator: NotIn, values: [kube-system, kubevirt, openebs, telemetry]}
      - {key: kubevirt.io, operator: NotIn, values: [virt-launcher]}
  lsmhooks:
    - hook: bprm_check_security
      message: Exec of a file that isn't in the image
      args:
        - {index: 0, type: linux_binprm}
        - {index: 0, type: uint64, resolve: file.f_inode.i_sb.s_magic}
      selectors:
        # the image is overlayfs; a volume, tmpfs or memfd is not. CNPG and Argo Workflows run a binary they copied into an emptyDir
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchArgs:
            - {args: [1], operator: NotEqual, values: ["2035054128"]}
            - {args: [0], operator: NotEqual, values: [/controller/manager, /var/run/argo/argoexec]}
          matchActions:
            - {action: Override, argError: -1}
            - {action: Post, imaHash: true}
        # a memfd has no path for the selector above to compare; tmpfs, ramfs and hugetlbfs
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchArgs:
            - {args: [1], operator: Equal, values: ["16914836", "2240043254", "2508478710"]}
          matchActions:
            - {action: Override, argError: -1}
            - {action: Post, imaHash: true}
        # the image's own writable layer, where a pod without a read-only root can drop one
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchArgs:
            - {args: [0], operator: Prefix, values: [/tmp/, /var/tmp/, /dev/shm/, /run/]}
          matchActions:
            - {action: Override, argError: -1}
            - {action: Post, imaHash: true}
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: tripwire-escape
spec:
  options:
    - {name: policy-mode, value: monitor}
  podSelector:
    matchExpressions:
      - {key: "k8s:io.kubernetes.pod.namespace", operator: NotIn, values: [kube-system, kubevirt, openebs, telemetry]}
      - {key: kubevirt.io, operator: NotIn, values: [virt-launcher]}
  lsmhooks:
    - hook: sb_mount
      message: Mount from inside a container
      args:
        - {index: 1, type: path}
      selectors:
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchActions:
            - {action: Override, argError: -1}
    - hook: move_mount
      message: Mount from inside a container
      selectors:
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchActions:
            - {action: Override, argError: -1}
    - hook: ptrace_access_check
      message: ptrace or another process's memory or environment from inside a container
      args:
        - {index: 1, type: uint32}
      selectors:
        # PTRACE_MODE_NOAUDIT: ps and top reading /proc/<pid>/stat
        - matchArgs:
            - {index: 1, operator: Mask, values: ["4"]}
          matchActions:
            - {action: NoPost}
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchActions:
            - {action: Override, argError: -1}
    - hook: bpf
      message: bpf() from inside a container
      selectors:
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchActions:
            - {action: Override, argError: -1}
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: tripwire-namespaces
spec:
  options:
    - {name: policy-mode, value: monitor}
  podSelector:
    matchExpressions:
      - {key: "k8s:io.kubernetes.pod.namespace", operator: NotIn, values: [kube-system, kubevirt, openebs, telemetry]}
      - {key: kubevirt.io, operator: NotIn, values: [virt-launcher]}
  kprobes:
    - call: sys_setns
      syscall: true
      message: setns from inside a container
      selectors:
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchActions:
            - {action: Sigkill}
    - call: sys_unshare
      syscall: true
      message: unshare from inside a container
      selectors:
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchActions:
            - {action: Sigkill}
    - call: create_user_ns
      syscall: false
      message: User namespace created from inside a container
      selectors:
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchActions:
            - {action: Sigkill}
    - call: sys_finit_module
      syscall: true
      message: Kernel module load from inside a container
      selectors:
        - matchActions:
            - {action: Sigkill}
    - call: sys_init_module
      syscall: true
      message: Kernel module load from inside a container
      selectors:
        - matchActions:
            - {action: Sigkill}
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: tripwire-privileges
spec:
  options:
    - {name: policy-mode, value: monitor}
  podSelector:
    matchExpressions:
      - {key: "k8s:io.kubernetes.pod.namespace", operator: NotIn, values: [kube-system, kubevirt, openebs, telemetry]}
      - {key: kubevirt.io, operator: NotIn, values: [virt-launcher]}
  kprobes:
    - call: __sys_setuid
      syscall: false
      message: setuid to root from inside a container
      args:
        - {index: 0, type: int}
      selectors:
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchArgs:
            - {index: 0, operator: Equal, values: ["0"]}
          matchActions:
            - {action: Sigkill}
    - call: __sys_setreuid
      syscall: false
      message: setreuid to root from inside a container
      args:
        - {index: 0, type: int}
        - {index: 1, type: int}
      selectors:
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchArgs:
            - {index: 0, operator: Equal, values: ["0"]}
          matchActions:
            - {action: Sigkill}
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchArgs:
            - {index: 1, operator: Equal, values: ["0"]}
          matchActions:
            - {action: Sigkill}
    - call: __sys_setresuid
      syscall: false
      message: setresuid to root from inside a container
      args:
        - {index: 0, type: int}
        - {index: 1, type: int}
        - {index: 2, type: int}
      selectors:
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchArgs:
            - {index: 0, operator: Equal, values: ["0"]}
          matchActions:
            - {action: Sigkill}
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchArgs:
            - {index: 1, operator: Equal, values: ["0"]}
          matchActions:
            - {action: Sigkill}
        - matchBinaries:
            - {operator: NotPrefix, values: [/nix/store/]}
          matchArgs:
            - {index: 2, operator: Equal, values: ["0"]}
          matchActions:
            - {action: Sigkill}
---
# a shell or netcat opening a TCP connection is a reverse shell
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: tripwire-reverse-shell
spec:
  options:
    - {name: policy-mode, value: monitor}
  podSelector:
    matchExpressions:
      - {key: "k8s:io.kubernetes.pod.namespace", operator: NotIn, values: [kube-system, kubevirt, openebs, telemetry]}
      - {key: kubevirt.io, operator: NotIn, values: [virt-launcher]}
  kprobes:
    - call: tcp_connect
      syscall: false
      message: Shell or netcat opened a TCP connection
      args:
        - {index: 0, type: sock}
      selectors:
        - matchBinaries:
            - operator: Postfix
              values: [/sh, /bash, /dash, /ash, /zsh, /nc, /ncat, /netcat, /nc.openbsd, /nc.traditional, /socat, /telnet]
          matchActions:
            - {action: Sigkill}
        # selectors see the executable, so Alpine's symlinked sh, nc and wget are all busybox; the tofu workflow's wget waits on Keycloak
        - matchBinaries:
            - {operator: Postfix, values: [/busybox]}
          matchArgs:
            - {index: 0, operator: NotDAddr, values: [10.42.0.0/16, 10.43.0.0/16, 127.0.0.0/8]}
          matchActions:
            - {action: Sigkill}
---
# OpenBao's auto-unseal key: only bao reads it
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: fim-openbao-seal-key
spec:
  options:
    - {name: policy-mode, value: monitor}
  podSelector:
    matchExpressions:
      - {key: "k8s:io.kubernetes.pod.namespace", operator: In, values: [openbao]}
  lsmhooks:
    - hook: file_open
      message: Something other than bao opened the OpenBao seal key
      args:
        - {index: 0, type: file}
      selectors:
        - matchBinaries:
            - {operator: NotIn, values: [/usr/bin/bao]}
          matchArgs:
            - {index: 0, operator: Prefix, values: [/openbao/seal/]}
          matchActions:
            - {action: Override, argError: -1}
---
# the ways to own the host; post only, never enforce on the host
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: fim-host
spec:
  hostSelector: {}
  lsmhooks:
    - hook: file_open
      message: Something other than k3s opened a host secret
      args:
        - {index: 0, type: file}
      selectors:
        - matchBinaries:
            - {operator: NotPostfix, values: [/k3s, /.k3s-wrapped]}
          matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /var/lib/secrets.yaml
                - /var/lib/rancher/k3s/server/token
                - /var/lib/rancher/k3s/server/cred/
                - /var/lib/rancher/k3s/server/tls/
                - /etc/rancher/k3s/k3s.yaml
                - /etc/rancher/node/password
        # decrypted into /run/secrets.d/<generation>/
        - matchBinaries:
            - {operator: NotPostfix, values: [/k3s, /.k3s-wrapped]}
          matchArgs:
            - index: 0
              operator: Postfix
              values:
                - /openbao/seal_key
                - /argocd/private_repo_pat
                - /rendered/openbao-seal-key.yaml
                - /rendered/argocd-private-repo.yaml
