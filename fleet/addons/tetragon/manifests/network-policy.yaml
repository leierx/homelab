# the agent runs on the host network, so its metrics port is a host port
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-tetragon
spec:
  nodeSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "2112", protocol: TCP}
