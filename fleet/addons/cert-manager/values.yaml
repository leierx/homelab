# Chart: https://cert-manager.io/docs/installation/helm/
cert-manager:
  crds:
    enabled: true
    # uninstalling the chart must never delete every Certificate in the cluster
    keep: true
  config: {gatewayAPI: {enabled: true}}
  prometheus: {servicemonitor: {enabled: true}}
  resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
  webhook:
    resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
  cainjector:
    resources: {requests: {cpu: 10m, memory: 128Mi}, limits: {memory: 512Mi}}
  startupapicheck:
    resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
