apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: controller
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - {port: "9403", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "9402", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
    # in-cluster HTTP-01 self-check via CoreDNS split-horizon to the edge Gateway
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: edge
      toPorts:
        - ports:
            - {port: "10080", protocol: TCP}
    # lookups through Cilium's DNS proxy, which learns the addresses the toFQDNs rule allows
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*"
    # Let's Encrypt's ACME API; the HTTP-01 self-check stays in-cluster (split horizon above)
    - toFQDNs:
        - matchName: acme-v02.api.letsencrypt.org
        - matchName: acme-staging-v02.api.letsencrypt.org
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cainjector
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cainjector
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "9402", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: webhook
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: webhook
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - {port: "6080", protocol: TCP}
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports:
            - {port: "10250", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "9402", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: startupapicheck
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: startupapicheck
  egress:
    - toEntities: [kube-apiserver]
---
# HTTP-01 solver pods run in each Certificate's namespace; Envoy forwards the challenge to them
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: acme-http01-solver
spec:
  endpointSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: edge
      toPorts:
        - ports:
            - {port: "8089", protocol: TCP}
