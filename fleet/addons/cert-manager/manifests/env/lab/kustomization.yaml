# Lab clusters issue from the Let's Encrypt staging CA (no rate limits, untrusted certs).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: cert-manager.io
      kind: ClusterIssuer
      name: letsencrypt
    patch: |
      - op: replace
        path: /spec/acme/server
        value: https://acme-staging-v02.api.letsencrypt.org/directory
