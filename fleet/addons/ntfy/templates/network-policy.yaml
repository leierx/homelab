apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ntfy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: edge
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "9090", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: ntfy-db
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
    # Web Push through the browser's push service (e.g. fcm.googleapis.com), end-to-end encrypted
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres
  annotations:
    # with the database Cluster, whose initdb job needs the API server
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: ntfy-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: ntfy
        - matchLabels:
            cnpg.io/cluster: ntfy-db
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
    # the CloudNativePG operator checks the instance's status endpoint
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - {port: "8000", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "9187", protocol: TCP}
  egress:
    # the Postgres instance manager and initdb/join jobs
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: ntfy-db
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
