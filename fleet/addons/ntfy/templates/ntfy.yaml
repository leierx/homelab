apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ntfy
  annotations:
    # after its database and secrets are Healthy
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  serviceName: ntfy
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ntfy
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          args: [serve, --config, /etc/ntfy/server.yml]
          env:
            - name: NTFY_DATABASE_URL
              valueFrom: {secretKeyRef: {name: ntfy-db-app, key: uri}}
            - name: NTFY_AUTH_USERS
              valueFrom: {secretKeyRef: {name: ntfy, key: auth-users}}
            - name: NTFY_AUTH_TOKENS
              valueFrom: {secretKeyRef: {name: ntfy, key: auth-tokens}}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy/server.yml
              subPath: server.yml
            - name: config
              mountPath: /etc/ntfy/templates/alertmanager.yml
              subPath: alertmanager.yml
      volumes:
        - name: config
          configMap:
            name: ntfy
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  labels:
    app.kubernetes.io/name: ntfy
spec:
  selector:
    app.kubernetes.io/name: ntfy
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ntfy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  endpoints:
    - port: metrics
