# generated once into OpenBao (PushSecret in the cluster layer); 29 characters, so tk_ + one is a valid ntfy token
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 29
  symbols: 0
  allowRepeat: true
  secretKeys: [leier_password, alertmanager_password, alertmanager_token]
