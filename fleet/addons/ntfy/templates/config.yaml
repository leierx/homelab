apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy
data:
  server.yml: |
    base-url: {{ required "url is per cluster" .Values.url }}
    listen-http: ":8080"
    metrics-listen-http: ":9090"
    behind-proxy: true
    web-root: disable
    template-dir: /etc/ntfy/templates
    auth-default-access: deny-all
    auth-access:
      - "alertmanager:alerts:wo"
      - "leier:alerts:ro"
  alertmanager.yml: |
{{ .Files.Get "files/alertmanager.yml" | indent 4 }}
