apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy
data:
  server.yml: |
    base-url: {{ required "url is per cluster" .Values.url }}
    listen-http: ":8080"
    metrics-listen-http: ":9090"
    behind-proxy: true
    template-dir: /etc/ntfy/templates
    web-push-email-address: {{ required "webPushEmailAddress is per cluster" .Values.webPushEmailAddress }}
    auth-default-access: deny-all
    auth-access:
      - "alertmanager:alerts:wo"
      # people reach ntfy only through Envoy's OIDC login (the edge Gateway)
      - "*:alerts:ro"
  alertmanager.yml: |
{{ .Files.Get "files/alertmanager.yml" | indent 4 }}
