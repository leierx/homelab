title: |
  {{- $firing := 0 }}{{ range .alerts }}{{ if eq .status "firing" }}{{ $firing = add $firing 1 }}{{ end }}{{ end -}}
  {{- $name := .groupLabels.alertname | default (first .alerts).labels.alertname -}}
  {{- if eq .status "firing" -}}
  {{ if eq .commonLabels.severity "critical" }}🔴{{ else }}🟠{{ end }} {{ $name }}{{ if gt $firing 1 }} ×{{ $firing }}{{ end }}
  {{- else -}}
  ✅ {{ $name }} resolved
  {{- end }}
message: |
  {{- $rfc := "2006-01-02T15:04:05Z07:00" -}}
  {{- if and (eq .status "firing") .commonAnnotations.summary }}{{ .commonAnnotations.summary }}

  {{ end -}}
  {{- range $i, $a := .alerts }}{{ if lt $i 10 -}}
  {{ if eq $a.status "firing" -}}
  • {{ $a.labels.instance | default $a.labels.alertname }} · since {{ dateInZone "Mon 15:04" (toDate $rfc $a.startsAt) "Europe/Oslo" }}
  {{ if not $.commonAnnotations.summary }}  {{ $a.annotations.summary }}
  {{ end }}
  {{- else -}}
  ✓ {{ $a.labels.instance | default $a.labels.alertname }} · lasted {{ durationRound ((toDate $rfc $a.endsAt).Sub (toDate $rfc $a.startsAt)).String }}
  {{ end }}{{ end }}{{ end -}}
  {{- if gt (len .alerts) 10 }}…and {{ sub (len .alerts) 10 }} more
  {{ end -}}
  {{- if .truncatedAlerts }}…and {{ .truncatedAlerts }} more
  {{ end -}}
priority: |
  {{- if eq .status "resolved" }}2{{ else if eq .commonLabels.severity "critical" }}5{{ else }}3{{ end }}
