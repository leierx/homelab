kubeProxyReplacement: true
policyEnforcementMode: always
rollOutCiliumPods: true
secretsNamespaceAnnotations:
  argocd.argoproj.io/sync-options: Delete=false,Prune=false
bpf: {masquerade: true}
hostFirewall: {enabled: true}
hubble:
  listenAddress: ''
  tls: {enabled: false}
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
      - flow:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
      - tcp
      - icmp
      - port-distribution
      - policy:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
    serviceMonitor: {enabled: true}
prometheus:
  enabled: true
  serviceMonitor: {enabled: true, trustCRDsExist: true}
resources: {requests: {cpu: 100m, memory: 512Mi}}
initResources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 256Mi}}
envoy:
  rollOutPods: true
  resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 1Gi}}
  prometheus: {serviceMonitor: {enabled: true}}
operator:
  rollOutPods: true
  resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
  prometheus: {serviceMonitor: {enabled: true}}
