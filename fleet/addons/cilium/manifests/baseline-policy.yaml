# default-deny for every pod except cluster DNS; each addon opens its own flows
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: baseline
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    # through Cilium's DNS proxy, which learns the addresses behind the toFQDNs rules
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*"
---
# cilium-health answers the agent's connectivity probes; it has no pod to carry a probe rule
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cilium-health
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  endpointSelector:
    matchLabels:
      "reserved:health": ""
  ingress:
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - {port: "4240", protocol: TCP}
    - fromEntities: [host, remote-node]
      icmps:
        - fields:
            - {family: IPv4, type: EchoRequest}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  ingress:
    - fromEntities: [host]
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
            - {port: "8181", protocol: TCP}
    - fromEntities: [cluster]
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "9153", protocol: TCP}
  egress:
    - toEntities: [kube-apiserver]
    # upstream lookups go to Quad9 over DoT (coredns-custom upstream.server)
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "853", protocol: TCP}
