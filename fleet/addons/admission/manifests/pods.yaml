# every image names a version: a tag other than latest, or a digest
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: image-versions
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: >-
        variables.containers.all(c, c.image.contains('@sha256:')
        || (c.image.substring(c.image.lastIndexOf('/') + 1).contains(':') && !c.image.endsWith(':latest')))
      message: every image needs a tag other than latest, or a digest
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: image-versions
spec:
  policyName: image-versions
  validationActions: [Deny]
---
# Every image comes from a registry Harbor proxies, so nodes pull it through Harbor (nixos/k3s.nix mirrors them
# without a fallback). An image without a registry host is docker.io. Keep the list in step with tofu/harbor/proxy.tf.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: image-registries
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: hosts
      expression: >-
        (object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []))
        .map(c, c.image.split('/'))
        .map(p, size(p) > 1 && (p[0].contains('.') || p[0].contains(':') || p[0] == 'localhost') ? p[0] : 'docker.io')
  validations:
    - expression: >-
        variables.hosts.all(h, h in ['docker.io', 'ecr-public.aws.com', 'ghcr.io', 'quay.io', 'registry.k8s.io', 'registry.skinke.net'])
      messageExpression: >-
        'images must come from a registry Harbor proxies (docker.io, ecr-public.aws.com, ghcr.io, quay.io,
        registry.k8s.io) or from registry.skinke.net; not ' + variables.hosts.filter(h, !(h in ['docker.io',
        'ecr-public.aws.com', 'ghcr.io', 'quay.io', 'registry.k8s.io', 'registry.skinke.net'])).join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: image-registries
spec:
  policyName: image-registries
  validationActions: [Deny]
---
# warn and audit only: upstream (KubeVirt, CDI) doesn't always comply; an alert reads the audit log
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: container-resources
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.requests)
        && 'cpu' in c.resources.requests && 'memory' in c.resources.requests
        && has(c.resources.limits) && 'memory' in c.resources.limits && !('cpu' in c.resources.limits))
      message: every container needs CPU and memory requests and a memory limit, and no CPU limit
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: container-resources
spec:
  policyName: container-resources
  validationActions: [Warn, Audit]
  matchResources:
    namespaceSelector:
      matchExpressions:
        # the Cilium agent deliberately has no memory limit
        - { key: kubernetes.io/metadata.name, operator: NotIn, values: [kube-system] }
