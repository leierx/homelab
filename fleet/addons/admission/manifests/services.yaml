# a NodePort, load balancer or external IP bypasses the Gateways onto the LAN and wg0; only the Envoy proxies may have one
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: services-not-exposed
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
  validations:
    - expression: >-
        !(has(object.spec.type) && object.spec.type in ['NodePort', 'LoadBalancer'])
        && !(has(object.spec.externalIPs) && size(object.spec.externalIPs) > 0)
      message: only envoy-gateway-system may expose NodePorts, load balancers or external IPs; route through the edge or wg Gateway
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: services-not-exposed
spec:
  policyName: services-not-exposed
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - { key: kubernetes.io/metadata.name, operator: NotIn, values: [envoy-gateway-system] }
---
# a SecurityPolicy on a route or ListenerSet replaces the Gateway-wide OIDC login unless it merges or keeps OIDC
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: security-policies-keep-oidc
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.envoyproxy.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [securitypolicies]
  validations:
    - expression: "has(object.spec.oidc) || has(object.spec.mergeType)"
      message: >-
        a SecurityPolicy on a route or ListenerSet replaces the Gateway's OIDC
        login; keep spec.oidc, set spec.mergeType, or exempt the namespace in
        this policy
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: security-policies-keep-oidc
spec:
  policyName: security-policies-keep-oidc
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - { key: kubernetes.io/metadata.name, operator: NotIn, values: [alerta, envoy-gateway-system, immich, keycloak] }
---
# the Gateways accept routes and listeners from All namespaces; this narrows who may create them
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gateway-routes-and-listeners
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.networking.k8s.io]
        apiVersions: [v1, v1alpha2, v1beta1]
        operations: [CREATE, UPDATE]
        resources: [httproutes, listenersets]
  validations:
    - expression: >-
        object.metadata.namespace in [
          'alerta',
          'argo',
          'argocd',
          'cert-manager',
          'envoy-gateway-system',
          'immich',
          'keycloak',
          'miniflux',
          'monitoring'
        ]
      message: >-
        only approved web-facing namespaces may attach HTTPRoute or ListenerSet
        resources to the Gateways; add the namespace to
        gateway-routes-and-listeners if it really needs a route
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gateway-routes-and-listeners
spec:
  policyName: gateway-routes-and-listeners
  validationActions: [Deny]

