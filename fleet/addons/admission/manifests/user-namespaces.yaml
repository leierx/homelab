# root in a container, or an escape from it, is an unprivileged user on the host; never for pods that need the host's own:
# host namespaces, privileged mode or host paths
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: user-namespaces
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: not-set
      expression: "!has(object.spec.hostUsers)"
    - name: no-host-namespaces
      expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork)
        && !(has(object.spec.hostPID) && object.spec.hostPID)
        && !(has(object.spec.hostIPC) && object.spec.hostIPC)
    - name: not-privileged
      expression: >-
        !(object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []))
        .exists(c, has(c.securityContext) && has(c.securityContext.privileged) && c.securityContext.privileged)
    - name: no-host-path
      expression: "!has(object.spec.volumes) || !object.spec.volumes.exists(v, has(v.hostPath))"
    # virt-launcher opens /dev/kvm and host devices
    - name: not-virt-launcher
      expression: >-
        !has(object.metadata.labels) || !('kubevirt.io' in object.metadata.labels)
        || object.metadata.labels['kubevirt.io'] != 'virt-launcher'
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: "Object{spec: Object.spec{hostUsers: false}}"
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: user-namespaces
spec:
  policyName: user-namespaces
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
