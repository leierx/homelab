# root in a container, or an escape from it, is an unprivileged user on the host; never for host-namespace pods
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: user-namespaces
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: not-set
      expression: "!has(object.spec.hostUsers)"
    - name: no-host-namespaces
      expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork)
        && !(has(object.spec.hostPID) && object.spec.hostPID)
        && !(has(object.spec.hostIPC) && object.spec.hostIPC)
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: "Object{spec: Object.spec{hostUsers: false}}"
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: user-namespaces
spec:
  policyName: user-namespaces
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          # namespaces whose pods get hostUsers: false
          values: [alerta, argo, argocd, cert-manager, cnpg-system, envoy-gateway-system, external-secrets, immich, keycloak, monitoring, openbao, renovate]
