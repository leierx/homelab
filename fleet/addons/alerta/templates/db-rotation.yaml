# ESO regenerates the password on each refresh; CNPG applies it because the Secret carries cnpg.io/reload
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: alerta-db-password
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alerta-db-rotation
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 720h
  target:
    name: alerta-db-app
    creationPolicy: Merge
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        password: '{{ "{{ .password }}" }}'
        pgpass: 'alerta-db-rw:5432:alerta:alerta:{{ "{{ .password }}" }}'
        uri: 'postgresql://alerta:{{ "{{ .password }}" }}@alerta-db-rw.{{ .Release.Namespace }}:5432/alerta'
        fqdn-uri: 'postgresql://alerta:{{ "{{ .password }}" }}@alerta-db-rw.{{ .Release.Namespace }}.svc.cluster.local:5432/alerta'
        jdbc-uri: 'jdbc:postgresql://alerta-db-rw.{{ .Release.Namespace }}:5432/alerta?password={{ "{{ .password }}" }}&user=alerta'
        fqdn-jdbc-uri: 'jdbc:postgresql://alerta-db-rw.{{ .Release.Namespace }}.svc.cluster.local:5432/alerta?password={{ "{{ .password }}" }}&user=alerta'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: alerta-db-password
