apiVersion: v1
kind: ConfigMap
metadata:
  name: alerta-config
data:
  alertad.conf: |
    DEBUG = False
    USE_PROXYFIX = True

    AUTH_PROVIDER = 'openid'
    SIGNUP_ENABLED = False
    OIDC_ISSUER_URL = {{ required "oidc.issuer is per cluster" .Values.oidc.issuer | quote }}
    OIDC_AUTH_URL = {{ printf "%s/protocol/openid-connect/auth" (required "oidc.issuer is per cluster" .Values.oidc.issuer) | quote }}
    OAUTH2_CLIENT_ID = 'alerta'

    OIDC_ROLE_CLAIM = 'groups'
    ALLOWED_OIDC_ROLES = ['homelab-admins', 'homelab-operators', 'homelab-viewers']
    ADMIN_ROLES = ['homelab-admins']
    USER_ROLES = ['homelab-operators']
    GUEST_ROLES = ['homelab-viewers']

    ALLOWED_ENVIRONMENTS = ['Production']
    DEFAULT_ENVIRONMENT = 'Production'
    DEFAULT_FILTER = {'status': None}
    SORT_LIST_BY = ['status', 'severity', 'lastReceiveTime']

    PLUGINS = ['remote_ip', 'reject', 'heartbeat', 'blackout', 'acked_by']
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alerta
  annotations:
    # after its database and secrets are Healthy
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  serviceName: alerta
  selector:
    matchLabels:
      app.kubernetes.io/name: alerta
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alerta
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alerta
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: ALERTA_SVR_CONF_FILE
              value: /etc/alerta/alertad.conf
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: alerta-db-app
                  key: uri
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: alerta
                  key: secret-key
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alerta
                  key: oidc-client-secret
            - name: AUTH_REQUIRED
              value: "true"
            - name: ADMIN_USERS
              value: admin
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: alerta
                  key: grafana-api-key
            # 180 days (4320 hours) retention for housekeeping
            - name: HK_EXPIRED_DELETE_HRS
              value: "4320"
            - name: HK_INFO_DELETE_HRS
              value: "4320"
            - name: HEARTBEAT_SEVERITY
              value: ""
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/management/gtg
              port: http
          livenessProbe:
            httpGet:
              path: /api/management/gtg
              port: http
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alerta
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alerta-config
---
apiVersion: v1
kind: Service
metadata:
  name: alerta
  labels:
    app.kubernetes.io/name: alerta
spec:
  selector:
    app.kubernetes.io/name: alerta
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
