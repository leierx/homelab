apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alerta
  annotations:
    # after its database and secrets are Healthy
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  serviceName: alerta
  selector:
    matchLabels:
      app.kubernetes.io/name: alerta
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alerta
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alerta
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: ALERTA_SVR_CONF_FILE
              value: /etc/alerta/alertad.conf
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: alerta-db-app
                  key: uri
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: alerta
                  key: secret-key
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alerta
                  key: oidc-client-secret
            - name: AUTH_REQUIRED
              value: "true"
            - name: ADMIN_USERS
              value: admin
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: alerta
                  key: grafana-api-key
            # 180 days
            - name: HK_EXPIRED_DELETE_HRS
              value: "4320"
            - name: HK_INFO_DELETE_HRS
              value: "4320"
            - name: HEARTBEAT_SEVERITY
              value: ""
            # the image recycles uWSGI workers every 30 s
            - name: UWSGI_MAX_WORKER_LIFETIME
              value: ""
            - name: SUPERVISORD_LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/management/gtg
              port: http
          livenessProbe:
            httpGet:
              path: /api/management/gtg
              port: http
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alerta
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alerta-config
---
apiVersion: v1
kind: Service
metadata:
  name: alerta
  labels:
    app.kubernetes.io/name: alerta
spec:
  selector:
    app.kubernetes.io/name: alerta
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
