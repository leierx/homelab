apiVersion: v1
kind: ConfigMap
metadata:
  name: alerta-config
data:
  config.json: |
    {"endpoint": "/api"}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alerta
  annotations:
    # after its database and secrets are Healthy
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  serviceName: alerta
  selector:
    matchLabels:
      app.kubernetes.io/name: alerta
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alerta
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-config
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: [sh, -c]
          args:
            - |
              set -eu
              cp -r /app/* /app-work/
              cat > /app-work/alertad.conf <<'EOF'
              DEBUG = False
              USE_PROXYFIX = True

              AUTH_REQUIRED = True
              AUTH_PROVIDER = 'openid'
              SIGNUP_ENABLED = False
              OIDC_ISSUER_URL = {{ required "oidc.issuer is per cluster" .Values.oidc.issuer | quote }}
              OIDC_AUTH_URL = {{ printf "%s/protocol/openid-connect/auth" (required "oidc.issuer is per cluster" .Values.oidc.issuer) | quote }}
              OAUTH2_CLIENT_ID = 'alerta'

              # Role mapping from Keycloak groups claim; no local admin accounts.
              # USER_ROLES stays empty because oidc.py stamps it onto every new user row;
              # homelab-operators gets its scopes from the perms table instead.
              OIDC_ROLE_CLAIM = 'groups'
              ALLOWED_OIDC_ROLES = ['homelab-admins', 'homelab-operators', 'homelab-viewers']
              ADMIN_ROLES = ['homelab-admins']
              USER_ROLES = []
              GUEST_ROLES = ['homelab-viewers']

              ALLOWED_ENVIRONMENTS = ['Production']
              DEFAULT_ENVIRONMENT = 'Production'
              DEFAULT_FILTER = {'status': []}
              SORT_LIST_BY = ['status', 'severity', 'lastReceiveTime']
              ASI_QUERIES = [
                  {'text': 'Production', 'query': [['environment', 'Production']]},
                  {'text': 'Heartbeats', 'query': {'q': 'event:Heartbeat'}},
                  {'text': 'Misc.', 'query': 'group=Misc'},
              ]

              # Retain closed, expired and informational alerts for half a year (180 days)
              DELETE_EXPIRED_AFTER = 15552000
              DELETE_INFO_AFTER = 15552000

              PLUGINS = ['remote_ip', 'reject', 'heartbeat', 'blackout', 'acked_by']
              EOF
              # docker-entrypoint.sh runs `env | sort`, so keep secrets out of the main container's env
              python3 -c '
              import os
              for k in ("DATABASE_URL", "SECRET_KEY", "OAUTH2_CLIENT_SECRET"):
                  print(f"{k} = {os.environ[k]!r}")
              ' >> /app-work/alertad.conf
              cat > /app-work/alerta.conf <<EOF
              [DEFAULT]
              endpoint = http://localhost:8080/api
              key = ${HOUSEKEEPING_API_KEY}
              EOF
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: alerta-db-app
                  key: uri
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: alerta
                  key: secret-key
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alerta
                  key: oidc-client-secret
            - name: HOUSEKEEPING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alerta
                  key: housekeeping-api-key
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app-work
      containers:
        - name: alerta
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            # 180 days (4320 hours) retention for housekeeping
            - name: HK_EXPIRED_DELETE_HRS
              value: "4320"
            - name: HK_INFO_DELETE_HRS
              value: "4320"
            - name: HEARTBEAT_SEVERITY
              value: ""
            - name: UWSGI_MAX_WORKER_LIFETIME
              value: ""
            - name: SUPERVISORD_LOG_LEVEL
              value: info
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/management/gtg
              port: http
          livenessProbe:
            httpGet:
              path: /api/management/gtg
              port: http
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /web/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: app
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: alerta-config
---
apiVersion: v1
kind: Service
metadata:
  name: alerta
  labels:
    app.kubernetes.io/name: alerta
spec:
  selector:
    app.kubernetes.io/name: alerta
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# seeds least-privilege API keys, operator role permissions, and default dark-mode user preference
apiVersion: batch/v1
kind: Job
metadata:
  name: alerta-seed
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alerta-seed
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
          command: [sh, -c]
          args:
            - |
              set -eu
              psql "$URI" -v ON_ERROR_STOP=1 \
                -v hk_key="$HOUSEKEEPING_API_KEY" \
                -v grafana_key="$GRAFANA_API_KEY" <<'SQL'
              INSERT INTO keys (id, key, "user", scopes, text, expire_time, count, customer)
              VALUES
                ('housekeeping', :'hk_key', 'system', ARRAY['read:alerts', 'write:alerts', 'admin:management'], 'Housekeeping', '2099-01-01 00:00:00', 0, NULL),
                ('grafana', :'grafana_key', 'grafana', ARRAY['write:webhooks'], 'Grafana alerts', '2099-01-01 00:00:00', 0, NULL)
              ON CONFLICT (id) DO UPDATE SET
                key = EXCLUDED.key,
                "user" = EXCLUDED."user",
                scopes = EXCLUDED.scopes,
                text = EXCLUDED.text,
                expire_time = EXCLUDED.expire_time;

              INSERT INTO perms (id, match, scopes)
              VALUES ('operators', 'homelab-operators', ARRAY['read', 'write'])
              ON CONFLICT (id) DO UPDATE SET
                match = EXCLUDED.match,
                scopes = EXCLUDED.scopes;

              UPDATE users SET roles = '{}' WHERE roles <> '{}';

              UPDATE users
              SET attributes = jsonb_set(coalesce(attributes, '{}'::jsonb), '{prefs,isDark}', 'true'::jsonb, true)
              WHERE attributes #> '{prefs,isDark}' IS NULL;

              CREATE OR REPLACE FUNCTION default_user_prefs() RETURNS trigger LANGUAGE plpgsql AS $body$
              BEGIN
                NEW.attributes := jsonb_set(coalesce(NEW.attributes, '{}'::jsonb), '{prefs,isDark}', 'true'::jsonb, true);
                RETURN NEW;
              END;
              $body$;

              CREATE OR REPLACE TRIGGER users_default_prefs
                BEFORE INSERT ON users
                FOR EACH ROW
                WHEN (NEW.attributes #> '{prefs,isDark}' IS NULL)
                EXECUTE FUNCTION default_user_prefs();
              SQL
          env:
            - name: URI
              valueFrom:
                secretKeyRef:
                  name: alerta-db-app
                  key: uri
            - name: HOUSEKEEPING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alerta
                  key: housekeeping-api-key
            - name: GRAFANA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alerta
                  key: grafana-api-key
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
