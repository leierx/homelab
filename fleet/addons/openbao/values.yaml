global: {tlsDisable: false}
serverTelemetry: {serviceMonitor: {enabled: true, port: metrics}}
injector: {enabled: false}
server:
  resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
  extraEnvironmentVars: {BAO_CACERT: /openbao/tls/ca.crt, PGSSLMODE: verify-full, PGSSLROOTCERT: /openbao/db-ca/ca.crt}
  # the storage stanza reads the standard PG* variables, which keeps the password out of the ConfigMap
  extraSecretEnvironmentVars:
    - {envName: PGHOST, secretName: openbao-db-app, secretKey: host}
    - {envName: PGDATABASE, secretName: openbao-db-app, secretKey: dbname}
    - {envName: PGUSER, secretName: openbao-db-app, secretKey: username}
    - {envName: PGPASSWORD, secretName: openbao-db-app, secretKey: password}
  extraPorts: [{containerPort: 9101, name: metrics}]
  service: {extraPorts: [{name: metrics, port: 9101, targetPort: 9101}]}
  # single replica with static auto-unseal: roll on image and config changes instead of waiting for a manual delete
  updateStrategyType: RollingUpdate
  configAnnotation: true
  volumes:
    - {name: tls, secret: {secretName: openbao-tls}}
    - {name: seal-key, secret: {secretName: openbao-seal-key}}
    - {name: db-ca, secret: {secretName: openbao-db-ca, items: [{key: ca.crt, path: ca.crt}]}}
    - {name: tmp, emptyDir: {}}
  volumeMounts:
    - {name: tls, mountPath: /openbao/tls, readOnly: true}
    - {name: seal-key, mountPath: /openbao/seal, readOnly: true}
    - {name: db-ca, mountPath: /openbao/db-ca, readOnly: true}
    # the chart renders the server config into /tmp at start
    - {name: tmp, mountPath: /tmp}
  dataStorage: {enabled: false}
  statefulSet:
    annotations:
      secret.reloader.stakater.com/reload: openbao-db-app
    securityContext:
      container:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        readOnlyRootFilesystem: true
        seccompProfile: {type: RuntimeDefault}
  ha:
    enabled: true
    replicas: 1
    disruptionBudget: {enabled: false}
    # the initialize blocks run once, against empty storage; a running OpenBao never sees later edits to them
    config: |
      ui = true
      disable_mlock = true

      listener "tcp" {
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_cert_file = "/openbao/tls/tls.crt"
        tls_key_file = "/openbao/tls/tls.key"
        tls_auto_reload = true
        telemetry {
          disallow_metrics = true
        }
      }

      listener "tcp" {
        address = "[::]:9101"
        tls_cert_file = "/openbao/tls/tls.crt"
        tls_key_file = "/openbao/tls/tls.key"
        tls_auto_reload = true
        telemetry {
          metrics_only = true
          unauthenticated_metrics_access = true
        }
      }

      storage "postgresql" {
        ha_enabled = "true"
        max_parallel = "10"
        # wait for the database instead of crash-looping
        max_connect_retries = 0
      }

      service_registration "kubernetes" {}

      telemetry {
        prometheus_retention_time = "24h"
        disable_hostname = true
      }

      seal "static" {
        current_key_id = "20261017"
        current_key = "file:///openbao/seal/key"
      }

      audit "file" "stdout" {
        options {
          file_path = "stdout"
        }
      }

      initialize "kv" {
        request "mount" {
          operation = "update"
          path = "sys/mounts/kv"
          data = {
            type = "kv"
            options = { version = "2" }
          }
        }
      }

      initialize "kubernetes-auth" {
        request "enable" {
          operation = "update"
          path = "sys/auth/kubernetes"
          data = { type = "kubernetes" }
        }
        request "config" {
          operation = "update"
          path = "auth/kubernetes/config"
          data = { kubernetes_host = "https://kubernetes.default.svc" }
        }
        request "read" {
          operation = "read"
          path = "sys/auth/kubernetes"
        }
      }

      # the policies key on the namespace in the Kubernetes auth alias metadata, which needs the mount accessor read above
      initialize "openbao-client" {
        request "policy" {
          operation = "update"
          path = "sys/policies/acl/openbao-client"
          data = {
            policy = {
              eval_type = "string"
              eval_source = "cel"
              variables = [{ name = "ns", expression = "'{{ "{{" }}identity.entity.aliases.' + responses['kubernetes-auth']['read']['data']['accessor'] + '.metadata.service_account_namespace{{ "}}" }}'" }]
              expression = "'path \"kv/data/homelab/' + ns + '/*\" { capabilities = [\"read\"] }\\npath \"kv/metadata/homelab/' + ns + '/*\" { capabilities = [\"read\", \"list\"] }\\npath \"kv/data/homelab/+/for/' + ns + '/*\" { capabilities = [\"read\"] }'"
            }
          }
        }
        request "push-policy" {
          operation = "update"
          path = "sys/policies/acl/openbao-client-push"
          data = {
            policy = {
              eval_type = "string"
              eval_source = "cel"
              variables = [{ name = "ns", expression = "'{{ "{{" }}identity.entity.aliases.' + responses['kubernetes-auth']['read']['data']['accessor'] + '.metadata.service_account_namespace{{ "}}" }}'" }]
              expression = "'path \"kv/data/homelab/' + ns + '/*\" { capabilities = [\"create\", \"read\", \"update\"] }\\npath \"kv/metadata/homelab/' + ns + '/*\" { capabilities = [\"create\", \"read\", \"update\"] }'"
            }
          }
        }
        request "role" {
          operation = "update"
          path = "auth/kubernetes/role/openbao-client"
          data = {
            bound_service_account_names = ["openbao-client"]
            bound_service_account_namespaces = ["*"]
            audience = "openbao"
            token_policies = ["openbao-client"]
            token_ttl = "1h"
          }
        }
        request "push-role" {
          operation = "update"
          path = "auth/kubernetes/role/openbao-client-push"
          data = {
            bound_service_account_names = ["openbao-client"]
            bound_service_account_namespaces = ["*"]
            audience = "openbao"
            token_policies = ["openbao-client-push"]
            token_ttl = "1h"
          }
        }
      }

      initialize "admin" {
        request "policy" {
          operation = "update"
          path = "sys/policies/acl/admin"
          data = {
            policy = "path \"*\" { capabilities = [\"create\", \"read\", \"update\", \"patch\", \"delete\", \"list\", \"sudo\"] }"
          }
        }
        request "role" {
          operation = "update"
          path = "auth/kubernetes/role/admin"
          data = {
            bound_service_account_names = ["openbao-admin"]
            bound_service_account_namespaces = ["openbao"]
            audience = "openbao"
            token_policies = ["admin"]
            token_ttl = "15m"
          }
        }
      }
