namespace: openbao
dependencies:
  - cilium
  - cert-manager
  - cloudnative-pg
  - zfs-localpv
  - prometheus-operator-crds
  - reloader
helm:
  repoURL: ghcr.io/openbao/charts
  chart: openbao
  # renovate: datasource=docker depName=ghcr.io/openbao/charts/openbao
  targetRevision: 0.30.8
application:
  spec:
    ignoreDifferences:
      - group: apps
        kind: StatefulSet
        jsonPointers:
          - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
managedNamespaceMetadata:
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
