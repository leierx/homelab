# a CA of its own: only External Secrets and the bao CLI need to trust it
# wave -1: the StatefulSet mounts openbao-tls; failing in its wave would leave the sync waiting on it forever
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-selfsigned
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  isCA: true
  commonName: openbao-ca
  secretName: openbao-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
  issuerRef:
    name: openbao-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: openbao-ca
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ca:
    secretName: openbao-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: openbao-tls
  privateKey:
    algorithm: ECDSA
  dnsNames:
    - openbao
    - openbao.openbao
    - openbao.openbao.svc
    - openbao.openbao.svc.cluster.local
    - openbao-active.openbao.svc
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: openbao-ca
    kind: Issuer
