# people use the bao CLI through kubectl exec
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: external-secrets
            app.kubernetes.io/name: external-secrets
      toPorts:
        - ports:
            - {port: "8200", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "9101", protocol: TCP}
  egress:
    # Kubernetes auth (TokenReview) and service registration
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: openbao-db
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres
  annotations:
    # with the database Cluster, whose initdb job needs the API server
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: openbao-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: openbao
        - matchLabels:
            cnpg.io/cluster: openbao-db
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
    # the CloudNativePG operator checks the instance's status endpoint
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - {port: "8000", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "9187", protocol: TCP}
  egress:
    # the Postgres instance manager and initdb/join jobs
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: openbao-db
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
