# generated once into OpenBao; the OIDC client secret next to it comes from the keycloak addon
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys: [admin_password]
