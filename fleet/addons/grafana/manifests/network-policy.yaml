# Default-deny for the monitoring namespace (Grafana, Loki, Mimir), then what they need.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - {}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - {port: "3000", protocol: TCP}
    # Alloy pushes metrics and logs
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
  egress:
    - toEndpoints:
        - {}
    # Grafana pushes alert notifications
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alerta
            app.kubernetes.io/name: alerta
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    # the Keycloak token endpoint (its hostname resolves publicly)
    - toEntities: [world]
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
