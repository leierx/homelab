apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: edge
      toPorts:
        - ports:
            - {port: "3000", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "3000", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mimir
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - {port: "3100", protocol: TCP}
    # Grafana pushes alert notifications
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alerta
            app.kubernetes.io/name: alerta
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    # Keycloak OIDC via CoreDNS split-horizon to the edge Gateway
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: edge
      toPorts:
        - ports:
            - {port: "10443", protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: loki
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - {port: "3100", protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mimir
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mimir
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
