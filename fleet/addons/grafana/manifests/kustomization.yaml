# This directory is the grafana addon's manifest source. Kustomize turns the
# two dashboard JSON files into sidecar ConfigMaps and lists the two existing
# raw manifests explicitly, so all four inputs live here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - network-policy.yaml
  - secrets.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Storage
configMapGenerator:
  - name: grafana-dashboard-storage-zfs
    files:
      - storage-zfs.json=dashboards/storage-zfs.json
  - name: grafana-dashboard-storage-disks
    files:
      - storage-disks.json=dashboards/storage-disks.json
