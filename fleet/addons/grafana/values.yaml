testFramework: {enabled: false}
admin: {existingSecret: grafana}
envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {secretKeyRef: {name: grafana, key: oidc-client-secret}}
  ALERTA_API_KEY: {secretKeyRef: {name: grafana, key: alerta-api-key}}
grafana.ini:
  server:
    root_url: https://%(domain)s/
  auth: {disable_login_form: true}
  auth.basic: {enabled: false}
  auth.generic_oauth:
    enabled: true
    name: Keycloak
    client_id: grafana
    scopes: openid email profile
    use_pkce: true
    allow_sign_up: true
    allow_assign_grafana_admin: true
    login_attribute_path: preferred_username
    role_attribute_path: contains(groups, 'homelab-admins') && 'GrafanaAdmin' || contains(groups, 'homelab-operators') && 'Editor' || contains(groups, 'homelab-viewers') && 'Viewer' || ''
    role_attribute_strict: true
deploymentStrategy: {type: Recreate}
persistence:
  enabled: true
  annotations: {argocd.argoproj.io/sync-options: 'Delete=false,Prune=false'}
initChownData: {enabled: false}
securityContext:
  fsGroupChangePolicy: OnRootMismatch
resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 1Gi}}
serviceMonitor: {enabled: true}
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        url: http://mimir:8080/prometheus
        isDefault: true
        jsonData: {prometheusType: Mimir, httpMethod: POST, timeInterval: 60s}
      - {name: Loki, uid: loki, type: loki, url: 'http://loki:3100'}
# Alert rules as provisioning files; the chart puts them in its ConfigMap, so a change rolls Grafana.
alerting:
  notifications.yaml:
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: Alerta
        receivers:
          - uid: alerta
            type: webhook
            settings:
              url: http://alerta.alerta.svc:8080/api/webhooks/prometheus
              authorization_scheme: Key
              authorization_credentials: $ALERTA_API_KEY
    policies:
      - orgId: 1
        receiver: Alerta
        group_by: [grafana_folder, alertname]
  security.yaml:
    apiVersion: 1
    groups:
    - orgId: 1
      name: security
      folder: homelab
      interval: 1m
      rules:
        - uid: admin-kubeconfig-used
          title: Admin kubeconfig used
          condition: C
          for: 0s
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: security
            service: kubernetes
            instance: system:admin
          annotations:
            value: '{{ with $values.A }}{{ printf "%.0f reqs" .Value }}{{ end }}'
            summary: 'The host''s system:masters certificate was used: break-glass, or someone who shouldn''t have it.'
          data:
            - refId: A
              datasourceUid: loki
              relativeTimeRange:
                from: 300
                to: 0
              model:
                refId: A
                queryType: instant
                expr: sum(count_over_time({job="kube-audit"} | json | user_username="system:admin" [5m]))
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: rbac-changed-by-person
          title: RBAC changed outside Argo CD
          condition: C
          for: 0s
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: security
            service: kubernetes
            instance: '{{ $labels.objectRef_resource }}/{{ $labels.objectRef_name }}'
          annotations:
            value: '{{ $labels.user_username }}'
            summary: '{{ $labels.user_username }} modified {{ $labels.objectRef_resource }}/{{ $labels.objectRef_name }} outside Argo CD.'
          data:
            - refId: A
              datasourceUid: loki
              relativeTimeRange:
                from: 300
                to: 0
              model:
                refId: A
                queryType: instant
                expr: sum by (user_username, objectRef_resource, objectRef_name) (count_over_time({job="kube-audit"} | json | objectRef_apiGroup="rbac.authorization.k8s.io" | verb=~"create|update|patch|delete" | user_username!~"system:serviceaccount:.*" | requestURI!~".*dryRun=All.*" [5m]))
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: secrets-or-exec-by-person
          title: Secrets read or pods entered by a person
          condition: C
          for: 0s
          noDataState: OK
          execErrState: Error
          labels:
            severity: informational
            group: security
            service: kubernetes
            instance: '{{ $labels.objectRef_namespace }}/{{ $labels.objectRef_resource }}{{ if $labels.objectRef_subresource }}/{{ $labels.objectRef_subresource }}{{ end }}'
          annotations:
            value: '{{ $labels.user_username }}'
            summary: '{{ $labels.user_username }} accessed {{ $labels.objectRef_resource }}{{ if $labels.objectRef_subresource }}/{{ $labels.objectRef_subresource }}{{ end }} in namespace {{ $labels.objectRef_namespace }}.'
          data:
            - refId: A
              datasourceUid: loki
              relativeTimeRange:
                from: 300
                to: 0
              model:
                refId: A
                queryType: instant
                expr: sum by (user_username, objectRef_namespace, objectRef_resource, objectRef_subresource) (count_over_time({job="kube-audit"} | json | user_username=~"oidc:.*" | objectRef_resource="secrets" or objectRef_subresource=~"exec|attach|portforward" [5m]))
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: openbao-admin-login
          title: OpenBao admin login
          condition: C
          for: 0s
          noDataState: OK
          execErrState: Error
          labels:
            severity: informational
            group: security
            service: openbao
            instance: openbao
          annotations:
            value: role=admin
            summary: 'Something logged in to OpenBao with the admin role (the bao CLI through kubectl exec, or a minted openbao-admin token).'
          data:
            - refId: A
              datasourceUid: loki
              relativeTimeRange:
                from: 300
                to: 0
              model:
                refId: A
                queryType: instant
                expr: sum(count_over_time({namespace="openbao", container="openbao"} |= "\"type\":\"response\"" | json | auth_metadata_role="admin" [5m]))
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        # The counters below start existing at their first increment, which increase() can't see;
        # the `unless … offset` half catches a series that has just appeared.
        - uid: grafana-local-login
          title: Grafana break-glass login
          condition: C
          for: 0s
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: security
            service: grafana
            instance: grafana
          annotations:
            value: admin
            summary: 'Someone logged in to Grafana with a password instead of Keycloak; the only password account is the break-glass admin.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: sum(increase(grafana_authn_authn_successful_login_total{client="auth.client.form"}[10m])) > 0 or sum(grafana_authn_authn_successful_login_total{client="auth.client.form"} unless grafana_authn_authn_successful_login_total{client="auth.client.form"} offset 10m)
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: argocd-local-login
          title: Argo CD break-glass login
          condition: C
          for: 0s
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: security
            service: argocd
            instance: argocd
          annotations:
            value: admin
            summary: 'Someone logged in to Argo CD with a local account''s password (the break-glass admin); SSO logins don''t go through SessionService.Create.'
          data:
            - refId: A
              datasourceUid: loki
              relativeTimeRange:
                from: 300
                to: 0
              model:
                refId: A
                queryType: instant
                expr: sum(count_over_time({namespace="argocd", container="server"} |= "session.SessionService" | logfmt | msg="finished call" | grpc_service="session.SessionService" | grpc_method="Create" | grpc_code="OK" [5m]))
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: keycloak-master-login
          title: Keycloak master realm login
          condition: C
          for: 0s
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: security
            service: keycloak
            instance: 'master/{{ $labels.client_id }}'
          annotations:
            value: '{{ $labels.event }}'
            summary: 'Break-glass in Keycloak: {{ $labels.event }} on the master realm via client {{ $labels.client_id }}.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: sum by (event, client_id) (increase(keycloak_user_events_total{realm="master", event=~"login|client_login", error="", client_id!="bootstrap-admin"}[10m])) > 0 or sum by (event, client_id) (keycloak_user_events_total{realm="master", event=~"login|client_login", error="", client_id!="bootstrap-admin"} unless keycloak_user_events_total{realm="master", event=~"login|client_login", error="", client_id!="bootstrap-admin"} offset 10m)
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: keycloak-impersonation
          title: Keycloak impersonation
          condition: C
          for: 0s
          noDataState: OK
          execErrState: Error
          labels:
            severity: critical
            group: security
            service: keycloak
            instance: '{{ $labels.realm }}/{{ $labels.client_id }}'
          annotations:
            value: '{{ $labels.event }}'
            summary: 'Someone impersonated a user in Keycloak realm {{ $labels.realm }} (client {{ $labels.client_id }}). Impersonation bypasses the user''s passkey/TOTP; investigate the realm events and rotate the bootstrap-admin client secret if this was not intentional.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: sum by (realm, event, client_id) (increase(keycloak_user_events_total{event="impersonate"}[10m])) > 0 or sum by (realm, event, client_id) (keycloak_user_events_total{event="impersonate"} unless keycloak_user_events_total{event="impersonate"} offset 10m)
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: admission-policy-warning
          title: Pod breaks an admission policy
          condition: C
          for: 0s
          noDataState: OK
          execErrState: Error
          labels:
            severity: informational
            group: security
            service: kubernetes
            instance: '{{ $labels.objectRef_namespace }}'
          annotations:
            value: '{{ with $values.A }}{{ printf "%.0f warnings" .Value }}{{ end }}'
            summary: 'A pod in namespace {{ $labels.objectRef_namespace }} was admitted despite a Warn/Audit policy (addon admission), e.g. a CPU limit or a missing memory limit.'
          data:
            - refId: A
              datasourceUid: loki
              relativeTimeRange:
                from: 300
                to: 0
              model:
                refId: A
                queryType: instant
                expr: sum by (objectRef_namespace) (count_over_time({job="kube-audit"} |= "validation.policy.admission.k8s.io/validation_failure" | json [5m]))
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: network-policy-drops
          title: Traffic dropped by network policy
          condition: C
          for: 0s
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: security
            service: cilium
            instance: '{{ $labels.source }} -> {{ $labels.destination }}'
          annotations:
            value: '{{ with $values.A }}{{ printf "%.0f drops" .Value }}{{ end }}'
            summary: 'Cilium denied traffic from {{ $labels.source }} to {{ $labels.destination }}: a missing allow rule, or something probing where it shouldn''t.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: sum by (source, destination) (increase(hubble_drop_total{reason="POLICY_DENIED"}[5m])) > 0
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
  health.yaml:
    apiVersion: 1
    groups:
    - orgId: 1
      name: health
      folder: homelab
      interval: 1m
      rules:
        - uid: volume-filling-up
          title: Volume over 85% full
          condition: C
          for: 15m
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: health
            service: zfs-localpv
            instance: '{{ $labels.persistentvolumeclaim }}'
          annotations:
            value: '{{ with $values.A }}{{ printf "%.1f%%" (mul .Value 100.0) }}{{ end }}'
            summary: 'PVC {{ $labels.persistentvolumeclaim }} is over 85% full.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: max by (persistentvolumeclaim) (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: pod-restarting
          title: Pod restarting
          condition: C
          for: 0s
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: health
            service: kubernetes
            instance: '{{ $labels.namespace }}/{{ $labels.pod }}'
          annotations:
            value: '{{ with $values.A }}{{ printf "%.0f restarts" .Value }}{{ end }}'
            summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted more than three times in 15 minutes.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[15m])) > 3
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: node-not-ready
          title: Node not ready
          condition: C
          for: 5m
          noDataState: OK
          execErrState: Error
          labels:
            severity: critical
            group: health
            service: kubernetes
            instance: '{{ $labels.node }}'
          annotations:
            value: NotReady
            summary: 'Node {{ $labels.node }} has been NotReady for 5 minutes.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: max by (node) (kube_node_status_condition{condition="Ready", status="true"} == 0) + 1
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: workflow-failed
          title: Workflow started by a CronWorkflow failed
          condition: C
          for: 0s
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: health
            service: argo-workflows
            instance: '{{ $labels.namespace }}'
          annotations:
            value: Failed
            summary: 'A workflow in namespace {{ $labels.namespace }} entered the Failed phase in the last 15 minutes.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 900
                to: 0
              model:
                refId: A
                instant: true
                expr: sum by (namespace) (increase(argo_workflows_total_count{phase="Failed"}[15m])) > 0
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: argocd-app-unhealthy
          title: Argo CD application unhealthy
          condition: C
          for: 15m
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: health
            service: argocd
            instance: '{{ $labels.name }}'
          annotations:
            value: '{{ $labels.health_status }}'
            summary: 'Argo CD application {{ $labels.name }} has been {{ $labels.health_status }} for 15 minutes.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: max by (name, health_status) (argocd_app_info{health_status!~"Healthy|Progressing|Suspended"} unless argocd_app_info{health_status="Missing", autosync_enabled="false"})
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: argocd-app-paused
          title: Argo CD application paused for a week
          condition: C
          for: 0s
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: health
            service: argocd
            instance: '{{ $labels.name }}'
          annotations:
            value: paused 7d
            summary: 'Argo CD application {{ $labels.name }} has had auto-sync off for 7 days, so git changes don''t reach it. Resume it, or take the addon out of the cluster''s values.yaml.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 604800
                to: 0
              model:
                refId: A
                instant: true
                expr: count_over_time((max by (name) (argocd_app_info{autosync_enabled="false"}))[7d:1h]) >= 168
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: secret-sync-failing
          title: Secret sync failing
          condition: C
          for: 15m
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: health
            service: external-secrets
            instance: '{{ $labels.exported_namespace }}/{{ $labels.name }}'
          annotations:
            value: Ready=False
            summary: 'ExternalSecret or PushSecret {{ $labels.exported_namespace }}/{{ $labels.name }} has not been Ready for 15 minutes.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: max by (exported_namespace, name) ({__name__=~"externalsecret_status_condition|pushsecret_status_condition", condition="Ready", status="False"}) > 0
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: openbao-sealed
          title: OpenBao sealed
          condition: C
          for: 5m
          noDataState: Alerting
          execErrState: Error
          labels:
            severity: critical
            group: health
            service: openbao
            instance: openbao
          annotations:
            value: sealed
            summary: 'OpenBao is sealed or not reporting: no secret can be read or generated.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: max(vault_core_unsealed)
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: lt
                      params:
                        - 1
        - uid: certificate-expiring
          title: Certificate expiring
          condition: C
          for: 1h
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: health
            service: cert-manager
            instance: '{{ $labels.namespace }}/{{ $labels.name }}'
          annotations:
            value: '{{ with $values.A }}{{ printf "%.1fd left" (div .Value 86400.0) }}{{ end }}'
            summary: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} expires within 14 days; renewal is failing.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: min by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 86400
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: zfs-pool-unhealthy
          title: ZFS pool unhealthy
          condition: C
          for: 5m
          noDataState: Alerting
          execErrState: Error
          labels:
            severity: critical
            group: health
            service: zfs
            instance: '{{ if $labels.zpool }}{{ $labels.zpool }}{{ else }}zpool{{ end }}'
          annotations:
            value: unhealthy
            summary: 'ZFS pool {{ if $labels.zpool }}{{ $labels.zpool }} {{ end }}is degraded, faulted, offline or not reporting: mirror redundancy is lost, so replace the failing disk before its pair goes.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: min by (zpool) (node_zfs_zpool_state{state="online"})
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: lt
                      params:
                        - 1
        - uid: smart-status-failed
          title: Disk failed SMART health check
          condition: C
          for: 5m
          noDataState: Alerting
          execErrState: Error
          labels:
            severity: critical
            group: health
            service: smartctl
            instance: '{{ if $labels.device }}{{ $labels.device }}{{ else }}smartctl{{ end }}'
          annotations:
            value: FAILED
            summary: 'Disk {{ if $labels.device }}{{ $labels.device }} {{ end }}failed its SMART health assessment (or smartctl-exporter stopped reporting); replace the disk.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: min by (device) (smartctl_device_smart_status)
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: lt
                      params:
                        - 1
        - uid: smart-disk-errors
          title: Disk has bad sectors or media errors
          condition: C
          for: 15m
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: health
            service: smartctl
            instance: '{{ $labels.device }}'
          annotations:
            value: '{{ with $values.A }}{{ printf "%.0f errors" .Value }}{{ end }}'
            summary: 'Disk {{ $labels.device }} reports reallocated, pending or uncorrectable sectors, SCSI grown defects, NVMe media errors or a failed SMART self-test; scrub the pool and plan a replacement.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: max by (device) (smartctl_device_attribute{attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Offline_Uncorrectable|Reported_Uncorrect", attribute_value_type="raw"} > 0 or smartctl_scsi_grown_defect_list > 0 or {__name__=~"smartctl_(read|write|verify)_total_uncorrected_errors"} > 0 or smartctl_device_media_errors > 0 or smartctl_device_self_test_log_error_count > 0)
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: smart-nvme-warning
          title: NVMe critical warning or low spare
          condition: C
          for: 5m
          noDataState: OK
          execErrState: Error
          labels:
            severity: critical
            group: health
            service: smartctl
            instance: '{{ $labels.device }}'
          annotations:
            value: critical warning
            summary: 'NVMe controller {{ $labels.device }} raised its critical-warning flag or fell below its available-spare threshold.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: max by (device) (smartctl_device_critical_warning > 0 or (smartctl_device_available_spare < smartctl_device_available_spare_threshold) + 1)
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: smart-disk-hot
          title: Disk over 55°C
          condition: C
          for: 15m
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: health
            service: smartctl
            instance: '{{ $labels.device }}'
          annotations:
            value: '{{ with $values.A }}{{ printf "%.0f°C" .Value }}{{ end }}'
            summary: 'Disk {{ $labels.device }} has been over 55°C for 15 minutes; check fans and airflow.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: max by (device) (smartctl_device_temperature{temperature_type="current"}) > 55
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: systemd-unit-failed
          title: Systemd unit failed
          condition: C
          for: 5m
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: health
            service: systemd
            exported_instance: '{{ $labels.name }}'
          annotations:
            value: failed
            summary: 'Host systemd unit {{ $labels.name }} on {{ $labels.instance }} has been in the failed state for 5 minutes.'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: max by (instance, name) (node_systemd_unit_state{state="failed"}) > 0
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
        - uid: backup-overdue
          title: Off-site backup overdue
          condition: C
          for: 15m
          noDataState: Alerting
          execErrState: Error
          labels:
            severity: warning
            group: health
            service: backup
            exported_instance: homelab-backup.timer
          annotations:
            value: '{{ with $values.A }}{{ printf "%.1fh ago" (div .Value 3600.0) }}{{ else }}no data{{ end }}'
            summary: 'homelab-backup.timer has not triggered in 26 hours (or node-exporter stopped reporting).'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: max by (instance) (time() - node_systemd_timer_last_trigger_seconds{name="homelab-backup.timer"})
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 93600
        - uid: systemd-timer-overdue
          title: Systemd timer overdue
          condition: C
          for: 1h
          noDataState: OK
          execErrState: Error
          labels:
            severity: warning
            group: health
            service: systemd
            exported_instance: '{{ $labels.name }}'
          annotations:
            value: overdue
            summary: 'Host systemd timer {{ $labels.name }} on {{ $labels.instance }} has not triggered within its expected schedule (2h for hourly, 26h for daily, 8d for weekly, 33d for monthly).'
          data:
            - refId: A
              datasourceUid: mimir
              relativeTimeRange:
                from: 600
                to: 0
              model:
                refId: A
                instant: true
                expr: max by (instance, name) ((time() - node_systemd_timer_last_trigger_seconds{name=~"sanoid\\.timer|logrotate\\.timer"} > 2 * 3600) or (time() - node_systemd_timer_last_trigger_seconds{name="systemd-tmpfiles-clean.timer"} > 26 * 3600) or (time() - node_systemd_timer_last_trigger_seconds{name="zfs-scrub.timer"} > 33 * 86400) or (time() - node_systemd_timer_last_trigger_seconds{name!~"homelab-backup\\.timer|sanoid\\.timer|logrotate\\.timer|systemd-tmpfiles-clean\\.timer|zfs-scrub\\.timer"} > 8 * 86400))
            - refId: C
              datasourceUid: __expr__
              model:
                refId: C
                type: threshold
                expression: A
                conditions:
                  - evaluator:
                      type: gt
                      params:
                        - 0
