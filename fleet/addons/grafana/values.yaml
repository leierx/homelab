testFramework: {enabled: false}
# the chart's own ClusterRole adds Secrets cluster-wide, which the ConfigMap-only dashboard sidecar never reads
rbac: {useExistingClusterRole: grafana-dashboards}
admin: {existingSecret: grafana}
envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {secretKeyRef: {name: grafana, key: oidc-client-secret}}
grafana.ini:
  analytics: {reporting_enabled: false, check_for_updates: false, check_for_plugin_updates: false}
  security: {disable_gravatar: true}
  log: {filters: "search-manifest-watcher:error"}
  server:
    root_url: https://%(domain)s/
  auth: {disable_login_form: true}
  auth.basic: {enabled: false}
  auth.generic_oauth:
    enabled: true
    auto_login: true
    name: Keycloak
    client_id: grafana
    scopes: openid email profile
    use_pkce: true
    allow_sign_up: true
    allow_assign_grafana_admin: true
    login_attribute_path: preferred_username
    role_attribute_path: contains(groups, 'grafana-admin') && 'GrafanaAdmin' || contains(groups, 'grafana-editor') && 'Editor' || contains(groups, 'grafana-viewer') && 'Viewer' || ''
    role_attribute_strict: true
deploymentStrategy: {type: Recreate}
persistence:
  enabled: true
  annotations: {argocd.argoproj.io/sync-options: 'Delete=false,Prune=false'}
initChownData: {enabled: false}
securityContext:
  fsGroupChangePolicy: OnRootMismatch
resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 1Gi}}
serviceMonitor: {enabled: true}
sidecar:
  resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
  dashboards:
    enabled: true
    searchNamespace: ALL
    resource: configmap
    folderAnnotation: grafana_folder
    skipReload: true
    provider: {foldersFromFilesStructure: true}
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        url: http://mimir:8080/prometheus
        isDefault: true
        jsonData: {prometheusType: Mimir, httpMethod: POST, timeInterval: 30s}
      - {name: Loki, uid: loki, type: loki, url: 'http://loki:3100'}
      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        url: http://alertmanager:9093
        jsonData: {implementation: prometheus}
