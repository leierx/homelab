testFramework: {enabled: false}
admin: {existingSecret: grafana}
envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {secretKeyRef: {name: grafana, key: oidc-client-secret}}
grafana.ini:
  analytics: {reporting_enabled: false, check_for_updates: false, check_for_plugin_updates: false}
  security: {disable_gravatar: true}
  log: {filters: "search-manifest-watcher:error"}
  server:
    root_url: https://%(domain)s/
  auth: {disable_login_form: true}
  auth.basic: {enabled: false}
  auth.generic_oauth:
    enabled: true
    auto_login: true
    name: Keycloak
    client_id: grafana
    scopes: openid email profile
    use_pkce: true
    allow_sign_up: true
    allow_assign_grafana_admin: true
    login_attribute_path: preferred_username
    role_attribute_path: contains(groups, 'homelab-admins') && 'GrafanaAdmin' || contains(groups, 'homelab-operators') && 'Editor' || contains(groups, 'homelab-viewers') && 'Viewer' || ''
    role_attribute_strict: true
deploymentStrategy: {type: Recreate}
persistence:
  enabled: true
  annotations: {argocd.argoproj.io/sync-options: 'Delete=false,Prune=false'}
initChownData: {enabled: false}
securityContext:
  fsGroupChangePolicy: OnRootMismatch
resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 1Gi}}
downloadDashboards:
  resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
serviceMonitor: {enabled: true}
sidecar:
  resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
  dashboards:
    enabled: true
    searchNamespace: ALL
    folderAnnotation: grafana_folder
    skipReload: true
    provider: {foldersFromFilesStructure: true}
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        url: http://mimir:8080/prometheus
        isDefault: true
        jsonData: {prometheusType: Mimir, httpMethod: POST, timeInterval: 30s}
      - {name: Loki, uid: loki, type: loki, url: 'http://loki:3100'}
      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        url: http://alertmanager:9093
        jsonData: {implementation: prometheus}
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - {name: kubernetes, folder: Kubernetes, type: file, options: {path: /var/lib/grafana/dashboards/kubernetes}}
      - {name: platform, folder: Platform, type: file, options: {path: /var/lib/grafana/dashboards/platform}}
      - {name: host, folder: Host, type: file, options: {path: /var/lib/grafana/dashboards/host}}
# pinned grafana.com dashboards, downloaded at startup
dashboards:
  kubernetes:
    k8s-views-global: {gnetId: 15757, revision: 43, datasource: [{name: DS_PROMETHEUS, value: mimir}]}
    k8s-views-namespaces: {gnetId: 15758, revision: 46, datasource: [{name: DS_PROMETHEUS, value: mimir}]}
    k8s-views-nodes: {gnetId: 15759, revision: 40, datasource: [{name: DS_PROMETHEUS, value: mimir}]}
    k8s-views-pods: {gnetId: 15760, revision: 41, datasource: [{name: DS_PROMETHEUS, value: mimir}]}
    k8s-system-api-server: {gnetId: 15761, revision: 21, datasource: [{name: DS_PROMETHEUS, value: mimir}]}
  platform:
    argocd-operational: {gnetId: 19993, revision: 9}
    argocd-application: {gnetId: 19974, revision: 8}
    cert-manager: {gnetId: 20842, revision: 3}
    envoy-gateway: {gnetId: 24460, revision: 1}
    cloudnative-pg:
      gnetId: 20417
      revision: 4
      datasource: [{name: DS_PROMETHEUS, value: mimir}, {name: DS_EXPRESSION, value: __expr__}]
  host:
    node-exporter-full: {gnetId: 1860, revision: 46}
    smartctl-exporter: {gnetId: 22604, revision: 4, datasource: [{name: DS_PROMETHEUS, value: mimir}]}
    systemd: {gnetId: 25304, revision: 2, datasource: [{name: DS_PROMETHEUS, value: mimir}]}
    zfs-overview: {gnetId: 24987, revision: 12, datasource: [{name: DS_PROMETHEUS, value: mimir}]}
