apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jellyfin
  annotations:
    # after its secrets are Healthy
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  serviceName: jellyfin-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      # Jellyfin reads JELLYFIN_* variables as configuration, and Service links would add some
      enableServiceLinks: false
      # SQLite checkpoints its WAL on shutdown
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init
          image: {{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}
          command: [/bin/sh, /etc/jellyfin-seed/init.sh]
          env:
            - name: SSO_PLUGIN_VERSION
              value: {{ .Values.ssoPlugin.version | quote }}
            - name: SSO_PLUGIN_SHA256
              value: {{ .Values.ssoPlugin.sha256 | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: jellyfin, key: oidc-client-secret}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            - name: seed
              mountPath: /etc/jellyfin-seed
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: jellyfin
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: TZ
              value: {{ .Values.timeZone | quote }}
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          # until the setup Job has completed the wizard, which lets anyone in, the Gateway gets no endpoint
          readinessProbe:
            exec:
              command: [/bin/sh, -c, "curl -fsS http://localhost:8096/System/Info/Public | grep -q '\"StartupWizardCompleted\":true'"]
            timeoutSeconds: 5
          # /health queries the database, which a library scan can keep busy
          livenessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 8Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: seed
          configMap:
            name: jellyfin
        # transcodes and resized images; evicts this pod before the node's root disk fills
        - name: cache
          emptyDir:
            sizeLimit: 50Gi
        # trickplay and subtitle extraction, and SQLite's VACUUM
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
      protocol: TCP
---
# the setup Job reaches the pod before it is Ready
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-headless
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
      protocol: TCP
