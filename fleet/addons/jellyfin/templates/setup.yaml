# the setup Job stores the account sync's API key, which Jellyfin generates, in Secret/jellyfin-api-key
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jellyfin-setup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jellyfin-setup
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [jellyfin-api-key]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jellyfin-setup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jellyfin-setup
subjects:
  - kind: ServiceAccount
    name: jellyfin-setup
---
# every sync, alongside the pod; it exits at once once the wizard is complete
apiVersion: batch/v1
kind: Job
metadata:
  name: jellyfin-setup
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin-setup
    spec:
      restartPolicy: Never
      serviceAccountName: jellyfin-setup
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: [/bin/sh, /etc/jellyfin-seed/setup.sh]
          env:
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: jellyfin, key: admin-password}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: seed
              mountPath: /etc/jellyfin-seed
              readOnly: true
      volumes:
        - name: seed
          configMap:
            name: jellyfin
