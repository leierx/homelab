# Chart: https://github.com/immich-app/immich-charts
# controller-specific pod options (Valkey's uid) merge with the defaults below
immich:
  defaultPodOptionsStrategy: merge
  controllers:
    main:
      containers:
        main:
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile: {type: RuntimeDefault}
  server:
    controllers:
      main:
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
              tag: v3.3.5
            env:
              DB_URL: {valueFrom: {secretKeyRef: {name: immich-db-app, key: uri}}}
              # the first admin comes from the immich_role claim, never from public sign-up
              IMMICH_ALLOW_SETUP: "false"
              # for photos whose metadata has no time zone
              TZ: Europe/Oslo
            resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {memory: 8Gi}}
  machine-learning:
    controllers:
      main:
        containers:
          main:
            image:
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-machine-learning
              tag: v3.3.5
            resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {memory: 8Gi}}
    persistence:
      cache: {type: persistentVolumeClaim, existingClaim: model-cache}
  valkey:
    enabled: true
    controllers:
      main:
        pod: {securityContext: {runAsUser: 999}}
        containers:
          main:
            resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 512Mi}}
  immich:
    metrics: {enabled: true}
    persistence: {library: {existingClaim: library}}
    # clusters/<cluster>/immich/config.yaml; a change needs `kubectl -n immich rollout restart deploy/immich-server`
    existingConfiguration: immich-config
    configurationKind: Secret
database:
  # VectorChord: the Database's extension version and the extension image's tag
  # renovate: datasource=docker depName=ghcr.io/tensorchord/vchord-scratch extractVersion=^pg18-v(?<version>\d+\.\d+\.\d+)$
  vchord: "1.1.1"
  storage:
    size: 1Gi
