defaultPodOptionsStrategy: merge
controllers:
  main:
    containers:
      main:
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
server:
  controllers:
    main:
      containers:
        main:
          image:
            # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
            tag: v3.3.5
          env:
            DB_URL: {valueFrom: {secretKeyRef: {name: immich-db-app, key: uri}}}
            IMMICH_ALLOW_SETUP: "false"
            TZ: Europe/Oslo
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {memory: 8Gi}}
machine-learning:
  controllers:
    main:
      containers:
        main:
          image:
            # renovate: datasource=docker depName=ghcr.io/immich-app/immich-machine-learning
            tag: v3.3.5
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {memory: 8Gi}}
  persistence:
    cache: {type: persistentVolumeClaim, existingClaim: model-cache}
valkey:
  enabled: true
  controllers:
    main:
      pod: {securityContext: {runAsUser: 999}}
      containers:
        main:
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 512Mi}}
immich:
  metrics: {enabled: true}
  persistence: {library: {existingClaim: library}}
  existingConfiguration: immich-config
  configurationKind: Secret
