# ESO regenerates the password on each refresh; CNPG applies it because the Secret carries cnpg.io/reload
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: immich-db-password
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  length: 64
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db-rotation
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 720h
  target:
    name: immich-db-app
    creationPolicy: Merge
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        password: '{{ "{{ .password }}" }}'
        pgpass: 'immich-db-rw:5432:immich:immich:{{ "{{ .password }}" }}'
        uri: 'postgresql://immich:{{ "{{ .password }}" }}@immich-db-rw.{{ .Release.Namespace }}:5432/immich'
        fqdn-uri: 'postgresql://immich:{{ "{{ .password }}" }}@immich-db-rw.{{ .Release.Namespace }}.svc.cluster.local:5432/immich'
        jdbc-uri: 'jdbc:postgresql://immich-db-rw.{{ .Release.Namespace }}:5432/immich?password={{ "{{ .password }}" }}&user=immich'
        fqdn-jdbc-uri: 'jdbc:postgresql://immich-db-rw.{{ .Release.Namespace }}.svc.cluster.local:5432/immich?password={{ "{{ .password }}" }}&user=immich'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: immich-db-password
