# originals, thumbnails, encoded video and Immich's own database dumps; a ZFS filesystem, browsable per file in snapshots
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.library.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.library.size }}
---
# downloaded models; losing it only means downloading them again
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.modelCache.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.modelCache.size }}
