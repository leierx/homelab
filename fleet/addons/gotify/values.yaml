image:
  repository: docker.io/gotify/server
  tag: 3.1.1
# URL and OIDC issuer, per cluster
url: ""
oidc:
  issuer: ""
  # Keycloak groups: admins get Gotify admin, users may log in
  adminGroups: ""
  userGroups: ""
database:
  storage:
    size: 1Gi
# turns Alertmanager's webhook into Gotify messages (files/alertmanager.tmpl)
bridge:
  image:
    repository: docker.io/druggeri/alertmanager_gotify_bridge
    tag: 2.3.2
