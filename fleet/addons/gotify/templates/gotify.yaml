apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gotify
  annotations:
    # after its database and secrets are Healthy
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  serviceName: gotify
  selector:
    matchLabels:
      app.kubernetes.io/name: gotify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gotify
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gotify
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: GOTIFY_SERVER_PORT
              value: "8080"
            - name: GOTIFY_SERVER_SECURECOOKIE
              value: "true"
            - name: GOTIFY_SERVER_TRUSTEDPROXIES
              value: {{ required "trustedProxies is per cluster" .Values.trustedProxies }}
            - name: GOTIFY_DATABASE_DIALECT
              value: postgres
            - name: GOTIFY_DATABASE_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: gotify-db-app
                  key: uri
            # no local password login or default admin account
            - name: GOTIFY_LOCALAUTH_ENABLED
              value: "false"
            - name: GOTIFY_OIDC_ENABLED
              value: "true"
            - name: GOTIFY_OIDC_IDP_NAME
              value: Keycloak
            - name: GOTIFY_OIDC_ISSUER
              value: {{ required "oidc.issuer is per cluster" .Values.oidc.issuer }}
            - name: GOTIFY_OIDC_CLIENTID
              value: gotify
            - name: GOTIFY_OIDC_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: gotify
                  key: oidc-client-secret
            - name: GOTIFY_OIDC_REDIRECTURL
              value: {{ printf "%s/auth/oidc/callback" (required "hostname is per cluster" .Values.hostname) }}
            # links the pre-seeded leier user (who owns the Grafana application) on first OIDC login
            - name: GOTIFY_OIDC_LINK_BY_USERNAME
              value: "true"
            - name: GOTIFY_OIDC_GROUPS_CLAIM
              value: groups
            - name: GOTIFY_OIDC_GROUPS_ADMIN
              value: homelab-admins
            - name: GOTIFY_OIDC_AUTO_REDIRECT
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gotify
  labels:
    app.kubernetes.io/name: gotify
spec:
  selector:
    app.kubernetes.io/name: gotify
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# seeds leier and the Grafana application token after Gotify has migrated the schema
apiVersion: batch/v1
kind: Job
metadata:
  name: gotify-seed
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gotify-seed
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
          command: [sh, -c]
          args:
            - |
              set -eu
              psql "$URI" -v ON_ERROR_STOP=1 -v app_token="$APP_TOKEN" <<'SQL'
              WITH u AS (
                INSERT INTO users (name, admin, created_at)
                VALUES ('leier', true, NOW())
                ON CONFLICT (name) DO UPDATE SET name = EXCLUDED.name
                RETURNING id
              )
              INSERT INTO applications (token, user_id, name, description, internal, image, default_priority, created_at, sort_key)
              SELECT :'app_token', id, 'Grafana', 'Grafana alerts', true, '', 5, NOW(), 'a0'
              FROM u
              ON CONFLICT (user_id, sort_key) DO UPDATE SET token = EXCLUDED.token;
              SQL
          env:
            - name: URI
              valueFrom:
                secretKeyRef:
                  name: gotify-db-app
                  key: uri
            - name: APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gotify
                  key: app-token
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
