{{- $url := required "url is per cluster" .Values.url -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gotify
  annotations:
    # after its database and secrets are Healthy
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  serviceName: gotify
  selector:
    matchLabels:
      app.kubernetes.io/name: gotify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gotify
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gotify
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: GOTIFY_SERVER_PORT
              value: "8080"
            - name: GOTIFY_SERVER_SECURECOOKIE
              value: "true"
            # the Gateway's Envoy pods, so client IPs come from X-Forwarded-For
            - name: GOTIFY_SERVER_TRUSTEDPROXIES
              value: 10.42.0.0/16
            - name: GOTIFY_DATABASE_DIALECT
              value: postgres
            - name: GOTIFY_DATABASE_CONNECTION
              valueFrom: {secretKeyRef: {name: gotify-db-app, key: uri}}
            # created on the first start only; local logins are off, so it is break-glass
            - name: GOTIFY_DEFAULTUSER_PASS
              valueFrom: {secretKeyRef: {name: gotify, key: admin-password}}
            - name: GOTIFY_LOCALAUTH_ENABLED
              value: "false"
            - name: GOTIFY_OIDC_ENABLED
              value: "true"
            - name: GOTIFY_OIDC_ISSUER
              value: {{ required "oidc.issuer is per cluster" .Values.oidc.issuer | quote }}
            - name: GOTIFY_OIDC_CLIENTID
              value: gotify
            - name: GOTIFY_OIDC_CLIENTSECRET
              valueFrom: {secretKeyRef: {name: gotify, key: oidc-client-secret}}
            - name: GOTIFY_OIDC_REDIRECTURL
              value: {{ printf "%s/auth/oidc/callback" $url | quote }}
            - name: GOTIFY_OIDC_IDP_NAME
              value: Keycloak
            - name: GOTIFY_OIDC_AUTO_REDIRECT
              value: "true"
            - name: GOTIFY_OIDC_GROUPS_CLAIM
              value: groups
            - name: GOTIFY_OIDC_GROUPS_ADMIN
              value: {{ required "oidc.adminGroups is per cluster" .Values.oidc.adminGroups | quote }}
            - name: GOTIFY_OIDC_GROUPS_USER
              value: {{ required "oidc.userGroups is per cluster" .Values.oidc.userGroups | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # application icons and plugins only; messages and users are in Postgres
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gotify
  labels:
    app.kubernetes.io/name: gotify
spec:
  selector:
    app.kubernetes.io/name: gotify
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
