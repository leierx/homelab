apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gotify
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gotify
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: edge
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: gotify-db
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
    # Keycloak OIDC via CoreDNS split-horizon to the edge Gateway; nothing else leaves the pod
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: edge
      toPorts:
        - ports:
            - {port: "10443", protocol: TCP}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres
  annotations:
    # with the database Cluster, whose initdb job needs the API server
    argocd.argoproj.io/sync-wave: "-1"
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: gotify-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: gotify
        - matchLabels:
            cnpg.io/cluster: gotify-db
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
    # the CloudNativePG operator checks the instance's status endpoint
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports:
            - {port: "9187", protocol: TCP}
  egress:
    # the Postgres instance manager and initdb/join jobs
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: gotify-db
      toPorts:
        - ports:
            - {port: "5432", protocol: TCP}
