defaults: {automountServiceAccountToken: false}
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
    compactor_grpc_address: 127.0.0.1:9095
    ring: {instance_addr: 127.0.0.1, kvstore: {store: inmemory}}
  memberlistConfig: {join_members: []}
  storage: {type: filesystem}
  schemaConfig:
    configs:
      - from: '2024-04-01'
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: index_, period: 24h}
  limits_config: {retention_period: 30d}
  compactor: {retention_enabled: true, delete_request_store: filesystem}
  pattern_ingester: {enabled: true}
  analytics: {reporting_enabled: false}
singleBinary:
  resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {memory: 2Gi}}
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
sidecar: {rules: {enabled: false}}
monitoring: {serviceMonitor: {enabled: true}}
