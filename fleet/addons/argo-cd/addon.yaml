# Argo CD manages itself. Installed once by hand with these exact chart
# coordinates and values (see fleet/README.md, "Bootstrap"), then adopted here.
addon:
  enablement: baseline
  placement:
    key: fleet/role
    value: management
  namespace: argocd
  releaseName: argocd
  # Keep repoURL -> name -> version in this order; Renovate parses it.
  chart:
    repoURL: https://argoproj.github.io/argo-helm
    name: argo-cd
    version: 10.11.1
