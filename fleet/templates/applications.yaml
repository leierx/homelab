{{- /*
One Application per addon in .Values.addons, named <cluster>-<addon>.
The addon is addons/<addon>/, or clusters/<cluster>/<addon>/ when no shared addon has that name.
For a shared addon, clusters/<cluster>/<addon>/ adds values.yaml (Helm values for this cluster)
and any other manifests, synced next to the addon.
Its addon.yaml holds namespace (default: the addon's name), podSecurity and ignoreDifferences.
*/ -}}
{{- $cluster := required "cluster is set by the ApplicationSet" .Values.cluster }}
{{- range $name := .Values.addons }}
{{- $local := printf "clusters/%s/%s" $cluster $name }}
{{- $shared := $.Files.Get (printf "addons/%s/addon.yaml" $name) | ne "" }}
{{- $dir := ternary (printf "addons/%s" $name) $local $shared }}
{{- $metaFile := $.Files.Get (printf "%s/addon.yaml" $dir) }}
{{- if not $metaFile }}{{ fail (printf "addon %s: neither addons/%s/ nor %s/ has an addon.yaml" $name $name $local) }}{{ end }}
{{- $meta := fromYaml $metaFile | default dict }}
{{- $extras := list }}
{{- if $shared }}
{{- range $path, $_ := $.Files.Glob (printf "%s/*" $local) }}
{{- if ne (base $path) "values.yaml" }}{{ $extras = append $extras $path }}{{ end }}
{{- end }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $cluster }}-{{ $name }}
  namespace: argocd
  labels:
    fleet/cluster: {{ $cluster }}
    fleet/addon: {{ $name }}
spec:
  project: default
  destination:
    name: {{ $cluster }}
    namespace: {{ $meta.namespace | default $name }}
  sources:
    - repoURL: {{ $.Values.repoURL }}
      targetRevision: {{ $.Values.revision }}
      path: fleet/{{ $dir }}
      {{- if $.Files.Get (printf "%s/Chart.yaml" $dir) }}
      helm:
        releaseName: {{ $name }}
        ignoreMissingValueFiles: true
        {{- if $shared }}
        valueFiles:
          - ../../{{ $local }}/values.yaml
        {{- end }}
        valuesObject:
          fleet:
            cluster: {{ $cluster }}
      {{- else if not ($.Files.Get (printf "%s/kustomization.yaml" $dir)) }}
      directory:
        exclude: addon.yaml
      {{- end }}
    {{- if $extras }}
    - repoURL: {{ $.Values.repoURL }}
      targetRevision: {{ $.Values.revision }}
      path: fleet/{{ $local }}
      directory:
        exclude: values.yaml
    {{- end }}
  {{- with $meta.ignoreDifferences }}
  ignoreDifferences: {{ toJson . }}
  {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      # CRs rendered by upstream charts (ServiceMonitors, ...) often need CRDs from another addon
      - SkipDryRunOnMissingResource=true
      - ApplyOutOfSyncOnly=true
    {{- with $meta.podSecurity }}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: {{ . }}
        pod-security.kubernetes.io/warn: {{ . }}
        pod-security.kubernetes.io/audit: {{ . }}
    {{- end }}
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
{{- end }}
