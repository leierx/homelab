{{- $cluster := required "cluster.name is required" .Values.cluster.name -}}
{{- $server := default "https://kubernetes.default.svc" .Values.cluster.server -}}
{{- $repoURL := .Values.repoURL -}}
{{- $targetRevision := default "HEAD" .Values.targetRevision -}}
{{- $files := .Files -}}
{{- $allAddons := fromYaml (include "fleet.mergedAddons" .) -}}

{{- range $name, $addon := $allAddons }}
{{- $wave := include "fleet.calcWave" (dict "addon" $name "all" $allAddons "depth" 0 "cluster" $cluster) }}
{{- $sources := list -}}
{{- $needsValuesRef := false -}}

{{/* 1. Primary Helm source (if defined in base or cluster addon.yaml, or local Chart.yaml exists) */}}
{{- $hasBaseChart := ne ($files.Get (printf "addons/%s/Chart.yaml" $name)) "" -}}
{{- $hasClusterChart := ne ($files.Get (printf "clusters/%s/addons/%s/Chart.yaml" $cluster $name)) "" -}}
{{- if or $addon.helm $hasBaseChart $hasClusterChart }}
  {{- $helmCfg := default dict $addon.helm -}}
  {{- $valueFiles := list -}}
  {{- if ne ($files.Get (printf "addons/%s/values.yaml" $name)) "" }}
    {{- $valueFiles = append $valueFiles (printf "$values/fleet/addons/%s/values.yaml" $name) -}}
    {{- $needsValuesRef = true -}}
  {{- end }}
  {{- if ne ($files.Get (printf "clusters/%s/addons/%s/values.yaml" $cluster $name)) "" }}
    {{- $valueFiles = append $valueFiles (printf "$values/fleet/clusters/%s/addons/%s/values.yaml" $cluster $name) -}}
    {{- $needsValuesRef = true -}}
  {{- end }}
  {{- $helmSource := dict
      "repoURL" (default $repoURL $helmCfg.repoURL)
      "targetRevision" (default $targetRevision $helmCfg.targetRevision)
  -}}
  {{- if $helmCfg.chart }}
    {{- $_ := set $helmSource "chart" $helmCfg.chart -}}
  {{- else if $helmCfg.path }}
    {{- $_ := set $helmSource "path" $helmCfg.path -}}
  {{- else if $hasBaseChart }}
    {{- $_ := set $helmSource "path" (printf "fleet/addons/%s" $name) -}}
  {{- else if $hasClusterChart }}
    {{- $_ := set $helmSource "path" (printf "fleet/clusters/%s/addons/%s" $cluster $name) -}}
  {{- end }}
  {{- $helmSpec := dict
      "releaseName" (default $name $helmCfg.releaseName)
      "valuesObject" (dict "fleet" (dict "cluster" $cluster))
  -}}
  {{- if $valueFiles }}
    {{- $_ := set $helmSpec "valueFiles" $valueFiles -}}
  {{- end }}
  {{- $_ := set $helmSource "helm" $helmSpec -}}
  {{- $sources = append $sources $helmSource -}}
{{- end }}

{{/* 2. Base addon manifests/ or kustomize/ (auto-detected if present) */}}
{{- if $files.Glob (printf "addons/%s/manifests/**" $name) }}
  {{- $sources = append $sources (dict "repoURL" $repoURL "targetRevision" $targetRevision "path" (printf "fleet/addons/%s/manifests" $name)) -}}
{{- end }}
{{- if or (ne ($files.Get (printf "addons/%s/kustomize/kustomization.yaml" $name)) "") (ne ($files.Get (printf "addons/%s/kustomize/Kustomization" $name)) "") }}
  {{- $sources = append $sources (dict "repoURL" $repoURL "targetRevision" $targetRevision "path" (printf "fleet/addons/%s/kustomize" $name)) -}}
{{- end }}

{{/* 3. Cluster addon manifests/ or kustomize/ (auto-detected if present) */}}
{{- if $files.Glob (printf "clusters/%s/addons/%s/manifests/**" $cluster $name) }}
  {{- $sources = append $sources (dict "repoURL" $repoURL "targetRevision" $targetRevision "path" (printf "fleet/clusters/%s/addons/%s/manifests" $cluster $name)) -}}
{{- end }}
{{- if or (ne ($files.Get (printf "clusters/%s/addons/%s/kustomize/kustomization.yaml" $cluster $name)) "") (ne ($files.Get (printf "clusters/%s/addons/%s/kustomize/Kustomization" $cluster $name)) "") }}
  {{- $sources = append $sources (dict "repoURL" $repoURL "targetRevision" $targetRevision "path" (printf "fleet/clusters/%s/addons/%s/kustomize" $cluster $name)) -}}
{{- end }}

{{/* 4. Any extra sources (extra Helm charts, CRDs, paths) declared in sources: [] */}}
{{- range $extra := $addon.extraSources }}
  {{- if $extra.helm }}
    {{- $extraHelm := dict
        "repoURL" (default $repoURL $extra.helm.repoURL)
        "targetRevision" (default $targetRevision $extra.helm.targetRevision)
    -}}
    {{- if $extra.helm.chart }}{{- $_ := set $extraHelm "chart" $extra.helm.chart -}}{{- end }}
    {{- if $extra.helm.path }}{{- $_ := set $extraHelm "path" $extra.helm.path -}}{{- end }}
    {{- $extraHelmSpec := dict "releaseName" (default $name $extra.helm.releaseName) -}}
    {{- if $extra.helm.valuesFile }}
      {{- $_ := set $extraHelmSpec "valueFiles" (list (printf "$values/fleet/clusters/%s/addons/%s/%s" $cluster $name $extra.helm.valuesFile)) -}}
      {{- $needsValuesRef = true -}}
    {{- end }}
    {{- $_ := set $extraHelm "helm" $extraHelmSpec -}}
    {{- $sources = append $sources $extraHelm -}}
  {{- else if $extra.kustomize }}
    {{- $sources = append $sources (dict "repoURL" (default $repoURL $extra.kustomize.repoURL) "targetRevision" (default $targetRevision $extra.kustomize.targetRevision) "path" $extra.kustomize.path) -}}
  {{- else if $extra.manifests }}
    {{- $sources = append $sources (dict "repoURL" (default $repoURL $extra.manifests.repoURL) "targetRevision" (default $targetRevision $extra.manifests.targetRevision) "path" $extra.manifests.path) -}}
  {{- end }}
{{- end }}

{{/* Add the values ref source once if any Helm source referenced $values/... */}}
{{- if $needsValuesRef }}
  {{- $sources = append $sources (dict "repoURL" $repoURL "targetRevision" $targetRevision "ref" "values") -}}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  labels:
    fleet.io/cluster: {{ $cluster }}
    fleet.io/addon: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave | quote }}
spec:
  project: default
  destination:
    server: {{ $server }}
    namespace: {{ default $name $addon.namespace }}
  sources:
    {{- toYaml $sources | nindent 4 }}
  {{- with $addon.ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply={{ ternary "false" "true" (eq $addon.serverSideApply false) }}
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
      - ApplyOutOfSyncOnly=true
    {{- with $addon.podSecurity }}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: {{ . }}
        pod-security.kubernetes.io/warn: {{ . }}
        pod-security.kubernetes.io/audit: {{ . }}
    {{- end }}
    retry:
      limit: 10
      refresh: true
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 10m
{{- end }}
