{{- $files := .Files -}}
{{- $argo := required "argo is required" .Values.argo -}}
{{- $cluster := .Values.cluster -}}
{{- $server := required "server is required" .Values.server -}}
{{- $repoURL := required "repoURL is required" .Values.repoURL -}}
{{- $targetRevision := required "targetRevision is required" .Values.targetRevision -}}
{{- $addons := fromYaml (include "fleet.addons" .) -}}

{{- range $name, $addon := $addons }}
{{- if eq $addon.manager $argo }}
{{- $sources := list -}}

{{- with $addon.helm }}
  {{- $source := omit . "releaseName" -}}
  {{- if not .repoURL -}}
    {{- $_ := set $source "repoURL" $repoURL -}}
    {{- $_ := set $source "targetRevision" (default $targetRevision .targetRevision) -}}
  {{- end -}}
  {{- $helm := dict "releaseName" (default $name .releaseName) -}}
  {{- $valueFiles := list -}}
  {{- range $layer := $addon.layers -}}
    {{- if $files.Get (printf "%s/values.yaml" $layer) -}}
      {{- $valueFiles = append $valueFiles (printf "$fleet/fleet/%s/values.yaml" $layer) -}}
    {{- end -}}
  {{- end -}}
  {{- if $valueFiles -}}
    {{- $_ := set $helm "valueFiles" $valueFiles -}}
  {{- end -}}
  {{- $_ := set $source "helm" $helm -}}
  {{- $sources = append $sources $source -}}
{{- end -}}

{{- $sources = append $sources (dict "repoURL" $repoURL "targetRevision" $targetRevision "ref" "fleet") -}}

{{- range $layer := $addon.layers -}}
  {{- if $files.Glob (printf "%s/manifests/**" $layer) -}}
    {{- $sources = append $sources (dict "repoURL" $repoURL "targetRevision" $targetRevision "path" (printf "fleet/%s/manifests" $layer)) -}}
  {{- end -}}
{{- end -}}

{{- range $extra := $addon.sources -}}
  {{- $source := deepCopy $extra -}}
  {{- if not $source.repoURL -}}
    {{- $_ := set $source "repoURL" $repoURL -}}
    {{- $_ := set $source "targetRevision" (default $targetRevision $source.targetRevision) -}}
  {{- end -}}
  {{- $sources = append $sources $source -}}
{{- end -}}

{{- $syncPolicy := dict
    "automated" (dict "prune" true "selfHeal" true)
    "syncOptions" (list "CreateNamespace=true" "ServerSideApply=true")
    "retry" (dict "limit" 10 "refresh" true "backoff" (dict "duration" "10s" "maxDuration" "3m" "factor" 2))
-}}
{{- with $addon.managedNamespaceMetadata -}}
  {{- $_ := set $syncPolicy "managedNamespaceMetadata" . -}}
{{- end -}}

{{- $app := dict
    "apiVersion" "argoproj.io/v1alpha1"
    "kind" "Application"
    "metadata" (dict
      "name" (printf "%s-%s" $cluster $name)
      "namespace" "argocd"
      "annotations" (dict
        "argocd.argoproj.io/sync-wave" (toString $addon.wave)
        "fleet.io/non-blocking" (toString (not $addon.blocking)))
      "finalizers" (list "resources-finalizer.argocd.argoproj.io"))
    "spec" (dict
      "project" "default"
      "destination" (dict "server" $server "namespace" (default $name $addon.namespace))
      "sources" $sources
      "syncPolicy" $syncPolicy)
-}}
{{- include "fleet.deepMerge" (dict "dst" $app "src" (default dict $addon.application)) }}
---
{{ toYaml $app }}
{{- end }}
{{- end }}
