# loft01: the single-node management cluster Argo CD runs in. Registered like
# any other cluster so ApplicationSets can target it by labels.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-loft01
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    # --- identity (required) ---
    fleet/environment: prod
    fleet/role: management
    # --- workload apps ---
    app.fleet/immich: enabled
    app.fleet/dodde: enabled
    # --- addon overrides ---
    # with no CI checks, an auto-synced Renovate automerges minor/patch bumps straight onto main
    addon.fleet/renovate: paused
  annotations:
    fleet/description: Single-node management cluster (Argo CD, identity, telemetry)
    # Never prune the management cluster's own registration: that would delete every Application targeting it.
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  name: loft01
  server: https://kubernetes.default.svc
  config: |
    {"tlsClientConfig":{"insecure":false}}
