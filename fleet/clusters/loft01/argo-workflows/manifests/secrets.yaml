apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-server-sso
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: argo-server-sso
    template:
      engineVersion: v2
      data:
        client-id: argo-workflows
        client-secret: '{{ .oidc_client_secret }}'
  data:
    - secretKey: oidc_client_secret
      remoteRef: {key: loft01/argo-workflows, property: oidc_client_secret}
