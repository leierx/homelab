apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-server-sso
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argo-server-sso
    template:
      engineVersion: v2
      data:
        client-id: argo-workflows
        client-secret: '{{ .oidc_client_secret }}'
  data:
    - secretKey: oidc_client_secret
      remoteRef: {key: homelab/keycloak/for/argo/argo-workflows, property: oidc_client_secret}
---
# ESO logs in to OpenBao as this namespace's openbao-client (ClusterSecretStores openbao, openbao-push)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-client
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
