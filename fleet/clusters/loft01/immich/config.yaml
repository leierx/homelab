# Immich's config file. Locked: with a config file the admin UI can't change settings.
# The file can't read the environment, so ESO renders it with the client secret (OpenBao loft01/immich).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    template:
      engineVersion: v2
      data:
        immich-config.yaml: |
          # only SSO: Keycloak client immich, accounts created at first login, admin from the immich_role claim
          oauth:
            enabled: true
            issuerUrl: https://auth.skinke.net/realms/homelab
            clientId: immich
            clientSecret: {{ .oidc_client_secret | quote }}
            autoLaunch: true
          passwordLogin:
            enabled: false
          server:
            externalDomain: https://photos.skinke.net
          machineLearning:
            urls: [http://immich-machine-learning:3003]
          # Renovate brings new versions
          newVersionCheck:
            enabled: false
          # originals land under library/<user>/<year>/<date>/<file>, readable without Immich
          storageTemplate:
            enabled: true
          # no map tile requests to tiles.immich.cloud; reverse geocoding stays on
          map:
            enabled: false
  data:
    - secretKey: oidc_client_secret
      remoteRef: { key: loft01/immich, property: oidc_client_secret }
