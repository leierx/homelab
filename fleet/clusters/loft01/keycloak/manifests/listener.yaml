apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak
spec:
  secretName: keycloak-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - auth.skinke.net
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: keycloak-edge
spec:
  parentRef:
    name: edge
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: auth.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: keycloak-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: keycloak-wg
spec:
  parentRef:
    name: wg
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: auth.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: keycloak-tls
---
# Public: what a login to realm homelab needs (Keycloak's reverse-proxy guide); admin and the master realm are wg-only
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-edge
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: keycloak-edge
  hostnames:
    - auth.skinke.net
  rules:
    - matches:
        - path: { type: PathPrefix, value: /realms/homelab/ }
        - path: { type: PathPrefix, value: /resources/ }
        # RFC 8414 metadata, for realm homelab only (the master realm stays internal)
        - path: { type: RegularExpression, value: "/\\.well-known/[^/]+/realms/homelab" }
      backendRefs:
        - name: keycloak-service
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-wg
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: keycloak-wg
  hostnames:
    - auth.skinke.net
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
---
# Keycloak is the OIDC provider itself, so its listeners opt out of the Gateway-wide OIDC policy
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: keycloak
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: keycloak-edge
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: keycloak-wg
  authorization:
    defaultAction: Allow

