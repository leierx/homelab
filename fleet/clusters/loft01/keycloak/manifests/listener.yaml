apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak
spec:
  secretName: keycloak-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - auth.skinke.net
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-admin
spec:
  secretName: keycloak-admin-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - keycloak.skinke.net
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: keycloak-edge
spec:
  parentRef:
    name: edge
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: auth.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: keycloak-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: keycloak-wg
spec:
  parentRef:
    name: wg
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: keycloak.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: keycloak-admin-tls
---
# Public: only the endpoints a login needs (Keycloak's reverse-proxy guide), for every realm but master (SecurityPolicy keycloak-edge); admin is wg-only and the account console closed
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-edge
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: keycloak-edge
  hostnames:
    - auth.skinke.net
  rules:
    - matches:
        # realm names without %, so an encoded "master" can't slip past the deny
        - path:
            type: RegularExpression
            value: '/realms/[\w-]+/(protocol/openid-connect/(auth|token|certs|userinfo|revoke|logout(/logout-confirm)?)|login-actions/[^/]+|\.well-known/openid-configuration)'
        # RFC 8414 discovery
        - path: {type: RegularExpression, value: '/\.well-known/openid-configuration/realms/[\w-]+'}
        - path: {type: PathPrefix, value: /resources/}
      backendRefs:
        - name: keycloak-service
          port: 8080
    # the admin console on keycloak.skinke.net frames these; frame-ancestors overrides the Gateway's X-Frame-Options
    - matches:
        - path: {type: RegularExpression, value: '/realms/[\w-]+/protocol/openid-connect/(3p-cookies/step[12]\.html|login-status-iframe\.html(/init)?)'}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Content-Security-Policy
                value: frame-ancestors 'self' https://keycloak.skinke.net
      backendRefs:
        - name: keycloak-service
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: keycloak-edge
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: keycloak-edge
  # keep the Gateway's request timeout
  mergeType: StrategicMerge
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            # :path with its query string
            - path: {type: RegularExpression, value: '/realms/[^/]+/login-actions/.*'}
              methods: [{value: POST}]
              sourceCIDR: {type: Distinct, value: 0.0.0.0/0}
          limit: {requests: 20, unit: Minute}
        # apps and Envoy's own OIDC filter exchange and refresh tokens here, each from its pod IP
        - clientSelectors:
            - path: {type: RegularExpression, value: '/realms/[^/]+/protocol/openid-connect/token(\?.*)?'}
              methods: [{value: POST}]
              sourceCIDR: {type: Distinct, value: 0.0.0.0/0}
          limit: {requests: 60, unit: Minute}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-wg
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: keycloak-wg
  hostnames:
    - keycloak.skinke.net
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
---
# Keycloak is the OIDC provider itself, so its wg listener opts out of the Gateway-wide OIDC policy
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: keycloak
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: keycloak-wg
  authorization:
    defaultAction: Allow
---
# the same for the public listener, which also keeps the master realm internal
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: keycloak-edge
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: keycloak-edge
  authorization:
    defaultAction: Allow
    rules:
      - action: Deny
        operation:
          path: {type: PathPrefix, value: /realms/master}
        principal:
          clientCIDRs: [0.0.0.0/0, "::/0"]
      - action: Deny
        operation:
          path: {type: PathPrefix, value: /.well-known/openid-configuration/realms/master}
        principal:
          clientCIDRs: [0.0.0.0/0, "::/0"]
