apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: admin_client_secret
        remoteRef: {remoteKey: homelab/keycloak/keycloak, property: admin_client_secret}
    - match:
        secretKey: leier_password
        remoteRef: {remoteKey: homelab/keycloak/keycloak, property: leier_password}
---
