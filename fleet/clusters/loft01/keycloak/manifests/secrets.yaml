# the master realm's service client: what Keycloak bootstraps and the reconcile workflow logs in with
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-bootstrap-admin
    template:
      engineVersion: v2
      data:
        client-id: bootstrap-admin
        client-secret: '{{ .admin_client_secret }}'
  data:
    - secretKey: admin_client_secret
      remoteRef: {key: homelab/keycloak/keycloak, property: admin_client_secret}
---
# TF_VAR_… for tofu/keycloak, so write-only values never enter state
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-tofu
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-tofu
  data:
    - secretKey: TF_VAR_keycloak_client_secret
      remoteRef: {key: homelab/keycloak/keycloak, property: admin_client_secret}
    - secretKey: TF_VAR_leier_password
      remoteRef: {key: homelab/keycloak/keycloak, property: leier_password}
    - secretKey: TF_VAR_argocd_client_secret
      remoteRef: {key: homelab/keycloak/for/argocd/argocd, property: oidc_client_secret}
    - secretKey: TF_VAR_grafana_client_secret
      remoteRef: {key: homelab/keycloak/for/monitoring/grafana, property: oidc_client_secret}
    - secretKey: TF_VAR_immich_client_secret
      remoteRef: {key: homelab/keycloak/for/immich/immich, property: oidc_client_secret}
    - secretKey: TF_VAR_alerta_client_secret
      remoteRef: {key: homelab/keycloak/for/alerta/alerta, property: oidc_client_secret}
    - secretKey: TF_VAR_edge_client_secret
      remoteRef: {key: homelab/keycloak/edge, property: oidc_client_secret}
    - secretKey: TF_VAR_argo_workflows_client_secret
      remoteRef: {key: homelab/keycloak/for/argo/argo-workflows, property: oidc_client_secret}
    - secretKey: TF_VAR_miniflux_client_secret
      remoteRef: {key: homelab/keycloak/for/miniflux/miniflux, property: oidc_client_secret}
    - secretKey: TF_VAR_paperless_client_secret
      remoteRef: {key: homelab/keycloak/for/paperless/paperless, property: oidc_client_secret}
    - secretKey: TF_VAR_jellyfin_client_secret
      remoteRef: {key: homelab/keycloak/jellyfin, property: oidc_client_secret}
---
# ESO logs in to OpenBao as this namespace's openbao-client (ClusterSecretStores openbao, openbao-push)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-client
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
