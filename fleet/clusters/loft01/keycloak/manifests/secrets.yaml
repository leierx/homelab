# the client secret Keycloak and Envoy Gateway's SecurityPolicy/oidc both read
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: oidc-edge
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: oidc_client_secret
        remoteRef: {remoteKey: homelab/keycloak/edge, property: oidc_client_secret}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: edge-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: edge-oidc
  data:
    - secretKey: client-secret
      remoteRef: {key: homelab/keycloak/edge, property: oidc_client_secret}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: edge-oidc
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Secret
      name: edge-oidc
---
