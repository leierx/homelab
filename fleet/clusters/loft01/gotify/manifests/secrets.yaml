# OpenBao path loft01/gotify: admin_password generated once (IfNotExists); oidc_client_secret comes from the keycloak addon
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: gotify
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: admin_password
        remoteRef: { remoteKey: loft01/gotify, property: admin_password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gotify
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: gotify
  data:
    - secretKey: admin-password
      remoteRef: { key: loft01/gotify, property: admin_password }
    - secretKey: oidc-client-secret
      remoteRef: { key: loft01/gotify, property: oidc_client_secret }
---
# alertmanager_token is the Alertmanager application's, created in Gotify by hand: Gotify generates app tokens itself
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gotify-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: gotify-bridge
    template:
      engineVersion: v2
      data:
        token: '{{ .token }}'
        # the bridge picks templates by the token's name; these point at files/alertmanager.tmpl
        token.tmpl: |
          {{ printf "{{ define %q }}{{ template \"alertmanager_message\" . }}{{ end }}" .token }}
          {{ printf "{{ define %q }}{{ template \"alertmanager_title\" . }}{{ end }}" (print "title=" .token) }}
  data:
    - secretKey: token
      remoteRef: { key: loft01/gotify, property: alertmanager_token }
