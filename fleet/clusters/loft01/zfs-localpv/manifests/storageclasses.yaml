# zfs: ext4 zvols, for databases and anything that needs a normal filesystem (default)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: zfs.csi.openebs.io
parameters:
  poolname: tank
  fstype: ext4
allowVolumeExpansion: true
# a deleted claim must not take the data with it: the zvol stays until removed by hand
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
# zfs-thin: a 1M-recordsize dataset per PVC for bulk files, never databases; refquota so snapshots don't count
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs-thin
provisioner: zfs.csi.openebs.io
parameters:
  poolname: tank
  fstype: zfs
  recordsize: 1M
  quotatype: refquota
  thinprovision: "yes"
allowVolumeExpansion: true
# a deleted claim must not take the data with it: the dataset stays until removed by hand
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
