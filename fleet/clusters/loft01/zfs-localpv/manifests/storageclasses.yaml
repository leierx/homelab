# zfs (default): refquota, so snapshots don't count against the claim
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: zfs.csi.openebs.io
parameters:
  poolname: tank
  fstype: zfs
  recordsize: 128k
  quotatype: refquota
  thinprovision: "yes"
allowVolumeExpansion: true
# a deleted claim keeps its data until removed by hand
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
# zfs-bulk: zfs with 1M records, for large files written whole and read through (photos, video, documents); never databases
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs-bulk
provisioner: zfs.csi.openebs.io
parameters:
  poolname: tank
  fstype: zfs
  recordsize: 1M
  quotatype: refquota
  thinprovision: "yes"
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
# zfs-block: a raw zvol for volumeMode: Block only (zfs-block-policy.yaml), never formatted on the host
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs-block
provisioner: zfs.csi.openebs.io
parameters:
  poolname: tank
  thinprovision: "yes"
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
# zfs-scratch: CDI's import scratch space (fleet/addons/cdi); throwaway, so it goes with its claim
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs-scratch
provisioner: zfs.csi.openebs.io
parameters:
  poolname: tank
  fstype: zfs
  quotatype: refquota
  thinprovision: "yes"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
