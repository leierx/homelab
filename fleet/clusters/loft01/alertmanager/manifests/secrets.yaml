# OpenBao paths loft01/alerta (the key its webhook already accepts) and loft01/ntfy
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: alertmanager
    template:
      engineVersion: v2
      data:
        alerta-api-key: '{{ .alerta_api_key }}'
        ntfy-token: 'tk_{{ .ntfy_token }}'
  data:
    - secretKey: alerta_api_key
      remoteRef:
        key: "loft01/alerta"
        property: grafana_api_key
    - secretKey: ntfy_token
      remoteRef:
        key: "loft01/ntfy"
        property: alertmanager_token
