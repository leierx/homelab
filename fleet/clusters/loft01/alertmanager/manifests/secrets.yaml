# Alerta's ADMIN_KEY (its share, OpenBao kv/homelab/alerta/for/monitoring/alerta) and the SMTP relay password (kv/homelab/monitoring/alertmanager)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alertmanager
  data:
    - secretKey: alerta-api-key
      remoteRef:
        key: homelab/alerta/for/monitoring/alerta
        property: admin_key
    - secretKey: smtp-password
      remoteRef:
        key: homelab/monitoring/alertmanager
        property: smtp_password
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-client
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
