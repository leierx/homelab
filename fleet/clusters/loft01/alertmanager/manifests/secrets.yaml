# Alerta's ADMIN_KEY and the SMTP relay password (OpenBao kv/loft01/alertmanager)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: alertmanager
  data:
    - secretKey: alerta-api-key
      remoteRef:
        key: loft01/alerta
        property: admin_key
    - secretKey: smtp-password
      remoteRef:
        key: loft01/alertmanager
        property: smtp_password
