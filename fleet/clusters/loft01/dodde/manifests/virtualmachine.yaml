apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: fedora
  namespace: dodde
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false,SkipDryRunOnMissingResource=true
spec:
  runStrategy: Always
  template:
    spec:
      # 180s for the guest, so the pod gets 210s, inside the 240s the kubelet gives priority-0 pods on shutdown
      terminationGracePeriodSeconds: 180
      # KubeVirt's DHCP hands the guest the pod's DNS; cluster DNS is blocked by the network policy
      dnsPolicy: None
      dnsConfig:
        nameservers: [9.9.9.9, 149.112.112.112]
      domain:
        # cloud-init keys its instance-id on this; a recreated VM would otherwise regenerate host keys
        firmware:
          uuid: e63f5b13-1e9b-4914-9cfa-00d8fb8af3ec
          serial: 19e895a7-b873-478b-9e80-bcd9f58b1edc
        resources:
          requests:
            cpu: 4
            memory: 24Gi
          limits:
            memory: 24Gi
        devices:
          disks:
            - name: rootdisk
              bootOrder: 1
              disk: {}
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: fedora-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              users:
                - name: dodde
                  groups: [wheel]
                  sudo: "ALL=(ALL) NOPASSWD:ALL"
                  shell: /bin/bash
                  lock_passwd: true
                  ssh_authorized_keys:
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFavdMIfxAdJCFjfEP3cPKBIsN5mnHVLkwOQaon8Oy31
              disable_root: true
              ssh_pwauth: false
              growpart:
                mode: auto
                devices: ['/']
              yum_repos:
                tailscale-stable:
                  name: Tailscale stable
                  baseurl: https://pkgs.tailscale.com/stable/fedora/$basearch
                  enabled: true
                  gpgcheck: true
                  repo_gpgcheck: true
                  gpgkey: https://pkgs.tailscale.com/stable/fedora/repo.gpg
              packages: [tailscale]
              runcmd:
                - [systemctl, enable, --now, tailscaled]
