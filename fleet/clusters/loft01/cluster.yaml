repoURL: https://github.com/leierx/homelab.git
targetRevision: HEAD

addons:
  alerta:
    oidc: {issuer: https://auth.skinke.net/realms/homelab}
    database: {storage: {storageClass: zfs, size: 5Gi}}

  argocd:
    configs:
      cm:
        url: https://argocd.skinke.net
        oidc.config: |
          name: Keycloak
          issuer: https://auth.skinke.net/realms/homelab
          clientID: argocd
          clientSecret: $argocd-oidc:clientSecret
          cliClientID: argocd-cli
          requestedScopes: [openid, profile, email]
          refreshTokenThreshold: 2m

  argo-workflows:
    server:
      sso:
        issuer: https://auth.skinke.net/realms/homelab
        redirectUrl: https://workflows.skinke.net/oauth2/callback

  cilium:
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 6443
    operator: {replicas: 1}
    ipam: {operator: {clusterPoolIPv4PodCIDRList: [10.42.0.0/16]}}
    resources: {requests: {memory: 2560Mi}}

  grafana:
    grafana.ini:
      server: {domain: metrics.skinke.net}
      auth:
        signout_redirect_url: https://auth.skinke.net/realms/homelab/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fmetrics.skinke.net%2Flogin
      auth.generic_oauth:
        auth_url: https://auth.skinke.net/realms/homelab/protocol/openid-connect/auth
        token_url: https://auth.skinke.net/realms/homelab/protocol/openid-connect/token
        api_url: https://auth.skinke.net/realms/homelab/protocol/openid-connect/userinfo
    persistence: {storageClassName: zfs, size: 5Gi}

  keycloak:
    hostname: https://auth.skinke.net
    proxyTrustedAddresses: 10.42.0.0/16
    database: {storage: {storageClass: zfs, size: 5Gi}}

  loki:
    singleBinary: {persistence: {storageClass: zfs, size: 50Gi}}

  mimir:
    storage: {className: zfs, size: 100Gi}

  miniflux:
    url: https://rss.skinke.net
    oidc: {issuer: https://auth.skinke.net/realms/homelab}
    database: {storage: {storageClass: zfs, size: 5Gi}}

  openbao:
    kvPrefix: loft01
    server: {dataStorage: {storageClass: zfs, size: 2Gi}}

  renovate:
    renovate: {persistence: {cache: {storageClass: zfs, storageSize: 5Gi}}}

  admission: {}
  alloy-logs: {}
  alloy-metrics: {}
  capi-argo-bridge: {}
  cdi: {}
  cert-manager: {}
  cloudnative-pg: {}
  cluster-api: {}
  dodde: {}
  envoy-gateway: {}
  external-secrets: {}
  immich: {}
  kube-state-metrics: {}
  kubevirt: {}
  node-exporter: {}
  prometheus-operator-crds: {}
  rbac: {}
  smartctl-exporter: {}
  zfs-localpv: {}
