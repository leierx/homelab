apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: alerta
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: secret_key
        remoteRef: {remoteKey: homelab/alerta/alerta, property: secret_key}
    - match:
        secretKey: admin_key
        remoteRef: {remoteKey: homelab/alerta/alerta, property: admin_key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alerta
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alerta
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: homelab/keycloak/for/alerta/alerta
        property: oidc_client_secret
    - secretKey: secret-key
      remoteRef:
        key: homelab/alerta/alerta
        property: secret_key
    - secretKey: admin-key
      remoteRef:
        key: homelab/alerta/alerta
        property: admin_key
---
# ESO logs in to OpenBao as this namespace's openbao-client (ClusterSecretStores openbao, openbao-push)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-client
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
# Alertmanager authenticates to Alerta with this key; the share is the only part of kv/homelab/alerta monitoring can read
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: alerta-share-monitoring
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    secret:
      name: alerta
  data:
    - match:
        secretKey: admin-key
        remoteRef: {remoteKey: homelab/alerta/for/monitoring/alerta, property: admin_key}
