# Helm charts come through Harbor (fleet.io/oci-mirror), which only the wg Gateway serves;
# CoreDNS answers registry.skinke.net with the wg Envoy Service
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: repo-server-registry
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-repo-server
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: wg
      toPorts:
        - ports:
            - {port: "10443", protocol: TCP}
