apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argocd-oidc
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientSecret
      remoteRef: {key: homelab/keycloak/for/argocd/argocd, property: oidc_client_secret}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-client
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
