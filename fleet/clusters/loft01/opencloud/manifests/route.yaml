apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: opencloud
spec:
  secretName: opencloud-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - opencloud.skinke.net
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: opencloud-edge
spec:
  parentRef:
    name: edge
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: opencloud.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: opencloud-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencloud-edge
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: opencloud-edge
  hostnames:
    - opencloud.skinke.net
  rules:
    - backendRefs:
        - name: opencloud
          port: 9200
      # no 300 s cap on large downloads, archives, plain WebDAV uploads or the notification stream
      timeouts:
        request: 0s
---
# the sync apps can't get through Envoy's OIDC login, so OpenCloud's own Keycloak check guards it
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: opencloud-edge
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: opencloud-edge
  authorization:
    defaultAction: Allow
