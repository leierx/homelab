apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: opencloud
spec:
  secretName: opencloud-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - oc.skinke.net
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: opencloud-edge
spec:
  parentRef:
    name: edge
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: oc.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: opencloud-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencloud-edge
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: opencloud-edge
  hostnames:
    - oc.skinke.net
  rules:
    - backendRefs:
        - name: opencloud
          port: 9200
      filters:
        # OpenCloud 9.0.0 takes the client IP from these when present (fixed in 9.0.1); the Gateway already sets X-Forwarded-For
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [True-Client-IP, X-Real-IP]
      # no cap on large downloads, zip archives or the live-update stream
      timeouts:
        request: 0s
---
# public links and the desktop and mobile apps can't get through Envoy's OIDC login, so OpenCloud's own Keycloak login guards it
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: opencloud-edge
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: opencloud-edge
  authorization:
    defaultAction: Allow
