# OpenBao path loft01/opencloud: generated once (IfNotExists), then read back
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: opencloud
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: jwt_secret
        remoteRef: { remoteKey: loft01/opencloud, property: jwt_secret }
    - match:
        secretKey: machine_auth_api_key
        remoteRef: { remoteKey: loft01/opencloud, property: machine_auth_api_key }
    - match:
        secretKey: transfer_secret
        remoteRef: { remoteKey: loft01/opencloud, property: transfer_secret }
    - match:
        secretKey: url_signing_secret
        remoteRef: { remoteKey: loft01/opencloud, property: url_signing_secret }
    - match:
        secretKey: system_user_api_key
        remoteRef: { remoteKey: loft01/opencloud, property: system_user_api_key }
    - match:
        secretKey: service_account_secret
        remoteRef: { remoteKey: loft01/opencloud, property: service_account_secret }
    - match:
        secretKey: idm_password
        remoteRef: { remoteKey: loft01/opencloud, property: idm_password }
    - match:
        secretKey: idm_reva_password
        remoteRef: { remoteKey: loft01/opencloud, property: idm_reva_password }
    - match:
        secretKey: idm_idp_password
        remoteRef: { remoteKey: loft01/opencloud, property: idm_idp_password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: opencloud
  dataFrom:
    - extract:
        key: loft01/opencloud
