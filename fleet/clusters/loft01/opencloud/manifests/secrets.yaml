# OpenBao path loft01/opencloud: generated once (PushSecret, IfNotExists), then read back
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: opencloud
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: jwt_secret
        remoteRef: { remoteKey: loft01/opencloud, property: jwt_secret }
    - match:
        secretKey: transfer_secret
        remoteRef: { remoteKey: loft01/opencloud, property: transfer_secret }
    - match:
        secretKey: url_signing_secret
        remoteRef: { remoteKey: loft01/opencloud, property: url_signing_secret }
    - match:
        secretKey: machine_auth_api_key
        remoteRef: { remoteKey: loft01/opencloud, property: machine_auth_api_key }
    - match:
        secretKey: system_user_api_key
        remoteRef: { remoteKey: loft01/opencloud, property: system_user_api_key }
    - match:
        secretKey: service_account_secret
        remoteRef: { remoteKey: loft01/opencloud, property: service_account_secret }
    - match:
        secretKey: thumbnails_transfer_token
        remoteRef: { remoteKey: loft01/opencloud, property: thumbnails_transfer_token }
    - match:
        secretKey: idm_svc_password
        remoteRef: { remoteKey: loft01/opencloud, property: idm_svc_password }
    - match:
        secretKey: idm_revasvc_password
        remoteRef: { remoteKey: loft01/opencloud, property: idm_revasvc_password }
    - match:
        secretKey: idm_idpsvc_password
        remoteRef: { remoteKey: loft01/opencloud, property: idm_idpsvc_password }
---
# what `opencloud init` would write; the IDM passwords are hashed into its LDAP on first boot, so they never change
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: opencloud
  data:
    - secretKey: OC_JWT_SECRET
      remoteRef: { key: loft01/opencloud, property: jwt_secret }
    - secretKey: OC_TRANSFER_SECRET
      remoteRef: { key: loft01/opencloud, property: transfer_secret }
    - secretKey: OC_URL_SIGNING_SECRET
      remoteRef: { key: loft01/opencloud, property: url_signing_secret }
    - secretKey: OC_MACHINE_AUTH_API_KEY
      remoteRef: { key: loft01/opencloud, property: machine_auth_api_key }
    - secretKey: OC_SYSTEM_USER_API_KEY
      remoteRef: { key: loft01/opencloud, property: system_user_api_key }
    - secretKey: OC_SERVICE_ACCOUNT_SECRET
      remoteRef: { key: loft01/opencloud, property: service_account_secret }
    - secretKey: THUMBNAILS_TRANSFER_TOKEN
      remoteRef: { key: loft01/opencloud, property: thumbnails_transfer_token }
    - secretKey: IDM_SVC_PASSWORD
      remoteRef: { key: loft01/opencloud, property: idm_svc_password }
    - secretKey: GRAPH_LDAP_BIND_PASSWORD
      remoteRef: { key: loft01/opencloud, property: idm_svc_password }
    - secretKey: IDM_REVASVC_PASSWORD
      remoteRef: { key: loft01/opencloud, property: idm_revasvc_password }
    - secretKey: USERS_LDAP_BIND_PASSWORD
      remoteRef: { key: loft01/opencloud, property: idm_revasvc_password }
    - secretKey: GROUPS_LDAP_BIND_PASSWORD
      remoteRef: { key: loft01/opencloud, property: idm_revasvc_password }
    - secretKey: AUTH_BASIC_LDAP_BIND_PASSWORD
      remoteRef: { key: loft01/opencloud, property: idm_revasvc_password }
    - secretKey: IDM_IDPSVC_PASSWORD
      remoteRef: { key: loft01/opencloud, property: idm_idpsvc_password }
