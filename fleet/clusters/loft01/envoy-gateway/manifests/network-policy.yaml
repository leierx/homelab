# loft01 Gateway proxy policies: edge backends, in-cluster OIDC clients, and wg Gateway proxy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: proxies-edge-routes
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: edge
  ingress:
    # in-cluster OIDC clients reaching auth.skinke.net via CoreDNS split-horizon
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alerta
            app.kubernetes.io/name: alerta
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argo
            app.kubernetes.io/name: argo-workflows-server
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-server
        - matchLabels:
            app.kubernetes.io/name: envoy
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: immich
            app.kubernetes.io/name: server
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: miniflux
            app.kubernetes.io/name: miniflux
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: grafana
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: zot
            app.kubernetes.io/name: zot
      toPorts:
        - ports: [{ port: "10443", protocol: TCP }]
    # cert-manager HTTP-01 self-check for auth.skinke.net
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cert-manager
            app.kubernetes.io/name: cert-manager
      toPorts:
        - ports: [{ port: "10080", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: edge
      toPorts:
        - ports: [{ port: "10443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: immich
            app.kubernetes.io/name: server
      toPorts:
        - ports: [{ port: "2283", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: keycloak
            app.kubernetes.io/name: keycloak
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: grafana
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: miniflux
            app.kubernetes.io/name: miniflux
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: proxies-wg
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: wg
  ingress:
    - fromCIDR: [10.0.0.0/24]
      toPorts:
        - ports:
            - { port: "10080", protocol: TCP }
            - { port: "10443", protocol: TCP }
    - fromEntities: [host]
      toPorts:
        - ports:
            - { port: "10080", protocol: TCP }
            - { port: "10443", protocol: TCP }
    # in-cluster registry.skinke.net clients via CoreDNS split-horizon (Argo CD's Helm charts)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-repo-server
      toPorts:
        - ports: [{ port: "10443", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: telemetry
            app.kubernetes.io/name: alloy
            app.kubernetes.io/instance: alloy-metrics
      toPorts:
        - ports: [{ port: "19001", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: gateway-helm
      toPorts:
        - ports: [{ port: "18000", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: edge
      toPorts:
        - ports: [{ port: "10443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argo
            app.kubernetes.io/name: argo-workflows-server
      toPorts:
        - ports: [{ port: "2746", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            app.kubernetes.io/name: argocd-server
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: alerta
            app.kubernetes.io/name: alerta
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: keycloak
            app.kubernetes.io/name: keycloak
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: zot
            app.kubernetes.io/name: zot
      toPorts:
        - ports: [{ port: "5000", protocol: TCP }]
