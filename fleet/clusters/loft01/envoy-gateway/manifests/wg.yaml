apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: wg
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: shutdown-manager
                      resources:
                        limits: { memory: 64Mi }
      envoyService:
        type: ClusterIP
        patch:
          type: StrategicMerge
          value:
            spec:
              externalIPs: ["10.0.0.1"]
              ports:
                - name: http-80
                  port: 80
                - name: https-443
                  port: 443
                  protocol: TCP
                  targetPort: 10443
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: wg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: wg
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: wg
spec:
  gatewayClassName: wg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
  allowedListeners:
    namespaces:
      from: All
---
# Stable in-cluster Service name for the wg proxy, which CoreDNS answers registry.skinke.net with (Envoy Gateway's own Service name includes a hash).
apiVersion: v1
kind: Service
metadata:
  name: wg
spec:
  selector:
    app.kubernetes.io/name: envoy
    gateway.envoyproxy.io/owning-gateway-name: wg
  ports:
    - name: https
      port: 443
      targetPort: 10443
