# OpenBao path loft01/ntfy: leier_password logs the phone in; alertmanager_token is Alertmanager's
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ntfy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: leier_password
        remoteRef: { remoteKey: loft01/ntfy, property: leier_password }
    - match:
        secretKey: alertmanager_password
        remoteRef: { remoteKey: loft01/ntfy, property: alertmanager_password }
    - match:
        secretKey: alertmanager_token
        remoteRef: { remoteKey: loft01/ntfy, property: alertmanager_token }
---
# bcrypt salts differ on every render, so only re-render when this spec changes
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: ntfy
    template:
      engineVersion: v2
      data:
        auth-users: 'leier:{{ .leier_password | bcrypt }}:user,alertmanager:{{ .alertmanager_password | bcrypt }}:user'
        auth-tokens: 'alertmanager:tk_{{ .alertmanager_token }}:Alertmanager'
  data:
    - secretKey: leier_password
      remoteRef: { key: loft01/ntfy, property: leier_password }
    - secretKey: alertmanager_password
      remoteRef: { key: loft01/ntfy, property: alertmanager_password }
    - secretKey: alertmanager_token
      remoteRef: { key: loft01/ntfy, property: alertmanager_token }
