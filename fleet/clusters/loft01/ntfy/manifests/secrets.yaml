# OpenBao path loft01/ntfy: Alertmanager's publish-only account, and the Web Push (VAPID) keys from `ntfy webpush keys`
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ntfy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: alertmanager_password
        remoteRef: { remoteKey: loft01/ntfy, property: alertmanager_password }
    - match:
        secretKey: alertmanager_token
        remoteRef: { remoteKey: loft01/ntfy, property: alertmanager_token }
---
# bcrypt salts differ on every render, so only re-render when this spec changes
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: ntfy
    template:
      engineVersion: v2
      data:
        auth-users: 'alertmanager:{{ .alertmanager_password | bcrypt }}:user'
        auth-tokens: 'alertmanager:tk_{{ .alertmanager_token }}:Alertmanager'
        web-push-public-key: '{{ .web_push_public_key }}'
        web-push-private-key: '{{ .web_push_private_key }}'
  data:
    - secretKey: alertmanager_password
      remoteRef: { key: loft01/ntfy, property: alertmanager_password }
    - secretKey: alertmanager_token
      remoteRef: { key: loft01/ntfy, property: alertmanager_token }
    - secretKey: web_push_public_key
      remoteRef: { key: loft01/ntfy, property: web_push_public_key }
    - secretKey: web_push_private_key
      remoteRef: { key: loft01/ntfy, property: web_push_private_key }
