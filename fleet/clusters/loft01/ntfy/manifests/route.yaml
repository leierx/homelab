apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ntfy
spec:
  secretName: ntfy-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - ntfy.skinke.net
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: ntfy-edge
spec:
  parentRef:
    name: edge
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: ntfy.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: ntfy-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy-edge
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: ntfy-edge
  hostnames:
    - ntfy.skinke.net
  rules:
    - backendRefs:
        - name: ntfy
          port: 8080
      # the phone app holds one subscription open
      timeouts:
        request: 0s
---
# the phone app can't get through Envoy's OIDC login; ntfy denies everyone but its two users
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ntfy-edge
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: ntfy-edge
  authorization:
    defaultAction: Allow
