apiVersion: v1
kind: Secret
metadata:
  name: loft01
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    fleet.io/enabled: "true"
    # pull OCI Helm charts through Harbor (fleet/templates/_helpers.tpl fleet.helmRepoURL)
    fleet.io/oci-mirror: registry.skinke.net
    fleet.io/admission.enable: "true"
    fleet.io/alerta.enable: "true"
    fleet.io/alloy-logs.enable: "true"
    fleet.io/alloy-metrics.enable: "true"
    fleet.io/argo-workflows.enable: "true"
    fleet.io/argocd.enable: "true"
    fleet.io/capi-argo-bridge.enable: "true"
    fleet.io/cdi.enable: "true"
    fleet.io/cert-manager.enable: "true"
    fleet.io/cilium.enable: "true"
    fleet.io/cloudnative-pg.enable: "true"
    fleet.io/cluster-api.enable: "true"
    fleet.io/dodde.enable: "true"
    fleet.io/envoy-gateway.enable: "true"
    fleet.io/external-secrets.enable: "true"
    fleet.io/grafana.enable: "true"
    fleet.io/harbor.enable: "true"
    fleet.io/immich.enable: "true"
    fleet.io/keycloak.enable: "true"
    fleet.io/kube-state-metrics.enable: "true"
    fleet.io/kubevirt.enable: "true"
    fleet.io/loki.enable: "true"
    fleet.io/mimir.enable: "true"
    fleet.io/miniflux.enable: "true"
    fleet.io/node-exporter.enable: "true"
    fleet.io/openbao.enable: "true"
    fleet.io/prometheus-operator-crds.enable: "true"
    fleet.io/rbac.enable: "true"
    fleet.io/renovate.enable: "true"
    fleet.io/smartctl-exporter.enable: "true"
    fleet.io/zfs-localpv.enable: "true"
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    fleet.io/repo-url: "https://github.com/leierx/homelab.git"
    fleet.io/target-revision: "HEAD"
type: Opaque
stringData:
  name: loft01
  server: https://kubernetes.default.svc
  config: |
    {"tlsClientConfig":{"insecure":false}}
