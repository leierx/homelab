# OpenBao path loft01/gotify: the token of the Gotify application everything is sent through, created there by hand
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apprise
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: apprise
  data:
    - secretKey: gotify-token
      remoteRef: { key: loft01/gotify, property: alertmanager_token }
