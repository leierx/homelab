# set by hand in Gotify (docs/monitoring.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apprise
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: apprise
  data:
    - secretKey: gotify-token
      remoteRef: {key: loft01/gotify, property: apprise_token}
