# ESO regenerates the password on each refresh; CNPG applies it because the Secret carries cnpg.io/reload
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: openbao-db-password
spec:
  length: 64
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-db-rotation
spec:
  refreshInterval: 720h
  target:
    name: openbao-db-app
    creationPolicy: Merge
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        password: '{{ .password }}'
        pgpass: 'openbao-db-rw:5432:openbao:openbao:{{ .password }}'
        uri: 'postgresql://openbao:{{ .password }}@openbao-db-rw.openbao:5432/openbao'
        fqdn-uri: 'postgresql://openbao:{{ .password }}@openbao-db-rw.openbao.svc.cluster.local:5432/openbao'
        jdbc-uri: 'jdbc:postgresql://openbao-db-rw.openbao:5432/openbao?password={{ .password }}&user=openbao'
        fqdn-jdbc-uri: 'jdbc:postgresql://openbao-db-rw.openbao.svc.cluster.local:5432/openbao?password={{ .password }}&user=openbao'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: openbao-db-password
