apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: romm
spec:
  secretName: romm-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - romm.skinke.net
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: romm-edge
spec:
  parentRef:
    name: edge
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: romm.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: romm-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: romm-edge
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: romm-edge
  hostnames:
    - romm.skinke.net
  rules:
    - backendRefs:
        - name: romm
          port: 8080
      # no 15 s cap (Envoy's default) on ROM downloads, uploads, or WebSocket sessions
      timeouts:
        request: 0s
