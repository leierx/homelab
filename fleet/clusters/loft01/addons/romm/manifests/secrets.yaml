# OpenBao path loft01/romm
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: romm
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: auth_secret_key
        remoteRef: { remoteKey: loft01/romm, property: auth_secret_key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: romm
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: "loft01/romm"
        property: oidc_client_secret
    - secretKey: auth-secret-key
      remoteRef:
        key: "loft01/romm"
        property: auth_secret_key
