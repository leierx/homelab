# OpenBao path loft01/gotify
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: gotify
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: app_token
        remoteRef: { remoteKey: loft01/gotify, property: app_token }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gotify
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: gotify
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: "loft01/gotify"
        property: oidc_client_secret
    - secretKey: app-token
      remoteRef:
        key: "loft01/gotify"
        property: app_token
