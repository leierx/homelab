# the master realm's service client: what Keycloak bootstraps and the reconcile workflow logs in with
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: keycloak-bootstrap-admin
    template:
      engineVersion: v2
      data:
        client-id: bootstrap-admin
        client-secret: '{{ .admin_client_secret }}'
  data:
    - secretKey: admin_client_secret
      remoteRef: { key: "loft01/keycloak", property: admin_client_secret }
---
# what the reconcile CronWorkflow reads: TF_VAR_… for the cluster's OpenTofu root, so write-only values never enter state
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-tofu
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: keycloak-tofu
  data:
    - secretKey: TF_VAR_keycloak_client_secret
      remoteRef: { key: "loft01/keycloak", property: admin_client_secret }
    - secretKey: TF_VAR_leier_password
      remoteRef: { key: "loft01/keycloak", property: leier_password }
    - secretKey: TF_VAR_argocd_client_secret
      remoteRef: { key: "loft01/argocd", property: oidc_client_secret }
    - secretKey: TF_VAR_grafana_client_secret
      remoteRef: { key: "loft01/grafana", property: oidc_client_secret }
    - secretKey: TF_VAR_immich_client_secret
      remoteRef: { key: "loft01/immich", property: oidc_client_secret }
    - secretKey: TF_VAR_alerta_client_secret
      remoteRef: { key: "loft01/alerta", property: oidc_client_secret }
    - secretKey: TF_VAR_edge_client_secret
      remoteRef: { key: "loft01/edge", property: oidc_client_secret }
    - secretKey: TF_VAR_argo_workflows_client_secret
      remoteRef: { key: "loft01/argo-workflows", property: oidc_client_secret }
    - secretKey: TF_VAR_romm_client_secret
      remoteRef: { key: "loft01/romm", property: oidc_client_secret }
    - secretKey: TF_VAR_miniflux_client_secret
      remoteRef: { key: "loft01/miniflux", property: oidc_client_secret }

