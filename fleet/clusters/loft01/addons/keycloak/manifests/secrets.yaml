# OpenBao paths loft01/<app>: generated once (PushSecret, IfNotExists), then read back
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: admin_client_secret
        remoteRef: { remoteKey: loft01/keycloak, property: admin_client_secret }
    - match:
        secretKey: leier_password
        remoteRef: { remoteKey: loft01/keycloak, property: leier_password }
---
