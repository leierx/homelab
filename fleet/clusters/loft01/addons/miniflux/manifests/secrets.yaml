# OpenBao path loft01/miniflux
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: miniflux
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: "loft01/miniflux"
        property: oidc_client_secret
