# OpenBao path loft01/alerta
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: alerta
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: secret_key
        remoteRef: { remoteKey: loft01/alerta, property: secret_key }
    - match:
        secretKey: housekeeping_api_key
        remoteRef: { remoteKey: loft01/alerta, property: housekeeping_api_key }
    - match:
        secretKey: grafana_api_key
        remoteRef: { remoteKey: loft01/alerta, property: grafana_api_key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alerta
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: alerta
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: "loft01/alerta"
        property: oidc_client_secret
    - secretKey: secret-key
      remoteRef:
        key: "loft01/alerta"
        property: secret_key
    - secretKey: housekeeping-api-key
      remoteRef:
        key: "loft01/alerta"
        property: housekeeping_api_key
    - secretKey: grafana-api-key
      remoteRef:
        key: "loft01/alerta"
        property: grafana_api_key
