# OpenBao path loft01/argo-workflows
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: argo-workflows-sso
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: argo-workflows-sso
  data:
    - match:
        secretKey: oidc_client_secret
        remoteRef: { remoteKey: loft01/argo-workflows, property: oidc_client_secret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-server-sso
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: argo-server-sso
    template:
      engineVersion: v2
      data:
        client-id: argo-workflows
        client-secret: '{{ .oidc_client_secret }}'
  data:
    - secretKey: oidc_client_secret
      remoteRef: { key: loft01/argo-workflows, property: oidc_client_secret }
