# OpenBao paths loft01/grafana and loft01/edge
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: grafana
    template:
      mergePolicy: Merge
      data:
        admin-user: admin
  data:
    - secretKey: admin-password
      remoteRef:
        key: "loft01/grafana"
        property: admin_password
    - secretKey: oidc-client-secret
      remoteRef:
        key: "loft01/grafana"
        property: oidc_client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: edge-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: edge-oidc
  data:
    - secretKey: client-secret
      remoteRef: { key: "loft01/edge", property: oidc_client_secret }
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: admin_password
        remoteRef: { remoteKey: loft01/grafana, property: admin_password }
