# zfs: ext4 zvols, for databases and anything that needs a normal filesystem (default)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: zfs.csi.openebs.io
parameters:
  poolname: tank
  fstype: ext4
allowVolumeExpansion: true
# a deleted claim must not take the data with it: the zvol stays until removed by hand
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
# zfs-thin: ZFS filesystems with 1M records, for bulk files; never databases.
# A ZFS filesystem per PVC: the size is a refquota (snapshots don't count),
# thin-provisioned so the quota is a limit and not space held in the pool.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs-thin
provisioner: zfs.csi.openebs.io
parameters:
  poolname: tank
  fstype: zfs
  recordsize: 1M
  quotatype: refquota
  thinprovision: "yes"
allowVolumeExpansion: true
# a deleted claim must not take the data with it: the dataset stays until removed by hand
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
