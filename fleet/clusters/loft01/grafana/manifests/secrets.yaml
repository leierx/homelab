# logs in to OpenBao as the monitoring namespace's openbao-client, which the alertmanager addon (a dependency) ships
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana
    template:
      mergePolicy: Merge
      data:
        admin-user: admin
  data:
    - secretKey: admin-password
      remoteRef:
        key: homelab/monitoring/grafana
        property: admin_password
    - secretKey: oidc-client-secret
      remoteRef:
        key: homelab/keycloak/for/monitoring/grafana
        property: oidc_client_secret
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: admin_password
        remoteRef: {remoteKey: homelab/monitoring/grafana, property: admin_password}
