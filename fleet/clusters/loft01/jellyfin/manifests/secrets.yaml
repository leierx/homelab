# oidc_client_secret and sync_client_secret come from the keycloak addon
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: jellyfin
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: admin_password
        remoteRef: {remoteKey: loft01/jellyfin, property: admin_password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: jellyfin
  data:
    - secretKey: admin-password
      remoteRef: {key: loft01/jellyfin, property: admin_password}
    - secretKey: oidc-client-secret
      remoteRef: {key: loft01/jellyfin, property: oidc_client_secret}
    - secretKey: sync-client-secret
      remoteRef: {key: loft01/jellyfin, property: sync_client_secret}
