# OpenBao path loft01/zot
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: zot-session-hash
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: session_hash_key
        remoteRef: { remoteKey: loft01/zot, property: session_hash_key }
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: zot-session-encrypt
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: encrypt-key
  data:
    - match:
        secretKey: session_encrypt_key
        remoteRef: { remoteKey: loft01/zot, property: session_encrypt_key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: zot-config
    template:
      engineVersion: v2
      data:
        openid.json: |
          {
            "clientid": "zot",
            "clientsecret": {{ .oidc_client_secret | toJson }}
          }
        session-keys.json: |
          {
            "hashKey": {{ .session_hash_key | toJson }},
            "encryptKey": {{ .session_encrypt_key | toJson }}
          }
        config.json: |
          {
            "distSpecVersion": "1.1.1",
            "storage": {
              "rootDirectory": "/var/lib/registry",
              "dedupe": true,
              "gc": true,
              "gcDelay": "2h",
              "gcInterval": "1h",
              "retention": {
                "dryRun": false,
                "delay": "24h",
                "policies": [
                  {
                    "repositories": ["**"],
                    "deleteReferrers": true,
                    "deleteUntagged": true,
                    "keepTags": [
                      {
                        "mostRecentlyPulledCount": 4,
                        "mostRecentlyPushedCount": 4
                      }
                    ],
                    "keepUntagged": {
                      "mostRecentlyPulledCount": 4,
                      "mostRecentlyPushedCount": 4
                    }
                  }
                ]
              }
            },
            "http": {
              "address": "0.0.0.0",
              "port": "5000",
              "externalUrl": "https://registry.skinke.net",
              "realm": "zot",
              "compat": ["docker2s2"],
              "readTimeout": "30m",
              "writeTimeout": "30m",
              "auth": {
                "failDelay": 5,
                "secureSession": true,
                "sessionKeysFile": "/etc/zot/session-keys.json",
                "openid": {
                  "providers": {
                    "oidc": {
                      "name": "Keycloak",
                      "issuer": "https://auth.skinke.net/realms/homelab",
                      "credentialsFile": "/etc/zot/openid.json",
                      "scopes": ["openid", "profile", "email", "groups"],
                      "claimMapping": {
                        "username": "preferred_username",
                        "groups": "groups"
                      }
                    }
                  }
                }
              },
              "accessControl": {
                "metrics": {
                  "anonymousPolicy": ["read"]
                },
                "repositories": {
                  "**": {
                    "anonymousPolicy": ["read"],
                    "policies": [
                      {
                        "groups": ["homelab-viewers"],
                        "actions": ["read"]
                      },
                      {
                        "groups": ["homelab-operators"],
                        "actions": ["read", "create", "update"]
                      }
                    ]
                  }
                },
                "adminPolicy": {
                  "groups": ["homelab-admins"],
                  "actions": ["read", "create", "update", "delete"]
                }
              }
            },
            "log": {
              "level": "info"
            },
            "extensions": {
              "metrics": {
                "enable": true,
                "prometheus": {
                  "path": "/metrics"
                }
              },
              "search": {
                "enable": true,
                "cve": {
                  "updateInterval": "12h",
                  "trivy": {
                    "dbRepository": "ghcr.io/aquasecurity/trivy-db",
                    "javaDBRepository": "ghcr.io/aquasecurity/trivy-java-db"
                  }
                }
              },
              "ui": {
                "enable": true
              },
              "scrub": {
                "enable": true,
                "interval": "24h"
              },
              "sync": {
                "enable": true,
                "registries": [
                  {
                    "urls": ["https://index.docker.io"],
                    "onDemand": true,
                    "stream": true,
                    "tlsVerify": true,
                    "manifestCheckInterval": "15m",
                    "content": [
                      {
                        "prefix": "**",
                        "destination": "/docker.io"
                      }
                    ]
                  },
                  {
                    "urls": ["https://ghcr.io"],
                    "onDemand": true,
                    "stream": true,
                    "tlsVerify": true,
                    "manifestCheckInterval": "15m",
                    "content": [
                      {
                        "prefix": "**",
                        "destination": "/ghcr.io"
                      }
                    ]
                  },
                  {
                    "urls": ["https://quay.io"],
                    "onDemand": true,
                    "stream": true,
                    "tlsVerify": true,
                    "manifestCheckInterval": "15m",
                    "content": [
                      {
                        "prefix": "**",
                        "destination": "/quay.io"
                      }
                    ]
                  },
                  {
                    "urls": ["https://registry.k8s.io"],
                    "onDemand": true,
                    "stream": true,
                    "tlsVerify": true,
                    "manifestCheckInterval": "15m",
                    "content": [
                      {
                        "prefix": "**",
                        "destination": "/registry.k8s.io"
                      }
                    ]
                  },
                  {
                    "urls": ["https://public.ecr.aws"],
                    "onDemand": true,
                    "stream": true,
                    "tlsVerify": true,
                    "manifestCheckInterval": "15m",
                    "content": [
                      {
                        "prefix": "**",
                        "destination": "/ecr-public.aws.com"
                      }
                    ]
                  }
                ]
              }
            }
          }
  data:
    - secretKey: oidc_client_secret
      remoteRef: { key: loft01/zot, property: oidc_client_secret }
    - secretKey: session_hash_key
      remoteRef: { key: loft01/zot, property: session_hash_key }
    - secretKey: session_encrypt_key
      remoteRef: { key: loft01/zot, property: session_encrypt_key }
