apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zot
spec:
  secretName: zot-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - registry.skinke.net
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: zot-wg
spec:
  parentRef:
    name: wg
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: registry.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: zot-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zot-wg
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: zot-wg
  hostnames:
    - registry.skinke.net
  rules:
    - backendRefs:
        - name: zot
          port: 5000
      # large layer pulls and streaming syncs can exceed the gateway-wide 300 s cap
      timeouts:
        request: 0s
---
# containerd and OCI CLI clients cannot complete Envoy's browser OIDC redirect; Zot's own OIDC and ACLs guard it
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: zot-wg
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: zot-wg
  authorization:
    defaultAction: Allow
