# Not optional: the kubelet's resolv-conf (nixos/k3s.nix) points CoreDNS at 127.0.0.53, which only
# upstream.server answers. Without this ConfigMap CoreDNS forwards to itself and its loop plugin stops it,
# so a fresh cluster applies it in bootstrap step 1 (fleet/README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # skinke.net resolves to the edge Envoy so OIDC clients and HTTP-01 self-checks stay in-cluster.
  # bind 0.0.0.0, not eth0: CoreDNS refuses a wildcard next to 127.0.0.53, and eth0's IPv6
  # link-local isn't bindable yet when the pod starts.
  split-horizon.override: |
    bind 0.0.0.0
    rewrite name regex \.skinke\.net(\..*\.cluster\.local)?\.$ edge.envoy-gateway-system.svc.cluster.local. answer auto
  # Quad9 over DNS-over-TLS; Quad9 validates DNSSEC. The host's resolved can't serve pods over UDP:
  # it pins replies to the ingress interface, cilium_net, which doesn't route back to pods.
  upstream.server: |
    .:53 {
      bind 127.0.0.53
      forward . tls://9.9.9.9 tls://149.112.112.112 {
        tls_servername dns.quad9.net
      }
      cache 30
    }
