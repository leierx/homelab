apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor
spec:
  secretName: harbor-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - registry.skinke.net
---
# the chart's HTTPRoute (expose.type route) attaches here
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: harbor-wg
spec:
  parentRef:
    name: wg
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: registry.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: harbor-tls
---
# containerd and OCI clients cannot complete Envoy's browser OIDC redirect; Harbor's own OIDC login and project permissions guard it
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: harbor-wg
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: harbor-wg
  authorization:
    defaultAction: Allow
---
# large layer pulls through the proxy cache can exceed the gateway-wide 300 s cap
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: harbor-route
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: harbor-route
  timeout:
    http:
      requestTimeout: 0s
