# OpenBao path loft01/harbor; the OIDC client secret next to these comes from the keycloak addon
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: harbor-random16
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random16
  data:
    - match:
        secretKey: secret_key
        remoteRef: { remoteKey: loft01/harbor, property: secret_key }
    - match:
        secretKey: core_secret
        remoteRef: { remoteKey: loft01/harbor, property: core_secret }
    - match:
        secretKey: jobservice_secret
        remoteRef: { remoteKey: loft01/harbor, property: jobservice_secret }
    - match:
        secretKey: registry_http_secret
        remoteRef: { remoteKey: loft01/harbor, property: registry_http_secret }
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: harbor-random32
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random32
  data:
    - match:
        secretKey: csrf_key
        remoteRef: { remoteKey: loft01/harbor, property: csrf_key }
    - match:
        secretKey: admin_password
        remoteRef: { remoteKey: loft01/harbor, property: admin_password }
    - match:
        secretKey: registry_password
        remoteRef: { remoteKey: loft01/harbor, property: registry_password }
---
# key names are the ones the chart reads (fleet/addons/harbor/values.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: harbor
  data:
    - secretKey: secretKey
      remoteRef: { key: loft01/harbor, property: secret_key }
    - secretKey: secret
      remoteRef: { key: loft01/harbor, property: core_secret }
    - secretKey: JOBSERVICE_SECRET
      remoteRef: { key: loft01/harbor, property: jobservice_secret }
    - secretKey: REGISTRY_HTTP_SECRET
      remoteRef: { key: loft01/harbor, property: registry_http_secret }
    - secretKey: CSRF_KEY
      remoteRef: { key: loft01/harbor, property: csrf_key }
    - secretKey: HARBOR_ADMIN_PASSWORD
      remoteRef: { key: loft01/harbor, property: admin_password }
---
# core logs in to the registry with this password; OnChange, so the bcrypt salt isn't redrawn every refresh
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: harbor-registry-credentials
    template:
      engineVersion: v2
      data:
        REGISTRY_PASSWD: "{{ .registry_password }}"
        REGISTRY_HTPASSWD: '{{ htpasswd "harbor_registry_user" .registry_password "bcrypt" }}'
  data:
    - secretKey: registry_password
      remoteRef: { key: loft01/harbor, property: registry_password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-tofu
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: harbor-tofu
  data:
    - secretKey: TF_VAR_admin_password
      remoteRef: { key: loft01/harbor, property: admin_password }
    - secretKey: TF_VAR_oidc_client_secret
      remoteRef: { key: loft01/harbor, property: oidc_client_secret }
