# oidc_client_secret comes from the keycloak addon
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: paperless
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: fleet-secrets-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: secret_key
        remoteRef: {remoteKey: loft01/paperless, property: secret_key}
    - match:
        secretKey: admin_password
        remoteRef: {remoteKey: loft01/paperless, property: admin_password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: paperless
    template:
      engineVersion: v2
      data:
        secret-key: '{{ .secret_key }}'
        admin-password: '{{ .admin_password }}'
        socialaccount-providers: |
          {"openid_connect": {"APPS": [{
            "provider_id": "keycloak",
            "name": "Keycloak",
            "client_id": "paperless",
            "secret": {{ .oidc_client_secret | toJson }},
            "settings": {
              "server_url": "https://auth.skinke.net/realms/homelab",
              "token_auth_method": "client_secret_basic",
              "oauth_pkce_enabled": true
            }
          }]}}
  data:
    - secretKey: secret_key
      remoteRef: {key: loft01/paperless, property: secret_key}
    - secretKey: admin_password
      remoteRef: {key: loft01/paperless, property: admin_password}
    - secretKey: oidc_client_secret
      remoteRef: {key: loft01/paperless, property: oidc_client_secret}
