apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: paperless
spec:
  secretName: paperless-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - paperless.skinke.net
---
# WireGuard only, behind Envoy's OIDC login as well as Paperless's own: it holds personal documents
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: paperless-wg
spec:
  parentRef:
    name: wg
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: paperless.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: paperless-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperless-wg
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: paperless-wg
  hostnames:
    - paperless.skinke.net
  rules:
    - backendRefs:
        - name: paperless
          port: 8000
