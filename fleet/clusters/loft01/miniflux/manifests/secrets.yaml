apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: miniflux
  data:
    - secretKey: oidc-client-secret
      remoteRef:
        key: homelab/keycloak/for/miniflux/miniflux
        property: oidc_client_secret
---
# ESO logs in to OpenBao as this namespace's openbao-client (ClusterSecretStores openbao, openbao-push)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-client
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
