# set by hand (docs/README.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: renovate-github-app
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef: {key: homelab/renovate/renovate, property: app_id}
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef: {key: homelab/renovate/renovate, property: installation_id}
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef: {key: homelab/renovate/renovate, property: private_key}
---
# ESO logs in to OpenBao as this namespace's openbao-client (ClusterSecretStores openbao, openbao-push)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-client
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
