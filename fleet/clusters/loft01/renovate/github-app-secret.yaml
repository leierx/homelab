# OpenBao path loft01/renovate: the GitHub App's id, installation id and private key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fleet-secrets
  target:
    name: renovate-github-app
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef: { key: "loft01/renovate", property: app_id }
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef: { key: "loft01/renovate", property: installation_id }
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef: { key: "loft01/renovate", property: private_key }
