# The management cluster: the one Argo CD runs in. Registered exactly like any
# other cluster so ApplicationSets can target it by labels.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-mgmt
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    # --- identity (required) ---
    fleet/environment: prod
    fleet/role: management
    fleet/region: home # TODO(fleet): set the real site/region name
    # --- capabilities (what the cluster can offer) ---
    capability.fleet/loadbalancer: "true"
    # --- opt-in addons ---
    addon.fleet/external-secrets: enabled
  annotations:
    fleet/description: Management cluster running Argo CD
type: Opaque
stringData:
  name: mgmt
  server: https://kubernetes.default.svc
  config: |
    {"tlsClientConfig":{"insecure":false}}
