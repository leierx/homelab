apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - database.yaml
  - network-policy.yaml
replacements:
  # one vchord version: the Database's extension version also picks the extension image tag
  - source:
      group: postgresql.cnpg.io
      kind: Database
      name: immich
      fieldPath: spec.extensions.[name=vchord].version
    targets:
      - select:
          group: postgresql.cnpg.io
          kind: Cluster
          name: immich-db
        fieldPaths:
          - spec.postgresql.extensions.[name=vchord].image.reference
        options:
          delimiter: "-v"
          index: 1
