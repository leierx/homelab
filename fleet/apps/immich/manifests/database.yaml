apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  instances: 1
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  postgresql:
    shared_preload_libraries: [vchord]
    # pgvector comes with the standard image; VectorChord is mounted from TensorChord's image
    extensions:
      - name: vchord
        image:
          # the version after `-v` is copied from the Database's vchord version (kustomization.yaml replacements)
          reference: ghcr.io/tensorchord/vchord-scratch:pg18-v0.0.0
        # the image holds a Debian package's tree, not the /lib and /share layout CloudNativePG assumes
        dynamic_library_path: [/usr/lib/postgresql/18/lib]
        extension_control_path: [/usr/share/postgresql/18]
  bootstrap:
    initdb:
      database: immich
      owner: immich
  # size and class per cluster (cluster/<name>/)
  storage:
    size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }
---
# extensions are created by the operator as postgres, so the immich role needs no superuser
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  cluster:
    name: immich-db
  name: immich
  owner: immich
  extensions:
    - name: vector
    # a bump updates it here (ALTER EXTENSION … UPDATE TO); Immich can't, without superuser
    - name: vchord
      # renovate: datasource=docker depName=ghcr.io/tensorchord/vchord-scratch extractVersion=^pg18-v(?<version>\d+\.\d+\.\d+)$
      version: "1.1.1"
    - name: cube
    - name: earthdistance
    - name: pg_trgm
    - name: unaccent
    - name: uuid-ossp
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: immich-db
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: immich-db
  podMetricsEndpoints:
    - port: metrics
