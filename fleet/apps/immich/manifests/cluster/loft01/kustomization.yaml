apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - config.yaml
  - route.yaml
  - storage.yaml
patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
      name: immich-db
    patch: |
      - op: replace
        path: /spec/storage
        value:
          storageClass: zfs
          size: 20Gi
