# Immich photo library. Opt-in: clusters labelled app.fleet/immich=enabled.
app:
  enablement: opt-in
  namespace: immich
  podSecurity: restricted
  # Keep repoURL -> name -> version in this order; Renovate parses it. OCI: no scheme.
  chart:
    repoURL: ghcr.io/immich-app/immich-charts
    name: immich
    version: 0.13.4
  # database, storage, config, routes, network policies
  manifests: true
