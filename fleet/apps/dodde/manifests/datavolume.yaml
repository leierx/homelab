apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: fedora-root
  namespace: dodde
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    # import without waiting for the VM, whose CRD comes from another app; otherwise a failed VM leaves the sync waiting on this forever
    cdi.kubevirt.io/storage.bind.immediate.requested: "true"
spec:
  source:
    http:
      url: https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2
      checksum: sha256:28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f
  storage:
    storageClassName: zfs
    accessModes: [ReadWriteOnce]
    volumeMode: Block
    resources:
      requests:
        storage: 200Gi
