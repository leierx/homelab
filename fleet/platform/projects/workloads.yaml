apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: User applications (fleet/apps). Namespaced resources only, never in platform namespaces.
  # Every upstream chart repository used by fleet/apps must be listed here.
  sourceRepos:
    - https://github.com/leierx/homelab
    # OCI Helm repositories (no scheme)
    - ghcr.io/immich-app/immich-charts
  # Anywhere except the platform's namespaces (keep in sync when an addon gets a new namespace).
  destinations:
    - server: "*"
      namespace: "!kube-*"
    - server: "*"
      namespace: "!argo"
    - server: "*"
      namespace: "!argocd"
    - server: "*"
      namespace: "!capi-*"
    - server: "*"
      namespace: "!cdi"
    - server: "*"
      namespace: "!cert-manager"
    - server: "*"
      namespace: "!cnpg-system"
    - server: "*"
      namespace: "!envoy-gateway-system"
    - server: "*"
      namespace: "!external-secrets"
    - server: "*"
      namespace: "!keycloak"
    - server: "*"
      namespace: "!kubeadm-*"
    - server: "*"
      namespace: "!kubevirt"
    - server: "*"
      namespace: "!kubevirt-infrastructure-system"
    - server: "*"
      namespace: "!monitoring"
    - server: "*"
      namespace: "!openbao"
    - server: "*"
      namespace: "!openebs"
    - server: "*"
      namespace: "!renovate"
    - server: "*"
      namespace: "!telemetry"
    - server: "*"
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: argoproj.io
      kind: "*"
    - group: external-secrets.io
      kind: SecretStore
