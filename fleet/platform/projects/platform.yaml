apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Cluster addons (fleet/addons). Cluster-admin scope, but cannot mint new Argo CD apps or projects.
  # Every upstream chart repository used by fleet/addons must be listed here.
  sourceRepos:
    - https://github.com/leierx/homelab
    - https://argoproj.github.io/argo-helm
    - https://charts.external-secrets.io
    - https://charts.jetstack.io
    - https://cloudnative-pg.github.io/charts
    - https://docs.renovatebot.com/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://helm.cilium.io
    - https://kubernetes-sigs.github.io/cluster-api-operator
    - https://openbao.github.io/openbao-helm
    - https://openebs.github.io/zfs-localpv
    - https://prometheus-community.github.io/helm-charts
    # OCI Helm repositories (no scheme)
    - docker.io/envoyproxy
  destinations:
    - server: "*"
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceBlacklist:
    - group: argoproj.io
      kind: AppProject
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: ApplicationSet
  orphanedResources:
    warn: false
