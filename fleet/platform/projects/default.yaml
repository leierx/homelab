# Argo CD always creates the `default` project. Lock it down so nothing can
# deploy through it by accident; every Application must pick a real project.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Intentionally empty. Use fleet, platform or workloads.
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
  namespaceResourceWhitelist: []
