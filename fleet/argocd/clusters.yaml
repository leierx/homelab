# One Application per clusters/<cluster>/ folder, named <cluster>: the fleet chart (fleet/) with
# that folder's values.yaml, rendering one <cluster>-<addon> Application per addon it lists.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: clusters
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # a hand-edited syncPolicy (e.g. auto-sync turned off to pause) stays until changed back
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - git:
        repoURL: https://github.com/leierx/homelab
        revision: HEAD
        directories:
          - path: fleet/clusters/*
  template:
    metadata:
      name: '{{ .path.basename }}'
      labels:
        fleet/cluster: '{{ .path.basename }}'
    spec:
      project: default
      # the Applications it renders live in Argo CD's namespace, whichever cluster they deploy to
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/leierx/homelab
        targetRevision: HEAD
        path: fleet
        helm:
          valueFiles:
            - clusters/{{ .path.basename }}/values.yaml
          valuesObject:
            cluster: '{{ .path.basename }}'
      # same for the <cluster>-<addon> Applications: pause one by hand without the chart undoing it
      ignoreDifferences:
        - group: argoproj.io
          kind: Application
          jsonPointers:
            - /spec/syncPolicy
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
