# Level 1: one Application per cluster folder (gitops/clusters/<cluster>/cluster.yaml).
#
# Each Application `cluster-<cluster>`:
#   1. deploys the cluster's two ApplicationSets from gitops/bootstrap/cluster/, named
#      <cluster>-addons and <cluster>-addons-ordered, with the cluster's data patched in, and
#   2. syncs the cluster's registration (cluster-secret.yaml), if the folder has one.
#
# The cluster's groups are the union of `groups:` in its cluster.yaml (in that order) and every
# group in gitops/groups.yaml that lists it under `clusters:` (alphabetically, after those).
#
# Deleting a cluster folder deletes `cluster-<cluster>`, its ApplicationSets, their Applications and
# the registration. Generated Applications carry no finalizer, so nothing on the cluster is touched.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fleet
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # First, so `values` renders against groups.yaml alone; its keys are the group names.
          - git:
              repoURL: https://github.com/leierx/homelab.git
              revision: main
              pathParamPrefix: groupsFile
              files:
                - path: gitops/groups.yaml
              values:
                groups: '{{ omit . "groupsFile" | toJson }}'
          - git:
              repoURL: https://github.com/leierx/homelab.git
              revision: main
              files:
                - path: gitops/clusters/*/cluster.yaml
                - path: gitops/clusters/*/*/cluster.yaml
                  exclude: true
  template:
    metadata:
      name: 'cluster-{{ .path.basename }}'
    spec:
      project: fleet
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      sources:
        - repoURL: https://github.com/leierx/homelab.git
          targetRevision: main
          path: gitops/bootstrap/cluster
          kustomize:
            namePrefix: '{{ .path.basename }}-'
            patches:
              - target:
                  kind: ApplicationSet
                patch: |-
                  {{- $cluster := .path.basename }}
                  {{- $defs := fromYaml .values.groups }}
                  {{- $groups := dig "groups" (list) . }}
                  {{- range $g, $def := $defs }}
                  {{-   if and (has $cluster (dig "clusters" (list) $def)) (not (has $g $groups)) }}{{ $groups = append $groups $g }}{{ end }}
                  {{- end }}
                  {{- $groupAddons := dict }}
                  {{- range $groups }}
                  {{-   range $a, $on := dig "addons" (dict) (get $defs . | default dict) }}{{ $_ := set $groupAddons $a $on }}{{ end }}
                  {{- end }}
                  {{- $element := dict
                        "cluster" $cluster
                        "clusterGroups" $groups
                        "groupAddons" $groupAddons
                        "clusterAddons" (dig "addons" (dict) .)
                        "repoURL" "https://github.com/leierx/homelab.git"
                        "revision" "main"
                      | toJson }}
                  - op: replace
                    path: /spec/generators/0/matrix/generators/0/matrix/generators/0/list/elements/0
                    value: {{ $element }}
                  - op: replace
                    path: /spec/generators/1/matrix/generators/0/matrix/generators/0/list/elements/0
                    value: {{ $element }}
        - repoURL: https://github.com/leierx/homelab.git
          targetRevision: main
          path: '{{ .path.path }}'
          directory:
            include: cluster-secret.yaml
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
