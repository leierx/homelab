# The only manifest you apply by hand:
#   kubectl apply -n argocd -f gitops/bootstrap/root.yaml
#
# It syncs the YAML files directly in gitops/bootstrap/ (not subfolders), which are
# the AppProjects and the fleet-level ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/leierx/homelab.git
    targetRevision: main
    path: gitops/bootstrap
    directory:
      exclude: root.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
