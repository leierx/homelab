apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gitops-addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  template:
    metadata:
      name: "gitops-addons-{{ .name }}"
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: -1
  # the chart, the stack and the overrides at the cluster's stack version: Argo CD
  # cannot read two revisions of one repository in one Application
  templatePatch: |
    {{- $url := index .metadata.annotations "addons_repo_url" }}
    {{- $base := index .metadata.annotations "addons_repo_basepath" }}
    {{- $stack := index .metadata.annotations "addons_stack_version" }}
    spec:
      source:
        repoURL: {{ $url | quote }}
        targetRevision: {{ $stack | quote }}
        path: {{ printf "%scharts/gitops-addons" $base | quote }}
        helm:
          releaseName: {{ printf "gitops-addons-%s" .name | quote }}
          ignoreMissingValueFiles: true
          valueFiles:
            - {{ printf "../../stacks/k8s-%s/stack.yaml" .metadata.labels.kubernetes_version | quote }}
            - {{ printf "../../overrides/environments/%s/values.yaml" .metadata.labels.environment | quote }}
            - {{ printf "../../overrides/clusters/%s/values.yaml" .name | quote }}
          valuesObject:
            cluster:
              name: {{ .name | quote }}
            repo:
              url: {{ $url | quote }}
              basepath: {{ $base | quote }}
              stackRevision: {{ $stack | quote }}
            addons:
            {{- range $label, $value := .metadata.labels }}
            {{- if hasPrefix "enable_" $label }}
              {{ trimPrefix "enable_" $label }}:
                enabled: {{ eq $value "true" }}
            {{- end }}
            {{- end }}
