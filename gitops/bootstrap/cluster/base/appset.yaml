# Per-cluster ApplicationSet. Rendered twice per cluster (see ../kustomization.yaml):
#   <cluster>-addons          values.ordered = "false"  → only Applications WITHOUT a wave
#   <cluster>-addons-ordered  values.ordered = "true"   → only Applications WITH a wave (RollingSync)
#
# gitops/bootstrap/fleet.yaml replaces both `elements: [{}]` placeholders with the cluster's data:
#   cluster        the cluster's folder name under gitops/clusters/
#   clusterGroups  the cluster's groups, in layering order
#   groupAddons    `addons:` of those groups in gitops/groups.yaml, merged in that order
#   clusterAddons  `addons:` from cluster.yaml
#   repoURL        the fleet repo
#   revision       the branch to track
#
# Each generator yields one candidate per addon / cluster app; its elementsYaml decides whether the
# candidate becomes an Application here. templatePatch turns the resulting `app` into the Application.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # No resources finalizer on generated Applications: removing one never uninstalls anything.
    preserveResourcesOnDeletion: true

  generators:
    # ---------------------------------------------------------------------------------------------
    # 0: catalog addons — one candidate per gitops/addons/<addon>/addon.yaml
    # ---------------------------------------------------------------------------------------------
    - matrix:
        generators:
          - matrix:
              generators:
                - list:
                    elements: [{}]
                - git:
                    repoURL: '{{ .repoURL }}'
                    revision: '{{ .revision }}'
                    files:
                      - path: gitops/addons/*/addon.yaml
                      - path: gitops/addons/*/*/addon.yaml
                        exclude: true
                    values:
                      ordered: "false"
          - list:
              elementsYaml: |
                {{- $addon := .path.basename }}
                {{- $where := printf "gitops/addons/%s on cluster %s" $addon .cluster }}

                {{- /* Enabled: cluster.yaml, else groups.yaml, else the addon's own clusters/groups */}}
                {{- $enabled := has .cluster (dig "clusters" (list) .) }}
                {{- range (dig "groups" (list) .) }}{{ if has . $.clusterGroups }}{{ $enabled = true }}{{ end }}{{ end }}
                {{- if hasKey .groupAddons $addon }}{{ $enabled = get .groupAddons $addon }}{{ end }}
                {{- if hasKey .clusterAddons $addon }}{{ $enabled = get .clusterAddons $addon }}{{ end }}
                {{- if not (kindIs "bool" $enabled) }}
                {{-   fail (printf "%s: addons entries must be true or false" $where) }}
                {{- end }}

                {{- $out := list }}
                {{- $ordered := hasKey . "wave" }}
                {{- if and $enabled (eq $ordered (eq .values.ordered "true")) }}
                {{-   if not (has (dig "type" "" .) (list "helm" "kustomize" "manifests")) }}
                {{-     fail (printf "%s: type must be helm, kustomize or manifests" $where) }}
                {{-   end }}
                {{-   if not (has (toString (dig "podSecurity" "" .)) (list "" "privileged" "baseline" "restricted")) }}
                {{-     fail (printf "%s: podSecurity must be privileged, baseline or restricted" $where) }}
                {{-   end }}
                {{-   if and $ordered (not (has (toString .wave) (list "1" "2" "3" "4" "5" "6" "7" "8" "9"))) }}
                {{-     fail (printf "%s: wave must be a whole number from 1 to 9" $where) }}
                {{-   end }}
                {{-   $name := dig "name" $addon . }}
                {{-   $out = append $out (dict "app" (dict
                        "kind" "addon"
                        "name" $name
                        "dir" (printf "gitops/addons/%s" $addon)
                        "type" .type
                        "namespace" (dig "namespace" $name .)
                        "podSecurity" (toString (dig "podSecurity" "" .))
                        "wave" (toString (dig "wave" "" .))
                        "releaseName" (dig "releaseName" $name .)
                        "syncOptions" (dig "syncOptions" (list) .)
                        "ignoreDifferences" (dig "ignoreDifferences" (list) .))) }}
                {{- end }}
                {{- toJson $out }}

    # ---------------------------------------------------------------------------------------------
    # 1: cluster apps — one candidate per gitops/clusters/<cluster>/apps/<app>/app.yaml
    # ---------------------------------------------------------------------------------------------
    - matrix:
        generators:
          - matrix:
              generators:
                - list:
                    elements: [{}]
                - git:
                    repoURL: '{{ .repoURL }}'
                    revision: '{{ .revision }}'
                    files:
                      - path: 'gitops/clusters/{{ .cluster }}/apps/*/app.yaml'
                      - path: 'gitops/clusters/{{ .cluster }}/apps/*/*/app.yaml'
                        exclude: true
                    values:
                      ordered: "false"
          - list:
              elementsYaml: |
                {{- $app := .path.basename }}
                {{- $where := printf "gitops/clusters/%s/apps/%s" .cluster $app }}
                {{- $out := list }}
                {{- $ordered := hasKey . "wave" }}
                {{- if eq $ordered (eq .values.ordered "true") }}
                {{-   if not (has (dig "type" "" .) (list "helm" "kustomize" "manifests")) }}
                {{-     fail (printf "%s: type must be helm, kustomize or manifests" $where) }}
                {{-   end }}
                {{-   if not (has (toString (dig "podSecurity" "" .)) (list "" "privileged" "baseline" "restricted")) }}
                {{-     fail (printf "%s: podSecurity must be privileged, baseline or restricted" $where) }}
                {{-   end }}
                {{-   if and $ordered (not (has (toString .wave) (list "1" "2" "3" "4" "5" "6" "7" "8" "9"))) }}
                {{-     fail (printf "%s: wave must be a whole number from 1 to 9" $where) }}
                {{-   end }}
                {{-   $out = append $out (dict "app" (dict
                        "kind" "app"
                        "name" $app
                        "dir" .path.path
                        "type" .type
                        "namespace" (dig "namespace" $app .)
                        "podSecurity" (toString (dig "podSecurity" "" .))
                        "wave" (toString (dig "wave" "" .))
                        "releaseName" (dig "releaseName" $app .)
                        "syncOptions" (dig "syncOptions" (list) .)
                        "ignoreDifferences" (dig "ignoreDifferences" (list) .))) }}
                {{- end }}
                {{- toJson $out }}

  template:
    metadata:
      name: '{{ .cluster }}'              # completed in templatePatch
    spec:
      project: addons
      destination:
        name: '{{ .cluster }}'

  templatePatch: |
    {{- $a := .app }}
    {{- $ordered := eq .values.ordered "true" }}
    {{- $layers := list }}
    {{- range .clusterGroups }}{{ $layers = append $layers (printf "groups/%s/addons/%s" . $a.name) }}{{ end }}
    {{- $layers = append $layers (printf "clusters/%s/addons/%s" .cluster $a.name) }}
    {{- $globs := list }}
    {{- range $layers }}{{ $globs = append $globs (printf "%s/*" .) }}{{ end }}
    metadata:
      name: {{ .cluster }}-{{ $a.name }}
      labels:
        fleet/cluster: {{ .cluster }}
        fleet/kind: {{ $a.kind }}
        {{- if $ordered }}
        fleet/wave: "{{ $a.wave }}"
        {{- end }}
    spec:
      destination:
        namespace: {{ $a.namespace }}
      sources:
        # The addon or app folder itself.
        - repoURL: {{ .repoURL }}
          targetRevision: {{ .revision }}
          path: {{ $a.dir }}
          {{- if eq $a.type "helm" }}
          helm:
            releaseName: {{ $a.releaseName }}
            # Cluster facts for charts and their templates: .Values.fleet.cluster, .Values.fleet.groups
            valuesObject:
              fleet:
                cluster: {{ .cluster }}
                groups: {{ toJson .clusterGroups }}
            {{- if eq $a.kind "addon" }}
            ignoreMissingValueFiles: true
            valueFiles:
              {{- range $layers }}
              - $values/gitops/{{ . }}/values.yaml
              {{- end }}
            {{- end }}
          {{- end }}
        {{- if eq $a.kind "addon" }}
        {{-   if eq $a.type "helm" }}
        - repoURL: {{ .repoURL }}
          targetRevision: {{ .revision }}
          ref: values
        {{-   end }}
        # Extra manifests from the group and cluster layer folders: every file except values.yaml.
        # gitops/ always exists and an include that matches nothing adds nothing, so every layer
        # folder is optional.
        - repoURL: {{ .repoURL }}
          targetRevision: {{ .revision }}
          path: gitops
          directory:
            recurse: true
            include: '{{ printf "{%s}" (join "," $globs) }}'
            exclude: '*/values.yaml'
        {{- end }}
      syncPolicy:
        # In the ordered ApplicationSet, RollingSync switches automated sync off and triggers the
        # syncs itself, reusing `prune` from here. Expect a log warning about it; that is intended.
        automated:
          prune: true
          selfHeal: true
        {{- with $a.podSecurity }}
        # Labels the destination namespace. Argo CD never deletes a namespace it labels this way.
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: {{ . }}
            pod-security.kubernetes.io/warn: {{ . }}
            pod-security.kubernetes.io/audit: {{ . }}
        {{- end }}
        retry:
          limit: -1
          refresh: true
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
          {{- range $a.syncOptions }}
          - {{ . }}
          {{- end }}
      {{- with $a.ignoreDifferences }}
      ignoreDifferences: {{ toJson . }}
      {{- end }}
