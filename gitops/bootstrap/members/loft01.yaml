apiVersion: v1
kind: Secret
metadata:
  name: cluster-loft01
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    cluster_name: loft01
    environment: prod
    kubernetes_version: "1.36"
    # one per addon loft01 runs, sorted; never for apps
    enable_admission: "true"
    enable_alloy_logs: "true"
    enable_alloy_metrics: "true"
    enable_argo_workflows: "true"
    enable_argocd: "true"
    enable_capi_argo_bridge: "true"
    enable_cdi: "true"
    enable_cert_manager: "true"
    enable_cilium: "true"
    enable_cloudnative_pg: "true"
    enable_cluster_api: "true"
    enable_envoy_gateway: "true"
    enable_external_secrets: "true"
    enable_grafana: "true"
    enable_keycloak: "true"
    enable_keycloak_operator: "true"
    enable_kube_state_metrics: "true"
    enable_kubevirt: "true"
    enable_loki: "true"
    enable_mimir: "true"
    enable_node_exporter: "true"
    enable_openbao: "true"
    enable_prometheus_operator_crds: "true"
    enable_rbac: "true"
    enable_renovate: "true"
    enable_zfs_localpv: "true"
  annotations:
    # without this Secret every addon and app Application of the cluster goes
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    addons_repo_url: https://github.com/leierx/homelab.git
    addons_repo_basepath: gitops/
    # renovate: datasource=git-tags depName=https://github.com/leierx/homelab.git
    addons_stack_version: stack-1.36.5
    workload_repo_url: https://github.com/leierx/homelab.git
    workload_repo_basepath: gitops/apps/
    workload_repo_revision: HEAD
type: Opaque
stringData:
  name: loft01
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
