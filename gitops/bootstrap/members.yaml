apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: members
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/leierx/homelab.git
    targetRevision: HEAD
    path: gitops/bootstrap/members
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: -1
