# server and machine learning ship together under one version
immich:
  # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
  tag: v3.3.4
# Postgres 18 is in this tag, the vchord image's pg18- prefix and its paths in templates/database.yaml
postgres:
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  tag: 18.6-standard-trixie
  storageClass: ""
  size: ""
# VectorChord, as the extension image's tag (pg18-v<version>) and the version the Database installs
vchord:
  # renovate: datasource=docker depName=ghcr.io/tensorchord/vchord-scratch
  version: 1.1.1

# this site's hostname, and the Keycloak issuer its users log in through
host: ""
keycloakHost: ""

# where the library and the model cache live, and how big; the cluster's storage decides
library:
  storageClass: ""
  size: ""
modelCache:
  storageClass: ""
  size: ""

# set by the app's values (gitops/apps/immich/prod)
fleet:
  cluster: ""
