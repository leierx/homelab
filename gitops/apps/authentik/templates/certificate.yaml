apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik-tls
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: authentik-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.certificate.dnsName | quote }}