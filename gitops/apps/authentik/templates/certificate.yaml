apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: authentik-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - {{ .Values.certificate.dnsName }}