cert-manager:
  crds:
    enabled: true
    keep: true
  # TLS from explicit Certificate objects only; HTTP-01 challenges are solved
  # through the shared-gateway (ClusterIssuer gatewayHTTPRoute solver). The
  # annotation-driven ListenerSet provisioning ("label convenience") is off.
  config:
    gatewayAPI:
      enabled: true
      enableListenerSet: false