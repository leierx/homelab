bitwarden:
  # TODO: fill in the mgmt cluster's Bitwarden project ID before first sync.
  projectID: "00000000-0000-0000-0000-000000000000"

# The Argo CD git write token is provided directly as a repository-write secret
# (see bootstrap.md), so no Bitwarden-materialized repo secret is needed on mgmt.
argocdRepoToken:
  enabled: false
  key: argocd/git-token