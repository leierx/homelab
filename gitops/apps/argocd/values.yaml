argo-cd:
  # Source Hydrator (beta, v3.5+) needs the commit server + hydrator.enabled.
  commitServer:
    enabled: true
  crds:
    install: true
  server:
    extraArgs:
      - --insecure
  # argocd-cmd-params-cm
  configs:
    params:
      "hydrator.enabled": "true"
    cm:
      commit.author.name: "GitOps Bot"
      commit.author.email: "gitops@homelab"

