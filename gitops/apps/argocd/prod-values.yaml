argo-cd:
  global:
    domain: argocd.prod.example.com
  server:
    initContainers:
      - name: extension-gitops-promoter
        image: quay.io/argoprojlabs/argocd-extension-installer:v1.0.1@sha256:ce1a1b3276c2ebb30f2228b26197a1cf94e23fbb8872881c7382507c96e4e3d9
        env:
          - name: EXTENSION_NAME
            value: gitops-promoter
          - name: EXTENSION_URL
            value: https://github.com/argoproj-labs/gitops-promoter/releases/download/v0.36.0/gitops-promoter-argocd-extension.tar.gz
          - name: EXTENSION_CHECKSUM_URL
            value: https://github.com/argoproj-labs/gitops-promoter/releases/download/v0.36.0/gitops-promoter_0.36.0_checksums.txt
        volumeMounts:
          - name: extensions
            mountPath: /tmp/extensions/
        securityContext:
          runAsUser: 1000
          allowPrivilegeEscalation: false
    volumeMounts:
      - name: extensions
        mountPath: /tmp/extensions/
    volumes:
      - name: extensions
        emptyDir: {}
  configs:
    cm:
      resource.links: |
        - url: '{{.resource.status.url}}'
          title: Pull Request
          icon.class: fa-code-pull-request
          if: resource.apiVersion == "promoter.argoproj.io/v1alpha1" && resource.kind == "PullRequest" && resource.status.url != nil && resource.status.url != ""
        - url: '{{.resource.status.pullRequest.url}}'
          title: Pull Request
          icon.class: fa-code-pull-request
          if: resource.apiVersion == "promoter.argoproj.io/v1alpha1" && resource.kind == "ChangeTransferPolicy" && resource.status.pullRequest != nil && resource.status.pullRequest.url != nil && resource.status.pullRequest.url != ""
      resource.customLabels: promoter.argoproj.io/commit-status