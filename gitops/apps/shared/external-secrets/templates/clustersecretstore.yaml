apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden
spec:
  retrySettings:
    maxRetries: 5
    retryInterval: "10s"
  provider:
    bitwardensecretsmanager:
      apiURL: {{ .Values.bitwarden.apiURL | quote }}
      identityURL: {{ .Values.bitwarden.identityURL | quote }}
      bitwardenServerSDKURL: {{ .Values.bitwarden.serverSDKURL | quote }}
      # The SDK server's CA, so the controller trusts its self-signed HTTPS cert.
      caProvider:
        type: Secret
        namespace: {{ .Release.Namespace }}
        name: bitwarden-ca
        key: ca.crt
      organizationID: {{ .Values.bitwarden.organizationID | required "bitwarden.organizationID must be set" | quote }}
      projectID: {{ .Values.bitwarden.projectID | required "bitwarden.projectID must be set" | quote }}
      auth:
        secretRef:
          credentials:
            name: bitwarden-access-token
            key: token
            namespace: {{ .Release.Namespace }}
