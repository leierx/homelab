argo-cd:
  commitServer:
    enabled: true
  crds:
    install: true
  server:
    extraArgs:
      - --insecure
  applicationSet:
    extraArgs:
      - --policy=create-update
  configs:
    params:
      "hydrator.enabled": "true"
    cm:
      commit.author.name: "GitOps Bot"
      commit.author.email: "gitops@homelab"

