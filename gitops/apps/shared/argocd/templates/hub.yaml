{{- if (index .Values "argocd-agent-principal").enabled }}
# Fixed NodePorts for the spoke clusters (no LoadBalancer implementation on
# k3s here — servicelb is disabled). Reached via the mgmt control-plane node
# IP 192.168.102.10.
apiVersion: v1
kind: Service
metadata:
  name: argocd-agent-principal-nodeport
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-agent-principal
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https
      port: 443
      targetPort: 8443
      nodePort: 30643
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-repo-server-nodeport
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-repo-server
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: server
      port: 8081
      targetPort: 8081
      nodePort: 30081
---
# Apps-in-any-namespace: applications in the per-agent namespaces must be
# allowed to reference the default project.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
spec:
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  destinations:
    - namespace: '*'
      server: '*'
    - namespace: '*'
      name: '*'
  sourceRepos:
    - '*'
  sourceNamespaces:
    - prod
    - test
    - mgmt
{{- end }}
