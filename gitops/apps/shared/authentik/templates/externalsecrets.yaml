apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 48h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        secretKeyRef:
          name: authentik/secret_key
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        secretKeyRef:
          name: authentik/postgresql-password
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        secretKeyRef:
          name: authentik/bootstrap-password
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        secretKeyRef:
          name: authentik/bootstrap-token
    - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
      remoteRef:
        secretKeyRef:
          name: authentik/bootstrap-email
    - secretKey: AUTHENTIK_BOOTSTRAP_USERNAME
      remoteRef:
        secretKeyRef:
          name: authentik/bootstrap-username
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgresql
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 48h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: authentik-postgresql
  data:
    - secretKey: password
      remoteRef:
        secretKeyRef:
          name: authentik/postgresql-password
    - secretKey: postgresql-postgres-password
      remoteRef:
        secretKeyRef:
          name: authentik/postgresql-superuser-password
