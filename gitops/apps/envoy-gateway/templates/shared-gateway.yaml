apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  gatewayClassName: envoy-gateway
  # Static front door. TLS listeners + certs are contributed per-app via
  # ListenerSets; this HTTP listener serves ACME HTTP-01 challenges for them.
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: All
  # Allow apps in any namespace to attach their own ListenerSets.
  allowedListeners:
    namespaces:
      from: All