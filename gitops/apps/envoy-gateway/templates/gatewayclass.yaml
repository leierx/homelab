apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
  annotations:
    # Declared explicitly instead of relying on Envoy Gateway's startup-only
    # auto-bootstrap (which races the CRDs being applied by this same app).
    argocd.argoproj.io/sync-wave: "2"
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller