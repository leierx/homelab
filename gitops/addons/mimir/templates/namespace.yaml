apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  annotations:
    # monitoring is shared by grafana, loki and prometheus-operator-crds; this addon owns the
    # labels, the others rely on it. Prune=false keeps it if only this addon is removed.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
