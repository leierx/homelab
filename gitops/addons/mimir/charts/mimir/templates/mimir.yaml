# mimir-distributed has no monolithic mode, so Mimir is one -target=all pod
{{- with .Values }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir
data:
  mimir.yaml: |
    {{- include "mimir.config" $ | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  labels:
    app.kubernetes.io/name: mimir
spec:
  selector:
    app.kubernetes.io/name: mimir
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
    - name: grpc
      port: 9095
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
spec:
  replicas: 1
  serviceName: mimir
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
      annotations:
        checksum/config: {{ include "mimir.config" $ | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # closing the ingester's TSDB heads on shutdown can take a while
      terminationGracePeriodSeconds: 240
      containers:
        - name: mimir
          image: docker.io/grafana/mimir:{{ .image.tag }}
          args:
            - -target=all
            - -config.file=/etc/mimir/mimir.yaml
          env:
            - name: GOMEMLIMIT
              value: {{ .goMemLimit | quote }}
          ports:
            - name: http-metrics
              containerPort: 8080
            - name: grpc
              containerPort: 9095
          readinessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 15
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: mimir
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .storage.storageClassName }}
        resources:
          requests:
            storage: {{ .storage.size }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mimir
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
  endpoints:
    - port: http-metrics
{{- end }}
