cluster-api-operator:
  core:
    cluster-api:
      # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
      version: v1.14.3
      deployment:
        containers:
          - name: manager
            resources:
              requests: { cpu: 10m, memory: 64Mi }
              limits: { memory: 512Mi }
  bootstrap:
    kubeadm:
      # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
      version: v1.14.3
      deployment:
        containers:
          - name: manager
            resources:
              requests: { cpu: 10m, memory: 64Mi }
              limits: { memory: 256Mi }
  controlPlane:
    kubeadm:
      # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
      version: v1.14.3
      deployment:
        containers:
          - name: manager
            resources:
              requests: { cpu: 10m, memory: 64Mi }
              limits: { memory: 512Mi }
  infrastructure:
    kubevirt:
      # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api-provider-kubevirt
      version: v0.11.2
      deployment:
        containers:
          - name: manager
            resources:
              requests: { cpu: 10m, memory: 64Mi }
              limits: { memory: 256Mi }
