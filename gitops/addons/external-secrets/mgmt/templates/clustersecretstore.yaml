# every ExternalSecret reads from here: remoteRef.key is <cluster>/<app> in the kv mount
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  conditions:
    # namespaces whose addons read secrets; anything else is refused
    - namespaces: [argocd, authentik, monitoring, ntfy, renovate]
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      caProvider:
        type: Secret
        name: openbao-tls
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# write store for PushSecrets that generate values (see docs/openbao.md); separate ServiceAccount
# and OpenBao role so reads and writes stay distinct in the audit log
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-push
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-push
spec:
  conditions:
    # namespaces whose addons generate secrets
    - namespaces: [authentik, monitoring, ntfy]
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      # ESO's property push is read-modify-write; CAS turns a lost race into a retry
      checkAndSet:
        required: true
      caProvider:
        type: Secret
        name: openbao-tls
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-push
          serviceAccountRef:
            name: external-secrets-push
            namespace: external-secrets
