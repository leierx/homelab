argo-cd:
  configs:
    cm:
      url: https://argocd.skinke.net
      # SSO only; the local admin account is disabled (docs/break-glass.md)
      admin.enabled: "false"
      oidc.config: |
        name: Keycloak
        issuer: https://auth.skinke.net/realms/homelab
        clientID: argocd
        clientSecret: $argocd-oidc:clientSecret
        # `argocd login --sso` uses this public client with PKCE
        cliClientID: argocd-cli
        requestedScopes: [openid, profile, email]
        # renew the session before Keycloak's 5-minute ID token runs out
        refreshTokenThreshold: 2m
    params:
      # TLS ends at the edge Gateway
      server.insecure: true
      # diff against what the API server stores, so CRD defaults (HTTPRoute matches, parentRef group/kind) aren't drift
      controller.diff.server.side: true
    rbac:
      policy.csv: |
        g, homelab-admins, role:admin
        g, homelab-operators, role:admin
        g, homelab-viewers, role:readonly
  dex:
    enabled: false
  notifications:
    enabled: false
  controller:
    metrics: { enabled: true, serviceMonitor: { enabled: true } }
    resources:
      requests: { cpu: 250m, memory: 768Mi }
      limits: { memory: 2Gi }
  repoServer:
    metrics: { enabled: true, serviceMonitor: { enabled: true } }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 1Gi }
    copyutil:
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 64Mi }
  server:
    metrics: { enabled: true, serviceMonitor: { enabled: true } }
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
  applicationSet:
    metrics: { enabled: true, serviceMonitor: { enabled: true } }
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
  redis:
    # redis never talks to the Kubernetes API
    automountServiceAccountToken: false
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 256Mi }
  redisSecretInit:
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
