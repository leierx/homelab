argo-cd:
  dex:
    enabled: false
  notifications:
    enabled: false
  controller:
    resources:
      requests: { cpu: 250m, memory: 768Mi }
      limits: { memory: 2Gi }
  repoServer:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 1Gi }
    copyutil:
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 64Mi }
  server:
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
  applicationSet:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
  redis:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 256Mi }
  redisSecretInit:
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
