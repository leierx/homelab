argo-cd:
  configs:
    cm:
      url: https://argocd.skinke.net
      # the local admin stays enabled as break-glass when Authentik is down
      oidc.config: |
        name: Authentik
        issuer: https://auth.skinke.net/application/o/argocd/
        clientID: argocd
        clientSecret: $argocd-oidc:clientSecret
        requestedScopes: [openid, profile, email, groups]
    params:
      # TLS ends at the edge Gateway
      server.insecure: true
      # diff against what the API server would store, so CRD defaults (HTTPRoute matches, parentRef
      # group/kind, ...) don't read as drift
      controller.diff.server.side: true
    rbac:
      policy.csv: |
        g, homelab-admins, role:admin
  dex:
    enabled: false
  notifications:
    enabled: false
  controller:
    metrics: { enabled: true, serviceMonitor: { enabled: true } }
    resources:
      requests: { cpu: 250m, memory: 768Mi }
      limits: { memory: 2Gi }
  repoServer:
    metrics: { enabled: true, serviceMonitor: { enabled: true } }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 1Gi }
    copyutil:
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 64Mi }
  server:
    metrics: { enabled: true, serviceMonitor: { enabled: true } }
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
  applicationSet:
    metrics: { enabled: true, serviceMonitor: { enabled: true } }
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
  redis:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 256Mi }
  redisSecretInit:
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
