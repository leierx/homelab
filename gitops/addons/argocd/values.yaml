argo-cd:
  configs:
    cm:
      admin.enabled: 'false'
    params:
      server.insecure: true
      controller.diff.server.side: true
      controller.sync.timeout.seconds: '4800'
    rbac:
      policy.csv: |
        g, homelab-admins, role:admin
        g, homelab-operators, role:admin
        g, homelab-viewers, role:readonly
  dex: {enabled: false}
  notifications: {enabled: false}
  controller:
    metrics: {enabled: true, serviceMonitor: {enabled: true}}
    resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {memory: 4Gi}}
  repoServer:
    metrics: {enabled: true, serviceMonitor: {enabled: true}}
    resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 1Gi}}
    copyutil:
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
  server:
    metrics: {enabled: true, serviceMonitor: {enabled: true}}
    resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
  # the fleet uses no ApplicationSets; the chart has no switch, only replicas
  applicationSet: {replicas: 0}
  redis:
    automountServiceAccountToken: false
    resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 256Mi}}
  redisSecretInit:
    resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
certificateIssuer: letsencrypt-prod
# on top of the chart's ingress NetworkPolicies
netpol:
  sameNamespace: true
  gateway: [8080]
  apiServer: true
  # the cluster-wide baseline allows DNS too, but Argo CD is what delivers that policy
  dns: true
  # GitHub for the repo, and the Keycloak issuer (public address) for SSO
  world: [443]
