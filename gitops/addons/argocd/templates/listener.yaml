apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd
spec:
  secretName: argocd-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - argocd.skinke.net
{{- range $gw := list "edge" "wg" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: argocd-{{ $gw }}
spec:
  parentRef:
    name: {{ $gw }}
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: argocd.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: argocd-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-{{ $gw }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: argocd-{{ $gw }}
  hostnames:
    - argocd.skinke.net
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
{{- end }}
---
# public requests log in to Authentik (client edge) before Argo CD sees them; wg peers skip this
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: edge-oidc
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: argocd-edge
  oidc:
    provider:
      issuer: https://auth.skinke.net/application/o/edge/
    clientID: edge
    clientSecret:
      name: edge-oidc
    redirectURL: https://argocd.skinke.net/oauth2/callback
    logoutPath: /oauth2/logout
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: edge-oidc
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: edge-oidc
  data:
    - secretKey: client-secret
      remoteRef: { key: loft01/edge, property: oidc_client_secret }
