# on top of the chart's ingress NetworkPolicies
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints: [{}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
  egress:
    - toEndpoints: [{}]
    - toEntities: [kube-apiserver]
    # GitHub for the repo, and auth.skinke.net (public address) for SSO
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
