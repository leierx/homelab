# on top of the chart's ingress NetworkPolicies
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints: [{}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
  egress:
    - toEndpoints: [{}]
    - toEntities: [kube-apiserver]
    # cluster DNS; the cluster-wide baseline allows it too, but Argo CD is what delivers that policy
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    # GitHub for the repo, and the Keycloak issuer (public address) for SSO
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
