cert-manager:
  crds:
    enabled: true
  # HTTP-01 is answered through HTTPRoutes on the edge Gateway; certificates are explicit Certificate objects
  config:
    gatewayAPI:
      enabled: true
  prometheus:
    servicemonitor:
      enabled: true
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
  webhook:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  cainjector:
    resources:
      requests: { cpu: 10m, memory: 128Mi }
      limits: { memory: 512Mi }
  startupapicheck:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }
