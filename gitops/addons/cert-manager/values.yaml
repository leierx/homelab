cert-manager:
  crds:
    enabled: true
  # the ACME HTTP-01 solver answers through HTTPRoutes on the edge Gateway;
  # certificates are explicit Certificate objects, not Gateway annotations
  config:
    gatewayAPI:
      enabled: true
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
  webhook:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  cainjector:
    resources:
      requests: { cpu: 10m, memory: 128Mi }
      limits: { memory: 512Mi }
  startupapicheck:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }
