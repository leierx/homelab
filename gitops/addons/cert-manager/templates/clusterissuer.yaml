apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: larssmitheier@protonmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            # the solver is reached through the edge Gateway; admission refuses the default NodePort
            serviceType: ClusterIP
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: edge
                namespace: envoy-gateway-system
                sectionName: http
