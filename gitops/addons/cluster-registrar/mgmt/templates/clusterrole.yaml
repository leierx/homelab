apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-registrar
rules:
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-registrar
subjects:
  - kind: ServiceAccount
    name: cluster-registrar
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-registrar
  apiGroup: rbac.authorization.k8s.io
