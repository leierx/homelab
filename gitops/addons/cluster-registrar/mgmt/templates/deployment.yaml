apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-registrar
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-registrar
  template:
    metadata:
      labels:
        app: cluster-registrar
    spec:
      serviceAccountName: cluster-registrar
      containers:
        - name: cluster-registrar
          image: ghcr.io/leierx/cluster-registrar:main
          imagePullPolicy: Always
          args:
            - --argocd-namespace={{ .Release.Namespace }}
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
