apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-registrar
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-registrar
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: cluster-registrar
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: cluster-registrar
  apiGroup: rbac.authorization.k8s.io
