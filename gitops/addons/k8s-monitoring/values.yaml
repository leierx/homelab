k8s-monitoring:
  clusterMetrics:
    enabled: true
    collector: alloy-metrics
    # the default allow lists drop much of what the community dashboards query; series are cheap at this scale
    kubelet:
      metricsTuning:
        useDefaultAllowList: false
    cadvisor:
      metricsTuning:
        useDefaultAllowList: false
    kube-state-metrics:
      metricsTuning:
        useDefaultAllowList: false
    apiServer:
      enabled: true
    kubeDNS:
      enabled: true
  hostMetrics:
    enabled: true
    collector: alloy-metrics
    linuxHosts:
      enabled: true
      metricsTuning:
        useDefaultAllowList: false
  prometheusOperatorObjects:
    enabled: true
    collector: alloy-metrics
  clusterEvents:
    enabled: true
    collector: alloy-singleton
  podLogsViaLoki:
    enabled: true
    collector: alloy-logs
  selfReporting:
    enabled: false

  collectors:
    alloy-metrics:
      presets: [clustered, statefulset]
      alloy:
        resources:
          requests: { cpu: 100m, memory: 512Mi }
          limits: { memory: 2Gi }
    alloy-singleton:
      presets: [singleton]
      alloy:
        resources:
          requests: { cpu: 10m, memory: 64Mi }
          limits: { memory: 256Mi }
    alloy-logs:
      # not the filesystem-log-reader preset: k3s has no /var/lib/docker/containers to mount
      presets: [daemonset]
      alloy:
        mounts:
          varlog: true
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { memory: 512Mi }
  collectorCommon:
    alloy:
      configReloader:
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 64Mi }

  telemetryServices:
    kube-state-metrics:
      deploy: true
      resources:
        requests: { cpu: 10m, memory: 64Mi }
        limits: { memory: 256Mi }
    node-exporter:
      deploy: true
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }

  alloy-operator:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
    # Helm hooks that finalize the operator Deployment; Argo would run one on every sync and never the delete side
    waitForAlloyRemoval:
      enabled: false
