k8s-monitoring:
  cluster:
    name: mgmt
  # the observability addon's backends, in-cluster
  destinations:
    mimir:
      type: prometheus
      url: http://mimir.monitoring.svc:8080/api/v1/push
    loki:
      type: loki
      url: http://loki.monitoring.svc:3100/loki/api/v1/push
    tempo:
      type: otlp
      url: http://tempo.monitoring.svc:4317
      tls:
        insecure: true
      metrics: { enabled: false }
      logs: { enabled: false }
      traces: { enabled: true }
