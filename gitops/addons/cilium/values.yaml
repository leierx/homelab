cilium:
  kubeProxyReplacement: true
  bpf:
    masquerade: true
  ipv6:
    enabled: false
  hubble:
    # no Relay or UI: Hubble only feeds the flow metrics below, and `cilium-dbg hubble observe`
    # in the agent still works over the local socket, so nothing needs a network listener or TLS
    listenAddress: ""
    tls:
      enabled: false
    metrics:
      enabled:
        - dns:query;ignoreAAAA
        - drop:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
        - flow:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
        - tcp
        - icmp
        - port-distribution
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        annotations: { grafana_folder: Cilium }
  prometheus:
    enabled: true
    metricsService: true
    serviceMonitor:
      enabled: true
  dashboards:
    enabled: true
    annotations: { grafana_folder: Cilium }
  # no memory limit on the agent: an OOM kill takes the node's networking down with it
  resources:
    requests: { cpu: 100m, memory: 512Mi }
  initResources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 256Mi }
  envoy:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 1Gi }
    prometheus:
      serviceMonitor:
        enabled: true
  operator:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
    prometheus:
      metricsService: true
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: true
      annotations: { grafana_folder: Cilium }
  certgen:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }
