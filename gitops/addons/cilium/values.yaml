cilium:
  kubeProxyReplacement: true
  bpf:
    masquerade: true
  ipv6:
    enabled: false
  hubble:
    tls:
      auto:
        # the default (helm) regenerates certs on every render, so Argo would never be in sync
        method: cronJob
  # no memory limit on the agent: an OOM kill takes the node's networking down with it
  resources:
    requests: { cpu: 100m, memory: 512Mi }
  initResources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 256Mi }
  envoy:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 1Gi }
  operator:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
  certgen:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }
