apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana
    template:
      mergePolicy: Merge
      data:
        admin-user: admin
  data:
    - secretKey: admin-password
      remoteRef:
        key: mgmt/grafana
        property: admin_password
    - secretKey: oidc-client-secret
      remoteRef:
        key: mgmt/grafana
        property: oidc_client_secret
