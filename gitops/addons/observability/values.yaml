grafana:
  fullnameOverride: grafana
  testFramework:
    enabled: false
  admin:
    existingSecret: grafana
  envValueFrom:
    NTFY_TOKEN:
      secretKeyRef:
        name: grafana
        key: ntfy-token
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana
        key: oidc-client-secret
  grafana.ini:
    server:
      domain: metrics.skinke.net
      root_url: https://%(domain)s/
    auth:
      # SSO only; the admin account is break-glass (docs/break-glass.md)
      disable_login_form: true
      signout_redirect_url: https://auth.skinke.net/application/o/grafana/end-session/
    # the hidden login form alone still left admin:<password> working against the API
    auth.basic:
      enabled: false
    auth.generic_oauth:
      enabled: true
      name: Authentik
      client_id: grafana
      scopes: openid email profile
      auth_url: https://auth.skinke.net/application/o/authorize/
      token_url: https://auth.skinke.net/application/o/token/
      api_url: https://auth.skinke.net/application/o/userinfo/
      use_pkce: true
      allow_sign_up: true
      allow_assign_grafana_admin: true
      login_attribute_path: preferred_username
      role_attribute_path: contains(groups, 'homelab-admins') && 'GrafanaAdmin' || contains(groups, 'homelab-operators') && 'Editor' || 'Viewer'
  # a second pod can't share the SQLite database on the RWO volume
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: zfs
    size: 5Gi
  # runs as root; fsGroup already gives Grafana the volume
  initChownData:
    enabled: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }
  downloadDashboards:
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
  serviceMonitor:
    enabled: true
  sidecar:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
    # charts across the cluster ship dashboards as ConfigMaps labelled grafana_dashboard
    dashboards:
      enabled: true
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      # the reload call needs basic auth; Grafana's file provider polls for changes anyway
      skipReload: true
      provider:
        foldersFromFilesStructure: true
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir
          uid: mimir
          type: prometheus
          url: http://mimir:8080/prometheus
          isDefault: true
          jsonData:
            prometheusType: Mimir
            httpMethod: POST
            timeInterval: 60s
        - name: Loki
          uid: loki
          type: loki
          url: http://loki:3100
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: kubernetes
          folder: Kubernetes
          type: file
          options:
            path: /var/lib/grafana/dashboards/kubernetes
        - name: platform
          folder: Platform
          type: file
          options:
            path: /var/lib/grafana/dashboards/platform
  dashboards:
    kubernetes:
      k8s-views-global: { gnetId: 15757, revision: 43 }
      k8s-views-namespaces: { gnetId: 15758, revision: 46 }
      k8s-views-nodes: { gnetId: 15759, revision: 40 }
      k8s-views-pods: { gnetId: 15760, revision: 41 }
      k8s-system-api-server: { gnetId: 15761, revision: 21 }
      node-exporter-full: { gnetId: 1860, revision: 45 }
    platform:
      argocd-operational: { gnetId: 19993, revision: 9 }
      argocd-application: { gnetId: 19974, revision: 8 }
      cert-manager: { gnetId: 20842, revision: 3 }
      envoy-gateway: { gnetId: 24460, revision: 1 }

  # Grafana-managed alerts to ntfy (topic `alerts`); loaded at startup, the chart rolls the pod on change
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: ntfy
          receivers:
            - uid: ntfy
              type: webhook
              settings:
                url: http://ntfy.ntfy.svc/alerts?template=grafana
                httpMethod: POST
                authorization_scheme: Bearer
                authorization_credentials: $__env{NTFY_TOKEN}
                # ntfy rejects a templated body over 128 KiB, which drops the whole notification
                maxAlerts: "10"
    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: ntfy
          group_by: [alertname, grafana_folder]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
    rules.yaml:
      apiVersion: 1
      groups:
        # people and stolen credentials: the API server audit log and OpenBao's
        - orgId: 1
          name: security
          folder: homelab
          interval: 1m
          rules:
            - uid: admin-kubeconfig-used
              title: Admin kubeconfig used
              condition: C
              for: 0s
              noDataState: OK
              execErrState: Error
              labels: { severity: warning }
              annotations:
                summary: "The host's system:masters certificate was used: break-glass, or someone who shouldn't have it."
              data:
                - { refId: A, datasourceUid: loki, relativeTimeRange: { from: 300, to: 0 }, model: { refId: A, queryType: instant, expr: 'sum(count_over_time({job="kube-audit"} | json | user_username="system:admin" [5m]))' } }
                - { refId: C, datasourceUid: __expr__, model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] } }
            - uid: rbac-changed-by-person
              title: RBAC changed outside Argo CD
              condition: C
              for: 0s
              noDataState: OK
              execErrState: Error
              labels: { severity: warning }
              annotations:
                summary: "A role or binding was created, changed or deleted by something other than a ServiceAccount."
              data:
                - { refId: A, datasourceUid: loki, relativeTimeRange: { from: 300, to: 0 }, model: { refId: A, queryType: instant, expr: 'sum by (user_username, objectRef_resource, objectRef_name) (count_over_time({job="kube-audit"} | json | objectRef_apiGroup="rbac.authorization.k8s.io" | verb=~"create|update|patch|delete" | user_username!~"system:serviceaccount:.*" | requestURI!~".*dryRun=All.*" [5m]))' } }
                - { refId: C, datasourceUid: __expr__, model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] } }
            - uid: secrets-or-exec-by-person
              title: Secrets read or pods entered by a person
              condition: C
              for: 0s
              noDataState: OK
              execErrState: Error
              labels: { severity: info }
              annotations:
                summary: "Someone logged in through Authentik read a Secret or used exec, attach or port-forward."
              data:
                - { refId: A, datasourceUid: loki, relativeTimeRange: { from: 300, to: 0 }, model: { refId: A, queryType: instant, expr: 'sum by (user_username, objectRef_namespace, objectRef_resource, objectRef_subresource) (count_over_time({job="kube-audit"} | json | user_username=~"oidc:.*" | objectRef_resource="secrets" or objectRef_subresource=~"exec|attach|portforward" [5m]))' } }
                - { refId: C, datasourceUid: __expr__, model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] } }
            - uid: openbao-admin-login
              title: OpenBao admin login
              condition: C
              for: 0s
              noDataState: OK
              execErrState: Error
              labels: { severity: info }
              annotations:
                summary: "Something logged in to OpenBao with the admin role (`just bao`, or a minted openbao-admin token)."
              data:
                - { refId: A, datasourceUid: loki, relativeTimeRange: { from: 300, to: 0 }, model: { refId: A, queryType: instant, expr: 'sum(count_over_time({namespace="openbao", container="openbao"} |= "\"type\":\"response\"" | json | auth_metadata_role="admin" [5m]))' } }
                - { refId: C, datasourceUid: __expr__, model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] } }
            - uid: admission-policy-warning
              title: Pod breaks an admission policy
              condition: C
              for: 0s
              noDataState: OK
              execErrState: Error
              labels: { severity: info }
              annotations:
                summary: "A pod was admitted despite a Warn/Audit policy (gitops/addons/admission), e.g. a CPU limit or a missing memory limit."
              data:
                - { refId: A, datasourceUid: loki, relativeTimeRange: { from: 300, to: 0 }, model: { refId: A, queryType: instant, expr: 'sum by (objectRef_namespace) (count_over_time({job="kube-audit"} |= "validation.policy.admission.k8s.io/validation_failure" | json [5m]))' } }
                - { refId: C, datasourceUid: __expr__, model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] } }
            - uid: network-policy-drops
              title: Traffic dropped by network policy
              condition: C
              for: 0s
              noDataState: OK
              execErrState: Error
              labels: { severity: warning }
              annotations:
                summary: "Cilium denied traffic: a missing allow rule, or something probing where it shouldn't."
              data:
                - { refId: A, datasourceUid: mimir, relativeTimeRange: { from: 600, to: 0 }, model: { refId: A, instant: true, expr: 'sum by (source, destination) (increase(hubble_drop_total{reason="POLICY_DENIED"}[5m])) > 0' } }
                - { refId: C, datasourceUid: __expr__, model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] } }
        - orgId: 1
          name: health
          folder: homelab
          interval: 1m
          rules:
            - uid: volume-filling-up
              title: Volume over 85% full
              condition: C
              for: 15m
              noDataState: OK
              execErrState: Error
              labels: { severity: warning }
              annotations: { summary: "A PVC is over 85% full." }
              data:
                - { refId: A, datasourceUid: mimir, relativeTimeRange: { from: 600, to: 0 }, model: { refId: A, instant: true, expr: 'max by (persistentvolumeclaim) (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85' } }
                - { refId: C, datasourceUid: __expr__, model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] } }
            - uid: pod-restarting
              title: Pod restarting
              condition: C
              for: 0s
              noDataState: OK
              execErrState: Error
              labels: { severity: warning }
              annotations: { summary: "A container restarted more than three times in 15 minutes." }
              data:
                - { refId: A, datasourceUid: mimir, relativeTimeRange: { from: 600, to: 0 }, model: { refId: A, instant: true, expr: 'sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[15m])) > 3' } }
                - { refId: C, datasourceUid: __expr__, model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] } }
            - uid: node-not-ready
              title: Node not ready
              condition: C
              for: 5m
              noDataState: OK
              execErrState: Error
              labels: { severity: critical }
              annotations: { summary: "A node has been NotReady for 5 minutes." }
              data:
                - { refId: A, datasourceUid: mimir, relativeTimeRange: { from: 600, to: 0 }, model: { refId: A, instant: true, expr: 'max by (node) (kube_node_status_condition{condition="Ready", status="true"} == 0) + 1' } }
                - { refId: C, datasourceUid: __expr__, model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] } }
            - uid: argocd-app-unhealthy
              title: Argo CD application unhealthy
              condition: C
              for: 15m
              noDataState: OK
              execErrState: Error
              labels: { severity: warning }
              annotations: { summary: "An Argo CD application has been Degraded, Missing or Unknown for 15 minutes." }
              data:
                - { refId: A, datasourceUid: mimir, relativeTimeRange: { from: 600, to: 0 }, model: { refId: A, instant: true, expr: 'max by (name, health_status) (argocd_app_info{health_status!~"Healthy|Progressing|Suspended"})' } }
                - { refId: C, datasourceUid: __expr__, model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] } }
            - uid: secret-sync-failing
              title: Secret sync failing
              condition: C
              for: 15m
              noDataState: OK
              execErrState: Error
              labels: { severity: warning }
              annotations: { summary: "An ExternalSecret or PushSecret has not been Ready for 15 minutes." }
              data:
                - { refId: A, datasourceUid: mimir, relativeTimeRange: { from: 600, to: 0 }, model: { refId: A, instant: true, expr: 'max by (exported_namespace, name) ({__name__=~"externalsecret_status_condition|pushsecret_status_condition", condition="Ready", status="False"}) > 0' } }
                - { refId: C, datasourceUid: __expr__, model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] } }
            - uid: openbao-sealed
              title: OpenBao sealed
              condition: C
              for: 5m
              noDataState: Alerting
              execErrState: Error
              labels: { severity: critical }
              # max: OpenBao keeps reporting the 0 from before it unsealed for its 24 h metrics retention
              annotations: { summary: "OpenBao is sealed or not reporting: no secret can be read or generated." }
              data:
                - { refId: A, datasourceUid: mimir, relativeTimeRange: { from: 600, to: 0 }, model: { refId: A, instant: true, expr: 'max(vault_core_unsealed)' } }
                - { refId: C, datasourceUid: __expr__, model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: lt, params: [1] } }] } }
            - uid: certificate-expiring
              title: Certificate expiring
              condition: C
              for: 1h
              noDataState: OK
              execErrState: Error
              labels: { severity: warning }
              annotations: { summary: "A cert-manager certificate expires within 14 days; renewal is failing." }
              data:
                - { refId: A, datasourceUid: mimir, relativeTimeRange: { from: 600, to: 0 }, model: { refId: A, instant: true, expr: 'min by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 86400' } }
                - { refId: C, datasourceUid: __expr__, model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] } }
loki:
  fullnameOverride: loki
  # Loki never talks to the Kubernetes API (rule sidecar off)
  defaults:
    automountServiceAccountToken: false
  deploymentMode: Monolithic
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 30d
      allow_structured_metadata: true
      volume_enabled: true
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
    # Grafana's Logs Drilldown shows patterns
    pattern_ingester:
      enabled: true
    analytics:
      reporting_enabled: false
  singleBinary:
    replicas: 1
    persistence:
      storageClass: zfs
      size: 50Gi
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 2Gi }
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  sidecar:
    rules:
      enabled: false
  monitoring:
    serviceMonitor:
      enabled: true

mimir:
  image:
    # renovate: datasource=docker depName=grafana/mimir
    tag: 3.2.2
  retention: 90d
  limits:
    ingestion_rate: 100000
    ingestion_burst_size: 1000000
    max_global_series_per_user: 3000000
    max_label_names_per_series: 50
    otel_metric_suffixes_enabled: true
  storage:
    storageClassName: zfs
    size: 100Gi
  goMemLimit: 3600MiB
  resources:
    requests: { cpu: 200m, memory: 1Gi }
    limits: { memory: 4Gi }
