renovate:
  # templates/serviceaccount.yaml: no API token in a pod that runs third-party code
  serviceAccount:
    create: false
    name: renovate
  cronjob:
    # what actually gets updated, and when, is up to renovate.json in the repo
    schedule: "17 * * * *"
    timeZone: Europe/Oslo
    concurrencyPolicy: Forbid
    # with Forbid, a hung run would block every later one; a run normally takes about a minute
    activeDeadlineSeconds: 3000
    # a GitHub App installation token lasts an hour, so each run mints its own
    preCommand: |
      RENOVATE_TOKEN=$(node /usr/local/share/github-app-token/token.mjs)
      export RENOVATE_TOKEN
  renovate:
    config: |
      {
        "platform": "github",
        "repositories": ["leierx/homelab"],
        "onboarding": false,
        "requireConfig": "required",
        "platformCommit": "enabled",
        "username": "leierx-renovate[bot]",
        "persistRepoData": true
      }
    persistence:
      cache:
        enabled: true
        storageClass: zfs
        storageSize: 5Gi
    securityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  # GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID, GITHUB_APP_PRIVATE_KEY from OpenBao loft01/renovate
  existingSecret: renovate-github-app
  extraVolumes:
    - name: github-app-token
      configMap:
        name: renovate-github-app-token
  extraVolumeMounts:
    - name: github-app-token
      mountPath: /usr/local/share/github-app-token
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 4Gi }
