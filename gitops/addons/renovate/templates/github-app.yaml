apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: renovate-github-app
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef: { key: mgmt/renovate, property: app_id }
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef: { key: mgmt/renovate, property: installation_id }
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef: { key: mgmt/renovate, property: private_key }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-github-app-token
data:
  # prints an installation token for the GitHub App, signed with its private key
  token.mjs: |
    import { sign } from "node:crypto";

    const { GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID, GITHUB_APP_PRIVATE_KEY } = process.env;
    const b64 = (value) => Buffer.from(JSON.stringify(value)).toString("base64url");
    const now = Math.floor(Date.now() / 1000);
    const unsigned = `${b64({ alg: "RS256", typ: "JWT" })}.${b64({ iat: now - 60, exp: now + 540, iss: GITHUB_APP_ID })}`;
    const jwt = `${unsigned}.${sign("RSA-SHA256", Buffer.from(unsigned), GITHUB_APP_PRIVATE_KEY).toString("base64url")}`;

    const res = await fetch(`https://api.github.com/app/installations/${GITHUB_APP_INSTALLATION_ID}/access_tokens`, {
      method: "POST",
      headers: { Authorization: `Bearer ${jwt}`, Accept: "application/vnd.github+json" },
    });
    if (!res.ok) {
      console.error(`GitHub App installation token: ${res.status} ${await res.text()}`);
      process.exit(1);
    }
    process.stdout.write((await res.json()).token);
