apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # the API server calls the Pipelines and pruner admission webhooks
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
    # Alloy scrapes the controller's and the pruner's metrics
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: k8s-monitoring
      toPorts:
        - ports: [{ port: "9090", protocol: TCP }]
    # the wg Gateway's proxy serves the Dashboard
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
      toPorts:
        - ports: [{ port: "9097", protocol: TCP }]
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: tekton-pipelines-resolvers
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
