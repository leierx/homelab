apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: keycloak-tofu
  namespace: keycloak-tofu
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  params:
    - name: apply
      description: '"true" applies the plan, "false" stops after it'
      default: "true"
  workspaces:
    - name: tofu
      mountPath: /config
      readOnly: true
    - name: work
      mountPath: /work
    - name: tmp
      mountPath: /tmp
  stepTemplate:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { memory: 1Gi }
  steps:
    - name: reconcile
      image: ghcr.io/opentofu/opentofu:1.13.1
      env:
        - { name: HOME, value: /tmp }
        - { name: TF_DATA_DIR, value: /tmp/tfdata }
      envFrom:
        - secretRef:
            name: keycloak-tofu
      workingDir: /work
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        # a ConfigMap mount is symlinks; copy the tree, dotfiles included
        cp -rL /config/. /work/
        # Keycloak restarts for upgrades; wait before touching the API (the HTTP port, not management)
        deadline=$((SECONDS + 900))
        until wget -q -O /dev/null --timeout=3 http://keycloak-service.keycloak.svc:8080/realms/homelab; do
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "Keycloak did not answer within 15 minutes" >&2
            exit 1
          fi
          sleep 5
        done
        cd /work
        tofu init -input=false -lockfile=readonly
        # another run may hold the state lock; wait for it instead of failing
        tofu plan -input=false -lock-timeout=15m -out=/tmp/plan
        if [ "$(params.apply)" = "false" ]; then
          echo "apply=false: plan only"
          exit 0
        fi
        tofu apply -input=false -lock-timeout=15m /tmp/plan
