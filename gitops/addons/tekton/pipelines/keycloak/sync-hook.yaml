# every sync of the tekton app starts a run; the Job only creates a TaskRun, so a failing reconcile
# can never fail the sync (whose retry limit is -1)
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-tofu-sync
  namespace: keycloak-tofu
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-tofu-launcher
    spec:
      serviceAccountName: keycloak-tofu-launcher
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        # kept identical to cronjob.yaml by hand: kustomize has no shared helpers
        - name: launch
          image: registry.k8s.io/kubectl:v1.36.4
          args: [create, -f, /template/taskrun.yaml]
          env:
            - { name: HOME, value: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: template, mountPath: /template, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: template
          configMap:
            name: keycloak-tofu-taskrun
        - name: tmp
          emptyDir: {}
