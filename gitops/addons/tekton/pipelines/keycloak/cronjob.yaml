apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-tofu
  namespace: keycloak-tofu
spec:
  schedule: "@daily"
  timeZone: Europe/Oslo
  # a tick missed while loft01 or k3s was down or patching runs when it is back (within 6 h)
  startingDeadlineSeconds: 21600
  concurrencyPolicy: Forbid
  suspend: true
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # no duplicate TaskRuns: the launcher either creates one or the tick is lost
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keycloak-tofu-launcher
        spec:
          serviceAccountName: keycloak-tofu-launcher
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            # kept identical to sync-hook.yaml by hand: kustomize has no shared helpers
            - name: launch
              image: registry.k8s.io/kubectl:v1.36.4
              args: [create, -f, /template/taskrun.yaml]
              env:
                - { name: HOME, value: /tmp }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 64Mi }
              volumeMounts:
                - { name: template, mountPath: /template, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: template
              configMap:
                name: keycloak-tofu-taskrun
            - name: tmp
              emptyDir: {}
