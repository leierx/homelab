# the reconcile reaches Keycloak, its own state, DNS and what tofu init downloads, and nothing else
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: keycloak-tofu
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: keycloak
            app.kubernetes.io/component: server
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    # the DNS rule lets Cilium see the lookups its toFQDNs rule enforces
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchPattern: "*"
    - toEntities: [kube-apiserver]
    - toFQDNs:
        - matchName: registry.opentofu.org
        - matchName: github.com
        - matchName: objects.githubusercontent.com
        - matchName: release-assets.githubusercontent.com
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
