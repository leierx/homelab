# the one TaskRun template every trigger starts; kubectl create -f it
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-tofu-taskrun
  namespace: keycloak-tofu
data:
  taskrun.yaml: |
    apiVersion: tekton.dev/v1
    kind: TaskRun
    metadata:
      generateName: keycloak-tofu-
      namespace: keycloak-tofu
      labels:
        app.kubernetes.io/name: keycloak-tofu
    spec:
      taskRef:
        name: keycloak-tofu
      serviceAccountName: keycloak-tofu
      params:
        - name: apply
          value: "true"
      workspaces:
        - name: tofu
          configMap:
            name: keycloak-tofu-tofu
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      podTemplate:
        securityContext:
          runAsNonRoot: true
          runAsUser: 8737
          seccompProfile:
            type: RuntimeDefault
      timeout: 1h
      retries: 2
