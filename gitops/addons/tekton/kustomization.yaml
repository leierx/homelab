apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - platform
  - dashboard-route.yaml
  - monitoring.yaml
  - network-policy.yaml
patches:
  # two weeks of finished runs, capped; wave 0 so the pruner webhook (wave -1) is up to validate it
  - target: {kind: ConfigMap, name: tekton-pruner-default-spec}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: tekton-pruner-default-spec
        annotations:
          argocd.argoproj.io/sync-wave: "0"
      data:
        global-config: |-
          enforcedConfigLevel: global
          ttlSecondsAfterFinished: 1209600
          successfulHistoryLimit: 20
          failedHistoryLimit: 20
