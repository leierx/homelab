apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - platform
  - dashboard-route.yaml
  - monitoring.yaml
  - network-policy.yaml
patches:
  # two weeks of finished runs, capped; the pruner controller refuses to start without this ConfigMap,
  # so it stays in the platform's wave
  - target: {kind: ConfigMap, name: tekton-pruner-default-spec}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: tekton-pruner-default-spec
      data:
        global-config: |-
          enforcedConfigLevel: global
          ttlSecondsAfterFinished: 1209600
          successfulHistoryLimit: 20
          failedHistoryLimit: 20
