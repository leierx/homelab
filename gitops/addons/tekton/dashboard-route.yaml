apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tekton-dashboard
spec:
  secretName: tekton-dashboard-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - tekton.skinke.net
---
# WireGuard only: the Dashboard starts and deletes runs
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: tekton-dashboard-wg
spec:
  parentRef:
    name: wg
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: tekton.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: tekton-dashboard-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton-dashboard-wg
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: tekton-dashboard-wg
  hostnames:
    - tekton.skinke.net
  rules:
    - backendRefs:
        - name: tekton-dashboard
          port: 9097
      # log streaming is one long request; don't cut it at the gateways' 300 s default
      timeouts:
        request: 0s
---
# WireGuard peers log in to Keycloak (client tekton); only homelab-admins get past the claim rule
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: tekton-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tekton-dashboard-wg
  oidc:
    provider:
      issuer: https://auth.skinke.net/realms/homelab
      # given, not discovered: Envoy Gateway fetches discovery once and never retries, and Keycloak may come up later
      authorizationEndpoint: https://auth.skinke.net/realms/homelab/protocol/openid-connect/auth
      tokenEndpoint: https://auth.skinke.net/realms/homelab/protocol/openid-connect/token
      endSessionEndpoint: https://auth.skinke.net/realms/homelab/protocol/openid-connect/logout
    clientID: tekton
    clientSecret:
      name: tekton-oidc
    redirectURL: https://tekton.skinke.net/oauth2/callback
    logoutPath: /oauth2/logout
    # fixed names so the JWT rule can read the ID token from its cookie
    cookieNames:
      idToken: tekton-id-token
      accessToken: tekton-access-token
  # gateway.envoyproxy.io v1.9.2 API: jwt.providers[].extractFrom.cookies,
  # authorization.rules[].principal.jwt.claims (site/content/en/latest/api/extension_types.md @v1.9.2)
  jwt:
    providers:
      - name: tekton
        issuer: https://auth.skinke.net/realms/homelab
        audiences: [tekton]
        remoteJWKS:
          uri: https://auth.skinke.net/realms/homelab/protocol/openid-connect/certs
        extractFrom:
          cookies: [tekton-id-token]
  authorization:
    defaultAction: Deny
    rules:
      - name: homelab-admins
        action: Allow
        principal:
          jwt:
            provider: tekton
            claims:
              - name: groups
                valueType: StringArray
                values: [homelab-admins]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tekton-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: tekton-oidc
  data:
    - secretKey: client-secret
      remoteRef: { key: loft01/tekton, property: oidc_client_secret }
