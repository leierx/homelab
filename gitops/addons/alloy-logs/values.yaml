alloy:
  alloy:
    configMap: {create: false, name: alloy-logs}
    mounts: {varlog: true}
    envFrom: [{configMapRef: {name: alloy-logs-env}}]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      seccompProfile: {type: RuntimeDefault}
    resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
  rbac: {create: false}
  configReloader:
    resources: {requests: {memory: 16Mi}, limits: {memory: 64Mi}}
  crds: {create: false}
lokiUrl: http://loki.monitoring.svc:3100/loki/api/v1/push
# k3s's audit log; on a cluster without one the pipeline just finds no file
auditLogPath: /var/log/kubernetes/audit.log
