alloy:
  alloy:
    configMap:
      create: false
      name: alloy-logs
      key: config.alloy
    mounts:
      varlog: true
    envFrom:
    - configMapRef:
        name: alloy-logs-env
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  rbac:
    create: false
  controller:
    type: daemonset
  configReloader:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
  crds:
    create: false
lokiUrl: ''
auditLogPath: ''
