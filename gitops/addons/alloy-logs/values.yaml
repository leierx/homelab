alloy:
  alloy:
    configMap:
      create: false
      name: alloy-logs
      key: config.alloy
    # /var/log/pods and the API server's audit log live under /var/log
    mounts:
      varlog: true
    envFrom:
      - configMapRef:
          name: alloy-logs-env
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
  # the chart's default rules are broader than what these components use
  rbac:
    create: false
  controller:
    type: daemonset
  configReloader:
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
  crds:
    create: false

# set by the fleet chart's Applications (and by CI and bootstrap with --set-string)
fleet:
  cluster: ""
# set by the cluster's values file; an empty auditLogPath skips the audit file
lokiUrl: ""
auditLogPath: ""
