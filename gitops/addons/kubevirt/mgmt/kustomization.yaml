apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.1/kubevirt-operator.yaml
  - https://github.com/kubevirt/kubevirt/releases/download/v1.9.1/kubevirt-cr.yaml
patches:
  # single node: a VM can never migrate, so draining or shutting down the node just stops it
  - target:
      kind: KubeVirt
    patch: |
      - op: add
        path: /spec/configuration/evictionStrategy
        value: None
