# default-deny: the browser and the phone arrive through Envoy, Grafana only ever posts a message
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: grafana
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
  egress:
    # Keycloak at auth.skinke.net, which resolves to the public address
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
