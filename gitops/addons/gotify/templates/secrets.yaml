# every ExternalSecret reads from the ClusterSecretStore's conditions, so the namespace is listed there
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gotify
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gotify
  data:
    # generated by the keycloak addon's PushSecret for the `gotify` client
    - secretKey: GOTIFY_OIDC_CLIENTSECRET
      remoteRef: { key: loft01/gotify, property: oidc_client_secret }
