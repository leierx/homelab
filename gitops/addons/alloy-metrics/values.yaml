alloy:
  alloy:
    configMap:
      create: false
      name: alloy-metrics
      key: config.alloy
    # one replica now; clustering is on so a bigger cluster can add more
    clustering:
      enabled: true
      name: alloy-metrics
    envFrom:
      - configMapRef:
          name: alloy-metrics-env
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 2Gi }
  # the chart's default rules are broader than what these components use
  rbac:
    create: false
  controller:
    type: statefulset
    replicas: 1
  configReloader:
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
  # the monitoring.grafana.com CRDs are not used; our configs are plain Alloy
  crds:
    create: false

# set by the fleet chart's Applications (and by CI and bootstrap with --set-string)
fleet:
  cluster: ""
# set by the cluster's values file
mimirUrl: ""
lokiUrl: ""
