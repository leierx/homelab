apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  annotations:
    # telemetry is shared by alloy-logs, kube-state-metrics and node-exporter; this addon owns the
    # labels, the others rely on it. Prune=false keeps it if only this addon is removed.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
