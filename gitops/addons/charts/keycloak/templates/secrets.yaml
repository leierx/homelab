# every value is generated once and stored in OpenBao; IfNotExists never replaces one that exists
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys: [admin_client_secret, leier_password, oidc_client_secret]
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: keycloak
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    {{- range list "admin_client_secret" "leier_password" }}
    - match:
        secretKey: {{ . }}
        remoteRef: { remoteKey: "{{ required "fleet.cluster" $.Values.fleet.cluster }}/keycloak", property: {{ . }} }
    {{- end }}
{{- range $name := .Values.clientSecrets }}
---
# the client secret Keycloak and the app both read
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: oidc-{{ $name }}
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: oidc_client_secret
        remoteRef: { remoteKey: "{{ required "fleet.cluster" $.Values.fleet.cluster }}/{{ $name }}", property: oidc_client_secret }
{{- end }}
---
# the master realm's service client: what the operator bootstraps and the reconcile workflow logs in with
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-bootstrap-admin
    template:
      engineVersion: v2
      data:
        client-id: bootstrap-admin
        client-secret: '{{ `{{ .admin_client_secret }}` }}'
  data:
    - secretKey: admin_client_secret
      remoteRef: { key: "{{ required "fleet.cluster" $.Values.fleet.cluster }}/keycloak", property: admin_client_secret }
---
# what the reconcile CronWorkflow reads: TF_VAR_… for the cluster's OpenTofu root, so write-only values never enter state
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-tofu
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-tofu
  data:
    - secretKey: TF_VAR_keycloak_client_secret
      remoteRef: { key: "{{ required "fleet.cluster" $.Values.fleet.cluster }}/keycloak", property: admin_client_secret }
    - secretKey: TF_VAR_leier_password
      remoteRef: { key: "{{ required "fleet.cluster" $.Values.fleet.cluster }}/keycloak", property: leier_password }
    - secretKey: TF_VAR_argocd_client_secret
      remoteRef: { key: "{{ required "fleet.cluster" $.Values.fleet.cluster }}/argocd", property: oidc_client_secret }
    - secretKey: TF_VAR_grafana_client_secret
      remoteRef: { key: "{{ required "fleet.cluster" $.Values.fleet.cluster }}/grafana", property: oidc_client_secret }
    - secretKey: TF_VAR_immich_client_secret
      remoteRef: { key: "{{ required "fleet.cluster" $.Values.fleet.cluster }}/immich", property: oidc_client_secret }
    - secretKey: TF_VAR_edge_client_secret
      remoteRef: { key: "{{ required "fleet.cluster" $.Values.fleet.cluster }}/edge", property: oidc_client_secret }
    - secretKey: TF_VAR_argo_workflows_client_secret
      remoteRef: { key: "{{ required "fleet.cluster" $.Values.fleet.cluster }}/argo-workflows", property: oidc_client_secret }
