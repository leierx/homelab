apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argo-workflows
spec:
  secretName: argo-workflows-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - {{ required "host" .Values.host }}
---
# WireGuard only; the UI runs workflows and is on nobody's public list
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: argo-workflows-wg
spec:
  parentRef:
    name: wg
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ required "host" .Values.host }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: argo-workflows-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-workflows-wg
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: argo-workflows-wg
  hostnames:
    - {{ required "host" .Values.host }}
  rules:
    - backendRefs:
        - name: argo-workflows-server
          port: 2746
