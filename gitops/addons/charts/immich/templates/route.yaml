apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: immich
spec:
  secretName: immich-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - photos.skinke.net
{{- range $gw := list "edge" "wg" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: immich-{{ $gw }}
spec:
  parentRef:
    name: {{ $gw }}
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: photos.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: immich-tls
---
# public without the edge login: the phone app can't get through it, so Immich's own SSO login guards it
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-{{ $gw }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: immich-{{ $gw }}
  hostnames:
    - photos.skinke.net
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283
      # no 15 s cap (Envoy's default) on downloading or streaming a large original
      timeouts:
        request: 0s
{{- end }}
