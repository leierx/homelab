# default-deny; each part reaches only what it needs (DNS and metrics scraping come from the cluster baseline)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: server
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
      toPorts:
        - ports: [{ port: "2283", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: immich-db
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: immich-valkey
      toPorts:
        - ports: [{ port: "6379", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: immich-machine-learning
      toPorts:
        - ports: [{ port: "3003", protocol: TCP }]
    # Keycloak at the issuer hostname, which resolves to the public address
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: machine-learning
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: immich-machine-learning
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: immich-server
      toPorts:
        - ports: [{ port: "3003", protocol: TCP }]
  egress:
    # models from Hugging Face, on first use
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: valkey
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: immich-valkey
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: immich-server
      toPorts:
        - ports: [{ port: "6379", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgres
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: immich-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: immich-server
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    # the CloudNativePG operator checks the instance's status endpoint
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
  egress:
    # the instance manager
    - toEntities: [kube-apiserver]
