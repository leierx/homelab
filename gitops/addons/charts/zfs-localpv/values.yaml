zfs-localpv:
  analytics:
    enabled: false
  # the chart gives every container of a pod the same resources
  zfsController:
    resources:
      requests: { cpu: 5m, memory: 16Mi }
      limits: { memory: 128Mi }
  zfsNode:
    resources:
      requests: { cpu: 5m, memory: 16Mi }
      limits: { memory: 256Mi }
pools: []
