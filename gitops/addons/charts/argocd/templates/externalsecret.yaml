apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  annotations:
    # Argo CD syncs itself; don't let a missing ESO CRD block that
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: argocd-oidc
    template:
      metadata:
        labels:
          # lets argocd-cm reference it as $argocd-oidc:clientSecret
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientSecret
      remoteRef: { key: loft01/argocd, property: oidc_client_secret }
