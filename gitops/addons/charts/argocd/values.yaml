argo-cd:
  configs:
    cm:
      # SSO only; the local admin account is disabled (docs/break-glass.md)
      admin.enabled: "false"
    params:
      # TLS ends at the edge Gateway
      server.insecure: true
      # diff against what the API server stores, so CRD defaults (HTTPRoute matches, parentRef group/kind) aren't drift
      controller.diff.server.side: true
    rbac:
      policy.csv: |
        g, homelab-admins, role:admin
        g, homelab-operators, role:admin
        g, homelab-viewers, role:readonly
  dex:
    enabled: false
  notifications:
    enabled: false
  controller:
    metrics: { enabled: true, serviceMonitor: { enabled: true } }
    resources:
      requests: { cpu: 250m, memory: 768Mi }
      limits: { memory: 2Gi }
  repoServer:
    metrics: { enabled: true, serviceMonitor: { enabled: true } }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 1Gi }
    copyutil:
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 64Mi }
  server:
    metrics: { enabled: true, serviceMonitor: { enabled: true } }
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
  applicationSet:
    metrics: { enabled: true, serviceMonitor: { enabled: true } }
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }
  redis:
    # redis never talks to the Kubernetes API
    automountServiceAccountToken: false
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 256Mi }
  redisSecretInit:
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }

# this site's hostname; the URL and the OIDC issuer that repeat it are upstream chart values
host: ""

# set by the fleet chart's Applications (and by CI and bootstrap with --set-string)
fleet:
  cluster: ""
