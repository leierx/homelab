apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints: [{}]
    # Alloy pushes metrics and logs
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: k8s-monitoring
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
  egress:
    - toEndpoints: [{}]
    # Grafana's sidecars watch ConfigMaps
    - toEntities: [kube-apiserver]
    # Grafana: the Keycloak token endpoint (its hostname resolves publicly) and grafana.com dashboards
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
