# set by the addons ApplicationSet
cluster:
  name: ""
  groups: []

repoURL: https://github.com/leierx/homelab.git
targetRevision: HEAD
syncOptions:
  - CreateNamespace=true
  - ServerSideApply=true

# every addon in addons/charts/, switched off; groups and clusters switch them on
addons:
  # cluster-scoped admission policies; the namespace only hosts the Helm release
  admission:
    enabled: false
    namespace: kube-system
  argocd:
    enabled: false
    namespace: argocd
    podSecurity: restricted
  argo-workflows:
    enabled: false
    namespace: argo
    podSecurity: restricted
  capi-argo-bridge:
    enabled: false
    namespace: argocd
  cdi:
    enabled: false
    namespace: cdi
    kustomize: true
  cert-manager:
    enabled: false
    namespace: cert-manager
    podSecurity: restricted
  # the agent and envoy run on the host network; the cluster-wide default (baseline) would refuse them
  cilium:
    enabled: false
    namespace: kube-system
    podSecurity: privileged
  cloudnative-pg:
    enabled: false
    namespace: cnpg-system
    podSecurity: restricted
  cluster-api:
    enabled: false
    namespace: capi-operator-system
    podSecurity: restricted
  envoy-gateway:
    enabled: false
    namespace: envoy-gateway-system
    podSecurity: restricted
  external-secrets:
    enabled: false
    namespace: external-secrets
    podSecurity: restricted
  immich:
    enabled: false
    namespace: immich
    podSecurity: restricted
  # node-exporter and the pod-log DaemonSet need host namespaces and hostPath mounts
  k8s-monitoring:
    enabled: false
    namespace: k8s-monitoring
    podSecurity: privileged
  # the namespace comes from the keycloak-operator addon, which labels it restricted
  keycloak:
    enabled: false
    namespace: keycloak
  keycloak-operator:
    enabled: false
    namespace: keycloak
    kustomize: true
  kubevirt:
    enabled: false
    namespace: kubevirt
    kustomize: true
  observability:
    enabled: false
    namespace: monitoring
    podSecurity: restricted
  openbao:
    enabled: false
    namespace: openbao
    podSecurity: restricted
  prometheus-operator-crds:
    enabled: false
    namespace: monitoring
  # cluster-scoped RBAC for people; the namespace only hosts the Helm release
  rbac:
    enabled: false
    namespace: kube-system
  renovate:
    enabled: false
    namespace: renovate
    podSecurity: restricted
  # the node plugin is privileged with hostPath mounts; the cluster-wide default (baseline) would refuse it
  zfs-localpv:
    enabled: false
    namespace: openebs
    podSecurity: privileged
