apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # Keycloak's own traffic: Postgres, JGroups
    - fromEndpoints: [{}]
    # the realm reconcile (keycloak-tofu), on the HTTP port only
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: keycloak-tofu
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    # the CloudNativePG operator checks the instance's status endpoint
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
  egress:
    - toEndpoints: [{}]
    # the Keycloak operator and the Postgres instance manager
    - toEntities: [kube-apiserver]
