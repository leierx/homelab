# applies the realm config; a new name per config, so a change in git runs it again (delete the Job to re-run)
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config-{{ include (print $.Template.BasePath "/realm.yaml") . | sha256sum | trunc 8 }}
spec:
  # retries until Keycloak is up on a fresh cluster
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-config-cli
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak-config-cli
          image: docker.io/adorsys/keycloak-config-cli:{{ .Values.configCli.tag }}
          env:
            - { name: KEYCLOAK_URL, value: "http://keycloak-service:8080" }
            - { name: KEYCLOAK_LOGINREALM, value: master }
            - { name: KEYCLOAK_GRANTTYPE, value: client_credentials }
            - { name: KEYCLOAK_CLIENTID, value: bootstrap-admin }
            - { name: KEYCLOAK_AVAILABILITYCHECK_ENABLED, value: "true" }
            - { name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT, value: 300s }
            - { name: IMPORT_FILES_LOCATIONS, value: "file:/config/*" }
            - { name: IMPORT_VARSUBSTITUTION_ENABLED, value: "true" }
            # always apply, so a rotated secret lands with a re-run of the same config
            - { name: IMPORT_CACHE_ENABLED, value: "false" }
            - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=75" }
          envFrom:
            - secretRef:
                name: keycloak-config
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: keycloak-realm
