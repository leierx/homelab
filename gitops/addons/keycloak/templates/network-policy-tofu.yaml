# the reconcile pod reaches Keycloak, DNS, the OpenTofu registry, and the API server for its state
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keycloak-tofu
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-tofu
  enableDefaultDeny:
    ingress: true
    egress: true
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: keycloak
            app.kubernetes.io/name: keycloak
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
    - toEntities: [kube-apiserver]
    # registry.opentofu.org and the provider release downloads
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
