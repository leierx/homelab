# every value is generated once and stored in OpenBao; IfNotExists never replaces one that exists
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys: [admin_password, admin_client_secret, leier_password, oidc_client_secret]
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: keycloak
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    {{- range list "admin_password" "admin_client_secret" "leier_password" }}
    - match:
        secretKey: {{ . }}
        remoteRef: { remoteKey: loft01/keycloak, property: {{ . }} }
    {{- end }}
{{- range $name, $client := .Values.oidcClients }}
{{- if not $client.public }}
---
# the client secret Keycloak and the app both read
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: oidc-{{ $name }}
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: oidc_client_secret
        remoteRef: { remoteKey: loft01/{{ $name }}, property: oidc_client_secret }
{{- end }}
{{- end }}
---
# master realm's admin user (break-glass, docs/break-glass.md) and service client (keycloak-config-cli)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-bootstrap-admin
    template:
      mergePolicy: Merge
      data:
        username: admin
        client-id: bootstrap-admin
  data:
    - secretKey: password
      remoteRef: { key: loft01/keycloak, property: admin_password }
    - secretKey: client-secret
      remoteRef: { key: loft01/keycloak, property: admin_client_secret }
---
# what the realm config substitutes: $(env:LEIER_PASSWORD), $(env:OIDC_<NAME>_CLIENT_SECRET)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-config
  data:
    - secretKey: KEYCLOAK_CLIENTSECRET
      remoteRef: { key: loft01/keycloak, property: admin_client_secret }
    - secretKey: LEIER_PASSWORD
      remoteRef: { key: loft01/keycloak, property: leier_password }
    {{- range $name, $client := .Values.oidcClients }}
    {{- if not $client.public }}
    - secretKey: OIDC_{{ $name | upper | replace "-" "_" }}_CLIENT_SECRET
      remoteRef: { key: loft01/{{ $name }}, property: oidc_client_secret }
    {{- end }}
    {{- end }}
