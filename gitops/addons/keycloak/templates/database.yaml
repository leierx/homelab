apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  annotations:
    # the realm's users and their second factors; removing the addon must not drop them
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:{{ .Values.postgres.tag }}
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  storage:
    storageClass: {{ required "postgres.storageClass" .Values.postgres.storageClass }}
    size: {{ required "postgres.size" .Values.postgres.size }}
  postgresql:
    parameters:
      # Keycloak asks for at most 20 connections; the server keeps headroom for the operator and pg_dump
      max_connections: "60"
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor" }}
---
# only once prometheus-operator's CRDs exist, so a missing CRD can't block the sync
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: keycloak-db
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: keycloak-db
  podMetricsEndpoints:
    - port: metrics
{{- end }}
