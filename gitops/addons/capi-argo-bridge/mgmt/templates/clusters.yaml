# all workload clusters (CAPI Clusters and their Secrets) live in this namespace; the bridge reads only here
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.clusterNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capi-argo-bridge
  namespace: {{ .Values.clusterNamespace }}
rules:
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capi-argo-bridge
  namespace: {{ .Values.clusterNamespace }}
subjects:
  - kind: ServiceAccount
    name: capi-argo-bridge
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: capi-argo-bridge
  apiGroup: rbac.authorization.k8s.io
