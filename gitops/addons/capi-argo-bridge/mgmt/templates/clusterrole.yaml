apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capi-argo-bridge
rules:
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capi-argo-bridge
subjects:
  - kind: ServiceAccount
    name: capi-argo-bridge
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: capi-argo-bridge
  apiGroup: rbac.authorization.k8s.io
