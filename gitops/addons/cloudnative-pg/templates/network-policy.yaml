apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # admission webhook
    - fromEntities: [kube-apiserver]
  egress:
    - toEntities: [kube-apiserver]
    # every Postgres instance's status endpoint, wherever its Cluster lives
    - toEndpoints:
        - matchExpressions:
            - { key: k8s:io.kubernetes.pod.namespace, operator: Exists }
            - { key: cnpg.io/cluster, operator: Exists }
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
