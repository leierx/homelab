authentik:
  authentik:
    disable_startup_analytics: true
    disable_update_check: true
    web:
      base_url: https://auth.skinke.net
    postgresql:
      host: authentik-db-rw
  global:
    # secrets only; the chart's own Secret carries the rest of the config
    envFrom:
      - secretRef:
          name: authentik-env
    env:
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-db-app
            key: password
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
  blueprints:
    configMaps:
      - authentik-default-locale
      - authentik-access
      - authentik-mfa
      - authentik-enrollment
      - authentik-oidc-clients
  server:
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 2Gi }
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
  worker:
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 2Gi }
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
# one Authentik OIDC provider + application each; client secret from OpenBao mgmt/<name> oidc_client_secret
oidcClients:
  argocd:
    launchURL: https://argocd.skinke.net
    redirectURIs:
      - https://argocd.skinke.net/auth/callback
      - http://localhost:8085/auth/callback
  grafana:
    launchURL: https://metrics.skinke.net
    redirectURIs:
      - https://metrics.skinke.net/login/generic_oauth
  # Envoy Gateway's login in front of the public sites (SecurityPolicy edge-oidc); not an app
  edge:
    launchURL: blank://blank
    redirectURIs:
      - https://argocd.skinke.net/oauth2/callback
      - https://metrics.skinke.net/oauth2/callback
