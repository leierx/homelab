apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik
spec:
  secretName: authentik-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - auth.skinke.net
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: authentik
spec:
  parentRef:
    name: edge
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: auth.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: authentik-tls
