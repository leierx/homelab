apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-default-locale
data:
  default-locale.yaml: |
    version: 1
    metadata:
      name: homelab - Default locale
    entries:
      # editing the default brand before it exists would create a brand without flows
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Brand
      - model: authentik_brands.brand
        identifiers:
          default: true
        attrs:
          attributes:
            settings:
              locale: en
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-sso
data:
  homelab-admins.yaml: |
    version: 1
    metadata:
      name: homelab - Admins
    entries:
      # akadmin must exist first, or this would create it without its bootstrap password
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: authentik Bootstrap
      - model: authentik_core.group
        id: homelab-admins
        identifiers:
          name: homelab-admins
        attrs:
          is_superuser: true
      - model: authentik_core.user
        identifiers:
          username: akadmin
        attrs:
          groups:
            - !Find [authentik_core.group, [name, authentik Admins]]
            - !KeyOf homelab-admins
  oidc-clients.yaml: |
    version: 1
    metadata:
      name: homelab - OIDC clients
    entries:
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider authorization flow (implicit consent)
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider invalidation flow
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: System - OAuth2 Provider - Scopes
      - model: authentik_providers_oauth2.scopemapping
        id: scope-groups
        identifiers:
          name: "homelab: OpenID 'groups'"
        attrs:
          scope_name: groups
          description: Group membership
          expression: |
            return {"groups": [group.name for group in request.user.all_groups()]}
      {{- range $name, $client := .Values.oidcClients }}
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-{{ $name }}
        identifiers:
          name: {{ $name }}
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # Authentik's model default is an empty list, so it must be set explicitly
          grant_types:
            - authorization_code
            - refresh_token
          client_id: {{ $name }}
          client_secret: !Env OIDC_{{ $name | upper | replace "-" "_" }}_CLIENT_SECRET
          # asymmetric, so clients can verify tokens against the JWKS
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            {{- range $client.redirectURIs }}
            - matching_mode: strict
              url: {{ . }}
            {{- end }}
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf scope-groups
      - model: authentik_core.application
        identifiers:
          slug: {{ $name }}
        attrs:
          name: {{ $name }}
          provider: !KeyOf provider-{{ $name }}
          meta_launch_url: {{ $client.launchURL }}
      {{- end }}
