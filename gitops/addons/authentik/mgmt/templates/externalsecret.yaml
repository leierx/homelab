apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: authentik-env
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef: { key: mgmt/authentik, property: secret_key }
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef: { key: mgmt/authentik, property: bootstrap_password }
    - secretKey: LEIER_PASSWORD
      remoteRef: { key: mgmt/authentik, property: leier_password }
    {{- range $name, $client := .Values.oidcClients }}
    {{- if not $client.public }}
    - secretKey: OIDC_{{ $name | upper | replace "-" "_" }}_CLIENT_SECRET
      remoteRef: { key: mgmt/{{ $name }}, property: oidc_client_secret }
    {{- end }}
    {{- end }}
