apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-default-locale
data:
  default-locale.yaml: |
    version: 1
    metadata:
      name: homelab - Default locale
    entries:
      # editing the default brand before it exists would create a brand without flows
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Brand
      - model: authentik_brands.brand
        identifiers:
          default: true
        attrs:
          attributes:
            settings:
              locale: en
