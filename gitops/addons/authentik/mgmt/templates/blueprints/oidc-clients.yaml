apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-oidc-clients
data:
  oidc-clients.yaml: |
    version: 1
    metadata:
      name: homelab - OIDC clients
    entries:
      # the tier groups the applications are bound to
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: homelab - Access control
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider authorization flow (implicit consent)
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider invalidation flow
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: System - OAuth2 Provider - Scopes
      {{- range $name, $client := .Values.oidcClients }}
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-{{ $name }}
        identifiers:
          name: {{ $name }}
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # Authentik's model default is an empty list, so it must be set explicitly
          grant_types:
            - authorization_code
            - refresh_token
          client_id: {{ $name }}
          client_secret: !Env OIDC_{{ $name | upper | replace "-" "_" }}_CLIENT_SECRET
          # asymmetric, so clients can verify tokens against the JWKS
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          redirect_uris:
            {{- range $client.redirectURIs }}
            - matching_mode: strict
              url: {{ . }}
            {{- end }}
          # the profile scope carries the groups claim (direct memberships)
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      - model: authentik_core.application
        id: app-{{ $name }}
        identifiers:
          slug: {{ $name }}
        attrs:
          name: {{ $name }}
          provider: !KeyOf provider-{{ $name }}
          meta_launch_url: {{ $client.launchURL }}
          policy_engine_mode: any
      # only the access tiers may use the app; anyone else is refused at Authentik
      {{- range $i, $group := list "homelab-admins" "homelab-operators" "homelab-viewers" }}
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-{{ $name }}
          group: !Find [authentik_core.group, [name, {{ $group }}]]
        attrs:
          order: {{ mul $i 10 }}
      {{- end }}
      {{- end }}
