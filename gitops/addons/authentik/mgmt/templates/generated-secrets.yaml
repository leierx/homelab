# every value is generated once and stored in OpenBao; IfNotExists never replaces one that exists
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys: [secret_key, bootstrap_password, leier_password, oidc_client_secret]
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: authentik
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    {{- range list "secret_key" "bootstrap_password" "leier_password" }}
    - match:
        secretKey: {{ . }}
        remoteRef: { remoteKey: mgmt/authentik, property: {{ . }} }
    {{- end }}
{{- range $name, $_ := .Values.oidcClients }}
---
# the client secret Authentik and the app both read
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: oidc-{{ $name }}
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: oidc_client_secret
        remoteRef: { remoteKey: mgmt/{{ $name }}, property: oidc_client_secret }
{{- end }}
