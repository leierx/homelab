apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-access
data:
  access.yaml: |
    version: 1
    metadata:
      name: homelab - Access control
    entries:
      # akadmin must exist first, or this would create it without its bootstrap password
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: authentik Bootstrap
      # group is_superuser makes every member an Authentik superuser
      - model: authentik_core.group
        id: homelab-admins
        identifiers:
          name: homelab-admins
        attrs:
          is_superuser: true
      - model: authentik_core.group
        id: homelab-operators
        identifiers:
          name: homelab-operators
      - model: authentik_core.group
        id: homelab-viewers
        identifiers:
          name: homelab-viewers
      # disabled, not deleted (the bootstrap blueprint would recreate it); break-glass is `just authentik-recover`.
      # Its own email, since Grafana enforces unique emails but looks OAuth users up by login.
      - model: authentik_core.user
        identifiers:
          username: akadmin
        attrs:
          is_active: false
          email: akadmin@skinke.net
          groups:
            - !Find [authentik_core.group, [name, authentik Admins]]
            - !KeyOf homelab-admins
      # personal account; password comes from OpenBao mgmt/authentik leier_password
      - model: authentik_core.user
        identifiers:
          username: leier
        attrs:
          name: Lars Smith Eier
          email: larssmitheier@protonmail.com
          password: !Env LEIER_PASSWORD
          groups:
            - !KeyOf homelab-admins
