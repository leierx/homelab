apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - fromEndpoints: [{}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
      toPorts:
        - ports: [{ port: "9000", protocol: TCP }]
    # the CloudNativePG operator checks the instance's status endpoint
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
  egress:
    - toEndpoints: [{}]
    # the Postgres instance manager, and Authentik's Kubernetes integration
    - toEntities: [kube-apiserver]
    # avatars are looked up on Gravatar (tenant setting `gravatar,initials`, not blueprintable)
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
