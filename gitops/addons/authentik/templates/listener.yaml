apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik
spec:
  secretName: authentik-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  dnsNames:
    - auth.skinke.net
{{- range $gw := list "edge" "wg" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: authentik-{{ $gw }}
spec:
  parentRef:
    name: {{ $gw }}
    namespace: envoy-gateway-system
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: auth.skinke.net
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: authentik-tls
{{- end }}
---
# public: only the OIDC endpoints and flow interface; admin, user UI, the rest of the API and recovery are wg-only
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-edge
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: authentik-edge
  hostnames:
    - auth.skinke.net
  rules:
    - matches:
        {{- range list "/application/o/" "/flows/" "/if/flow/" "/api/v3/flows/executor/" "/ws/client/" "/static/" "/media/" }}
        - path: { type: PathPrefix, value: {{ . }} }
        {{- end }}
      backendRefs:
        - name: authentik-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-wg
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: authentik-wg
  hostnames:
    - auth.skinke.net
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
