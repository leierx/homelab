gateway-helm:
  certgen:
    job:
      resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
netpol:
  # the controller serves xDS to the proxies
  sameNamespace: true
  apiServer: true
  # the controller fetches OIDC discovery, the proxies exchange codes at the Keycloak issuer (public address)
  world: [443]
