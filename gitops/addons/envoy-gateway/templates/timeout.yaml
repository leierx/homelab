# Envoy's default (15 s) cuts long downloads; a route's own timeouts still win
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: default-request-timeout
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: wg
  timeout:
    http:
      requestTimeout: 300s
