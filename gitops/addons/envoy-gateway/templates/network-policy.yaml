apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
spec:
  endpointSelector: {}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    # the controller serves xDS to the proxies
    - fromEndpoints: [{}]
  egress:
    - toEndpoints: [{}]
    - toEntities: [kube-apiserver]
    # the controller fetches OIDC discovery, the proxies exchange codes at auth.skinke.net (public address)
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
---
# the sites' traffic: the port forward and WireGuard peers arrive as world, the host's own requests as host
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: proxies
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
  ingress:
    - fromEntities: [world, host]
      toPorts:
        - ports:
            - { port: "10080", protocol: TCP }
            - { port: "10443", protocol: TCP }
  egress:
    {{- range $ns, $port := dict "argocd" "8080" "gotify" "8080" "immich" "2283" "keycloak" "8080" "monitoring" "3000" "ntfy" "8080" }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns }}
      toPorts:
        - ports: [{ port: "{{ $port }}", protocol: TCP }]
    {{- end }}
    # ACME HTTP-01 solvers (cert-manager), in whichever namespace the Certificate is
    - toEndpoints:
        - matchExpressions:
            - { key: k8s:io.kubernetes.pod.namespace, operator: Exists }
            - { key: acme.cert-manager.io/http01-solver, operator: In, values: ["true"] }
      toPorts:
        - ports: [{ port: "8089", protocol: TCP }]
