# generated once into OpenBao: leier's login for the phone app, and Grafana's publish token. Grafana
# only ever uses its token, but ntfy wants a password hash for every user.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random
spec:
  length: 48
  symbols: 0
  allowRepeat: true
  secretKeys: [leier_password, grafana_password]
---
# ntfy tokens are tk_ plus 29 lowercase letters and digits
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: token
spec:
  length: 29
  symbols: 0
  noUpper: true
  allowRepeat: true
  prefix: tk_
  secretKeys: [grafana_token]
{{- range $gen, $keys := dict "random" (list "leier_password" "grafana_password") "token" (list "grafana_token") }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ntfy-{{ $gen }}
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: {{ $gen }}
  data:
    {{- range $keys }}
    - match:
        secretKey: {{ . }}
        remoteRef: { remoteKey: loft01/ntfy, property: {{ . }} }
    {{- end }}
{{- end }}
---
# users, ACL and tokens are provisioned from the environment on every start; anything else is denied
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ntfy-auth
    template:
      engineVersion: v2
      data:
        NTFY_AUTH_USERS: {{ `leier:{{ .leier_password | bcrypt }}:admin,grafana:{{ .grafana_password | bcrypt }}:user` | quote }}
        NTFY_AUTH_ACCESS: grafana:alerts:wo
        NTFY_AUTH_TOKENS: {{ `grafana:{{ .grafana_token }}:grafana` | quote }}
  data:
    {{- range list "leier_password" "grafana_password" "grafana_token" }}
    - secretKey: {{ . }}
      remoteRef: { key: loft01/ntfy, property: {{ . }} }
    {{- end }}
