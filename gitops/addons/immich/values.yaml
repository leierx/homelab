# Upstream chart values (dependency "immich"). Our own keys below it configure the
# database, the PVCs, the routes and the config ExternalSecret that the chart does not manage.
immich:
  # controller-specific pod options (Valkey's uid) merge with the defaults below
  defaultPodOptionsStrategy: merge
  # shared by every component unless a component overrides it
  controllers:
    main:
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

  server:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-server
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
              tag: v3.3.5
            env:
              # the database keeps its credentials in its own Secret
              DB_URL:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-app
                    key: uri
              # the first admin comes from the immich_role claim, never from public sign-up
              IMMICH_ALLOW_SETUP: "false"
              # for photos whose metadata has no time zone
              TZ: Europe/Oslo
            resources:
              requests: { cpu: 500m, memory: 1Gi }
              limits: { memory: 8Gi }

  machine-learning:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-machine-learning
              tag: v3.3.5
            resources:
              requests: { cpu: 500m, memory: 1Gi }
              limits: { memory: 8Gi }
    persistence:
      cache:
        type: persistentVolumeClaim
        existingClaim: model-cache

  valkey:
    enabled: true
    controllers:
      main:
        pod:
          securityContext:
            runAsUser: 999
        containers:
          main:
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 512Mi }

  immich:
    metrics:
      enabled: true
    persistence:
      library:
        existingClaim: library
    # a config change needs a rollout restart; see docs/immich.md
    existingConfiguration: immich-config
    configurationKind: Secret

postgres:
  tag: 18.6-standard-trixie
  storageClass: ''
  size: ''
vchord:
  version: 1.1.1
host: ''
keycloakHost: ''
library:
  storageClass: ''
  size: ''
modelCache:
  storageClass: ''
  size: ''
certificateIssuer: letsencrypt-prod
