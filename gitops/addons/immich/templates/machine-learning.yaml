apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-machine-learning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-machine-learning
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: immich-machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:{{ .Values.immich.tag }}
          ports:
            - { name: http, containerPort: 3003 }
          startupProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /ping, port: http }
          readinessProbe:
            httpGet: { path: /ping, port: http }
          volumeMounts:
            - { name: cache, mountPath: /cache }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 8Gi }
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
spec:
  selector:
    app.kubernetes.io/name: immich-machine-learning
  ports:
    - { name: http, port: 3003, targetPort: http }
