apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
spec:
  replicas: 1
  # the library is an RWO volume
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:{{ .Values.immich.tag }}
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef: { name: immich-db-app, key: uri }
            - { name: REDIS_HOSTNAME, value: immich-valkey }
            - { name: IMMICH_CONFIG_FILE, value: /config/immich-config.yaml }
            # the first admin comes from the immich_role claim, never from the public admin sign-up
            - { name: IMMICH_ALLOW_SETUP, value: "false" }
            - { name: IMMICH_TELEMETRY_INCLUDE, value: all }
            # for photos whose metadata has no time zone
            - { name: TZ, value: Europe/Oslo }
          ports:
            - { name: http, containerPort: 2283 }
            - { name: metrics-api, containerPort: 8081 }
            - { name: metrics-ms, containerPort: 8082 }
          startupProbe:
            httpGet: { path: /api/server/ping, port: http }
            periodSeconds: 10
            # the first start loads the reverse-geocoding data into Postgres
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /api/server/ping, port: http }
          readinessProbe:
            httpGet: { path: /api/server/ping, port: http }
          volumeMounts:
            - { name: library, mountPath: /data }
            - { name: config, mountPath: /config, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 8Gi }
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: library
        - name: config
          secret:
            secretName: {{ include "immich.configName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  labels:
    app.kubernetes.io/name: immich-server
spec:
  selector:
    app.kubernetes.io/name: immich-server
  ports:
    - { name: http, port: 2283, targetPort: http }
    - { name: metrics-api, port: 8081, targetPort: metrics-api }
    - { name: metrics-ms, port: 8082, targetPort: metrics-ms }
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor" }}
---
# the API and the job workers (microservices) each export their own metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  endpoints:
    - port: metrics-api
    - port: metrics-ms
{{- end }}
