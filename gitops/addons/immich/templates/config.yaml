# the file can't read the environment, so ESO renders it with the client secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      engineVersion: v2
      data:
        immich-config.yaml: |
          {{- include "immich.config" . | nindent 10 }}
  data:
    - secretKey: oidc_client_secret
      remoteRef: { key: {{ required "fleet.cluster" .Values.fleet.cluster }}/immich, property: oidc_client_secret }
