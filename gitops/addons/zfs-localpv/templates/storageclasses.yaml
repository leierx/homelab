{{- range .Values.pools }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .storageClass }}
  {{- if .default }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: zfs.csi.openebs.io
parameters:
  poolname: {{ .name }}
  {{- if .dataset }}
  # a ZFS filesystem per PVC: the size is a refquota (snapshots don't count), reserved like a zvol
  fstype: zfs
  recordsize: {{ .dataset.recordsize }}
  quotatype: refquota
  thinprovision: "no"
  {{- else }}
  fstype: ext4
  {{- end }}
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
{{- end }}
