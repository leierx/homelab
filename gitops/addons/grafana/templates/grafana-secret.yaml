apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana
    template:
      mergePolicy: Merge
      data:
        admin-user: admin
  data:
    - secretKey: admin-password
      remoteRef:
        key: "{{ required "global.fleet.cluster" .Values.global.fleet.cluster }}/grafana"
        property: admin_password
    - secretKey: oidc-client-secret
      remoteRef:
        key: "{{ required "global.fleet.cluster" .Values.global.fleet.cluster }}/grafana"
        property: oidc_client_secret
---
# generated once into OpenBao; the OIDC client secret next to it comes from the keycloak addon
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random
spec:
  length: 64
  symbols: 0
  allowRepeat: true
  secretKeys: [admin_password]
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao-push
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: random
  data:
    - match:
        secretKey: admin_password
        remoteRef: { remoteKey: "{{ required "global.fleet.cluster" .Values.global.fleet.cluster }}/grafana", property: admin_password }
