grafana:
  fullnameOverride: grafana
  testFramework: {enabled: false}
  admin: {existingSecret: grafana}
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {secretKeyRef: {name: grafana, key: oidc-client-secret}}
  grafana.ini:
    server:
      root_url: https://%(domain)s/
    auth: {disable_login_form: true}
    auth.basic: {enabled: false}
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      client_id: grafana
      scopes: openid email profile
      use_pkce: true
      allow_sign_up: true
      allow_assign_grafana_admin: true
      login_attribute_path: preferred_username
      role_attribute_path: contains(groups, 'homelab-admins') && 'GrafanaAdmin' || contains(groups, 'homelab-operators') && 'Editor' || contains(groups, 'homelab-viewers') && 'Viewer' || ''
      role_attribute_strict: true
  deploymentStrategy: {type: Recreate}
  persistence:
    enabled: true
    annotations: {argocd.argoproj.io/sync-options: 'Delete=false,Prune=false'}
  initChownData: {enabled: false}
  securityContext:
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 1Gi}}
  downloadDashboards:
    resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
  serviceMonitor: {enabled: true}
  sidecar:
    resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 256Mi}}
    dashboards:
      enabled: true
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      skipReload: true
      provider: {foldersFromFilesStructure: true}
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir
          uid: mimir
          type: prometheus
          url: http://mimir:8080/prometheus
          isDefault: true
          jsonData: {prometheusType: Mimir, httpMethod: POST, timeInterval: 60s}
        - {name: Loki, uid: loki, type: loki, url: 'http://loki:3100'}
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - {name: kubernetes, folder: Kubernetes, type: file, options: {path: /var/lib/grafana/dashboards/kubernetes}}
        - {name: platform, folder: Platform, type: file, options: {path: /var/lib/grafana/dashboards/platform}}
  # grafana.com dashboards, downloaded at startup
  dashboards:
    kubernetes:
      k8s-views-global: {gnetId: 15757, revision: 43}
      k8s-views-namespaces: {gnetId: 15758, revision: 46}
      k8s-views-nodes: {gnetId: 15759, revision: 40}
      k8s-views-pods: {gnetId: 15760, revision: 41}
      k8s-system-api-server: {gnetId: 15761, revision: 21}
      node-exporter-full: {gnetId: 1860, revision: 45}
    platform:
      argocd-operational: {gnetId: 19993, revision: 9}
      argocd-application: {gnetId: 19974, revision: 8}
      cert-manager: {gnetId: 20842, revision: 3}
      envoy-gateway: {gnetId: 24460}
  # the alert rules: templates/alert-rules.yaml (the chart passes the name through tpl)
  extraConfigmapMounts:
    - name: alert-rules
      configMap: '{{ include "homelab.alerts.configMap" . }}'
      mountPath: /etc/grafana/provisioning/alerting
      readOnly: true
certificateIssuer: letsencrypt-prod
