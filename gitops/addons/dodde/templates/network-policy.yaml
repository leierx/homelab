apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vm-isolation
  namespace: dodde
spec:
  # every VM's pod, not CDI's importer, which needs cluster DNS for the image URL
  endpointSelector:
    matchLabels:
      kubevirt.io: virt-launcher
  egressDeny:
    # the baseline CCNP allows cluster DNS to every pod; deny beats allow
    - toEntities: [cluster]
