# the policy's name and the pods it selects; by default the whole namespace
name: default
endpointSelector: {}
# the namespace's own pods, both ways
sameNamespace: false
# ingress from the API server, for admission webhooks
webhook: false
# ingress from the Envoy Gateway proxies, on these ports
gateway: []
# egress to the API server
apiServer: false
# egress to cluster DNS; the cluster-wide baseline in addons/cilium allows it to every pod already
dns: false
# egress to the internet, on these TCP ports
world: []
# CiliumNetworkPolicy rules, after the ones above
ingress: []
egress: []
