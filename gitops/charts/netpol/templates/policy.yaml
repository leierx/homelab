{{- with .Values }}
{{- $in := list }}
{{- $out := list }}
{{- if .sameNamespace }}
{{- $in = append $in (dict "fromEndpoints" (list (dict))) }}
{{- $out = append $out (dict "toEndpoints" (list (dict))) }}
{{- end }}
{{- if .webhook }}
{{- $in = append $in (dict "fromEntities" (list "kube-apiserver")) }}
{{- end }}
{{- with .gateway }}
{{- $ports := list }}
{{- range . }}{{ $ports = append $ports (dict "port" (toString .) "protocol" "TCP") }}{{ end }}
{{- $envoy := dict "k8s:io.kubernetes.pod.namespace" "envoy-gateway-system" "app.kubernetes.io/name" "envoy" }}
{{- $in = append $in (dict "fromEndpoints" (list (dict "matchLabels" $envoy)) "toPorts" (list (dict "ports" $ports))) }}
{{- end }}
{{- if .apiServer }}
{{- $out = append $out (dict "toEntities" (list "kube-apiserver")) }}
{{- end }}
{{- if .dns }}
{{- $dns := dict "k8s:io.kubernetes.pod.namespace" "kube-system" "k8s-app" "kube-dns" }}
{{- $ports := list (dict "port" "53" "protocol" "UDP") (dict "port" "53" "protocol" "TCP") }}
{{- $out = append $out (dict "toEndpoints" (list (dict "matchLabels" $dns)) "toPorts" (list (dict "ports" $ports))) }}
{{- end }}
{{- with .world }}
{{- $ports := list }}
{{- range . }}{{ $ports = append $ports (dict "port" (toString .) "protocol" "TCP") }}{{ end }}
{{- $out = append $out (dict "toEntities" (list "world") "toPorts" (list (dict "ports" $ports))) }}
{{- end }}
{{- $in = concat $in .ingress }}
{{- $out = concat $out .egress }}
{{- /* Cilium rejects a policy without rules; an empty rule allows nothing */}}
{{- if not (or $in $out) }}
{{- $in = list (dict) }}
{{- $out = list (dict) }}
{{- end }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .name }}
spec:
  endpointSelector: {{ toJson .endpointSelector }}
  enableDefaultDeny:
    ingress: true
    egress: true
  {{- with $in }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $out }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
