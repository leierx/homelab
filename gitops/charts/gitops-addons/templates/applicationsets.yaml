{{- $cluster := required "cluster.name is set by the gitops-addons ApplicationSet" .Values.cluster.name }}
{{- $repo := .Values.repo }}
{{- range $name, $addon := .Values.addons }}
{{- if $addon.enabled }}
{{- $n := $name | replace "_" "-" }}
{{- if and $addon.chart $addon.path }}
{{- fail (printf "addons.%s: an upstream chart (from the stack) and a path at once" $name) }}
{{- end }}
{{- if not (or $addon.chart $addon.path) }}
{{- fail (printf "addons.%s: no chart in stacks/k8s-<version>/stack.yaml and no path in the catalog" $name) }}
{{- end }}
{{- $fleet := dict "fleet" (dict "cluster" $cluster) }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addon-{{ $n }}-{{ $cluster }}
  namespace: argocd
  {{- if hasKey $addon "syncWave" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $addon.syncWave | toString | quote }}
  {{- end }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
            cluster_name: {{ $cluster }}
  template:
    metadata:
      name: addon-{{ $n }}-{{ $cluster }}
    spec:
      project: default
      destination:
        name: {{ $cluster }}
        namespace: {{ required (printf "addons.%s.namespace" $name) $addon.namespace }}
      {{- if $addon.chart }}
      {{- $upstream := dict "repoURL" $addon.repoUrl "chart" $addon.chart "targetRevision" ($addon.targetRevision | toString) "helm" (dict "releaseName" $addon.releaseName) }}
      {{- with $addon.values }}
      {{- $_ := set $upstream.helm "valuesObject" . }}
      {{- end }}
      {{- if hasKey $addon "extras" }}
      {{- $extrasValues := mergeOverwrite (deepCopy (default dict $addon.extras.values)) $fleet }}
      sources:
        - {{- toYaml $upstream | nindent 10 }}
        - repoURL: {{ $repo.url }}
          targetRevision: {{ $repo.stackRevision }}
          path: {{ $repo.basepath }}addon-extras/{{ $name | replace "_" "-" }}
          helm:
            releaseName: {{ $addon.releaseName }}
            valuesObject:
              {{- toYaml $extrasValues | nindent 14 }}
      {{- else }}
      source:
        {{- toYaml $upstream | nindent 8 }}
      {{- end }}
      {{- else if hasKey $addon "kustomize" }}
      source:
        repoURL: {{ $repo.url }}
        targetRevision: {{ $repo.stackRevision }}
        path: {{ $repo.basepath }}{{ $addon.path }}
        {{- with $addon.kustomize }}
        kustomize:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- else }}
      source:
        repoURL: {{ $repo.url }}
        targetRevision: {{ $repo.stackRevision }}
        path: {{ $repo.basepath }}{{ $addon.path }}
        helm:
          releaseName: {{ $addon.releaseName }}
          valuesObject:
            {{- toYaml (mergeOverwrite (deepCopy (default dict $addon.values)) $fleet) | nindent 12 }}
      {{- end }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          {{- toYaml (default $.Values.syncOptions $addon.syncOptions) | nindent 10 }}
        retry:
          limit: -1
        {{- with $addon.podSecurity }}
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: {{ . }}
            pod-security.kubernetes.io/warn: {{ . }}
            pod-security.kubernetes.io/audit: {{ . }}
        {{- end }}
      {{- with $addon.ignoreDifferences }}
      ignoreDifferences:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
