# set by the gitops-addons ApplicationSet from the cluster Secret
cluster:
  name: ""
repo:
  url: ""
  basepath: ""
  stackRevision: ""
syncOptions:
  - CreateNamespace=true
  - ServerSideApply=true
# Every addon, switched off: an enable_<addon> label on the cluster Secret switches it on.
# Versions live in stacks/k8s-<version>/stack.yaml, cluster values and sync waves in overrides/.
# An upstream chart's values are here; our own charts and addon-extras keep theirs in their values.yaml.
addons:
  # cluster-scoped admission policies; the namespace only hosts the Helm release
  admission:
    enabled: false
    namespace: kube-system
    releaseName: admission
    path: charts/admission
  # all four telemetry addons share one namespace, and node-exporter and the log
  # collector need host access, so the namespace can only be privileged
  alloy_logs:
    enabled: false
    namespace: telemetry
    podSecurity: privileged
    releaseName: alloy-logs
    extras: {}
    values:
      alloy:
        configMap:
          create: false
          name: alloy-logs
          key: config.alloy
        # /var/log/pods and the API server's audit log live under /var/log
        mounts:
          varlog: true
        envFrom:
          - configMapRef:
              name: alloy-logs-env
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
      # the chart's default rules are broader than what these components use
      rbac:
        create: false
      controller:
        type: daemonset
      configReloader:
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
      crds:
        create: false
  alloy_metrics:
    enabled: false
    namespace: telemetry
    podSecurity: privileged
    releaseName: alloy-metrics
    extras: {}
    values:
      alloy:
        configMap:
          create: false
          name: alloy-metrics
          key: config.alloy
        # one replica now; clustering is on so a bigger cluster can add more
        clustering:
          enabled: true
          name: alloy-metrics
        envFrom:
          - configMapRef:
              name: alloy-metrics-env
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {memory: 2Gi}
      # the chart's default rules are broader than what these components use
      rbac:
        create: false
      controller:
        type: statefulset
        replicas: 1
      configReloader:
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
      # the monitoring.grafana.com CRDs are not used; our configs are plain Alloy
      crds:
        create: false
  argo_workflows:
    enabled: false
    namespace: argo
    podSecurity: restricted
    releaseName: argo-workflows
    extras: {}
    values:
      crds:
        upgradeJob:
          podSecurityContext:
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
      controller:
        # where the chart puts the default workflow ServiceAccount; the keycloak CronWorkflow brings its own
        workflowNamespaces: [argo]
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
        # no Postgres archive and no artifact repository: logs go to Loki
        persistence: {}
        # finished workflows go after three days; a successful run's pods after an hour (logs are in
        # Loki), a failed run's pods stay with the workflow for debugging
        workflowDefaults:
          spec:
            ttlStrategy:
              secondsAfterCompletion: 259200
            podGC:
              strategy: OnWorkflowSuccess
              deleteDelayDuration: 1h
        metricsConfig:
          enabled: true
        serviceMonitor:
          enabled: true
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 1Gi}
      executor:
        # restricted: the stock argoexec image runs as root
        securityContext:
          runAsNonRoot: true
          runAsUser: 8737
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}
      server:
        authModes: [sso]
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
        sso:
          enabled: true
          clientId:
            name: argo-server-sso
            key: client-id
          clientSecret:
            name: argo-server-sso
            key: client-secret
          # the group claim the SSO RBAC rules read
          scopes: [groups]
          rbac:
            enabled: true
        resources:
          requests: {cpu: 20m, memory: 128Mi}
          limits: {memory: 512Mi}
  argocd:
    enabled: false
    namespace: argocd
    podSecurity: restricted
    releaseName: argocd
    extras: {}
    values:
      configs:
        cm:
          # SSO only; the local admin account is disabled (docs/break-glass.md)
          admin.enabled: "false"
          resource.customizations.health.argoproj.io_ApplicationSet: |-
            -- An ApplicationSet is Healthy only when every Application it generated is Healthy,
            -- so a sync wave of ApplicationSets waits for the addons themselves (docs/gitops.md)
            local hs = { status = "Progressing", message = "Waiting for the ApplicationSet controller" }
            if obj.status == nil or obj.status.conditions == nil then
              return hs
            end
            local upToDate = false
            for _, c in ipairs(obj.status.conditions) do
              if c.type == "ErrorOccurred" and c.status == "True" then
                return { status = "Degraded", message = c.message }
              end
              if c.type == "ResourcesUpToDate" and c.status == "True" then
                upToDate = true
              end
            end
            if not upToDate then
              return hs
            end
            for _, r in ipairs(obj.status.resources or {}) do
              local s = (r.health and r.health.status) or ""
              if s == "Degraded" then
                return { status = "Degraded", message = r.name .. " is Degraded" }
              end
              if s ~= "Healthy" then
                return { status = "Progressing", message = r.name .. " is " .. (s ~= "" and s or "not reported yet") }
              end
            end
            return { status = "Healthy", message = "Every Application is Healthy" }
        params:
          # TLS ends at the edge Gateway
          server.insecure: true
          # diff against what the API server stores, so CRD defaults (HTTPRoute matches, parentRef group/kind) aren't drift
          controller.diff.server.side: true
          # 4800s: ~2x the longest first sync in the rebuild (2379s); a wedged operation now fails and retries
          controller.sync.timeout.seconds: "4800"
        rbac:
          policy.csv: |
            g, homelab-admins, role:admin
            g, homelab-operators, role:admin
            g, homelab-viewers, role:readonly
      dex:
        enabled: false
      notifications:
        enabled: false
      controller:
        metrics: {enabled: true, serviceMonitor: {enabled: true}}
        resources:
          requests: {cpu: 250m, memory: 1Gi}
          limits: {memory: 4Gi}
      repoServer:
        metrics: {enabled: true, serviceMonitor: {enabled: true}}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 1Gi}
        copyutil:
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      server:
        metrics: {enabled: true, serviceMonitor: {enabled: true}}
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 256Mi}
      applicationSet:
        # the ApplicationSet health check reads status.resources, which the controller only
        # refreshes on a reconcile; this resyncs its cache, so a wave sees the wave below it
        extraArgs:
          - --cache-sync-period=60s
        metrics: {enabled: true, serviceMonitor: {enabled: true}}
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}
      redis:
        # redis never talks to the Kubernetes API
        automountServiceAccountToken: false
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 256Mi}
      redisSecretInit:
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
  capi_argo_bridge:
    enabled: false
    namespace: argocd
    releaseName: capi-argo-bridge
    path: charts/capi-argo-bridge
  cdi:
    enabled: false
    namespace: cdi
    path: manifests/cdi
    kustomize: {}
  cert_manager:
    enabled: false
    namespace: cert-manager
    podSecurity: restricted
    releaseName: cert-manager
    extras: {}
    values:
      crds:
        enabled: true
      # HTTP-01 is answered through HTTPRoutes on the edge Gateway; certificates are explicit Certificate objects
      config:
        gatewayAPI:
          enabled: true
      prometheus:
        servicemonitor:
          enabled: true
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 256Mi}
      webhook:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
      cainjector:
        resources:
          requests: {cpu: 10m, memory: 128Mi}
          limits: {memory: 512Mi}
      startupapicheck:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 64Mi}
  # the agent and envoy run on the host network; the cluster-wide default (baseline) would refuse them
  cilium:
    enabled: false
    namespace: kube-system
    podSecurity: privileged
    releaseName: cilium
    extras: {}
    values:
      kubeProxyReplacement: true
      bpf:
        masquerade: true
      ipv6:
        enabled: false
      hubble:
        # no Relay or UI: Hubble only feeds the metrics below; `cilium-dbg hubble observe` uses the local socket
        listenAddress: ""
        tls:
          enabled: false
        metrics:
          enabled:
            - dns:query;ignoreAAAA
            - drop:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
            - flow:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
            - tcp
            - icmp
            - port-distribution
            # allowed/denied/audited verdicts per workload pair, for writing network policies
            - policy:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
          serviceMonitor:
            enabled: true
          dashboards:
            enabled: true
            annotations: {grafana_folder: Cilium}
      prometheus:
        enabled: true
        metricsService: true
        serviceMonitor:
          enabled: true
      dashboards:
        enabled: true
        annotations: {grafana_folder: Cilium}
      # no memory limit on the agent: an OOM kill takes the node's networking down with it
      resources:
        requests: {cpu: 100m, memory: 512Mi}
      initResources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 256Mi}
      envoy:
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 1Gi}
        prometheus:
          serviceMonitor:
            enabled: true
      operator:
        replicas: 1
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}
        prometheus:
          metricsService: true
          serviceMonitor:
            enabled: true
        dashboards:
          enabled: true
          annotations: {grafana_folder: Cilium}
      certgen:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 64Mi}
      # the chart ships the key with a null default; a null here keeps it out of cilium-config
      policyCIDRMatchMode: null
  cloudnative_pg:
    enabled: false
    namespace: cnpg-system
    podSecurity: restricted
    releaseName: cloudnative-pg
    extras: {}
    values:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 256Mi}
      monitoring:
        podMonitorEnabled: true
  cluster_api:
    enabled: false
    namespace: capi-operator-system
    podSecurity: restricted
    releaseName: cluster-api
    values:
      # as Helm hooks, Argo would neither diff nor prune the provider CRs; sync-waves order them instead
      enableHelmHook: false
      resources:
        manager:
          requests: {cpu: 10m, memory: 64Mi}
          # null drops the chart's 100m CPU limit, which only throttles
          limits: {cpu: null, memory: 256Mi}
      containerSecurityContext:
        manager:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
      core:
        cluster-api:
          # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
          version: v1.14.3
          deployment:
            containers:
              - name: manager
                resources:
                  requests: {cpu: 10m, memory: 64Mi}
                  limits: {memory: 512Mi}
      bootstrap:
        kubeadm:
          # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
          version: v1.14.3
          deployment:
            containers:
              - name: manager
                resources:
                  requests: {cpu: 10m, memory: 64Mi}
                  limits: {memory: 256Mi}
      controlPlane:
        kubeadm:
          # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api
          version: v1.14.3
          deployment:
            containers:
              - name: manager
                resources:
                  requests: {cpu: 10m, memory: 64Mi}
                  limits: {memory: 512Mi}
      infrastructure:
        kubevirt:
          # renovate: datasource=github-releases depName=kubernetes-sigs/cluster-api-provider-kubevirt
          version: v0.11.2
          deployment:
            containers:
              - name: manager
                resources:
                  requests: {cpu: 10m, memory: 64Mi}
                  limits: {memory: 256Mi}
  envoy_gateway:
    enabled: false
    namespace: envoy-gateway-system
    podSecurity: restricted
    releaseName: envoy-gateway
    extras: {}
    values:
      certgen:
        job:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
  external_secrets:
    enabled: false
    namespace: external-secrets
    podSecurity: restricted
    releaseName: external-secrets
    extras: {}
    values:
      serviceMonitor:
        enabled: true
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 256Mi}
      webhook:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
      certController:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
  grafana:
    enabled: false
    namespace: monitoring
    podSecurity: restricted
    releaseName: grafana
    extras: {}
    values:
      fullnameOverride: grafana
      testFramework:
        enabled: false
      admin:
        existingSecret: grafana
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana
            key: oidc-client-secret
      grafana.ini:
        server:
          root_url: https://%(domain)s/
        auth:
          # SSO only; the admin account is break-glass (docs/break-glass.md)
          disable_login_form: true
        # the hidden login form alone still left admin:<password> working against the API
        auth.basic:
          enabled: false
        auth.generic_oauth:
          enabled: true
          name: Keycloak
          client_id: grafana
          scopes: openid email profile
          use_pkce: true
          allow_sign_up: true
          allow_assign_grafana_admin: true
          login_attribute_path: preferred_username
          role_attribute_path: contains(groups, 'homelab-admins') && 'GrafanaAdmin' || contains(groups, 'homelab-operators') && 'Editor' || contains(groups, 'homelab-viewers') && 'Viewer' || ''
          # no tier, no login; Keycloak refuses such users first, this holds if that ever changes
          role_attribute_strict: true
      # a second pod can't share the SQLite database on the RWO volume
      deploymentStrategy:
        type: Recreate
      persistence:
        enabled: true
        storageClassName: ""
        size: ""
      # runs as root; fsGroup already gives Grafana the volume
      initChownData:
        enabled: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {memory: 1Gi}
      downloadDashboards:
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
      serviceMonitor:
        enabled: true
      sidecar:
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}
        # charts across the cluster ship dashboards as ConfigMaps labelled grafana_dashboard
        dashboards:
          enabled: true
          searchNamespace: ALL
          folderAnnotation: grafana_folder
          # the reload call needs basic auth; Grafana's file provider polls for changes anyway
          skipReload: true
          provider:
            foldersFromFilesStructure: true
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Mimir
              uid: mimir
              type: prometheus
              url: http://mimir:8080/prometheus
              isDefault: true
              jsonData:
                prometheusType: Mimir
                httpMethod: POST
                timeInterval: 60s
            - name: Loki
              uid: loki
              type: loki
              url: http://loki:3100
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: kubernetes
              folder: Kubernetes
              type: file
              options:
                path: /var/lib/grafana/dashboards/kubernetes
            - name: platform
              folder: Platform
              type: file
              options:
                path: /var/lib/grafana/dashboards/platform
      dashboards:
        kubernetes:
          k8s-views-global: {gnetId: 15757, revision: 43}
          k8s-views-namespaces: {gnetId: 15758, revision: 46}
          k8s-views-nodes: {gnetId: 15759, revision: 40}
          k8s-views-pods: {gnetId: 15760, revision: 41}
          k8s-system-api-server: {gnetId: 15761, revision: 21}
          node-exporter-full: {gnetId: 1860, revision: 45}
        platform:
          argocd-operational: {gnetId: 19993, revision: 9}
          argocd-application: {gnetId: 19974, revision: 8}
          cert-manager: {gnetId: 20842, revision: 3}
          envoy-gateway: {gnetId: 24460, revision: 1}
      # Grafana-managed alerts, visible in Grafana's alert list; no notification channel (TODO.md)
      alerting:
        rules.yaml:
          apiVersion: 1
          groups:
            # people and stolen credentials: the API server audit log and OpenBao's
            - orgId: 1
              name: security
              folder: homelab
              interval: 1m
              rules:
                - uid: admin-kubeconfig-used
                  title: Admin kubeconfig used
                  condition: C
                  for: 0s
                  noDataState: OK
                  execErrState: Error
                  labels: {severity: warning}
                  annotations:
                    summary: "The host's system:masters certificate was used: break-glass, or someone who shouldn't have it."
                  data:
                    - {refId: A, datasourceUid: loki, relativeTimeRange: {from: 300, to: 0}, model: {refId: A, queryType: instant, expr: 'sum(count_over_time({job="kube-audit"} | json | user_username="system:admin" [5m]))'}}
                    - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                - uid: rbac-changed-by-person
                  title: RBAC changed outside Argo CD
                  condition: C
                  for: 0s
                  noDataState: OK
                  execErrState: Error
                  labels: {severity: warning}
                  annotations:
                    summary: "A role or binding was created, changed or deleted by something other than a ServiceAccount."
                  data:
                    - {refId: A, datasourceUid: loki, relativeTimeRange: {from: 300, to: 0}, model: {refId: A, queryType: instant, expr: 'sum by (user_username, objectRef_resource, objectRef_name) (count_over_time({job="kube-audit"} | json | objectRef_apiGroup="rbac.authorization.k8s.io" | verb=~"create|update|patch|delete" | user_username!~"system:serviceaccount:.*" | requestURI!~".*dryRun=All.*" [5m]))'}}
                    - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                - uid: secrets-or-exec-by-person
                  title: Secrets read or pods entered by a person
                  condition: C
                  for: 0s
                  noDataState: OK
                  execErrState: Error
                  labels: {severity: info}
                  annotations:
                    summary: "Someone logged in through Keycloak read a Secret or used exec, attach or port-forward."
                  data:
                    - {refId: A, datasourceUid: loki, relativeTimeRange: {from: 300, to: 0}, model: {refId: A, queryType: instant, expr: 'sum by (user_username, objectRef_namespace, objectRef_resource, objectRef_subresource) (count_over_time({job="kube-audit"} | json | user_username=~"oidc:.*" | objectRef_resource="secrets" or objectRef_subresource=~"exec|attach|portforward" [5m]))'}}
                    - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                - uid: openbao-admin-login
                  title: OpenBao admin login
                  condition: C
                  for: 0s
                  noDataState: OK
                  execErrState: Error
                  labels: {severity: info}
                  annotations:
                    summary: "Something logged in to OpenBao with the admin role (`just bao`, or a minted openbao-admin token)."
                  data:
                    - {refId: A, datasourceUid: loki, relativeTimeRange: {from: 300, to: 0}, model: {refId: A, queryType: instant, expr: 'sum(count_over_time({namespace="openbao", container="openbao"} |= "\"type\":\"response\"" | json | auth_metadata_role="admin" [5m]))'}}
                    - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                - uid: admission-policy-warning
                  title: Pod breaks an admission policy
                  condition: C
                  for: 0s
                  noDataState: OK
                  execErrState: Error
                  labels: {severity: info}
                  annotations:
                    summary: "A pod was admitted despite a Warn/Audit policy (gitops/charts/admission), e.g. a CPU limit or a missing memory limit."
                  data:
                    - {refId: A, datasourceUid: loki, relativeTimeRange: {from: 300, to: 0}, model: {refId: A, queryType: instant, expr: 'sum by (objectRef_namespace) (count_over_time({job="kube-audit"} |= "validation.policy.admission.k8s.io/validation_failure" | json [5m]))'}}
                    - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                - uid: network-policy-drops
                  title: Traffic dropped by network policy
                  condition: C
                  for: 0s
                  noDataState: OK
                  execErrState: Error
                  labels: {severity: warning}
                  annotations:
                    summary: "Cilium denied traffic: a missing allow rule, or something probing where it shouldn't."
                  data:
                    - {refId: A, datasourceUid: mimir, relativeTimeRange: {from: 600, to: 0}, model: {refId: A, instant: true, expr: 'sum by (source, destination) (increase(hubble_drop_total{reason="POLICY_DENIED"}[5m])) > 0'}}
                    - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
            - orgId: 1
              name: health
              folder: homelab
              interval: 1m
              rules:
                - uid: volume-filling-up
                  title: Volume over 85% full
                  condition: C
                  for: 15m
                  noDataState: OK
                  execErrState: Error
                  labels: {severity: warning}
                  annotations: {summary: "A PVC is over 85% full."}
                  data:
                    - {refId: A, datasourceUid: mimir, relativeTimeRange: {from: 600, to: 0}, model: {refId: A, instant: true, expr: 'max by (persistentvolumeclaim) (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85'}}
                    - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                - uid: pod-restarting
                  title: Pod restarting
                  condition: C
                  for: 0s
                  noDataState: OK
                  execErrState: Error
                  labels: {severity: warning}
                  annotations: {summary: "A container restarted more than three times in 15 minutes."}
                  data:
                    - {refId: A, datasourceUid: mimir, relativeTimeRange: {from: 600, to: 0}, model: {refId: A, instant: true, expr: 'sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[15m])) > 3'}}
                    - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                - uid: node-not-ready
                  title: Node not ready
                  condition: C
                  for: 5m
                  noDataState: OK
                  execErrState: Error
                  labels: {severity: critical}
                  annotations: {summary: "A node has been NotReady for 5 minutes."}
                  data:
                    - {refId: A, datasourceUid: mimir, relativeTimeRange: {from: 600, to: 0}, model: {refId: A, instant: true, expr: 'max by (node) (kube_node_status_condition{condition="Ready", status="true"} == 0) + 1'}}
                    - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                - uid: workflow-failed
                  title: Workflow started by a CronWorkflow failed
                  condition: C
                  for: 0s
                  noDataState: OK
                  execErrState: Error
                  labels: {severity: warning}
                  annotations: {summary: "A workflow entered the Failed phase in the last 15 minutes. Every standing workflow here is started by a CronWorkflow (the controller's counter has no cron label)."}
                  data:
                    - {refId: A, datasourceUid: mimir, relativeTimeRange: {from: 900, to: 0}, model: {refId: A, instant: true, expr: 'sum by (namespace) (increase(argo_workflows_total_count{phase="Failed"}[15m])) > 0'}}
                    - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                - uid: argocd-app-unhealthy
                  title: Argo CD application unhealthy
                  condition: C
                  for: 15m
                  noDataState: OK
                  execErrState: Error
                  labels: {severity: warning}
                  annotations: {summary: "An Argo CD application has been Degraded, Missing or Unknown for 15 minutes."}
                  data:
                    - {refId: A, datasourceUid: mimir, relativeTimeRange: {from: 600, to: 0}, model: {refId: A, instant: true, expr: 'max by (name, health_status) (argocd_app_info{health_status!~"Healthy|Progressing|Suspended"})'}}
                    - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                - uid: secret-sync-failing
                  title: Secret sync failing
                  condition: C
                  for: 15m
                  noDataState: OK
                  execErrState: Error
                  labels: {severity: warning}
                  annotations: {summary: "An ExternalSecret or PushSecret has not been Ready for 15 minutes."}
                  data:
                    - {refId: A, datasourceUid: mimir, relativeTimeRange: {from: 600, to: 0}, model: {refId: A, instant: true, expr: 'max by (exported_namespace, name) ({__name__=~"externalsecret_status_condition|pushsecret_status_condition", condition="Ready", status="False"}) > 0'}}
                    - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
                - uid: openbao-sealed
                  title: OpenBao sealed
                  condition: C
                  for: 5m
                  noDataState: Alerting
                  execErrState: Error
                  labels: {severity: critical}
                  # max: OpenBao keeps reporting the 0 from before it unsealed for its 24 h metrics retention
                  annotations: {summary: "OpenBao is sealed or not reporting: no secret can be read or generated."}
                  data:
                    - {refId: A, datasourceUid: mimir, relativeTimeRange: {from: 600, to: 0}, model: {refId: A, instant: true, expr: 'max(vault_core_unsealed)'}}
                    - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [1]}}]}}
                - uid: certificate-expiring
                  title: Certificate expiring
                  condition: C
                  for: 1h
                  noDataState: OK
                  execErrState: Error
                  labels: {severity: warning}
                  annotations: {summary: "A cert-manager certificate expires within 14 days; renewal is failing."}
                  data:
                    - {refId: A, datasourceUid: mimir, relativeTimeRange: {from: 600, to: 0}, model: {refId: A, instant: true, expr: 'min by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 86400'}}
                    - {refId: C, datasourceUid: __expr__, model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}}
  # the namespace comes from the keycloak-operator addon, which labels it restricted
  keycloak:
    enabled: false
    namespace: keycloak
    releaseName: keycloak
    path: charts/keycloak
  keycloak_operator:
    enabled: false
    namespace: keycloak
    path: manifests/keycloak-operator
    kustomize: {}
  kube_state_metrics:
    enabled: false
    namespace: telemetry
    podSecurity: privileged
    releaseName: kube-state-metrics
    values:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 256Mi}
  kubevirt:
    enabled: false
    namespace: kubevirt
    path: manifests/kubevirt
    kustomize: {}
  loki:
    enabled: false
    namespace: monitoring
    podSecurity: restricted
    releaseName: loki
    values:
      fullnameOverride: loki
      # Loki never talks to the Kubernetes API (rule sidecar off)
      defaults:
        automountServiceAccountToken: false
      deploymentMode: Monolithic
      loki:
        auth_enabled: false
        commonConfig:
          replication_factor: 1
        storage:
          type: filesystem
        schemaConfig:
          configs:
            - from: "2024-04-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h
        limits_config:
          retention_period: 30d
          allow_structured_metadata: true
          volume_enabled: true
        compactor:
          retention_enabled: true
          delete_request_store: filesystem
        # Grafana's Logs Drilldown shows patterns
        pattern_ingester:
          enabled: true
        analytics:
          reporting_enabled: false
      singleBinary:
        replicas: 1
        persistence:
          storageClass: ""
          size: ""
        resources:
          requests: {cpu: 100m, memory: 512Mi}
          limits: {memory: 2Gi}
      read:
        replicas: 0
      write:
        replicas: 0
      backend:
        replicas: 0
      gateway:
        enabled: false
      chunksCache:
        enabled: false
      resultsCache:
        enabled: false
      lokiCanary:
        enabled: false
      test:
        enabled: false
      sidecar:
        rules:
          enabled: false
      monitoring:
        serviceMonitor:
          enabled: true
  mimir:
    enabled: false
    namespace: monitoring
    podSecurity: restricted
    releaseName: mimir
    path: charts/mimir
  node_exporter:
    enabled: false
    namespace: telemetry
    podSecurity: privileged
    releaseName: node-exporter
    values:
      fullnameOverride: node-exporter
      nameOverride: node-exporter
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
  openbao:
    enabled: false
    namespace: openbao
    podSecurity: restricted
    releaseName: openbao
    extras: {}
    values:
      global:
        tlsDisable: false
      serverTelemetry:
        serviceMonitor:
          enabled: true
          scheme: https
          # in-cluster metrics only; the scrape doesn't need to verify OpenBao's private CA
          tlsConfig:
            insecureSkipVerify: true
      injector:
        enabled: false
      server:
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
        extraEnvironmentVars:
          BAO_CACERT: /openbao/tls/ca.crt
        volumes:
          - name: tls
            secret:
              secretName: openbao-tls
          # k3s deploys this Secret from sops-nix (nixos/sops.nix), so it survives a rebuilt cluster
          - name: seal-key
            secret:
              secretName: openbao-seal-key
        volumeMounts:
          - name: tls
            mountPath: /openbao/tls
            readOnly: true
          - name: seal-key
            mountPath: /openbao/seal
            readOnly: true
        dataStorage:
          storageClass: zfs
          size: 2Gi
        statefulSet:
          securityContext:
            container:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
        ha:
          enabled: true
          replicas: 1
          disruptionBudget:
            enabled: false
          raft:
            enabled: true
            setNodeId: true
            # config: set per cluster, because its policies name that cluster's kv paths
  prometheus_operator_crds:
    enabled: false
    namespace: monitoring
    releaseName: prometheus-operator-crds
    values: {}
  # cluster-scoped RBAC for people; the namespace only hosts the Helm release
  rbac:
    enabled: false
    namespace: kube-system
    releaseName: rbac
    path: charts/rbac
  renovate:
    enabled: false
    namespace: renovate
    podSecurity: restricted
    releaseName: renovate
    extras: {}
    values:
      # templates/serviceaccount.yaml: no API token in a pod that runs third-party code
      serviceAccount:
        create: false
        name: renovate
      cronjob:
        # what actually gets updated, and when, is up to renovate.json in the repo
        schedule: "17 * * * *"
        timeZone: Europe/Oslo
        concurrencyPolicy: Forbid
        # with Forbid, a hung run would block every later one; a run normally takes about a minute
        activeDeadlineSeconds: 3000
        # a GitHub App installation token lasts an hour, so each run mints its own
        preCommand: |
          RENOVATE_TOKEN=$(node /usr/local/share/github-app-token/token.mjs)
          export RENOVATE_TOKEN
      renovate:
        config: |
          {
            "platform": "github",
            "repositories": ["leierx/homelab"],
            "onboarding": false,
            "requireConfig": "required",
            "platformCommit": "enabled",
            "username": "leierx-renovate[bot]",
            "persistRepoData": true
          }
        persistence:
          cache:
            enabled: true
            storageClass: zfs
            storageSize: 5Gi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
      # GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID, GITHUB_APP_PRIVATE_KEY from OpenBao loft01/renovate
      existingSecret: renovate-github-app
      extraVolumes:
        - name: github-app-token
          configMap:
            name: renovate-github-app-token
      extraVolumeMounts:
        - name: github-app-token
          mountPath: /usr/local/share/github-app-token
      resources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {memory: 4Gi}
  # the node plugin is privileged with hostPath mounts; the cluster-wide default (baseline) would refuse it
  zfs_localpv:
    enabled: false
    namespace: openebs
    podSecurity: privileged
    releaseName: zfs-localpv
    extras: {}
    values:
      analytics:
        enabled: false
      # the chart gives every container of a pod the same resources
      zfsController:
        resources:
          requests: {cpu: 5m, memory: 16Mi}
          limits: {memory: 128Mi}
      zfsNode:
        resources:
          requests: {cpu: 5m, memory: 16Mi}
          limits: {memory: 256Mi}
