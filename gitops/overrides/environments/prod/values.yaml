# The order addons come up in on a prod cluster. Each wave
# starts only once every addon of the waves before it is Healthy. Addons that
# need each other share a wave. A wave is a property of the environment, never
# of the addon (docs/gitops.md, Sync waves).
addons:
  # wave 0: needs nothing, and everything else needs the CRDs it installs
  admission:
    syncWave: 0
  prometheus_operator_crds:
    syncWave: 0
  rbac:
    syncWave: 0
  # wave 1: the controllers whose CRDs and webhooks the later waves' objects go through
  cert_manager:
    syncWave: 1
  cilium:
    syncWave: 1
  cdi:
    syncWave: 1
  cloudnative_pg:
    syncWave: 1
  keycloak_operator:
    syncWave: 1
  kubevirt:
    syncWave: 1
  zfs_localpv:
    syncWave: 1
  # wave 2: secrets and the edge, and the backends the telemetry writes to
  alloy_logs:
    syncWave: 2
  alloy_metrics:
    syncWave: 2
  cluster_api:
    syncWave: 2
  envoy_gateway:
    syncWave: 2
  kube_state_metrics:
    syncWave: 2
  loki:
    syncWave: 2
  mimir:
    syncWave: 2
  node_exporter:
    syncWave: 2
  openbao:
    syncWave: 2
  # wave 3: everything that reads a secret needs OpenBao and the edge above it
  external_secrets:
    syncWave: 3
  # wave 4: the consumers, and the pair that ships a CRD the other uses
  argo_workflows:
    syncWave: 4
  argocd:
    syncWave: 4
  capi_argo_bridge:
    syncWave: 4
  grafana:
    syncWave: 4
  keycloak:
    syncWave: 4
  renovate:
    syncWave: 4
