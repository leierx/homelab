# loft01: hostnames, addresses, pools and sizing; nothing here is a version
addons:
  admission:
    values:
      # pods here get hostUsers: false; nothing privileged or reading host files (telemetry's log collector)
      userNamespaces:
        - argo
        - argocd
        - cert-manager
        - cnpg-system
        - envoy-gateway-system
        - external-secrets
        - immich
        - keycloak
        - monitoring
        - openbao
        - renovate
  alloy_logs:
    extras:
      values:
        lokiUrl: http://loki.monitoring.svc:3100/loki/api/v1/push
        auditLogPath: /var/log/kubernetes/audit.log
  alloy_metrics:
    extras:
      values:
        mimirUrl: http://mimir.monitoring.svc:8080/api/v1/push
        lokiUrl: http://loki.monitoring.svc:3100/loki/api/v1/push
  argocd:
    extras:
      values:
        host: argocd.skinke.net
    values:
      configs:
        cm:
          url: https://argocd.skinke.net
          oidc.config: |
            name: Keycloak
            issuer: https://auth.skinke.net/realms/homelab
            clientID: argocd
            clientSecret: $argocd-oidc:clientSecret
            # `argocd login --sso` uses this public client with PKCE
            cliClientID: argocd-cli
            requestedScopes: [openid, profile, email]
            # renew the session before Keycloak's 5-minute ID token runs out
            refreshTokenThreshold: 2m
  argo_workflows:
    extras:
      values:
        host: workflows.skinke.net
    values:
      server:
        sso:
          issuer: https://auth.skinke.net/realms/homelab
          redirectUrl: https://workflows.skinke.net/oauth2/callback
  cilium:
    values:
      # the API server on the host itself: k3s has no separate control plane Service
      k8sServiceHost: 127.0.0.1
      k8sServicePort: 6443
      ipam:
        operator:
          clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
      # BPF maps are sized from host RAM and charged to the agent's cgroup, ~2.4Gi on 512G
      resources:
        requests: { cpu: 100m, memory: 2560Mi }
  envoy_gateway:
    extras:
      values:
        wireguardAddress: 10.0.0.1
  grafana:
    extras:
      values:
        host: metrics.skinke.net
        keycloakHost: auth.skinke.net
    values:
      grafana.ini:
        server:
          domain: metrics.skinke.net
        auth:
          # Grafana adds the id_token_hint
          signout_redirect_url: https://auth.skinke.net/realms/homelab/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fmetrics.skinke.net%2Flogin
        auth.generic_oauth:
          auth_url: https://auth.skinke.net/realms/homelab/protocol/openid-connect/auth
          token_url: https://auth.skinke.net/realms/homelab/protocol/openid-connect/token
          api_url: https://auth.skinke.net/realms/homelab/protocol/openid-connect/userinfo
      persistence:
        storageClassName: zfs
        size: 5Gi
  keycloak:
    values:
      postgres:
        storageClass: zfs
        size: 5Gi
      host: auth.skinke.net
      podCIDR: 10.42.0.0/16
  kubevirt:
    kustomize:
      patches:
        # single node: a VM can never migrate, so draining or shutting down the node just stops it
        - target:
            kind: KubeVirt
          patch: |
            - op: add
              path: /spec/configuration/evictionStrategy
              value: None
        # single node: a second replica of the control plane buys nothing
        - target:
            kind: KubeVirt
          patch: |
            - op: add
              path: /spec/infra
              value:
                replicas: 1
            - op: add
              path: /spec/customizeComponents
              value:
                patches:
                  - resourceType: Deployment
                    resourceName: virt-api
                    type: strategic
                    patch: '{"spec":{"template":{"spec":{"containers":[{"name":"virt-api","resources":{"limits":{"memory":"1Gi"}}}]}}}}'
                  - resourceType: Deployment
                    resourceName: virt-controller
                    type: strategic
                    patch: '{"spec":{"template":{"spec":{"containers":[{"name":"virt-controller","resources":{"limits":{"memory":"1Gi"}}}]}}}}'
                  - resourceType: Deployment
                    resourceName: virt-exportproxy
                    type: strategic
                    patch: '{"spec":{"template":{"spec":{"containers":[{"name":"exportproxy","resources":{"limits":{"memory":"256Mi"}}}]}}}}'
                  - resourceType: DaemonSet
                    resourceName: virt-handler
                    type: strategic
                    patch: '{"spec":{"template":{"spec":{"containers":[{"name":"virt-handler","resources":{"limits":{"memory":"1Gi"}}}]}}}}'
        - target:
            kind: Deployment
            name: virt-operator
          patch: |
            - op: replace
              path: /spec/replicas
              value: 1
            - op: add
              path: /spec/template/spec/containers/0/resources/limits
              value:
                memory: 1Gi
  loki:
    values:
      singleBinary:
        persistence:
          storageClass: zfs
          size: 50Gi
  mimir:
    values:
      mimir:
        storage:
          storageClassName: zfs
          size: 100Gi
  openbao:
    values:
      server:
        dataStorage:
          storageClass: zfs
          size: 2Gi
        ha:
          raft:
            config: |
              ui = true
              # memory is not swapped to disk here (zram only), and raft wants mlock off
              disable_mlock = true

              listener "tcp" {
                address = "[::]:8200"
                cluster_address = "[::]:8201"
                tls_cert_file = "/openbao/tls/tls.crt"
                tls_key_file = "/openbao/tls/tls.key"
                telemetry {
                  unauthenticated_metrics_access = true
                }
              }

              storage "raft" {
                path = "/openbao/data"
              }

              service_registration "kubernetes" {}

              telemetry {
                prometheus_retention_time = "24h"
                disable_hostname = true
              }

              seal "static" {
                current_key_id = "20261017"
                current_key = "file:///openbao/seal/key"
              }

              audit "file" "stdout" {
                options {
                  file_path = "stdout"
                }
              }

              # runs once, on first start against empty storage; later changes go through `just bao`
              initialize "kv" {
                request "mount" {
                  operation = "update"
                  path = "sys/mounts/kv"
                  data = {
                    type = "kv"
                    options = { version = "2" }
                  }
                }
              }

              initialize "kubernetes-auth" {
                request "enable" {
                  operation = "update"
                  path = "sys/auth/kubernetes"
                  data = { type = "kubernetes" }
                }
                request "config" {
                  operation = "update"
                  path = "auth/kubernetes/config"
                  data = { kubernetes_host = "https://kubernetes.default.svc" }
                }
              }

              initialize "external-secrets" {
                request "policy" {
                  operation = "update"
                  path = "sys/policies/acl/external-secrets"
                  data = {
                    policy = "path \"kv/data/loft01/*\" { capabilities = [\"read\"] }\npath \"kv/metadata/loft01/*\" { capabilities = [\"read\", \"list\"] }"
                  }
                }
                request "role" {
                  operation = "update"
                  path = "auth/kubernetes/role/external-secrets"
                  data = {
                    bound_service_account_names = ["external-secrets"]
                    bound_service_account_namespaces = ["external-secrets"]
                    token_policies = ["external-secrets"]
                    token_ttl = "1h"
                  }
                }
              }

              # PushSecrets store generated values; their IfNotExists, not this policy, keeps existing ones
              initialize "external-secrets-push" {
                request "policy" {
                  operation = "update"
                  path = "sys/policies/acl/external-secrets-push"
                  data = {
                    policy = "path \"kv/data/loft01/*\" { capabilities = [\"create\", \"read\", \"update\"] }\npath \"kv/metadata/loft01/*\" { capabilities = [\"create\", \"read\", \"update\"] }"
                  }
                }
                request "role" {
                  operation = "update"
                  path = "auth/kubernetes/role/external-secrets-push"
                  data = {
                    bound_service_account_names = ["external-secrets-push"]
                    bound_service_account_namespaces = ["external-secrets"]
                    token_policies = ["external-secrets-push"]
                    token_ttl = "1h"
                  }
                }
              }

              # whoever can mint a token for this ServiceAccount is admin; that is cluster-admin already
              initialize "admin" {
                request "policy" {
                  operation = "update"
                  path = "sys/policies/acl/admin"
                  data = {
                    policy = "path \"*\" { capabilities = [\"create\", \"read\", \"update\", \"patch\", \"delete\", \"list\", \"sudo\"] }"
                  }
                }
                request "role" {
                  operation = "update"
                  path = "auth/kubernetes/role/admin"
                  data = {
                    bound_service_account_names = ["openbao-admin"]
                    bound_service_account_namespaces = ["openbao"]
                    token_policies = ["admin"]
                    token_ttl = "15m"
                  }
                }
              }
  renovate:
    values:
      renovate:
        persistence:
          cache:
            storageClass: zfs
            storageSize: 5Gi
  zfs_localpv:
    extras:
      values:
        pools:
          - name: tank
            storageClass: zfs
            default: true
          # large files (Immich's library)
          - name: tank
            storageClass: zfs-media
            dataset:
              recordsize: 1M
    values:
      zfs:
        # the host's ZFS, not a container image's
        bin: /run/current-system/sw/bin/zfs
