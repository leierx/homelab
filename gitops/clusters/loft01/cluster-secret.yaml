# loft01 is the hub itself; the bootstrap files address it by this in-cluster server URL.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-loft01
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: loft01
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
