# loft01: the hub
groups: [prod]
addons:
  # the hub's own
  - argocd
  - cluster-api
  # one instance for the whole fleet
  - keycloak
  - grafana
  - argo-workflows
  - renovate
  - immich
  - dodde
paused:
  # with no checks, an unpaused Renovate automerges minor and patch bumps straight onto main
  - renovate
# what every chart sees as .Values.global.fleet
global:
  fleet:
    cluster: loft01
    domain: skinke.net
