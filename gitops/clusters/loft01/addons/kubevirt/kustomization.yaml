apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../addons/kubevirt
patches:
  # single node: a VM can never migrate, so draining or shutting down the node just stops it
  - target:
      kind: KubeVirt
    patch: |
      - op: add
        path: /spec/configuration/evictionStrategy
        value: None
  # single node: a second replica of the control plane buys nothing
  - target:
      kind: KubeVirt
    patch: |
      - op: add
        path: /spec/infra
        value:
          replicas: 1
      - op: add
        path: /spec/customizeComponents
        value:
          patches:
            - resourceType: Deployment
              resourceName: virt-api
              type: strategic
              patch: '{"spec":{"template":{"spec":{"containers":[{"name":"virt-api","resources":{"limits":{"memory":"1Gi"}}}]}}}}'
            - resourceType: Deployment
              resourceName: virt-controller
              type: strategic
              patch: '{"spec":{"template":{"spec":{"containers":[{"name":"virt-controller","resources":{"limits":{"memory":"1Gi"}}}]}}}}'
            - resourceType: Deployment
              resourceName: virt-exportproxy
              type: strategic
              patch: '{"spec":{"template":{"spec":{"containers":[{"name":"exportproxy","resources":{"limits":{"memory":"256Mi"}}}]}}}}'
            - resourceType: DaemonSet
              resourceName: virt-handler
              type: strategic
              patch: '{"spec":{"template":{"spec":{"containers":[{"name":"virt-handler","resources":{"limits":{"memory":"1Gi"}}}]}}}}'
  - target:
      kind: Deployment
      name: virt-operator
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/resources/limits
        value:
          memory: 1Gi
