zfs-localpv:
  zfs:
    bin: /run/current-system/sw/bin/zfs
storageClasses:
- name: zfs
  poolname: tank
  fstype: ext4
  thinprovision: false
  default: true
- name: zfs-thin
  poolname: tank
  fstype: zfs
  thinprovision: true
  recordsize: 1M
- name: zfs-media
  poolname: tank
  fstype: zfs
  thinprovision: true
  recordsize: 1M
