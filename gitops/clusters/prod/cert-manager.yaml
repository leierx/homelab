apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  sourceHydrator:
    drySource:
      repoURL: https://github.com/leierx/homelab.git
      path: gitops/apps/cert-manager
      targetRevision: HEAD
      helm:
        valueFiles:
          - values.yaml
    syncSource:
      targetBranch: env/prod
      path: gitops/hydrated/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true