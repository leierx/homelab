apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
  annotations:
    # Provision the NFS StorageClass before anything that claims a PVC.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sourceHydrator:
    drySource:
      repoURL: https://github.com/leierx/homelab.git
      path: gitops/apps/nfs
      targetRevision: HEAD
      helm:
        valueFiles:
          - values.yaml
          - prod-values.yaml
    syncSource:
      targetBranch: env/prod
      path: gitops/hydrated/nfs
  destination:
    server: https://kubernetes.default.svc
    namespace: nfs-provisioner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true