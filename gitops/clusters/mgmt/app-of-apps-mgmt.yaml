apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-of-apps-mgmt
  # Per-env app-of-apps: mgmt runs only the control-plane subset — the infra
  # apps needed to host Argo CD itself (cilium, cert-manager, envoy-gateway,
  # external-secrets) plus apps/mgmt/* (argocd). No nfs, no shared apps.
  # destination.name selects the in-cluster registered secret.
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/leierx/homelab.git
              revision: HEAD
              # mgmt only runs a subset of the infra apps — list the app.yaml
              # files explicitly instead of globbing apps/infra/*.
              files:
                - path: gitops/apps/infra/cilium/app.yaml
                - path: gitops/apps/infra/cert-manager/app.yaml
                - path: gitops/apps/infra/envoy-gateway/app.yaml
                - path: gitops/apps/infra/external-secrets/app.yaml
          - list:
              elements:
                - env: mgmt
                  group: infra
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/leierx/homelab.git
              revision: HEAD
              files:
                - path: gitops/apps/mgmt/*/app.yaml
          - list:
              elements:
                - env: mgmt
                  group: mgmt
  # RollingSync: infra apps land first (wave 0), then the control-plane apps
  # (wave 1).
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: homelab.io/sync-wave
              operator: In
              values: ['0']
        - matchExpressions:
            - key: homelab.io/sync-wave
              operator: In
              values: ['1']
  template:
    metadata:
      # One Argo CD manages every cluster, so names must be unique across
      # appsets.
      name: '{{.env}}-{{.name}}'
      labels:
        homelab.io/sync-wave: '{{ if .wave }}{{ .wave }}{{ else if eq .group "infra" }}0{{ else }}1{{ end }}'
    spec:
      project: default
      # Plain (hydrated) source per env branch, rendered by this instance's
      # commit-server; the dry source in apps/<group>/ is hydrated into it.
      sourceHydrator:
        drySource:
          repoURL: https://github.com/leierx/homelab.git
          path: 'gitops/apps/{{.group}}/{{.name}}'
          targetRevision: HEAD
          helm:
            valueFiles:
              - values.yaml
              - '{{.env}}-values.yaml'
            ignoreMissingValueFiles: true
        syncSource:
          targetBranch: 'env/{{.env}}'
          path: 'hydrated/{{.env}}/{{.name}}'
      destination:
        # Cluster secret name as registered on the mgmt control plane.
        name: '{{.env}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        # No automated: RollingSync drives syncs (Prune via sync-option).
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - Prune=true