apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    repoURL: https://github.com/leierx/homelab.git
    targetRevision: HEAD
    # The whole clusters/ tree: per-agent namespaces and the three
    # app-of-apps ApplicationSets (and this file — the root app manages
    # itself). Reconciled by the hub's own application-controller.
    path: gitops/clusters
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
