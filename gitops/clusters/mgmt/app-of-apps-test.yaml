apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-of-apps-test
  # Per-env app-of-apps: one ApplicationSet per cluster means test can change
  # rollout policy (e.g. faster waves / AllAtOnce) without touching
  # prod/mgmt. All Applications live in the argocd namespace on mgmt;
  # destination.name selects the registered cluster secret.
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/leierx/homelab.git
              revision: HEAD
              files:
                - path: gitops/apps/infra/*/app.yaml
          - list:
              elements:
                - env: test
                  group: infra
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/leierx/homelab.git
              revision: HEAD
              files:
                - path: gitops/apps/shared/*/app.yaml
          - list:
              elements:
                - env: test
                  group: shared
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/leierx/homelab.git
              revision: HEAD
              files:
                - path: gitops/apps/test/*/app.yaml
          - list:
              elements:
                - env: test
                  group: test
  # RollingSync: infra apps (apps/infra/) land first — wave 0 — so shared apps
  # and env-only apps (wave 1) don't race their dependencies. `wave:` key in
  # app.yaml overrides the folder default. Waits for each wave to be Healthy.
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: homelab.io/sync-wave
              operator: In
              values: ['0']
        - matchExpressions:
            - key: homelab.io/sync-wave
              operator: In
              values: ['1']
  template:
    metadata:
      # One Argo CD manages every cluster, so names must be unique across
      # appsets.
      name: '{{.env}}-{{.name}}'
      labels:
        homelab.io/sync-wave: '{{ if .wave }}{{ .wave }}{{ else if eq .group "infra" }}0{{ else }}1{{ end }}'
    spec:
      project: default
      # Plain (hydrated) source per env branch, rendered by this instance's
      # commit-server; the dry source in apps/<group>/ is hydrated into it.
      sourceHydrator:
        drySource:
          repoURL: https://github.com/leierx/homelab.git
          path: 'gitops/apps/{{.group}}/{{.name}}'
          targetRevision: HEAD
          helm:
            valueFiles:
              - values.yaml
              - '{{.env}}-values.yaml'
            ignoreMissingValueFiles: true
        syncSource:
          targetBranch: 'env/{{.env}}'
          path: 'hydrated/{{.env}}/{{.name}}'
      destination:
        # Cluster secret name as registered on the mgmt control plane.
        name: '{{.env}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        # No automated: RollingSync drives syncs (Prune via sync-option).
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - Prune=true