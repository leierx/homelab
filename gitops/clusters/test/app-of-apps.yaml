apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: app-of-apps
  # Namespace-based agent mapping: apps in this namespace are routed to the
  # agent of the same name by the principal.
  namespace: test
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/leierx/homelab.git
              revision: HEAD
              files:
                - path: gitops/apps/shared/*/app.yaml
          - list:
              elements:
                - env: test
                  group: shared
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/leierx/homelab.git
              revision: HEAD
              files:
                - path: gitops/apps/test/*/app.yaml
          - list:
              elements:
                - env: test
                  group: test
  template:
    metadata:
      name: '{{.name}}'
      labels:
        # Principal and agents only process resources carrying this label.
        argocd-agent: "true"
    spec:
      project: default
      # Plain source: syncs the hydrated output produced by the hydrate-*
      # driver apps on the hub (see hydrator.yaml in this directory).
      source:
        repoURL: https://github.com/leierx/homelab.git
        targetRevision: 'env/{{.env}}'
        path: 'gitops/hydrated/{{.env}}/{{.name}}'
      destination:
        # Agent cluster secret (created by `argocd-agentctl agent create`);
        # carries skip-reconcile so the hub's controller leaves these alone.
        name: '{{.env}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
