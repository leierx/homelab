apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hydrate-test
  # Hub-local hydration drivers: these apps live in the control-plane
  # namespace and are unlabeled, so the principal and agents never see them.
  # The hub's application-controller hydrates them like any ordinary
  # sourceHydrator app; the real (agent-routed) apps in app-of-apps.yaml then
  # sync the hydrated output from the env branch.
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/leierx/homelab.git
              revision: HEAD
              files:
                - path: gitops/apps/shared/*/app.yaml
          - list:
              elements:
                - env: test
                  group: shared
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/leierx/homelab.git
              revision: HEAD
              files:
                - path: gitops/apps/test/*/app.yaml
          - list:
              elements:
                - env: test
                  group: test
  template:
    metadata:
      name: 'hydrate-{{.env}}-{{.name}}'
    spec:
      project: default
      sourceHydrator:
        drySource:
          repoURL: https://github.com/leierx/homelab.git
          path: 'gitops/apps/{{.group}}/{{.name}}'
          targetRevision: HEAD
          helm:
            valueFiles:
              - values.yaml
              - '{{.env}}-values.yaml'
            ignoreMissingValueFiles: true
        syncSource:
          targetBranch: 'env/{{.env}}'
          path: 'gitops/hydrated/{{.env}}/{{.name}}'
      # Deliberately no syncPolicy: this app is never synced (it would deploy
      # the env's manifests onto the hub). It exists purely to drive
      # hydration; the destination namespace only provides the helm rendering
      # context, so it must match the app.yaml namespace.
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
