apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# the operator watches only its own namespace, so the Keycloak CR (addon keycloak) lives here too
resources:
  - github.com/keycloak/keycloak-k8s-resources/kubernetes?ref=26.8.1
  - namespace.yaml
patches:
  - target:
      kind: Deployment
      name: keycloak-operator
    patch: |
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/cpu
