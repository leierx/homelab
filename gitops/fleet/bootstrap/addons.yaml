apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/secret-type: cluster
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: "addons-{{ .name }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/leierx/homelab.git
        targetRevision: HEAD
        path: gitops/fleet/catalog
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: -1
  # the catalog, then each group's enables in the cluster's order, then the cluster's own
  templatePatch: |
    {{- $groups := splitList "," (index .metadata.annotations "fleet.homelab/groups") }}
    spec:
      source:
        helm:
          releaseName: "addons-{{ .name }}"
          ignoreMissingValueFiles: true
          valueFiles:
          {{- range $groups }}
            - "../../groups/{{ . }}/addons.yaml"
          {{- end }}
            - "../../clusters/{{ .name }}/addons.yaml"
          valuesObject:
            cluster:
              name: "{{ .name }}"
              groups:
              {{- range $groups }}
                - "{{ . }}"
              {{- end }}
