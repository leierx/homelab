{{- $cluster := required "cluster.name is set by the addons ApplicationSet" .Values.cluster.name }}
{{- range $name, $addon := .Values.addons }}
{{- if $addon.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}-{{ $cluster }}
  namespace: argocd
spec:
  project: default
  destination:
    name: {{ $cluster }}
    namespace: {{ required (printf "addons.%s.namespace" $name) $addon.namespace }}
  source:
    repoURL: {{ $.Values.repoURL }}
    targetRevision: {{ $.Values.targetRevision }}
    {{- if $addon.kustomize }}
    path: gitops/clusters/{{ $cluster }}/addons/{{ $name }}
    {{- else }}
    path: gitops/addons/{{ $name }}
    helm:
      releaseName: {{ $name }}
      ignoreMissingValueFiles: true
      valueFiles:
        {{- range $.Values.cluster.groups }}
        {{- if . }}
        - ../../groups/{{ . }}/addons/{{ $name }}/values.yaml
        {{- end }}
        {{- end }}
        - ../../clusters/{{ $cluster }}/addons/{{ $name }}/values.yaml
      valuesObject:
        fleet:
          cluster: {{ $cluster }}
    {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      {{- range (default $.Values.syncOptions $addon.syncOptions) }}
      - {{ . }}
      {{- end }}
    retry:
      limit: -1
    {{- with $addon.podSecurity }}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: {{ . }}
        pod-security.kubernetes.io/warn: {{ . }}
        pod-security.kubernetes.io/audit: {{ . }}
    {{- end }}
  {{- with $addon.ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
