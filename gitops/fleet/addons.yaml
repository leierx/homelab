apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/leierx/homelab.git
              revision: HEAD
              files:
                - path: gitops/addons/*/addon.yaml
          - clusters:
              selector:
                matchLabels:
                  addons.homelab/{{ .path.basename }}: "true"
  syncPolicy:
    # removing a label or addon never uninstalls; a bad commit can't take out Cilium or Argo
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: "{{ .path.basename }}-{{ .name }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/leierx/homelab.git
        targetRevision: HEAD
        path: "{{ .path.path }}/{{ .metadata.labels.env }}"
      destination:
        server: "{{ .server }}"
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: -1
  # addons whose addon.yaml sets `kustomize: true` have a kustomization.yaml instead of a Chart.yaml;
  # `podSecurity: <level>` labels the namespace for enforce, warn and audit, so the cluster default
  # (enforce baseline, warn restricted) doesn't warn about what the addon declared (kustomize addons
  # ship their own Namespace and label it there)
  templatePatch: |
    {{- if not (hasKey . "kustomize") }}
    spec:
      source:
        helm:
          releaseName: "{{ .path.basename }}"
          valueFiles:
            - ../values.yaml
            - values.yaml
            - "../clusters/{{ .name }}.yaml"
          ignoreMissingValueFiles: true
      {{- if hasKey . "podSecurity" }}
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: "{{ .podSecurity }}"
            pod-security.kubernetes.io/warn: "{{ .podSecurity }}"
            pod-security.kubernetes.io/audit: "{{ .podSecurity }}"
      {{- end }}
    {{- end }}
