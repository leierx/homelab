apiVersion: v1
kind: Secret
metadata:
  name: cluster-mgmt
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    env: mgmt
    addons.homelab/argocd: "true"
    addons.homelab/capi-argo-bridge: "true"
    addons.homelab/cdi: "true"
    addons.homelab/cert-manager: "true"
    addons.homelab/cilium: "true"
    addons.homelab/cluster-api: "true"
    addons.homelab/envoy-gateway: "true"
    addons.homelab/kubevirt: "true"
    addons.homelab/zfs-localpv: "true"
type: Opaque
stringData:
  name: mgmt
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
