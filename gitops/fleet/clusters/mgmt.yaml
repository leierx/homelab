apiVersion: v1
kind: Secret
metadata:
  name: cluster-mgmt
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    env: mgmt
    addons.homelab/admission: "true"
    addons.homelab/argocd: "true"
    addons.homelab/authentik: "true"
    addons.homelab/capi-argo-bridge: "true"
    addons.homelab/cdi: "true"
    addons.homelab/cert-manager: "true"
    addons.homelab/cilium: "true"
    addons.homelab/cloudnative-pg: "true"
    addons.homelab/cluster-api: "true"
    addons.homelab/envoy-gateway: "true"
    addons.homelab/external-secrets: "true"
    addons.homelab/k8s-monitoring: "true"
    addons.homelab/kubevirt: "true"
    addons.homelab/ntfy: "true"
    addons.homelab/observability: "true"
    addons.homelab/openbao: "true"
    addons.homelab/prometheus-operator-crds: "true"
    addons.homelab/rbac: "true"
    addons.homelab/renovate: "true"
    addons.homelab/zfs-localpv: "true"
type: Opaque
stringData:
  name: mgmt
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
