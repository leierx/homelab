{{- if not .Values.cluster }}
{{- range $path, $_ := .Files.Glob "clusters/*/cluster.yaml" }}
{{- $c := base (dir $path) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-{{ $c }}
  namespace: argocd
  labels: {fleet.skinke.net/cluster: {{ $c }}}
spec:
  project: default
  destination: {server: https://kubernetes.default.svc, namespace: argocd}
  sources:
    - repoURL: {{ $.Values.repoURL }}
      targetRevision: main
      path: gitops/fleet
      helm: {releaseName: cluster-{{ $c }}, valuesObject: {cluster: {{ $c }}}}
    - repoURL: {{ $.Values.repoURL }}
      targetRevision: main
      path: gitops/clusters/{{ $c }}
      directory: {exclude: cluster.yaml}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry: {limit: -1, refresh: true, backoff: {duration: 10s, factor: 2, maxDuration: 3m}}
    syncOptions: [Delete=false, ServerSideApply=true]
{{- end }}
{{- end }}
