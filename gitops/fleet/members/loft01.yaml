apiVersion: v1
kind: Secret
metadata:
  name: cluster-loft01
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
  annotations:
    # without this Secret every addon Application of the cluster goes
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
    # what the cluster is, in value-layering order (earlier groups lose to later ones)
    fleet.homelab/groups: base,hub,single-node,prod
type: Opaque
stringData:
  name: loft01
  server: https://kubernetes.default.svc
  config: '{"tlsClientConfig":{"insecure":false}}'
