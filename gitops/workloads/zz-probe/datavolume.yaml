apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: probe-disk
  namespace: zz-probe
  annotations:
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  source:
    blank: {}
  storage:
    storageClassName: zfs
    accessModes: [ReadWriteOnce]
    volumeMode: Filesystem
    resources:
      requests:
        storage: 1Gi
