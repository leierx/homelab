apiVersion: v1
kind: Namespace
metadata:
  name: dodde
  annotations:
    # the namespace owns everything in it: without this, Argo deleting the
    # namespace collects the DataVolume's PVC and its zvol snapshots too
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
