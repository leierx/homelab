  labels:
    app: nfs-subdir-external-provisioner
    chart: nfs-subdir-external-provisioner-4.0.18
    heritage: Helm
    release: test-nfs
  name: test-nfs-nfs-subdir-external-provisioner
---
allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  labels:
    app: nfs-subdir-external-provisioner
    chart: nfs-subdir-external-provisioner-4.0.18
    heritage: Helm
    release: test-nfs
  name: nfs
mountOptions:
  - nfsvers=4
  - noatime
parameters:
  archiveOnDelete: "false"
provisioner: cluster.local/test-nfs-nfs-subdir-external-provisioner
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    app: nfs-subdir-external-provisioner
    chart: nfs-subdir-external-provisioner-4.0.18
    heritage: Helm
    nfs-subdir-external-provisioner: test-nfs-nfs-subdir-external-provisioner
    release: test-nfs
  name: pv-test-nfs-nfs-subdir-external-provisioner
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 10Mi
  mountOptions:
    - nfsvers=4
    - noatime
  nfs:
    path: /test
    server: 192.168.101.1
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: nfs-subdir-external-provisioner
    chart: nfs-subdir-external-provisioner-4.0.18
    heritage: Helm
    release: test-nfs
  name: pvc-test-nfs-nfs-subdir-external-provisioner
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
  selector:
    matchLabels:
      nfs-subdir-external-provisioner: test-nfs-nfs-subdir-external-provisioner
  storageClassName: ""
  volumeMode: Filesystem
---
