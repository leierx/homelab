apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nfs-subdir-external-provisioner
    chart: nfs-subdir-external-provisioner-4.0.18
    heritage: Helm
    release: test-nfs
  name: test-nfs-nfs-subdir-external-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-subdir-external-provisioner
      release: test-nfs
  strategy:
    type: Recreate
  template:
    metadata:
      annotations: null
      labels:
        app: nfs-subdir-external-provisioner
        release: test-nfs
    spec:
      containers:
        - env:
            - name: PROVISIONER_NAME
              value: cluster.local/test-nfs-nfs-subdir-external-provisioner
            - name: NFS_SERVER
              value: 192.168.101.1
            - name: NFS_PATH
              value: /test
          image: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2
          imagePullPolicy: IfNotPresent
          name: nfs-subdir-external-provisioner
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext: {}
          volumeMounts:
            - mountPath: /persistentvolumes
              name: nfs-subdir-external-provisioner-root
      securityContext: {}
      serviceAccountName: test-nfs-nfs-subdir-external-provisioner
      volumes:
        - name: nfs-subdir-external-provisioner-root
          persistentVolumeClaim:
            claimName: pvc-test-nfs-nfs-subdir-external-provisioner
