name: addon render

# Gates Renovate's automerge: renders every cluster's addons as Argo CD does
on:
  pull_request:
    paths:
      - "gitops/**"
      - ".github/api-versions.txt"
      - ".github/workflows/addon-render.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: render every cluster's addons
        run: |
          set -euo pipefail
          helm version --short
          api=$(paste -sd, .github/api-versions.txt)
          catalog=gitops/fleet/catalog/values.yaml
          for d in gitops/addons/*/; do
            a=$(basename "$d")
            yq -e ".addons | has(\"$a\")" "$catalog" > /dev/null || { echo "no catalog entry for addons/$a"; exit 1; }
          done
          for a in $(yq -r '.addons | keys | .[]' "$catalog"); do
            [ -d "gitops/addons/$a" ] || { echo "catalog entry $a has no addons/$a"; exit 1; }
          done
          for member in gitops/fleet/members/*.yaml; do
            cluster=$(yq -r '.stringData.name' "$member")
            IFS=, read -r -a groups <<< "$(yq -r '.metadata.annotations["fleet.homelab/groups"] // ""' "$member")"
            layers=("$catalog")
            for g in "${groups[@]}"; do
              if [ -f "gitops/groups/$g/addons.yaml" ]; then layers+=("gitops/groups/$g/addons.yaml"); fi
            done
            if [ -f "gitops/clusters/$cluster/addons.yaml" ]; then layers+=("gitops/clusters/$cluster/addons.yaml"); fi
            fleet_args=()
            for f in "${layers[@]:1}"; do fleet_args+=(-f "$f"); done
            helm template "addons-$cluster" gitops/fleet/catalog -n argocd "${fleet_args[@]}" \
              --set-string "cluster.name=$cluster" > /dev/null
            echo "rendered fleet chart for $cluster"
            merged=$(yq ea '. as $i ireduce ({}; . * $i)' "${layers[@]}")
            for a in $(echo "$merged" | yq -r '.addons | to_entries | map(select(.value.enabled)) | .[].key'); do
              if [ "$(echo "$merged" | yq -r ".addons[\"$a\"].kustomize // false")" = "true" ]; then
                kubectl kustomize "gitops/clusters/$cluster/addons/$a" > /dev/null
              else
                dir="gitops/addons/$a"
                args=(-n "$(echo "$merged" | yq -r ".addons[\"$a\"].namespace")" --api-versions "$api")
                for g in "${groups[@]}"; do
                  if [ -f "gitops/groups/$g/addons/$a/values.yaml" ]; then args+=(-f "gitops/groups/$g/addons/$a/values.yaml"); fi
                done
                if [ -f "gitops/clusters/$cluster/addons/$a/values.yaml" ]; then args+=(-f "gitops/clusters/$cluster/addons/$a/values.yaml"); fi
                helm dependency update "$dir" > /dev/null
                helm template "$a" "$dir" "${args[@]}" --set-string "fleet.cluster=$cluster" > /dev/null
                rm -rf "$dir/charts" "$dir/Chart.lock"
              fi
              echo "rendered $a for $cluster"
            done
          done
