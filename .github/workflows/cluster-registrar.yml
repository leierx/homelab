name: cluster-registrar

on:
  push:
    branches: [main]
    paths: ["apps/cluster-registrar/**", ".github/workflows/cluster-registrar.yml"]
  pull_request:
    paths: ["apps/cluster-registrar/**", ".github/workflows/cluster-registrar.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: apps/cluster-registrar

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/cluster-registrar/go.mod
          cache-dependency-path: apps/cluster-registrar/go.sum
      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: go test ./...

      - if: github.event_name != 'pull_request'
        uses: ko-build/setup-ko@v0.10
      - if: github.event_name != 'pull_request'
        run: >
          KO_DOCKER_REPO=ghcr.io/${{ github.repository_owner }}/cluster-registrar
          ko build . --bare --platform=linux/amd64 --tags=main,${{ github.sha }}
          --image-label=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
