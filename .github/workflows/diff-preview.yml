name: diff preview

# Renders every Argo CD Application on main and on the pull request in a
# throwaway kind cluster and comments the diff. Not a required check: it is for
# reading, and `addon render` stays the only gate.
on:
  pull_request:
    paths:
      - "gitops/**"
      - ".github/workflows/diff-preview.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: diff-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    # a fork PR's token cannot comment, and it must never see a repository secret
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: pull-request

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: main

      # The addon Applications are generated by the catalog chart, so the tool
      # cannot see them in the YAML it scans. Render them first, with the same
      # value layers Argo CD uses, including cluster.groups (which decides the
      # per-addon group value files).
      - name: render the generated Applications
        run: |
          set -euo pipefail
          for member in pull-request/gitops/fleet/members/*.yaml; do
            cluster=$(yq -r '.stringData.name' "$member")
            groups=$(yq -r '.metadata.annotations["fleet.homelab/groups"] // ""' "$member")
            IFS=, read -r -a names <<< "$groups"
            for checkout in main pull-request; do
              args=()
              for g in "${names[@]}"; do
                if [ -f "$checkout/gitops/groups/$g/addons.yaml" ]; then args+=(-f "$checkout/gitops/groups/$g/addons.yaml"); fi
              done
              if [ -f "$checkout/gitops/clusters/$cluster/addons.yaml" ]; then args+=(-f "$checkout/gitops/clusters/$cluster/addons.yaml"); fi
              mkdir -p "$checkout/rendered"
              helm template "addons-$cluster" "$checkout/gitops/fleet/catalog" -n argocd "${args[@]}" \
                --set-string "cluster.name=$cluster" \
                --set "cluster.groups={$groups}" \
                > "$checkout/rendered/applications-$cluster.yaml"
            done
          done

      # The throwaway cluster has none of the CRDs the real one has, so charts
      # that guard on a CRD would render differently (or fail). Take them from
      # the pinned charts of the addons that install them.
      - name: render the cluster's CRDs
        run: |
          set -euo pipefail
          mkdir -p pull-request/preinstall
          : > pull-request/preinstall/crds.yaml
          for member in pull-request/gitops/fleet/members/*.yaml; do
            cluster=$(yq -r '.stringData.name' "$member")
            groups=$(yq -r '.metadata.annotations["fleet.homelab/groups"] // ""' "$member")
            IFS=, read -r -a names <<< "$groups"
            for addon in prometheus-operator-crds cert-manager envoy-gateway k8s-monitoring; do
              [ -d "pull-request/gitops/addons/$addon" ] || continue
              args=()
              for g in "${names[@]}"; do
                if [ -f "pull-request/gitops/groups/$g/addons/$addon/values.yaml" ]; then args+=(-f "pull-request/gitops/groups/$g/addons/$addon/values.yaml"); fi
              done
              if [ -f "pull-request/gitops/clusters/$cluster/addons/$addon/values.yaml" ]; then args+=(-f "pull-request/gitops/clusters/$cluster/addons/$addon/values.yaml"); fi
              helm template "$addon" "pull-request/gitops/addons/$addon" --include-crds --dependency-update "${args[@]}" \
                --set-string "fleet.cluster=$cluster" \
                | yq 'select(.kind == "CustomResourceDefinition")' >> pull-request/preinstall/crds.yaml
            done
          done

      - name: generate the diff
        env:
          # renovate: datasource=docker depName=dagandersen/argocd-diff-preview
          ARGOCD_DIFF_PREVIEW_IMAGE: dagandersen/argocd-diff-preview:v0.2.17@sha256:ea90848df29337b50d5058330210b38e39232360b78d9c60951fc92e454c6941
        run: |
          set -euo pipefail
          mkdir -p output
          docker run --rm --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/main:/base-branch" \
            -v "$PWD/pull-request:/target-branch" \
            -v "$PWD/output:/output" \
            -v "$PWD/pull-request/gitops/fleet/members:/secrets:ro" \
            -v "$PWD/pull-request/preinstall:/preinstall:ro" \
            "$ARGOCD_DIFF_PREVIEW_IMAGE" \
            --target-branch="refs/pull/${{ github.event.number }}/merge" \
            --repo="${{ github.repository }}" \
            --secrets-folder=/secrets \
            --preinstall-folder=/preinstall \
            --file-regex='^(rendered/|gitops/fleet/bootstrap/)' \
            --render-method=repo-server-api \
            --timeout=900 \
            --keep-cluster-alive \
            --debug \
            --title="Rendered manifest diff"

      - name: inspect the cluster
        if: failure()
        run: |
          docker ps -a
          node=argocd-diff-preview-control-plane
          docker exec "$node" crictl ps -a || true
          docker exec "$node" crictl pods || true
          docker exec "$node" journalctl -u kubelet --no-pager | tail -120 || true
          port=$(docker port "$node" 6443 | awk -F: 'NR==1{print $2}')
          docker exec "$node" cat /etc/kubernetes/admin.conf > /tmp/admin.conf
          sed -i "s#https://127.0.0.1:6443#https://127.0.0.1:$port#" /tmp/admin.conf
          kubectl --kubeconfig /tmp/admin.conf get pods -A -o wide || true
          kubectl --kubeconfig /tmp/admin.conf -n argocd describe deploy argocd-redis || true
          kubectl --kubeconfig /tmp/admin.conf -n argocd get events --sort-by=.lastTimestamp | tail -60 || true

      - name: upload the diff
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diff-preview
          path: output/
          if-no-files-found: ignore
          retention-days: 7

      - name: post the diff as a comment
        run: |
          set -euo pipefail
          body=output/diff.md
          if [ ! -f "$body" ]; then
            echo "the tool produced no $body" >&2
            exit 1
          fi
          limit=60000
          if [ "$(wc -c < "$body")" -gt "$limit" ]; then
            # GitHub caps a comment at 65536 characters; keep the summary block
            {
              sed -n '1,/^<details>/p' "$body"
              echo "The full diff is too large for a comment and is attached to this run as the \`diff-preview\` artifact."
            } > output/comment.md
          else
            cp "$body" output/comment.md
          fi
          gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" \
            --body-file output/comment.md --edit-last \
            || gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" \
              --body-file output/comment.md
        env:
          GH_TOKEN: ${{ github.token }}
