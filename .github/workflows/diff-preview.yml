name: diff preview

# Renders every Argo CD Application on main and on the pull request in a
# throwaway kind cluster and comments the diff. Not a required check: it is for
# reading, and `addon render` stays the only gate.
on:
  pull_request:
    paths:
      - "gitops/**"
      - ".github/workflows/diff-preview.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: diff-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    # a fork PR's token cannot comment, and it must never see a repository secret
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: pull-request

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: main

      # The addon Applications are generated by the catalog chart, so the tool
      # cannot see them in the YAML it scans. Render the ApplicationSets first,
      # with the same value layers Argo CD uses, for both checkouts.
      - name: render the ApplicationSets
        run: |
          set -euo pipefail
          for checkout in pull-request main; do
            [ -d "$checkout/gitops/charts/gitops-addons" ] || continue
            for member in "$checkout"/gitops/bootstrap/members/*.yaml; do
              [ -f "$member" ] || continue
              cluster=$(yq -r '.stringData.name' "$member")
              env=$(yq -r '.metadata.labels.environment' "$member")
              kver=$(yq -r '.metadata.labels.kubernetes_version' "$member")
              tag=$(yq -r '.metadata.annotations.addons_stack_version' "$member")
              url=$(yq -r '.metadata.annotations.addons_repo_url' "$member")
              base=$(yq -r '.metadata.annotations.addons_repo_basepath' "$member")
              enables=()
              while read -r l v; do
                enables+=(--set-string "addons.${l#enable_}.enabled=$([ "$v" = "true" ] && echo true || echo false)")
              done < <(yq -r '.metadata.labels | to_entries[] | select(.key | test("^enable_")) | "\(.key) \(.value)"' "$member")
              mkdir -p "$checkout/rendered"
              helm template "gitops-addons-$cluster" "$checkout/gitops/charts/gitops-addons" -n argocd \
                -f "$checkout/gitops/stacks/k8s-$kver/stack.yaml" \
                -f "$checkout/gitops/overrides/environments/$env/values.yaml" \
                -f "$checkout/gitops/overrides/clusters/$cluster/values.yaml" \
                --set "cluster.name=$cluster" \
                --set "repo.url=$url" \
                --set "repo.basepath=$base" \
                --set "repo.stackRevision=$tag" \
                "${enables[@]}" > "$checkout/rendered/applicationsets-$cluster.yaml"
            done
          done

      # The throwaway cluster has none of the CRDs the real one has, so charts
      # that guard on a CRD would render differently (or fail). Take them from
      # the stack charts of the addons that install them.
      - name: render the cluster's CRDs
        run: |
          set -euo pipefail
          mkdir -p pull-request/preinstall
          : > pull-request/preinstall/crds.yaml
          catalog=pull-request/gitops/charts/gitops-addons/values.yaml
          for member in pull-request/gitops/bootstrap/members/*.yaml; do
            [ -f "$member" ] || continue
            kver=$(yq -r '.metadata.labels.kubernetes_version' "$member")
            stack="pull-request/gitops/stacks/k8s-$kver/stack.yaml"
            for addon in prometheus_operator_crds cert_manager envoy_gateway; do
              chart=$(yq -r ".addons[\"$addon\"].chart // \"\"" "$stack")
              [ -n "$chart" ] || continue
              repo=$(yq -r ".addons[\"$addon\"].repoUrl" "$stack")
              version=$(yq -r ".addons[\"$addon\"].targetRevision" "$stack")
              release=$(yq -r ".addons[\"$addon\"].releaseName" "$catalog")
              yq ".addons[\"$addon\"].values // {}" "$catalog" > /tmp/crds-values.yaml
              case "$repo" in
                *://*) src=("$chart" --repo "$repo") ;;
                *) src=("oci://$repo/$chart") ;;
              esac
              helm template "$release" "${src[@]}" --version "$version" --include-crds -f /tmp/crds-values.yaml \
                | yq 'select(.kind == "CustomResourceDefinition")' >> pull-request/preinstall/crds.yaml
            done
          done

      - name: generate the diff
        env:
          # renovate: datasource=docker depName=dagandersen/argocd-diff-preview
          ARGOCD_DIFF_PREVIEW_IMAGE: dagandersen/argocd-diff-preview:v0.2.17@sha256:ea90848df29337b50d5058330210b38e39232360b78d9c60951fc92e454c6941
        run: |
          set -euo pipefail
          mkdir -p output
          docker run --rm --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/main:/base-branch" \
            -v "$PWD/pull-request:/target-branch" \
            -v "$PWD/output:/output" \
            -v "$PWD/pull-request/gitops/bootstrap/members:/secrets:ro" \
            -v "$PWD/pull-request/preinstall:/preinstall:ro" \
            -v "$PWD/pull-request/.github/argocd-diff-preview/values.yaml:/argocd-config/values.yaml:ro" \
            "$ARGOCD_DIFF_PREVIEW_IMAGE" \
            --target-branch="refs/pull/${{ github.event.number }}/merge" \
            --repo="${{ github.repository }}" \
            --secrets-folder=/secrets \
            --preinstall-folder=/preinstall \
            --file-regex='^(rendered/|gitops/bootstrap/)' \
            --render-method=repo-server-api \
            --timeout=900 \
            --title="Rendered manifest diff"

      - name: upload the diff
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diff-preview
          path: output/
          if-no-files-found: ignore
          retention-days: 7

      - name: post the diff as a comment
        run: |
          set -euo pipefail
          body=output/diff.md
          if [ ! -f "$body" ]; then
            echo "the tool produced no $body" >&2
            exit 1
          fi
          limit=60000
          if [ "$(wc -c < "$body")" -gt "$limit" ]; then
            # GitHub caps a comment at 65536 characters; keep the summary block
            {
              sed -n '1,/^<details>/p' "$body"
              echo "The full diff is too large for a comment and is attached to this run as the \`diff-preview\` artifact."
            } > output/comment.md
          else
            cp "$body" output/comment.md
          fi
          gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" \
            --body-file output/comment.md --edit-last \
            || gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" \
              --body-file output/comment.md
        env:
          GH_TOKEN: ${{ github.token }}
