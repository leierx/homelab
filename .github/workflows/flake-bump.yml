name: flake bump

on:
  schedule:
    - cron: "0 10 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: bump flake.lock
        run: nix flake update

      - run: nix fmt -- --ci
      - run: nix flake check
      - run: nix build --no-link .#nixosConfigurations.loft01.config.system.build.toplevel
      # the ISO needs the age key; its system doesn't
      - run: nix eval --raw .#nixosConfigurations.offlineInstaller-loft01.config.system.build.toplevel.drvPath

      # `nix flake update` never leaves the pinned branch, so fail once the next release exists
      - name: nixpkgs release is current
        run: |
          release=$(nix eval --raw .#nixosConfigurations.loft01.config.system.nixos.release)
          year=${release%.*} month=${release#*.}
          if [ "$month" = 05 ]; then next="$year.11"; else next="$((10#$year + 1)).05"; fi
          if git ls-remote --exit-code --heads https://github.com/NixOS/nixpkgs "nixos-$next" >/dev/null; then
            echo "::error::nixos-$next exists: move nixpkgs (and services.k3s.package) off nixos-$release in flake.nix"
            exit 1
          fi

      - name: open and merge the flake.lock PR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then exit 0; fi

          branch="flake-bump/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          old=$(mktemp)
          git show HEAD:flake.lock > "$old"
          changes=$(jq -r --slurpfile old "$old" '
            .nodes | to_entries[]
            | select(.value.locked != null)
            | .key as $name
            | ($old[0].nodes[$name].locked.rev // "new") as $before
            | select($before != .value.locked.rev)
            | "- `\($name)`: \($before[0:12]) -> \(.value.locked.rev[0:12])"' flake.lock)
          if [ -z "$changes" ]; then changes='- `flake.lock`: see the diff'; fi

          git checkout -b "$branch"
          git -c user.name=github-actions -c user.email=github-actions@noreply.github.com \
            commit -m "chore: bump flake.lock" -- flake.lock
          git push origin "$branch"

          {
            echo "Updated inputs:"
            echo
            echo "$changes"
          } > /tmp/body.md
          gh pr create --base main --head "$branch" \
            --title "chore: bump flake.lock" --body-file /tmp/body.md

          # A PR opened with GITHUB_TOKEN starts no other workflows, so no checks
          # would ever run on it. They already ran above on exactly this tree.
          gh pr merge --merge --delete-branch
