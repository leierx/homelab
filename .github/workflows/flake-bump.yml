name: flake bump

on:
  schedule:
    - cron: "0 10 */2 * *"
  workflow_dispatch:
  # Nix-only: a check that doesn't run can't be required, and gitops PRs have addon-render (TODO.md, Protect main)
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nixos/**
      - .github/workflows/flake-bump.yml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - name: bump flake.lock
        if: github.event_name != 'pull_request'
        run: nix flake update

      - run: nix fmt -- --ci
      - run: nix flake check
      - run: nix build --no-link .#nixosConfigurations.loft01.config.system.build.toplevel
      # the ISO needs the age key; its system doesn't
      - run: nix eval --raw .#nixosConfigurations.offlineInstaller-loft01.config.system.build.toplevel.drvPath

      # `nix flake update` never leaves the pinned branch, so fail once the next release exists
      - name: nixpkgs release is current
        run: |
          release=$(nix eval --raw .#nixosConfigurations.loft01.config.system.nixos.release)
          year=${release%.*} month=${release#*.}
          if [ "$month" = 05 ]; then next="$year.11"; else next="$((10#$year + 1)).05"; fi
          if git ls-remote --exit-code --heads https://github.com/NixOS/nixpkgs "nixos-$next" >/dev/null; then
            echo "::error::nixos-$next exists: move nixpkgs (and services.k3s.package) off nixos-$release in flake.nix"
            exit 1
          fi

      - name: push flake.lock
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git diff --quiet -- flake.lock && exit 0
          git -c user.name=github-actions -c user.email=github-actions@noreply.github.com \
            commit -m "chore: bump flake.lock" -- flake.lock
          git push origin HEAD:main
