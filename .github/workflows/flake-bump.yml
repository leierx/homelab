name: flake bump

on:
  schedule:
    - cron: "0 10 */2 * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - name: bump flake.lock
        if: github.event_name != 'pull_request'
        run: nix flake update

      - run: nix fmt -- --ci
      - run: nix flake check
      - run: nix build --no-link .#nixosConfigurations.loft01.config.system.build.toplevel

      - name: push flake.lock
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git diff --quiet -- flake.lock && exit 0
          git -c user.name=github-actions -c user.email=github-actions@noreply.github.com \
            commit -m "chore: bump flake.lock" -- flake.lock
          git push origin HEAD:main

  gitops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix shell --inputs-from . nixpkgs#kubernetes-helm nixpkgs#yq-go --command gitops/render.sh
