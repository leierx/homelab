name: gitops check

# Renders the fleet layout offline and checks every addon the way Argo CD will
# use it. Gates Renovate's automerge.
on:
  push:
    branches: [main]
    paths:
      - "gitops/**"
      - ".github/workflows/gitops-check.yml"
  pull_request:
    paths:
      - "gitops/**"
      - ".github/workflows/gitops-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: install PyYAML
        run: pip install pyyaml

      - name: 1. render-check
        run: SIM_OUT=/tmp/sim.yaml gitops/tools/render-check/run.sh

      - name: 2. every non-template YAML parses
        run: |
          set -euo pipefail
          find gitops -name '*.yaml' ! -path '*/templates/*' -print0 \
            | xargs -0 -r -n1 yq e '.' >/dev/null

      - name: 3. every enabled Helm addon builds and renders on its cluster
        run: |
          set -euo pipefail
          [ -s /tmp/sim.yaml ] || { echo "::error::render-check did not write SIM_OUT" >&2; exit 1; }

          # One Application per enabled Helm addon per cluster, with the value files the
          # ApplicationSet generated: every group layer in order, then the cluster layer.
          while IFS= read -r app; do
            cluster=$(jq -r '.cluster' <<<"$app")
            dir=$(jq -r '.dir' <<<"$app")
            [ -f "$dir/addon.yaml" ] || continue
            name=$(basename "$dir")
            ns=$(jq -r '.namespace' <<<"$app")
            rel=$(jq -r '.releaseName' <<<"$app")
            out="/tmp/render-$cluster-$name.yaml"

            # a fresh runner has no chart-repository list; `helm dependency build` needs it
            idx=0
            while IFS= read -r repo; do
              [ -n "$repo" ] || continue
              idx=$((idx + 1))
              case "$repo" in
                oci://*) ;;
                *) helm repo add "$name-$idx" "$repo" --force-update >/dev/null ;;
              esac
            done < <(yq ea -r '.dependencies[]?.repository // ""' "$dir/Chart.yaml")
            helm dependency build "$dir" >/dev/null
            args=(template "$rel" "$dir" -n "$ns" --include-crds
              --set-json "fleet=$(jq -c '.fleet' <<<"$app")")
            while IFS= read -r vf; do
              [ -n "$vf" ] || continue
              vf=${vf#\$values/}
              [ -f "$vf" ] && args+=(-f "$vf")
            done < <(jq -r '.valueFiles[]?' <<<"$app")
            helm "${args[@]}" > "$out"
            cp "$out" "/tmp/render-$name.yaml"   # check 10 reads these

            # a delete addon may only be delete if every CRD it renders survives removal
            if [ "$(yq -r '.onRemoval' "$dir/addon.yaml")" = "delete" ]; then
              crds=$(yq ea '[select(.kind == "CustomResourceDefinition")] | length' "$out")
              kept=$(yq ea '[select(.kind == "CustomResourceDefinition")
                | select(.metadata.annotations."helm.sh/resource-policy" == "keep"
                    or ((.metadata.annotations."argocd.argoproj.io/sync-options" // "") | test("Delete=false")))] | length' "$out")
              if [ "$crds" != "$kept" ]; then
                echo "::error::$name on $cluster is onRemoval=delete but renders $crds CRD(s), only $kept with a keep annotation" >&2
                exit 1
              fi
            fi
            echo "rendered $name on $cluster"
          done < <(yq ea -o=json -I=0 'select(.kind == "Application"
              and .metadata.labels."fleet/kind" == "addon"
              and (.spec.sources[0].helm // null) != null)
            | {"cluster": .metadata.labels."fleet/cluster",
               "dir": .spec.sources[0].path,
               "namespace": .spec.destination.namespace,
               "releaseName": .spec.sources[0].helm.releaseName,
               "fleet": .spec.sources[0].helm.valuesObject.fleet,
               "valueFiles": .spec.sources[0].helm.valueFiles}' /tmp/sim.yaml | jq -c .)

      - name: 4. every Kustomize addon builds
        run: |
          set -euo pipefail
          for d in gitops/addons/*/; do
            [ -f "$d/addon.yaml" ] || continue
            [ "$(yq -r '.type' "$d/addon.yaml")" = "kustomize" ] || continue
            name=$(basename "$d")
            kubectl kustomize "$d" > "/tmp/render-$name.yaml"
            echo "rendered $name"
          done

      - name: 5. bootstrap/cluster has exactly the two ApplicationSets
        run: |
          set -euo pipefail
          kubectl kustomize gitops/bootstrap/cluster > /tmp/cluster.yaml
          names=$(yq ea -r 'select(.kind == "ApplicationSet") | .metadata.name' /tmp/cluster.yaml \
            | grep -vE '^(---)?$' | sort | paste -sd, -)
          if [ "$names" != "addons,addons-ordered" ]; then
            echo "::error::bootstrap/cluster rendered ApplicationSets: $names" >&2
            exit 1
          fi

      - name: 10. namespaces are exceptions and protected
        run: |
          set -euo pipefail
          ok=1
          shared=$(mktemp)
          for d in gitops/addons/*/; do
            [ -f "$d/addon.yaml" ] || continue
            name=$(basename "$d")
            type=$(yq -r '.type' "$d/addon.yaml")
            ns=$(yq -r '.namespace // .name // ""' "$d/addon.yaml")
            [ -n "$ns" ] || ns=$name
            pss=$(yq -r '.podSecurity // ""' "$d/addon.yaml")
            printf '%s\t%s\n' "$ns" "$pss" >> "$shared"

            render="/tmp/render-$name.yaml"
            [ -f "$render" ] || continue
            # Every Namespace object it renders: either an allowed exception (a kustomize addon's
            # upstream Namespace, or one that is not a destination) and always protected.
            while IFS=$'\t' read -r objns ann; do
              [ -n "$objns" ] || continue
              if [ "$objns" = "$ns" ] && [ "$type" != "kustomize" ]; then
                echo "::error::$name declares its destination namespace $objns as a manifest (section 5.7)" >&2
                ok=0
              fi
              case "$ann" in
                *Delete=false*Prune=false*|*Prune=false*Delete=false*) ;;
                *)
                  echo "::error::$name renders Namespace $objns without Delete=false,Prune=false (section 5.7)" >&2
                  ok=0
                  ;;
              esac
            done < <(yq ea -o=json -I=0 'select(.kind == "Namespace")
                | {"name": .metadata.name, "ann": (.metadata.annotations."argocd.argoproj.io/sync-options" // "")}' "$render" \
              | jq -r '[.name, .ann] | @tsv')
          done

          conflicts=$(sort -u "$shared" | awk -F'\t' '{ if ($1 in seen && seen[$1] != $2) print $1; seen[$1] = $2 }' | sort -u)
          if [ -n "$conflicts" ]; then
            echo "::error::addons sharing a namespace disagree on podSecurity: $conflicts" >&2
            ok=0
          fi
          [ "$ok" = 1 ] || exit 1
