name: stack release

# A merge that changes what a stack serves (the gitops-addons chart, the stacks, the
# overrides, addon-extras, our charts, manifests) becomes a new stack version: a tag
# stack-<k8s minor>.<n> per stack. Renovate then proposes the new tag to each cluster's
# addons_stack_version. Dispatch it to re-tag without a change.
on:
  push:
    branches: [main]
    paths:
      - "gitops/charts/**"
      - "gitops/stacks/**"
      - "gitops/overrides/**"
      - "gitops/addon-extras/**"
      - "gitops/manifests/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stack-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: tag a new version of every stack
        run: |
          set -euo pipefail
          for d in gitops/stacks/k8s-*/; do
            minor=${d#gitops/stacks/k8s-}
            minor=${minor%/}
            last=$(git tag -l "stack-$minor.*" | sed "s/^stack-$minor\.//" | { grep -E '^[0-9]+$' || true; } | sort -n | tail -1)
            tag="stack-$minor.$(( ${last:-0} + 1 ))"
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            echo "tagged $tag at $GITHUB_SHA"
          done
