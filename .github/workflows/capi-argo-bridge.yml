name: capi-argo-bridge

on:
  push:
    branches: [main]
    paths: ["packages/capi-argo-bridge/**", ".github/workflows/capi-argo-bridge.yml"]
  pull_request:
    paths: ["packages/capi-argo-bridge/**", ".github/workflows/capi-argo-bridge.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Build and test capi-argo-bridge image
        id: build
        run: |
          image=$(nix build -L --no-link --print-out-paths .#capi-argo-bridge-image)
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - if: github.ref == 'refs/heads/main'
        name: Push container image to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skopeo copy \
            --dest-creds "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            "docker-archive:${{ steps.build.outputs.image }}" \
            "docker://ghcr.io/${GITHUB_REPOSITORY_OWNER}/capi-argo-bridge:0.1.${GITHUB_RUN_NUMBER}"
