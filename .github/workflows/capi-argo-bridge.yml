name: capi-argo-bridge

on:
  push:
    branches: [main]
    paths: ["applications/capi-argo-bridge/**", "flake.nix", "flake.lock", ".github/workflows/capi-argo-bridge.yml"]
  pull_request:
    paths: ["applications/capi-argo-bridge/**", "flake.nix", "flake.lock", ".github/workflows/capi-argo-bridge.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31

      - name: Build and test capi-argo-bridge
        run: nix build -L .#capi-argo-bridge .#capi-argo-bridge-image

      - if: github.event_name != 'pull_request'
        name: Push container image to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=$(nix build --no-link --print-out-paths .#capi-argo-bridge-image)
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER}/capi-argo-bridge"
          creds="${GITHUB_ACTOR}:${GITHUB_TOKEN}"
          nix run nixpkgs#skopeo -- copy --dest-creds "$creds" \
            "docker-archive:${image}" "docker://${repo}:main"
          nix run nixpkgs#skopeo -- copy --dest-creds "$creds" \
            "docker-archive:${image}" "docker://${repo}:0.1.${GITHUB_RUN_NUMBER}"
