name: capi-argo-bridge

on:
  push:
    branches: [main]
    paths: ["apps/capi-argo-bridge/**", ".github/workflows/capi-argo-bridge.yml"]
  pull_request:
    paths: ["apps/capi-argo-bridge/**", ".github/workflows/capi-argo-bridge.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: apps/capi-argo-bridge

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/capi-argo-bridge/go.mod
          cache-dependency-path: apps/capi-argo-bridge/go.sum
      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: go test ./...

      - if: github.event_name != 'pull_request'
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
      - if: github.event_name != 'pull_request'
        run: >
          KO_DOCKER_REPO=ghcr.io/${{ github.repository_owner }}/capi-argo-bridge
          ko build . --bare --platform=linux/amd64 --tags=main,0.1.${{ github.run_number }}
          --image-label=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
