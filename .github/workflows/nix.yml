name: nix

on:
  push:
    branches: [main]
    paths: ["flake.lock", "**/*.nix", ".github/workflows/nix.yml"]
  pull_request:
    paths: ["flake.lock", "**/*.nix", ".github/workflows/nix.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
      - run: nix fmt -- --ci
      - run: nix flake check
      - run: nix build --no-link .#nixosConfigurations.loft01.config.system.build.toplevel
      # the ISO needs SECRETS_FILE and --impure; its system doesn't
      - run: nix eval --raw .#nixosConfigurations.offlineInstaller-loft01.config.system.build.toplevel.drvPath
