name: nix

on:
  pull_request:
    paths: ["flake.lock", "**/*.nix", ".github/workflows/nix.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - run: nix fmt -- --ci
      - run: nix flake check
      - run: nix build --no-link .#nixosConfigurations.loft01.config.system.build.toplevel
      # the ISO needs the age key; its system doesn't
      - run: nix eval --raw .#nixosConfigurations.offlineInstaller-loft01.config.system.build.toplevel.drvPath
